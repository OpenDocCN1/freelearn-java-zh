  \n1. 如果你正在处理单体架构且代码较多（象限 a），开发者开始意识到，为了避免这些巨大的限制（以及许多其他限制），可以将服务拆分为不同的、更小且更简单的程序。今天，已经有公司拥有几十个甚至上百个这样不同的程序。为了处理遗留系统并帮助实现微服务，你可以通过所谓的“绞杀者模式（strangler\
  \ pattern）”来替换旧系统。你可以参考《单体到微服务：演进架构（Monolith to Microservices: Evolutionary Architecture）》一书。\n\
  \n2. 如果你是在一家初创公司并需要快速交付（象限 b），你通常会为了速度而选择单体架构。在开始阶段，微服务可能是有害的。当微服务需要扩展时，你可以通过通过配置对象来实现微服务。\n\
  \n3. 如果你处于一家拥有成熟系统的并需要某些功能（象限 c）的公司，你可能需要通过微服务来工作。在这种情况下，你可以通过创建微服务来处理新需求。\n\n4.\
  \ 如果你是在一家拥有过多系统且代码量巨大的公司工作（象限 d），这意味着你得到了两者之最：难以理解、管理和开发的臃肿代码，以及需要大量资源的服务器。这就是我所说的“红区”；你应该尽量避免这种场景。如果你发现自己处于这种环境中，你应该评估通过重构服务来使用微服务的可能性，而不是依赖代码。\n\
