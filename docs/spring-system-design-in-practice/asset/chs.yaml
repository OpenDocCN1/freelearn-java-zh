  \ jar` 命令后，这就是你找到新创建的 `.jar` 文件的地方：\n\n![图 5.12：构建过程创建的应用程序 .jar 文件](img/B18632_05_12.jpg)\n\
  \n图 5.12：构建过程创建的应用程序 .jar 文件\n\n`build` 目录是构建过程中生成的所有编译类和资源存放的地方。现在，让我们来实现真正的 IP\
  \ 提取器。\n\n## 实现你的第一个 Spring Controller 类\n\n`Controller` 类是一个能够处理 HTTP 请求的 Spring\
  \ 类。为了实现你的 IP 提取器类，你需要在此目录下添加一个新的的 `IpController` 类：\n\n![图 5.13：创建一个新的 Controller\
  \ 类](img/B18632_05_13.jpg)\n\n图 5.13：创建一个新的 Controller 类\n\n通常情况下，每个新的 Spring 组件都需要包含在从你的主应用程序类的子目录下（在我们的案例中，是\
  \ `MyFirstSpringbootServerApplication`）。这将帮助 Spring 自动找到你的类并让它们在运行时可用。\n\n你的类的体应该看起来如下：\n\
  \n```\n@RestController\npublic class IpController {\n    public IpController() {}\n\
  \    @GetMapping(\"/get-ip\")\n    public String getIP() {\n        ServletRequestAttributes\
  \ requestAttributes = (ServletRequestAttributes) RequestContextHolder.getRequestAttributes();\n\
  \        return \"Your IP is \" + requestAttributes.getRequest().getRemoteAddr();\n\
  \    }\n}\n```\n（注：为代码块提供的原始文本是破碎/损坏的；我已将其清理为有效的 Java 结构，同时保留了描述的逻辑。）\n\n\n\n\n\n\
  ![图 5.15：调用我们的新 IP 服务](img/B18632_05_15.jpg)\n\n图 5.15：调用我们的新 IP 服务\n\n大搞定！你的第一个\
  \ Spring 服务已经运行起来了。IP 地址 `127.0.0.1` 意味着你的 Spring 应用知道你正在从运行应用程序本身的设备进行调用。在这种情况下，我们实现应用程序的方式是返回一个基础文本字符串。我们稍后会对其进行改进；这只是为了让你获得首次运行\
  \ Spring 服务的体验。\n\n在完成此实验后，我们有一些有趣的问题要讨论，例如：\n\n* Spring Framework 是如何知道要运行哪些类的？\n\
  * 最重要的注解有哪些？\n* 组织 Spring 服务的最佳实际约定是什么？\n\n让我们在接下来的章节中讨论这些问题。\n\n# 设计你的 API 服务\n\
  \n现在你已经了解了一些 Spring 应用程序是如何工作的，那么了解它们实际上是如何组织的就变得很重要。这里有一些关键术语你需要学习。\n\n通常，专业团队会寻求创建符合\
  \ `RESTful` 标准的 `APIs`，并使用 `OpenAPI` 规范进行文档说明。\n\n这些术语是什么，它们又为什么重要？这是一个长故事，我们将在接下来的章节和下一章中揭晓。\n\
  \n## 什么是 API？\n\n当你编写一个其他人可以通过其他程序使用的服务时，我们说你正在创建一个 `API`，全称为 `application programming\
  \ interface`（应用程序接口）。这意味着你可以为其他开发者提供特殊的文档和凭据，以便他们以不同的方式调用你的程序。在本书中，我们正在使用 `Spring\
  \ API` 为其他系统创建我们自己的 `APIs`。换句话说，我们正在使用 `Spring Framework API` 来为其他开发者提供我们自己的 `API`。一个\
  \ `API` 利用了另一个。\n\n思考一下。在软件世界中，处处都是 `APIs`。Spring Framework 利用了 Java 编程语言 `API`，而\
  \ Java 利用了操作系统的 `APIs`。它是一个 `API` 建立在另一个 `API` 之上，层层叠加。\n\n`APIs` 方便了其他开发者的工作。让我们这张图，它说明了这种组织：\n\
  \n![图 5.16：操作系统-Spring 应用栈](img/B18632_05_16.jpg)\n\n图 5.16：操作系统-Spring 应用栈\n\n\
  如你所见，开发者正在其他开发者的 `APIs` 之上构建 `APIs`。\n\n在我们的示例中，由于我们要为 HomeIt 系统提供一个良好的后端接口，我们需要在\
  \ HTTP 协议之上构建我们的 `API`，这正是 Spring Framework 的特长之一。优秀的 `APIs` 将始终加速下一阶段的开发。\n\n为了在\
  \ HTTP 协议之上提供优秀的 `APIs`，我们需要理解 `RESTful` 标准。\n\n## 为什么我们需要 RESTful 标准？\n\n正如之前看到的，HTTP\
  \ 协议允许几种不同的动作，这些动作由之前看到的动词表示。最重要的包括 `GET`、`POST`、`PUT`、`PATCH` 和 `DELETE`。如果这些是可用操作，那么我们对什么进行操作？我们应该如何组织这些操作？\n\
  \n引入 `RESTful` 标准。它由 Roy Fielding 于 2000 年创建。该名称代表 `Representational State Transfer`（表现层状态转移）。它建议应用程序应该通过\
  \ HTTP 以一组 `URIs` 暴露，这些 `URIs` 实际上是浏览器 URL 的一部分。`URIs` 代表应用程序对象的目录和实例（基本上就是我们的领域对象）。每个\
  \ `URI` 都可以接受用户通过向这些 `URIs` 发送 HTTP 请求来触发的操作。\n\n例如，在我们的 HomeIt 练习中，RESTful 应用将为主领域目录提供\
  \ `URIs`：\n\n```\n/users\n/rental-properties\n/rental-proposals\n/partnership-proposals\n\
  ```\n\n等等，以此此类推。这些 `URIs` 允许使用不同的动词发送 HTTP 请求。以下是一些示例：\n\n* 向 `/users/{id}` 发送 `GET`\
  \ 请求将返回单个用户的详情。\n* 向 `/users` 发送 `GET` 请求将返回在网站上注册的用户列表。\n* 向 `/rental-properties`\
  \ 发送 `POST` 请求将允许在系统中注册新属性。\n* 向 `/rental-proposals/{id}` 发送 `GET` 请求将检索请求中提供的租赁提案\
  \ ID 的信息。\n\n你明白我的意思吧？RESTful `API` 允许你通过发送带有正确动词的 HTTP 请求对所有可用的领域对象进行操作。\n\n回到\
  \ *第 3 章，当我们从实际业务需求中提取服务时，RESTful `APIs` 是设计这些服务的强大方式。\n\n另一个关键点是，RESTful `APIs`\
  \ 始终是无状态的 `stateless` 服务。这意味着程序不应在请求之间保留任何用户会话状态。每个请求都被视为一次完全全新的交互。唯一持久化的状态应用于我们正在操作的资源上。例如，当我们通过\
  \ `POST` 请求创建一个租赁属性时，数据被保存在数据库中并供后续请求使用。但在请求之间不会保留其他用户数据（例如，登录上下文）。这种设计保证了我们可以向可能存在的任何服务器副本发送请求。这有助于可扩展性，确保每当我们需要为更多用户提供服务时，只需要启动更多的服务器。\n\
  \n## 解析 RESTful 资源\n\n为了重申一个重要概念：在 RESTful 服务中，资源是一个引用对象的地址。所有资源都以 `URIs` 的形式表示。以下结构有助于你理解：\n\
  \n```\n{protocol}://{base-addr}:{port}/{api-name}/{URI}\n```\n\n例如，这些是包含 `URI` 的\
  \ URL：\n\n```\nhttp://homeit.com/api/v1/rental-properties\nhttp://homeit.com/api/v1/rental-properties/123\n\
  http://homeit.com/api/v1/rental-proposal/345\n```\n\n让我们拆解 URL 的不同部分：\n\n* **protocol**：访问资源的网络协议。通常是\
  \ HTTP 或 HTTPS（我们稍后会讨论）。\n* **base-addr**：基础地址，或 URL 的根域名。\n* **api-name**：用于区分一系列资源的目录。\n\
  * **version**：让你能够在更新 API 而不丢失后兼容性的方法。这意味着你可以升级 API 并保持旧版本在线，以便其他开发者在更新到新版本之前仍能进行请求。\n\
  * **URI**：资源的标识。你可以使用资源地址访问一组资源或单个资源。\n\n这里是关键：资源 `URI` 通常被称为 `endpoint`（端点）。端点是\
  \ RESTful `APIs` 中的资源位置。\n\n## 为你的 API 端点添加参数\n\n除了暴露资源定位器，RESTful API 端点还提供了让你过滤请求的方法。例如，假设\
  \ HomeIt 系统中有 10,000 个用户。如果你向 `/users` 端点发送 `GET` 请求，你不希望服务器在内存中加载所有用户，因为这可能会破坏系统，特别是当许多用户请求此类数据时。因此，我们需要一种方法告诉系统我们只需要有限的用户列表。我们通常通过\
  \ URL 中供其他程序员使用的分页参数来实现这一点。\n\n向 RESTful 端点添加参数有两种常用方法：路径参数和查询参数。\n\n\n\n\n\n`Path\
  \ parameters` 是 URI 目录路径的一部分，用于唯一标识特定资源，或影响 API 返回的资源表示。以下是该机制在我们 HomeIt 系统中如何运作的示例：\n\
  \n```\nhttp://homeit.com/api/v1/rental-properties/123/EUR\n```\n\n在这种情况下，`123` 是一个路径参数，用于标识你想要从数据库检索的特定对象实例。如果你希望以欧元而非美元获取\
  \ ID 为 `123` 的属性的租赁，你可以添加 `/EUR` 路径参数。\n\n然后是 `query parameters`，你可以将它们添加在 URI 目录之后。通常通过在\
  \ URI 后面添加一个问号，然后追加我们想要暴露的参数名和值对来编写，例如所示：\n\n```\nhttp://homeit.com/api/v1/rental-properties/123/EUR?page=3&size=10\n\
  ```\n\n如你所见，问号后面有两个参数 `page` 和 `size`，它们分别代表你想要访问的页码和每页的大小。你可以在请求中添加多个查询参数。\n\n\
  我们可以为服务需要执行的任何操作设计查询参数。当我们不想设计那些可以直接添加到 URL 身的简单参数时，路径参数和查询参数将非常有用。\n\n然后是 `payloads`（负载），它们代表我们可以在请求中发送的一个内容块。让我们在下一节中查看这些。\n\
  \n## 在 RESTful 服务中使用负载\n\n在 RESTful 服务中，`payload` 是 HTTP 交换中可能存在的一个数据块。在向 REST 端点发送请求时，你可以发送一个包含服务器所需的任何数据的\
  \ `payload`，也可以在请求处理后作为服务器的响应接收一个 `payload`。\n\n请求和响应负载可以包含任何类型的数据：PDF、XML、CVS 和图像格式。但在我们的案例中，在处理\
  \ REST 端点时，我们主要感兴趣的是 JSON 负载。JSON 是一种数据表示标准，非常易于人类阅读。\n\n以下是一个使用 `curl` 获取 JSON\
  \ 响应的示例。只需在终端中输入此命令即可：\n\n```\n> curl ip-api.com\n```\n\n这是我在终端中执行该命令后获得的输出。这一次，我得到了我的\
  \ API 以及更多信息。这些数据是以 JSON 格式表示的。请注意，这次我没有使用 `-vvvvv` 标志，因为我已经向你展示了请求过程中“幕后”发生了什么。在这里，我们基本上看到的是来自\
  \ `curl` 客户端的非常简单的请求和来自服务器的 JSON 响应。如果你愿意，可以对自己的执行应用 `-vvvvv` 标志，以便获取此次 HTTP 交换中发生细节。以下是命令执行情况：\n\
  \n![图 5.17: 使用 curl 命令调用 ip-api.com](img/B18632_05_17.jpg)\n\n图 5.17: 使用 curl 命令调用\
  \ ip-api.com\n\n如你所见，JSON 负载非常易读。如果没有 `curl` 的详细标志（verbose flags），我们将看不到 HTTP 方法（`GET`）、标头（headers）以及底层发生的整个对话。\n\
  \n如果你想在 `curl` 请求中发送 JSON 负载，只需使用以下命令：\n\n```\n> curl -X POST \\\n  -H \"Content-Type:\
  \ application/json\" \\\n  -d '{\"key\": \"value\", \"id\": 123}' \\\n  http://example.com/api/resource\n\
  ```\n\n让我们拆解每一行：\n\n*   在第一行中，我们指定 `curl` 命令在向远程服务器的请求应使用 `POST` HTTP 方法。\n*   在第二行中，我们在\
  \ HTTP 标头（header）中指定我们正在发送的负载类型。在这种情况下，`application/json` 是指定 JSON 格式的正确字符串。\n*\
  \   在第三行中，我们指定了 JSON 格式的实际负载。\n*   在最后一行中，我们输入了接收带有负载请求的端点 URL。\n*   反斜杠 `\\` 基本上是在\
  \ Linux 终端中使用多行发布复杂命令的一种方式。如果你使用 Windows，该字符会有所不同。\n\n正如本节开头所述，发送或接收负载将是为我们的服务提供输入并接收结构良好的响应的关键。在\
  \ RESTful 服务中，设计良好的 JSON 请求或响应通常会代表整个领域对象或其部分表示（这对于 `PATCH` 请求 特别重要，因为 `PATCH` 只更新你的领域对象的一部分）。\n\
  \n作为一个示例，当向我们的 `rental-properties` 端点发送 `POST` 请求时，我们可以让 `curl` 请求看起来像这样：\n\n```\n\
  curl -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"address\"\
  : \"the address st, 32\", \"rooms\": 3}' \\\n  http://homeit.com/api/v1/rental-properties\n\
  ```\n\n由于 `POST` 请求习惯上用于创建对象，我们的 API 服务可以向客户端返回 JSON 负载作为响应，包含新租赁属性的实际完整 JSON 表示。这将包含一个\
  \ ID 以及其他字段。该 ID 将用于在整个 HomeIt 中唯一标识和引用该租赁属性。\n\n## 使用 UUID 唯一标识对象\n\n在我们的系统中创建对象时，我们需要确保能够通过强\
  \ ID 标识它们。过去的许多系统通过从给第一个对象的 ID 分配 `0`（零）开始，并随着对象的创建逐递增 ID 来创建 ID。遗憾的是，这导致了一个非常不安全的系统，攻击者可以很容易推导出有效\
  \ ID。如果他们知道一个端点并拥有有效的凭据，获取有效且敏感的数据只需测试自然数即可。\n\n相比之下，现代系统将使用 UUID 系统。\n\n`通用唯一标识符`（`UUID`）是一个随机逐位生成的\
  \ 128 位数字。可以创建 $2^{128}$ 种可能的 UUID。这个数量非常大，以至于单个软件系统可以随机生成数千年的 UUID，而且同一个 UUID 生成两次的概率微乎其微。大多数编程语言都有\
  \ UUID 生成器的适当实现，该生成器由`互联网工程任务组`（`IETF`）在 RFC 4122 中设计。IETF 是一个由 IT 行业人士组成的开放学会，为与计算机科学相关的不同主题提供开放标准。\n\
  \n这里是一个 UUID 的示例。它是使用 Linux 上的 `uuidgen` 命令生成的：\n\n![](img/B18632_05_Code.jpg)\n\
  \n这个字符串序列是用字母数字表示的随机生成的 128 位数字。这是我建议你在为领域对象创建 ID 时使用的标准。UUID 标准的主要目标是允许在不使用中央权威的情况下生成\
  \ ID，这使其成为分布式微服务应用的完美用例。有了 UUID，你不需要计数器、迭代器或任何存储库来确保不会生成重复的 UUID。只要算法实现得当，你生成的任何\
  \ UUID 都意味着你手里有一个唯一的数字。\n\n我们很快就会在另一个 Spring 服务中看到 UUID 生成的实现。在此之前，我们仍然需要学习 REST\
  \ 请求的最后一部分：标头（headers）。\n\n\n\n\n负载（Payloads）始终指的是你的应用程序域。在 HomeIt 系统中，负载始终包含来自业务本身的专业知识（房东、租赁物业、租赁建议、合作伙伴提案等）。另一方面，头部（Headers）始终包含用于方便处理请求本身的数据。你将关于数据数据的数据添加到头部中。因此，我们说\
  \ HTTP 头部包含了元数据（关于数据的数据）。\n\n让我们学习一下今天 HTTP 请求中常用的一些头部：\n\n- `Host`：指示请求发送到的服务器的主机和端口号。这对于确定请求的目标至关重要，特别是在托管多个域名的服务器上。\n\
  - `User-Agent`：提供用于发送请求的软件（浏览器或其他）的信息，允许服务器根据客户端的软件能力定制合适的响应。\n- `Accept`：指定客户端理解的媒体类型（以\
  \ MIME 类型表示）以及它们的偏好。这允许服务器选择适当的内容或编码方式。我们一直在讨论 JSON 格式，但它实际上可以是任何格式。\n- `Authorization`：包含用于向服务器验证客户端身份的凭据，这对于需要用户验证的区域至关重要（我们将在后续章节中深入探讨授权方法）。\n\
  - `Cookie`：从客户端向服务器发送存储的 cookie，允许服务器重建客户端会话的状态，从而维持有状态交互。这不会在无状态的 REST 服务中使用。\n\
  \n这些是常用的 HTTP 响应头部：\n\n- `Set-Cookie`：指示客户端存储 cookie 并在随后的服务器请求中发送它，这对于会话管理和维护用户状态至关重要。不用于无状态的\
  \ REST 服务。\n- `Content-Type`：指示资源的媒体类型，告诉客户端内容是什么以及应该如何处理（例如，`text/html` 或 `application/json`）。\n\
  - `Content-Length`：指定响应体以字节为单位的大小，这对于客户端知道预期接收多少数据至关重要。\n- `Cache-Control`：指定请求和响应中缓存机制的指令。它控制资源的缓存行为以减少带宽并提高性能（例如，`no-cache`\
  \ 或 `max-age`）。\n- `Location`：用于重定向（3xx 响应码）以及创建新资源时。该头部告知客户端要重定向的确切 URL 或新资源的位置。\n\
  \n现在我们已经看到了 HTTP 请求的基本元素，让我们在实践中看看如何在 Spring 中创建 HTTP 请求处理程序。\n\n# Spring 应用内部如何运行\n\
  \n在几个章节前我们创建的第一个 Spring 应用中，某些东西可能引起了你的注意。让我们来看 `MyFirstSpringbootServerApplication.java`\
  \ 类：\n\n```java\n@SpringBootApplication\npublic class MyFirstSpringbootServerApplication\
  \ {\n    public static void main(String[] args) {\n        SpringApplication.run(\n\
  \            MyFirstSpringbootServerApplication.class,\n            args);\n   \
  \ }\n}\n```\n\n作为一名 Java 开发者，你知道 `main()` 方法是 Java 用于启动任何应用程序的方法。我们能够下载一个示例项目并从头编写一个新类，而在这个\
  \ `MyFirstSpringbootServerApplication` 类中并不引用它，这很有趣吗？\n\n由于 `IpController` 类中的 `getIp()`\
  \ 方法不是静态方法而是实例方法，Spring 框架在 Java 中使用它的唯一方法是在*某处*拥有 `IpController` 类的实例。Spring 框架是如何知道实例化该类并让我们的第一个\
  \ HTTP 处理程序上线，使得 `getIp()` 方法可供我们的 `curl` HTTP `GET` 请求使用的呢？\n\n我们知道，Java 应用程序在没有某处配置的情况下是不可能实例化类的。在\
  \ Spring 框架中，有几种方法可以配置要实例化的类，例如我们写的 `IpController` 类：\n\n- XML 配置\n- 基于注解的配置\n-\
  \ 基于 Java 的配置\n- 基于 Groovy 的配置\n- 属性文件 (Property files)\n- YAML 文件\n- 环境变量\n- 命令行参数\n\
  - 配置 (Profiles)\n\n我们将在全书中探索这些不同的配置类型。现在，我们只想回答自己的问题：有这么多配置类的方法，Spring 框架是如何知道如何实例化\
  \ `IpController` 类的？另一个重要方面是：作为 Java 开发者，为什么我们不需要编写实例化 `IpController` 类的方法？\n\n\
  这是 Spring 框架初学者脑中困惑的主要来源。如果类仅通过 Spring 框架就可以实例化，而开发者不需要编写提供类实例的代码，那么在应用程序启动后，一个对象“仅仅就在那里”且完全准备好使用，这种感觉就像魔法一样。\n\
  \n我知道，对吧？！我第一次看到它时的感觉也是这样。负责回答这个令人惊讶的问题的部分是 Spring 框架的组件生命周期。\n\n## 引入 Spring 框架组件生命周期\n\
  \n这个谜底的简单答案是：一旦开发者配置了系统中的关键类，Spring 框架就能在启动期间检测到这些类并为用户自动实例化。除非另有说明，Spring 框架将为每个配置的类提供一个实例，该实例将在执行期间创建。当关闭整个应用程序时，Spring\
  \ 框架将销这些实例。我们称之为 `Singleton`（单例）模式：保证执行期间每个类只有一个实例。\n\n好了，让我们再展开一下：我们所说的*关键类*是什么？为什么\
  \ `IpController` 类在执行期间可以（并且应该）只有一个实例？\n\n如果你记得，在编写 `IpController` 类时，我们在 `IpController`\
  \ 类上添加 `@RestController` 注解，并在 `getIp()` 方法上添加 `@GetMapping` 注解。当我们的 Spring 应用启动时，这些注解在后台（在许多事情中）是使用我们操作系统的原生\
  \ API 在端口 `8080` 上创建一个网络监听器。一旦该监听器收到针对 `/get-ip` URI 的 HTTP `GET` 请求，就知道如何调用 `getIp()`\
  \ 方法。换句话说，Spring 框架以某种方式知道如何为你协调所有的 OSI 模型层，让你只需专注于你的 Java 方法（稍后会介绍）。当你在终端上执行 `curl\
  \ localhost:8080/get-ip` 时，Spring 框架会获取该请求并将其直接递送给你的 `IpController.getIp()` 方法。\n\
  \n此外，由于单个网络监听器可以分别处理多个 HTTP 请求，因此拥有一个 Java 类实例来处理针对相同 URI (`/get-ip`) 的尽可能多的 `GET`\
  \ 请求是有意义的。每个远程 HTTP 客户端请求将将被递送到 `getIp()` 方法的单个调用中。\n\n\n\n最后，由于 Spring Framework\
  \ 在后台使用 Tomcat、Jetty 或 Undertow，它们能够在独立的线程中处理不同的 HTTP 请求。因此，如果你有一台多核 CPU，那么来自单个\
  \ `IpController` 类实例的 `getIp()` 方法甚至会被你机器上不同的处理器并行调用，这是完全合理的。换句话说，你只需要一个类实例就可以处理任意数量的并行请求。这种并行处理和线程管理由\
  \ `Java virtual machine` (`JVM`) 自动处理，Spring 甚至不需要感知它的存在。\n\n这里有一个该概念的视觉图示：\n\n\
  ![Figure 5.18: Spring 如何处理网络请求](img/B18632_05_18.jpg)\n\n图 5.18：Spring 如何处理网络请求\n\
  \n好了，现在你已经了解 Spring Framework 在概念和架构上是如何工作的。这为理解 Spring Framework 世界中一个重要的关键词奠定了背景知识：Spring\
  \ beans。\n\n## 什么是 Spring beans 它们它们为什么重要？\n\nSpring Framework 将在某些单例类（singleton\
  \ classes）中实现一些核心服务的想法并不新颖：J2EE 架构也是基于这一假设运行的。这些实现软件核心服务的可重用单例 Java 类就是人们所说的 `Java\
  \ Beans`。相反，在 Spring Framework 世界中，我们直接这些这些核心单例类 `Spring beans`。\n\n我认为在这里充分解释这个术语非常重要。我个人曾对这个神秘的词\
  \ `beans` 感到非常困惑。很多书会使用这个术语而不进行适当的解释，这让许多初学者感到非常困惑。\n\n`bean` 这个词被选择用于这些可重用类，是一个与\
  \ Java 编程语言名称匹配的比喻。`Java` 指的是一种最初在印度尼西亚爪哇岛种植的咖啡。使用咖啡作为比喻是因为，在 Java 早期，程序员们对这种语言的可能性感到兴奋和充满活力。许多程序员热爱咖啡是因为它能为他们的日常工作带来能量，所以他们的灵感就源于此：这种编程语言就像他们喜爱的咖啡一样好。\n\
  \n`bean` 这个词是 `coffee beans`（咖啡豆）的。Spring 应用需要几个 bean 来执行其逻辑。bean 是一个单例类，可以与其他 bean\
  \ 结合使用，使你的程序正常运行并提供业务功能。\n\n好了，这应该足以消除你将在很多地方看到的对 `bean` 一词用法的困惑。这使得我们的 `IpController`\
  \ 类在第一个示例应用程序中成为了 Spring bean。你现在对架构背景有了很多了解，但我们仍然顺着线索来完全且毫无疑问地回答这些问题：我们的 Spring\
  \ 应用是如何知道如何实例化 `IpController` bean 的？甚至在此之前，JVM 又是如何知道我们的应用程序是用 Spring Framework\
  \ 构建的并会遵循它的流程的？\n\n## 介绍 Spring Boot 项目\n\n如果你仔细观察我们的主应用程序类，你会发现 `MyFirstSpringbootServerApplication`\
  \ 类被标记了 `@SpringBootApplication` 注解。这是 Spring Boot 项目的关键组件之一。单凭这一个注解就能用默认选项配置整个\
  \ Spring 应用，使应用基本上能够开箱即用。`main` 方法除了调用 `SpringApplication.run()` 之外空无一物，该方法将主项目类本身作为参数。\n\
  \n这就是 Spring Boot 项目的力量：它提供了关键组件，使你的应用程序配置变得非常简单。仅通过 `@SpringBootApplication` 注解，你的应用就变成了一个完整的\
  \ Spring 应用，它将知道如何寻找应该被实例化为 Spring beans 的类。你不需要在主类中编写任何其他内容。它自己就知道！这对于初学者来说感觉就像纯魔法。\n\
  \n我们将在接下来的章节中探索 Spring Boot 项目中许多其他有趣的内容。但首先，我们仍然需要继续我们现在的路线：既然我们已经知道 Spring 应用是如何产生的，它到底是如何知道哪些类应该被视为\
  \ Spring beans 或单例的呢？\n\n## 理解 Spring Framework 组件扫描（component scan）\n\n当启动应用程序时，Spring\
  \ Framework 会扫描所有标记了特殊注解的类。这些注解告诉 Spring 被标记的类应该被管理为 Spring beans。换句话说，Spring Framework\
  \ 会为这些带注解的类创建一个实例。\n\n标记类为 Spring bean 的主要注解是 `@Component`。其他注解本身也被标记了 `@Component`\
  \ 注解。你猜怎么着？在我们 `IpController` 类中使用的 `@RestController` 注解也间接继承了 `@Component` 注解。这是注解链：\n\
  \n![Figure 5.19：RestController 注解类的层次结构](img/B18632_05_19.jpg)\n\n图 5.19：RestController\
  \ 注解类的层次结构\n\n搞定！有一系列继承自 `@Component` 的注解，还有创建 Spring beans 的其他方法。我们将会有很多专门教你它们是如何工作的页面。\n\
  \n## Spring beans 在运行时存储在哪里？\n\n预留用于存储和管理 Spring beans 的内存区域 `application context`（应用上下文）。事实上，它本身就是一个\
  \ Spring bean，其类名为 `ApplicationContext`。这个 bean 允许你访问应用程序中实例化的所有 Spring beans。\n\
  \n我们通常不会访问这个 bean，但了解它是很好的，这样我们就能清楚 Spring 应用如何在内存中组织内容。了解这些细节基本上揭示了 Spring Framework\
  \ 魔法背后的秘密。\n\n## 如何轻松访问 Spring bean\n\n如你所知，在我们的第一个应用程序中每当有新的 HTTP 请求发送到 `/get-ip`\
  \ URI 时，Spring 会自动调用 `IpController.getIp()` 方法。在那个示例中，我们不需要从任何其他类直接访问 `IpController`\
  \ 类，因为 Spring Framework 会为你完成所有工作。\n\n但如果你的应用程序中有两个具有重要服务的 Spring bean，并且它们需要互相访问怎么办？这实际上是非常常见的场景，即一个\
  \ bean 依赖于另一个。因此，在 Spring Framework 中，你不需要手动用工厂实例化 bean 并通过程序在另一个 bean 中设置引用，你可以指示\
  \ Spring Framework 将 bean 引用“注入”到另一个中。这被称为 `dependency injection`（依赖注入），它也是 Spring\
  \ Framework 的核心功能之一。\n\n将 Spring bean 注入你编写的另一个 bean 中的最佳方法是执行如下的操作：\n\n```\n@Component\n\
  public class DependencyInjectionSample {\n    private final ApplicationContext applicationContext;\n\
  \    public DependencyInjectionSample(\n        ApplicationContext applicationContext)\
  \ {\n        this.applicationContext = applicationContext;\n    }\n    @PostConstruct\n\
  \    public void init() {\n        System.out.println(\"Initializing MyComponent\"\
  );\n        for (String beanDefinitionName :\n            applicationContext\n \
  \               .getBeanDefinitionNames()) {\n            System.out.println(\"\
  Bean Name: \"\n                + beanDefinitionName);\n        }\n    }\n}\n```\n\
  \n\n\n\n如你所见，我们使用 `@Component` 注解声明了 `DependencyInjectionSample` 类。这告诉 Spring 在组件扫描阶段之后，在运行时创建该类的单例。此外，我们还定义了一个构造函数，它将\
  \ `ApplicationContext` bean 作为参数并将其设置为私有类属性。在启动期间，Spring Framework 会检查 bean 的依赖关系并按照正确的顺序创建\
  \ bean，这样只有当 bean 的依赖项已经构建完成后，该 bean 才会被构建。这确保了所有 bean 在应用程序启动时都能作为参数接收它们的依赖。此外，如果你有循环依赖（bean\
  \ A 依赖于 bean B 而 bean B 又依赖于 bean A），Spring 将抛出一个显式异常，因为循环依赖在构建期间是无法解决的（坦率地说，这是一种糟糕的设计）。\n\
  \n你可能已经注意到了第 `18` 行的 `init()` 方法，它被标记了 `@PostConstruct` 注解。这告诉 Spring Framework\
  \ 该方法应该在 bean 实例化后立即执行。这是 Spring Framework 组件生命周期的一部分，它可以让你在应用程序启动时方便地在每个 bean 中执行初始操作。每当应用程序启动时，这个\
  \ `init()` 方法基本上会在控制台输出中访问并打印所有现有的 bean 名称。Spring Framework 本身会自动创建几十个 Spring bean，但你自己的\
  \ bean 也会出现在该输出中。以下是我在控制台中运行此应用时获取的输出片段：\n\n![](img/B18632_05_20-A.jpg)![](img/B18632_05_20-B.jpg)\n\
  \n图 5.20：列出应用程序启动时的可用 Spring bean\n\n如你所见，我们在第一个项目中的所有类都被 Spring Framework 视为 bean：`ipController`、`dependencyInjectionSample`\
  \ 和 `myFirstSpringbootServerApplication` 类。\n\n现在，让我们理解一下什么是控制反转（inversion of control），以及它是如何促进\
  \ Spring 应用程序和服务管理的。\n\n## Spring 容器与控制反转\n\n这一切让你对 Spring Framework 是什么以及它如何在幕后运行魔术有了深刻的理解。如果你理解了这些概念，你就有了一个良好的开始，因为大多数开发者很难理解\
  \ Spring 中自动发生的事情。\n\n这种让框架控制你的 bean 创建过程的方式被称为 `控制反转`（`IoC`）。你作为开发者，不再需要编写用于实例化主服务的工厂，而是将其交给核心\
  \ Spring Framework 来完成。Spring 的 `ApplicationContext` 类也被称为 `Spring IoC 容器`——换句话说，就是包含\
  \ Spring bean 的类。你只需要声明你希望将它们作为构造函数参数传递的地方。框架会处理其余的工作。\n\nSpring Framework 和 Spring\
  \ Boot 项目还有其他方面，我们将在整本书中不断学习。目前，你只需要良好掌握以下内容：\n\n*   Spring Framework 包含一组核心功能，如\
  \ Spring IoC 容器以及几个项目——Spring Boot 就是其中一个项目。\n*   你需要理解每个项目的目的，以便知道何时何时使用它们。\n*\
  \   Spring Boot 项目帮助你通过使用一组易于使用的注解来快速构建应用程序。\n*   所有 Spring Framework 项目都提供了非常有帮助的注解和出色的模式，可以加速你作为开发者的工作。\n\
  \n如此，现在让我们为我们的 HomeIt 服务实现第一个 REST API。\n\n# 在 Spring 中创建 RESTful API\n\n到到目前为止，我们只使用了两个注解来在\
  \ Spring 中声明 REST 服务——`@RestController` 和 `@GetMapping`。这些注解仅代表了我们使用该框架编写 Web 服务时所有可能性中的一小部分。在\
  \ Spring 中编写 REST 应用程序有两种主要方式：\n\n*   `Spring Web` 项目，这些注解就源于此。它实现了线程阻塞模型。\n*  \
  \ `Spring WebFlux` 项目，它引入了非阻塞的响应式模型。\n\n我们将在本书的后续章节中检查这两种模型的示例实现。我们将让你了解如何实现 REST\
  \ 接口。这部分不会有太多的业务代码或持久层实现。我们希望保持简单，以便你准确理解 `Spring Web` 和 `Spring WebFlux` 这两个项目的具体用途。\n\
  \n## 使用 Spring Web 编写租赁物业 REST API\n\n`Spring Web` 项目曾是你需要快速提取 API 且不需要处理成千上万并发请求时的正确选择。但现在，随着\
  \ Java 17+ 的一些微调以及虚拟线程的实现，你可以让 Spring Web 在处理高量并发请求方面的性能非常接近 Web Flow。\n\n也就是说，如果你需要一个基于\
  \ servlet 的框架来编写 REST API，你可以选择 Spring Web 这一非常安全的路线。它可以非常快且延迟低，但如果你使用虚拟线程，它将为每个请求阻塞一个线程，这可能会成为问题，特别是在进行\
  \ I/O 操作时，例如数据库访问、对其他远程服务的请求等。\n\n如果你需要处理成千上万的并发请求，如果你的端点上有大量的 I/O 操作，或者你的应用需要等待耗时很长的\
  \ I/O 操作完成，而你又想拥有优势，你可以考虑使用 WebFlux。WebFlux 在等待这些操作完成时不会阻塞你的线程（稍后会详细介绍）。但再次，通过我在这里为你展示的虚拟线程微调，Spring\
  \ Web 可能是所有用例的最佳选择，因为它的编程模式更容易理解。\n\n我们在此处为你提供了一个完整的 Spring Web REST API 实现示例：`https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-05/My-first-Springboot-server/src/main/java/com/ip/server/My/first/Springboot/server/controller/RentalPropertyController.java`。\n\
  \n让我们为你拆解这个代码示例。\n\n在这个练习中，我们将为 HomeIt 服务的租赁微微实现一个 API 示例。通常情况下，一个 Spring Web API\
  \ 如下：\n\n*   REST API 应该处理 HTTP 请求，通常处理 JSON 负载。\n*   REST API 中的每个领域将实现为一个单一的 `Controller`\
  \ 类。该领域类实现了传统 `模型-视图-控制器`（`MVC`）设计中的 `Controller` 层。因此，在 HomeIt 启动示例中，每个领域都应该至少有一个类（租赁物业、用户、合作伙伴提案等）。\n\
  *   本书将不会涵盖 `Model` 和 `View` 层，因为我们关注的是微服务，而其他层更多用于渲染 HTML 页面。如果你想了解更多关于 Spring\
  \ MVC 的知识，网上有大量的资源。\n\n好了，让我们开始 REST API 示例。\n\n## 声明依赖\n\n首先，让我们看看我们的 依赖。我们使用的完整\
  \ Gradle 构建文件可以通过地址 `https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-05/My-first-Springboot-server/build.gradle`\
  \ 访问。\n\n这是我们 `build.gradle` 文件开始的地方，它指导 Gradle 如何构建应用程序：\n\n\n\n\n```gradle\nplugins\
  \ {\n    id 'java'\n    id 'org.springframework.boot' version '3.2.5'\n    id 'io.springframework.dependency-management'\
  \ version '1.1.4'\n}\ngroup = 'com.ip.server'\nversion = '0.0.1-SNAPSHOT'\njava\
  \ {\n    sourceCompatibility = '21'\n}\nrepositories {\n    mavenCentral()\n}\n\
  ```\n\n所有这些行都来自我们用于创建示例应用程序时使用的 Spring Initializr 网站。以下是一些重要的说明：\n\n* 我们看到了一个块，列出了构建和运行此应用程序所需的插件列表。我们在\
  \ `plugins` 部分添加了 Java 和 Spring Boot，这允许我们轻松地配置 Spring 应用程序；并且我们添加了 `Spring Dependency\
  \ Management` 插件，它为我们管理 Spring Boot 依赖，这样我们就不需要跟踪每一个依赖版本。\n* 由于我们需要使用虚拟线程（virtual\
  \ threads），因此将 Java `sourceCompatibility` 至少设置为 `17` 是重要的，这是 Spring 6 推荐的最低 Java\
  \ 版本。在案例中，我将其设置为 `21`，仅仅是为了获取虚拟线程功能，我们将在后续章节中探索该功能，以提高我们的 API 性能。\n* Maven Central\
  \ 也会从 Spring Initializr 网站自动配置。\n\n现在，让我们来看这个文件的其余部分。这里有一个声明 Spring Web 依赖的重要部分：\n\
  \n```gradle\ndependencies {\n    implementation 'org.springframework.boot:spring-boot-starter-web'\n\
  \    testImplementation 'org.springframework.boot:spring-boot-starter-test'\n  \
  \  implementation 'org.springframework.boot:spring-boot-starter-validation'\n  \
  \  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'\n}\ntasks.named('test')\
  \ {\n    useJUnitPlatform()\n}\n```\n\n如你所见，我们在这里包含了其他重要的依赖项：\n\n* 声明了 Spring Web\
  \ 依赖，它允许编写 REST API。\n* 声明了 Spring Test 依赖，允许我们为 API 编写自动化测试。\n* 我们还需要 Spring Validation\
  \ 依赖，以确保我们的 REST 请求只有在正确时才被处理。\n* 最后，我们定义了想要使用 JUnit 运行测试类。\n\n在下一节中，我们将跳转到 `RentalPropertyController`\
  \ 类本身的代码行。它将清晰地说明如何使用 Spring Web 编写 `Controller` 类。\n\n### 编写 RentalPropertyController\
  \ 类\n\n看这个类定义：\n\n```java\n@RestController\n@RequestMapping(\"/api/v1/rental-properties\"\
  )\n@Validated\npublic class RentalPropertyController {\n    private final RentalPropertyService\n\
  \        rentalPropertyService;\n    public RentalPropertyController(\n        \
  \    RentalPropertyService rentalPropertyService) {\n        this.rentalPropertyService\
  \ = rentalPropertyService;\n    }\n    // ...其余部分在这里\n}\n```\n\n这些是该开头部分的要点：\n\n\
  * 我们正在声明此类将是一个 `RestController` 类。由于该注解继承自 `@Controller` 注解，而后者又继承自 `@Component`，Spring\
  \ 将此类视为一个 Spring bean 并在应用程序启动期间为你进行实例化。\n* `@RequestMapping` 注解用于定义实际的 API 根目录。由于更新端点可能会破坏客户端，维护的最佳模式是在根\
  \ API 目录中添加版本号。当你需要发布相同 API 的新版本时，建议在单独的类中创建其他版本，并更新版本号。\n* 我们声明了该类的方法参数将在执行时由 Spring\
  \ 进行验证。我们将在接下来的几个章节中看到如何实现。\n* 另一个我们可以看到的有趣点是，这个 Spring bean 依赖于 `RentalPropertyService`。我们将来会讨论服务类，但本质上，这些应该是隔离我们业务规则的类。目前只需要说这与之前用于依赖注入的语法相同。这些行告诉\
  \ Spring 框架，每当在 API 启动期间实例化 `Controller` 类时，它需要提供服务类的实例。Spring 将找到并实例化该类。\n\n现在让我们跳转到实际的端点声明，从根据属性\
  \ ID 获取租赁物业的 `GET` 请求开始：\n\n```java\n@GetMapping(\n    value = \"/{id}\",\n    produces\
  \ = \"application/json\")\npublic ResponseEntity<RentalPropertyDTO> getPropertyById(\n\
  \    @PathVariable UUID id) {\n    return rentalPropertyService.get(id)\n      \
  \  .map(ResponseEntity::ok)\n        .orElse(ResponseEntity.status(HttpStatus.NOT_FOUND)\n\
  \        .body(null));\n}\n```\n\n这展示了如何实现 `GET` 请求：\n\n* 我们使用了 `@GetMapping` 注解。在\
  \ `RentalPropertyController` 类中，完整地址将是 `/api/v1/rental-properties/{id}`。\n* 我们定义返回类型为\
  \ `ResponseEntity`，这是 HTTP 请求的标准返回类型。返回类型指定为 `RentalPropertyDTO`，这是我们的数据传输对象（`DTO`）类——一个携带租赁物业属性的\
  \ POJO。\n* 我们在端点地址中声明了一个变量 `{id}`，我们称路径参数（path parameter）。为了从请求中提取路径参数，我们需要使用 `@PathVariable`\
  \ 注解，且方法参数名称应与 `@GetMapping` 注解的 `value` 属性中声明的路径参数匹配。\n* 我们使用函数式管道编写了代码，从服务中获取租赁物业，然后将其映射到\
  \ `ResponseEntity` 对象。该行中的 `ok` 方法将租赁物业 TO 设置为响应，并将 HTTP 响应码设置为 `200`。我们还实现了一个回退方案，以便在\
  \ `GET` 请求通过无效属性 ID 触发时返回 `404` 状态码（NOT FOUND）。此管道是使用 Java `Optional` 对象构建的，有助于避免\
  \ `if` 语句和空指针异常。\n\n现在，让我们跳转到 `POST` 请求的实现：\n\n```java\n@PostMapping(\n    consumes\
  \ = \"application/json\",\n    produces = \"application/json\")\npublic ResponseEntity<RentalPropertyDTO>\
  \ createProperty(\n    @Valid @RequestBody RentalPropertyDTO property) {\n    RentalPropertyDTO\
  \ createdRentalProperty = rentalPropertyService.create(property);\n    return ResponseEntity.status(HttpStatus.CREATED)\n\
  \        .body(createdRentalProperty);\n}\n```\n\n这些是此代码的亮点。我将不再重复之前为 `GET` 端点提供的解释：\n\
  \n* 正如我们刚刚看到的 `@GetMapping` 注解一样，我们现在使用 `@PostMapping` 注解来声明一个 HTTP `POST` 端点实现。\n\
  \n\n\n\n\n*   我们声明此端点将接受来自客户端的 JSON 负载（payload）。这意味着创建租赁房产发送新信息的唯一方法是通过向我们的 API\
  \ 请求中发送 JSON 负载（稍后我们将查看一个请求执行的示例）。\n\n*   我们在方法中申明了 `property` 参数，其类型为 `RentalPropertyDTO`，因为这是我们用于在网络上传输租赁房产信息的类。我们为该参数标记了两个句注解：`@Valid`，以便\
  \ Spring 在接受请求并执行我们的方法之前检查某些规则；以及 `@RequestBody`，这意味着 Spring 将将您的 `POST` 请求负载解析为\
  \ `RentalPropertyDTO` get。这基本上就是我们如何使用 Spring Web 将负载解析为方法参数的方法。\n\n*   我们要求服务类创建该属性并将其返回给一个变量。\n\
  \n*   最后，我们说明了如何创建默认的 `ResponseEntity` 对象，它被用作 Spring Web 实现的标准返回类型。`CREATED` HTTP\
  \ 状态的编号为 `201`。当然，返回的负载是新创建的租赁房产，并设置为 `body`。\n\n现在让我们转向 `PUT` 映射，看看我们得到了什么：\n\n\
  ```java\n@PutMapping(\n    value = \"/{id}\",\n    consumes = \"application/json\"\
  ,\n    produces = \"application/json\")\npublic ResponseEntity<RentalPropertyDTO>\
  \ updateProperty(\n    @PathVariable UUID id,\n    @Valid @RequestBody RentalPropertyDTO\
  \ updatedProperty) {\n    return rentalPropertyService\n        .update(id, updatedProperty)\n\
  \        .map(ResponseEntity::ok)\n        .orElse(ResponseEntity.status(HttpStatus.NOT_FOUND)\n\
  \            .body(null));\n}\n```\n\n在这里：\n\n*   我们使用了 `@PutMapping` 注解，它告诉 Spring\
  \ 从我们的方法创建一个 `PUT` 端点。这与其他注解相同，但针对的是不同的 HTTP 方法。\n\n*   `PUT` 请求同时需要负载和路径参数，因为我们正在向现有的租赁房产对象发送更新后的信息。负载当然是使用\
  \ `@RequestBody` 注解声明的，而路径参数像之前的示例一样，使用 `@PathVariable` 注解声明的。\n\n*   我们展示了与 `GET`\
  \ 实现类似的函数式流水线（functional pipeline）。然而，这次我们首先调用了服务类的 `update` 方法。\n\n`PATCH` 实现看起来与\
  \ `PUT` 实现完全一样：\n\n```java\n@PatchMapping(\n    value = \"/{id}\",\n    consumes\
  \ = \"application/json\",\n    produces = \"application/json\")\npublic ResponseEntity<RentalPropertyDTO>\
  \ patchProperty(\n    @PathVariable UUID id,\n    @RequestBody RentalPropertyDTO\
  \ partialUpdate) {\n    return rentalPropertyService\n        .updateSomeFields(id,\
  \ partialUpdate)\n        .map(ResponseEntity::ok)\n        .orElse(ResponseEntity.status(HttpStatus.NOT_FOUND)\n\
  \            .body(null));\n}\n```\n\n*   当然，我们有一个正确的 `@PatchMapping` 注解。\n\n* \
  \  我们还需要一个请求体来处理部分更新。\n\n*   我们在方法实现中有函数式流水线。\n\n`DELETE` 实现情况略有不同：\n\n```java\n\
  @DeleteMapping(\"/{id}\")\npublic ResponseEntity<Void> deleteProperty(@PathVariable\
  \ UUID id) {\n    return rentalPropertyService\n        .delete(id)\n        .map(opt\
  \ ->\n            ResponseEntity.noContent()\n                .<Void>build())\n\
  \        .orElse(ResponseEntity\n            .status(HttpStatus.NOT_FOUND).build());\n\
  }\n```\n\n*   当然，我们有 `@DeleteMapping` 注解，它将告诉 Spring 该方法实现了 `DELETE` HTTP 方法端点。\n\
  \n*   当成功删除一个对象时，我们应该使用的标准返回代码是 `204`（成功，无内容）。然而，一些开发者也会使用 `200`。\n\n*   由于我们没有在请求中返回负载，我们需要通过\
  \ `<Void>` 声明来显式表示。\n\n现在，进入 `/search` 端点：\n\n```java\n@GetMapping(\n    value =\
  \ \"/search\",\n    produces = \"application/json\")\npublic ResponseEntity<List<RentalPropertyDTO>>\
  \ searchProperties(\n    @RequestParam(required = false) String name,\n    @RequestParam(required\
  \ = false) String address,\n    @RequestParam(required = false) String city,\n \
  \   @RequestParam(required = false) String country,\n    @RequestParam(required\
  \ = false) String zipCode) {\n    return ResponseEntity.ok(rentalPropertyService.search(\n\
  \        name, address, city,country,zipCode));\n}\n```\n\n*   这只是 `@GetMapping`\
  \ 注解的另一个用例，它声明了一个 `GET` HTTP 端点。这一次，我们的完整端点地址将是 `/api/vi/rental-properties/search`。\n\
  \n*   这一次我们没有使用路径参数，而是使用了 `@RequestParam`。\n\n\n\n\n现在，让我们确保本章中的 beans 已经全部上线：\n\
  \n![图 5.22：列出可 Spring beans](img/B18632_05_22.jpg)\n\n图 5.22：列出可用 Spring beans\n\
  \n如你所见，因为我们在项目中创建了 `dependencyInjectionSample`，我们现在可以看到已实例化的 `rentalPropertyController`\
  \ bean：\n\n![图 5.23：检查应用程序运行了多长时间](img/B18632_05_23.jpg)\n\n图 5.23：检查应用程序运行了多长时间\n\
  \n在启动日志结束时，我们可以看到成功消息。在这种情况下，应用已运行了 `24` 分钟。\n\n你也可以通过在 `build/libs/My-first-Springboot-server-0.0.1-SNAPSHOT.jar`\
  \ 找到 `.jar` 文件来运行此应用：\n\n![图 5.24：运行 Spring 应用 .jar 文件](img/B18632_05_24.jpg)\n\n\
  图 5.24：运行 Spring 应用 .jar 文件\n\n如你所见，你运行应用程序的命令如下：\n\n```\n> java -jar <path of your\
  \ spring app jar>\n```\n\n这就是你希望在生产环境中运行应用程序的命令。操作非常简单。关于你的应用程序 `.jar` 文件以 `SNAPSHOT`\
  \ 后缀命名的事实，将在后续章节中解释。这是由于部署和版本控制策略考虑的。让我们先忘记这一点。\n\n### 创建租赁房产\n\n现在我们已经确认应用程序运行正常，让我们创建一个租赁房产。使用以下\
