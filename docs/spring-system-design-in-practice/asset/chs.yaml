  \ IDE 中打开它。如果你仍然没有偏好的 IDE，我建议下载 IntelliJ 社区版，它是免费的。如果你是学生，甚至可以访问付费版本。它是到目前为止最适合\
  \ Java 项目的 IDE。\n\n## 打开你的 Spring 项目\n\n在解压你的第一个服务器后，将呈现以下目录结构：\n\n![图 5.10：Spring\
