  ```\n\n第一条命令将使用你通过 SDKMAN 安装在机器上的默认 Gradle 版本执行构建。第二个命令将使用使用 Spring Initializr 生成的\
  \ Spring 项目自带的内置 Gradle 版本。\n\n让我们检查构建命令的输出：\n\n![图 5.11：Gradle 构建命令输出](img/B18632_05_11.jpg)\n\
  \n图 5.11：Gradle 构建命令输出\n\n当你运行应用程序时，Gradle 会自动编译并构建它，然后会发生以下情况：\n\n*   你的 Java 依赖项默认将直接从\
