  \n## 使用 Spring Initializr\n\n启动 Spring 项目有一个非常工具。它被称为 Spring Initializr，可以通过此地址访问：[`start.spring.io/`](https://start.spring.io/)。\n\
  \n当你访问网站时，你会看到并排的面板。左侧需要对使用的版本以及应用程序、包等进行通用设置。我设置了这些值，你也可以这样做以跟上这个过程：\n\n![Figure\
  \ 5.8: Creating an app with Spring Initializr](img/B18632_05_8.jpg)\n\n图 5.8: 使用\
  \ Spring Initializr 创建应用\n\n\n\n\n右侧面板是您选择服务将中使用哪些 Spring 项目的地方；这些实际上是您将需要的 Java\
