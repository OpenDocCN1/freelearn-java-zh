  这是 Spring 项目的基本结构。我稍后会深入进行更多的背景解释。现在，让我们了解一下不同的部分：\n\n*   `/gradle` 目录实际上包含整个版本的\
  \ Gradle 软件，它是我们的包构建器。它存在那里是为了万一你的机器上没有安装 Gradle。\n*   文件命为 `MyFirstSpringbootServerApplication.java`\
  \ 的文件是你服务器的主应用程序类。这是可以运行整套 Spring 服务的类。\n*   `/test` 目录包含一个初始测试类，我们将使用它来加速应用程序开发。\n\
  *   还有其他 Gradle `config` 文件，我们将在接下来的章节中处理。现在重要的是说明，`gradlew` 和 `gradlew.bat` 实际上是可执行文件，通过这些文件你可以在项目中运行\
  \ Gradle 构建，即使你的机器上没有安装 Gradle。\n*   命名为 `build.gradle` 的文件是我们声明 Java 库依赖的地方（包含您在项目中将用到的\
  \ Spring 类的 `.jar` 文件）。\n\n接下来，我们将学习如何编译并构建我们的包。\n\n## 使用 Gradle 构建你的应用程序\n\n为了构建你的\
