  [/content]\n\n# 微服务通信\n\n好的，我们已经考虑了是否要在我们的架构中添加新的微服务。现在，由于这本书主要是关于微服务的，我们需要了解它们实际上是如何相互通信的。为了学习这一点，我想请你看看接下来的图：\n\
  \n\n\n\n![图 5.2: OSI 模型](img/B18632_05_2.jpg)\n\n图 5.2: OSI 模型\n\n这个模型就是我们所谓的“开放系统互连接”（`Open\
  \ System Interconnection`，`OSI`）模型。它是由“国际标准化组织”（`ISO`）设计的概念模型。它让我们能够理解常见的网络协议栈，并确定互联网应用程序是如何从布线技术一直到应用程序进行开发的。\n\
  \n网上有很多关于 OSI 模型的优秀文章，由于它不是本书的主题，我们不再对其进行进一步探讨。我只是想引起你的注意，以便让你对应用程序所运行之上的基础有一个更清晰的视角。从基础物理层到链路层、网络层、传输层、会话层和表示层，我们的应用程序通常会使用第\
  \ 7 层——应用层的协议。\n\n在下一节中，我们将剖析 HTTP 协议的不同部分——我们将使用它来创建服务的主要协议。\n\n## 介绍 HTTP 协议\n\
  \n运行在 OSI 模型第 7 层的“超文本传输协议”（`Hyper-Text Transfer Protocol`，`HTTP`）是我们的应用程序在网络上发送和接收数据的轨道。它最初由\
  \ Tim Berners-Lee 创建，用于在浏览器之间传输 HTML 页面。\n\n## 你的浏览器运行在 HTTP 之上\n\n本节介绍了你的浏览器连接网站的具体方式。可能会存在一些差异，我们将在接下来的章节中重点介绍。但浏览互联网的本质是我们这里将解释的内容。\n\
  \nHTTP 的美之处在于该协议是人类可读的。通过使用简单的命令，实际上可以理解客户端和服务器正在交换什么数据。\n\n我们可以通过使用 `curl` 命令来了解\
  \ HTTP 协议的真实威力。这个终端命令在所有主要的操作系统中可用，包括 Windows 10+。\n\n例如，这是我在 Ubuntu Linux 机器上执行\
  \ `curl -vvvvv httpbin.org/ip` 命令的输出。它正在查询一个服务，该服务将告知我电脑的 IP（`http://bin.org/ip`）。`–vvvvv`\
  \ 参数将 `curl` 的执行提升到最大详细程度级别。换句话说，它会在控制台输出中客户端和服务器之间所有的实际交换：\n\n![图 5.3: 使用 curl\
  \ 向 HTTP 服务器发送/接收的原始请求和响应](img/B18632_05_3.jpg)\n\n图 5.3: 使用 curl 向 HTTP 服务器发送/接收的原始请求和响应\n\
  \n你可以在你的机器上测试相同的命令。完成后，我们可以剖析此输出：\n\n*   第一行和第二行显示了目标服务器的 IP (`3.233.6.75`) 和端口\
  \ (`80`)。该 IP 是通过 DNS 协议在底层找到的，该协议将可读地址映射为识别互联网上服务器位置的结构化数字。IP 是 OSI 模型中第 3 层的一部分。端口是第\
  \ 4 层的一部分。表示我们已连接到服务器的字符串是第 5 层会话层的一部分。第二行还显示了连接数（`#0`）。带有多个请求的复杂 HTTP 交换会导致到同一服务器/端口的多次连接。\n\
  \n*   第三行开始以两个字符开头：`>` 或 `<`。右箭头代表我们发送给服务器的数据。左箭头代表我们从服务器接收的数据。\n\n*   在我们发送给服务器的数据中，我们可以看到以下：\n\
  \n    *   `GET /ip HTTP/1.1`：`GET` 是我们在目标服务器上执行的命令。在这种情况下，我们正在请求服务检索一个资源，即 `/ip`\
  \ 目录。在这里，我们使用的是 HTTP 1.1 版本。`GET` 命令也称为 HTTP 动词（verb）。我们很快将深入探讨主要的可用动词。\n\n    *\
  \   `Host`、`User-Agent` 和 `Accept`：这些被称为 HTTP 请求中的头部（headers）。它们帮助以各种方式结构化请求。示例中的头部用于识别目标域名、执行请求时使用的\
  \ `curl` 版本，并设置我们的命令接受返回的数据类型（在本例中，我们接受任何格式）。我们将在将来深入探讨重要头部的作用。\n\n*   此执行不支持多路复用。这意味着如果我们需要执行其他\
  \ HTTP 命令，则必须建立新连接。\n\n*   在我们从服务器接收的数据中，我们可以看到以下：\n\n    *   `HTTP/1.1 200 OK`：`200`\
  \ 数字告诉我们的 `curl` 客户端请求成功了（`OK`）。它也被称为返回码。HTTP 请求有许多重要的返回码，我们将在接下来的节中学习主要的主要的。\n\n\
  \    *   然后我们有一系列头部：`Date`、`Content-Type`、`Content-Length` 等。它们告诉我们执行日期、返回内容类型（JSON，我们将进一步研究）、以字节为单位的数据长度以及正在运行的实际服务器和版本（在本例中为\
  \ `gunicorn`，这是一个基于 Python 的 HTTP 服务器）。\n\n*   最后，我们可以看到实际的 IP 结果，被称为 `payload`（负载）。在这种情况下，它包含了我电脑的\
  \ IP 地址（请求的来源）。JSON 内容类型是开发微服务的关键，因为对人类是 100% 可读的。\n\n在排查系统故障时我喜欢使用 `curl`。对于通用开发，有很多很好的替代方案，如\
  \ Postman、Insomnia 和 Bruno。它们都允许创建请求集合，以便我们轻松测试服务的各个方面。当然，你的浏览器也可以作为访问网站的工具。\n\n\
  \n\n\n\n还有其他重要的 HTTP 动词，但这些是我们需要学习的几个。我们先专注于这几个。通过为一个领域实现这五个动词，我们就完整地实现了 CRUD 操作——创建（`POST`）、读取（`GET`）、更新（`POST`,\
  \ `PUT`）和删除（`DELETE`）。这些是几乎每个软件中的主要操作。\n\n现在让我们来看主要的返回码。\n\n## 主要的 HTTP 响应码有哪些？\n\
  \n正如你在 `curl` 示例中所看到的，当你向服务器发送 HTTP 请求时，它总是返回某些代码。这些是我们在大多数系统中使用的主要响应码：\n\n*   `200\
  \ OK`：请求成功。例如，当你发出一个 `GET` 请求时，返回 `200` 码意味着资源已获取并在消息正文中传输。\n*   `201 Created`：请求已执行并导致创建了一个新资源。这通常是\
  \ `POST` 请求的响应。\n*   `202 Accepted`：请求已接受处理，但处理尚未完成。\n*   `204 No Content`：服务器成功处理了请求，但没有返回任何内容。\n\
  *   `301 Moved Permanently`：请求资源的地址已永久更改。响应中通常会提供新地址。\n*   `400 Bad Request`：由于某些客户端错误（通常是格式错误的消息），服务器无法或拒绝处理请求。\n\
  *   `401 Unauthorized`：虽然 HTTP 标准规定为 `Unauthorized`，但在语义上，此响应意味着 `unauthenticated`。也就是说，客户端必须验证身份以获取请求的响应。\n\
  *   `403 Forbidden`：虽然客户端已通过验证，但其权限不足以访问指定的资源。\n*   `404 Not Found`：服务器找不到请求的资源。\n\
  *   `500 Internal Server Error`：服务器错误，意味着发生了不可恢复的错误。\n*   `502 Bad Gateway`：服务器作为网关或代理工作时，从上游服务器接收到无效响应。\n\
  *   `504 Gateway Timeout`：服务器作为网关或代理工作时，未及时从上游获取响应。\n\n再次，还有其他你可能在实现中使用的 HTTP 代码。这些是一些人们最常用的代码。你可以在网上很多地方找到其他的\
  \ HTTP 返回码，例如 [`http.cat`](http://http.cat) ——这是一个将 HTTP 返回码与猫咪图片结合的趣味网站。\n\n# 编写你的第一个\
  \ Spring 应用\n\n我们要不要使用 Spring Boot（这是我们稍后将讨论的主要 Spring 框架项目）来重写这个 IP 服务，这样我们就能运行自己的第一个应用，你也可以感受到\
  \ Spring 是如何运作的？我们可以从这个非常快速的练习开始，然后回来解释 Spring 框架。\n\n## 使用 SDKMAN 管理你的工具版本\n\n\
  为了安装所有需要的程序，我们可以使用一个名为 `SDKMAN` 的智能工具。它能够在同一台计算机环境中维护不同版本的 Java SDK。通过 `SDKMAN`，你能够根据需要使用不同的版本。假设你今天需要\
  \ Java 8，你只需要安装它并指示 `SDKMAN` 让 Java 8 成为你终端中的默认工具。如果你想将当前的 SDK 版本更改为 Java 17，你也可以这样做。你甚至可以设置一个目录，并指定你选择的默认\
  \ Java 版本，这样当在该目录内运行 Java 命令时，就会使用你偏好的 Java 版本。这在你处理需要不同 Java 版本的项目时非常有用。\n\n`SDKMAN`\
  \ 同时支持 Linux（包括 macOS 和 Windows WSL）和 Windows。你可以按照此处的说明在你的机器上安装：[`sdkman.io/install`](https://sdkman.io/install)。\n\
  \n注意，`SDKMAN` 也能管理其他工具，包括 Maven 和 Gradle。在本书中，我们将使用 Gradle。\n\n`SDKMAN` 网站包含一个非常易于遵循的说明页面，你可以在此学习主要命令以及如何使用它们：[`sdkman.io/usage`](https://sdkman.io/usage)。\n\
  \n对于本书来说，只需运行几个命令安装正确的工具即可。首先，你可以通过此命令列出可用的 Java 版本：\n\n```\n> sdk list java\n```\n\
  \n结果将向你显示你可以安装的几个 Java 版本：\n\n![Figure 5.4: SDKMAN listing Java versions](img/B18632_05_4.jpg)\n\
