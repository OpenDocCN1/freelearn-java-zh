  \n2. 提交您的购买证明。\n\n3. 完成！我们将直接将免费 PDF 和其他福利发送到您的邮箱。\n\n# 第一部分：系统设计基础\n\n在编写行代码之前，我们需要了解我们正在构建的内容。这部分重点关注分析产品需求，将其组织为可执行的开发任务，并构建作为系统骨架的领域模型。完成本部分后，您将有一从抽象业务需求到具体技术愿景的清晰路径。\n\
  \n本部分包含以下章节：\n\n*   *第 1 章, *什么是产品需求？*\n*   *第 2 章, *将复杂需求分类为功能、用例和故事*\n*   *第 3\
  \ 章, *为您的应用定义领域*\n*   *第 4 章, *为您的领域定义服务*\n\n# 1. 什么是产品需求？\n\n欢迎开启 Spring Framework\
  \ 的奇妙之旅！\n\n在本章中，我们将涵盖所谓的“业务”或“产品”需求的世界，无论使用何种技术栈，这些需求适用于任何类型的开发工作。这些是系统的核心和灵魂，是我们了解应用程序的第一要素。需求是系统运行的动力。毕竟，当我们创建软件时，需要一个理由。要重要的是，软件开发的最佳实践并非在开发中期或后期需要的，而是从我们构思项目开始就开始了。\n\
  \n话虽如此，在本章中，我们将首先确定要解决的问题，然后清晰地阐述这些解决方案。\n\n我们将探讨：\n\n*   充分利用 Spring Framework\
  \ \n*   本书是如何安排以帮助您成功的？\n*   为什么我们必须理解业务需求？\n*   清晰的需求——确保业务正确\n*   产品需求的陷阱\n\n\n\
  \n\n\n*   可以使用顶级的 IDE，提升所有程序员的开发体验\n\n这些仅仅是 `Java` 和 `JVM` 共同构成如此强大平台的原因几点。而且这仅仅是\
  \ `Spring Framework` 广受赞誉的原因之一。\n\n`Spring Framework` 专家非常受青睐，并且在未来也将是如此。\n\n此外，`Spring`\
  \ 生态系统已经巩固了其作为最实惠、实现最快且最易理解的 `Java` 编程框架的地位。这种卓越归功于 `Spring Framework` 在市场上所有可用框架中采用了卓越的设计原则。\n\
  \n`Spring Framework` 创建于 2003 年，拥有二十余年的精磨。随着每一个版本的发布，`Spring` 社区都勤勉地保留了最佳模式和标准，并摒弃了不再符合其用途的内容。你能想象吗，你可以免费地访问如此丰富的、经过测试的理念和想法来让自己受益吗？\n\
  \n通过专精 `Spring`，你将获得顶级框架的专业知识，该框架构建在最好的编程平台之上，适用于最苛刻的场景：企业级应用。`Spring Framework`\
  \ 对于开发后端微服务架构至关重要，而这正是目前全球最大公司的基石。\n\n企业级公司的后端微服务构成了一个价值数十亿美元的行业，`Java` 在起着领导作用。因此，通过精通\
  \ `Spring`，你将能够胜任复杂的企业级架构。\n\n\n\n\n\n事实上，Spring 生态系统中并没有明确的“开始”或“结束”；每个组件的设计都是为了相得益彰。因此，关键在于理解驱动选择每个组件或\
  \ Spring 项目的特定需求。一个常见的障碍是，许多人对于为自己的软件解决方案选择何种 Spring 项目缺乏洞察力。更关键的是，在将现实世界的需求转化为有效的\
  \ Spring Framework 架构和实施策略方面，存在着广泛的挑战。\n\n这种业内的这种差距源于开发者难以理解客户视角，而这根源于多年来以技术为中心的讨论和编码，对客户参与或采纳替代性视角的关注极少。许多软件开发者发现自己被困在自己的技术范式中，无法轻易跳出局限。对于渴望提升开发能力和架构敏锐度的程序员来说，掌握业务需求已成为了一项基础技能。而这正是我们希望通过这本书来培养的技能。\n\
  \n## 完善业务需求\n\n这一原则将帮助你避免在 Spring 实现遭受巨大的损失，因为业务需求是引导你和你的团队走向成功——或走向失败的最高杠杆。\n\n\
  其中涉及的细微差别和变量层不胜数。一份编写精良的需求文档可以为团队注入清晰感，使必要的进展步骤变得直观易懂。相反，这些需求中的漏洞会导致混乱、延误，并且在日常运营中经常带来不悦的惊喜。\n\
  \n我曾见证过许多由于需求描述不当而导致的严重后果：\n\n* 团队可能会发现自己不得不丢弃数月的开发工作\n*   系统可能在缺失功能的情况下发布，影响用户体验\n\
  *   集成问题可能在项目的后期才显现\n*   项目时间表可能被反复推迟，扰计划的发布日期\n* 质量保证团队可能在测试什么以及如何测试上感到挣扎，导致潜在的遗漏\n\
  *   更容易做出糟糕的架构决策，影响项目的长期可持续性\n*   短视的选择可能会产生巨大的未来成本\n*   为了赶截止日期，可能需要额外的时间，影响团队士气和项目预算\n\
  \n情况就是如此。如果你轻率地跳过这些初始章节，听听这个幽默的预言：你的项目将无法获得安宁。清晨降临时，你将为 Slack 聊天中等待着怎样的混乱而焦虑。但不要害怕！要做所有需求都符合这些最佳实践的守护者。这样做，你注定将作为一个\
  \ Spring 开发者过上更加愉快的生活。\n\n## 什么是业务需求？\n\n`Business requirements`（业务需求）、`product\
  \ requirements`（产品需求）和 `functional requirements`（功能需求）是公司用来封装其系统为客户问题提供的解决方案的术语。\n\
  \n理解业务需求首先需要掌握什么是客户的问题。\n\n那么，究竟什么是问题？\n\n你能简洁地定义客户的问题吗？许多人对问题有直觉的感觉，但难以清晰地表述它们。这是一个常见的疏忽，但许多人并没有意识到自己在规范或处理业务需求方面存在差距。\n\
  \n这种理解上的差距会显著影响架构决策的质量。\n\n我见过许多案例，团队在原地不断打转，试图确定产品的目的。然而，通过我即将介绍的简单概念、定义和工具，组织和理清业务需求将变得简单且易懂。想象一下，将几周的循环式讨论转化为一个高效的一小时会议。这既强大又简单。\n\
  \n让我们用这个对“客户问题”的简单而深远的定义来揭开业务需求的神秘面纱：\n\n`客户问题产生于不理想的情况`。\n\n这个简洁的短语分量巨大。它意味着软件开发应该始终致力于将客户从不理想的状态转变为解决方案——即理想的状态。因此，你的软件应该充当网关，引导客户远离他们的问题走向解决。\n\
  \n现在，回到什么是业务需求。\n\n如果我们把问题理解为一种不理想的情况，把解决方案理解为未来的、所追求的状态，那么业务需求本质上是一系列精确陈述的汇编，详细说明你的软件必须采取的行动，以将客户从当前的困境转变为理想的解决方案。\n\
  \n## 清晰可见的需求——确保业务获得正确的需求\n\n我们在本节中将讨论的方法有助于为关于需求的对话带来结构和清晰度。我是利用在神经语言程序（NLP）领域学到的核心概念开发了它。虽然我们不需要在这里涉及\
  \ NLP 的技术细节，但我认为学习这种结构化业务需求的方法将有助于你理解业务需求的本质。\n\n业务人员通常会自由地写下他们想要创建的解决方案的特征。但事实上，在那种通常的自由文本形式中，隐藏着几个变量。当你真正理解了它们时，你将能够识别出任何业务需求中的漏洞和缺失部分。\n\
  \n## 可视化解决问题的时间线\n\n利用可视化时间线通过关注两个关键节点——现在和未来 `states`（状态），简化了业务需求的定义。现在状态详细说明了客户目前的挑战，而未来状态则构想了他们在实施你的解决方案后的情况。\n\
  \n视觉化非常重要，正如我们从脑科学中发现的那样。当我们使用图片或图表时，大脑会有更多地方“点亮”。通过使用更多的神经元，我们能更好地理解事物。我们大脑非常擅长观察和理解图片。例如，想想我们如何在脑海中把时间看作一条直线来理解它。那是我们在使用图片来把握一个棘手的概念。因此，当我们使用视觉化工具来解释系统时，它利用了我们大脑处理图像的强项，使我们更容易掌握事情，包括非常复杂的业务需求。简而言之，使用图片不仅是有帮助的；它是一种明智且必要的方法，可以最大限度地利用我们大脑学习和解决问题的方式。\n\
  \n下图提供了一个清晰的框架，用于理解你的软件为用户所提供的转型旅程：\n\n![Figure 1.1 – 使用软件从问题到解决方案](img/B18632_01_1.jpg)\n\
  \n图 1.1 – 使用软件从问题到解决方案\n\n对于一份全面且有效的业务需求文档，至关重要的是汇集能够生动展示客户当前与未来状态之间对比的陈述。将此文档想象成双列布局：左侧详细说明了客户目前的不理想状况，而右侧概述了使用你的软件后的理想未来状态。重要的是，文档还必须指定软件如何促进客户从不理想的现在向理想的未来转型。\n\
  \n这种结构不仅明确了软件的目的和功能，还确保了所有利益相关者对目标和项目的转型潜力达成共识。\n\n以社交媒体平台解决的问题为例，我们可以将这些元素放在一条基础的时间线上：\n\
  \n![Figure 1.2 – 社交媒体解决了什么问题？](img/B18632_01_2.jpg)\n\n\n\n\n\n#1.2 – 社交媒体解决了什么问题？\n\
  \n在图表中，我们观察到两个对比明显的阶段，它们划分了社交媒体平台出现前后的生活。\n\n在左侧，场景描绘了这样一个时期：客户在每天快速、轻松地了解朋友生活方面面临着挑战。相反，右侧描绘了采用社交媒体带来的变革性影响，客户可以享受轻松且即时与朋友建立的便利，标志着向增强通信和社交互动的重大转变。\n\
  \n这种鲜明的对比凸显了社交媒体平台在弥合沟通差距和促进用户间连接方面的作用。当然，社交媒体解决的问题还有更多，这只是为了说明目的的一个例子。\n\n## 制定业务需求\n\
  \n现在我们已经在时间线模型中勾定了“问题”和“解决方案”，接下来的关键步骤是对你的产品进行全面的描述。本质上，你的产品充当了将客户从当前困境输送到预期解决方案的通道。\n\
  \n为了确保你的产品履行其承诺，定义其有效地将客户从“问题”状态转换到“解决方案”状态所需的属性和特性至关重要。这就是 `business requirements`（业务需求）、`product\
  \ requirements`（产品需求）或简单的 `requirements`（需求）发挥作用的地方，这些术语在不同组织中经常互换。\n\n制定一套完整的业务需求通常涉及四个步流程：\n\
  \n1. 识别你的客户面临的所有你的产品旨在解决的 `problems`。\n2. 定义 `solutions`，清楚地阐述你的产品应该如何改变用户体验。\n\
  3. 为每一对问题-解决方案列出 `high-level requirements`（高层需求），详细说明实现预期结果所需的内容。\n\n将高层需求转化为针对特定用例、业务规则和流程的\
  \ `refined requirements`（细化需求），这些需求将指导解决方案的开发和实施。\n\n为了更直观地表示这些步骤，请看此图：\n\n![图 1.3\
  \ – 从问题到细化需求](img/B18632_01_3.jpg)\n\n图 1.3 – 从问题到细化需求\n\n在接下来的章节中，我们将深入探讨这些步骤中的每一个，为将客户需求转化为可操作的产品特性和功能提供一个清晰的框架。\n\
  \n### 识别客户的关键问题\n\n想象你最近加入了一家名为 `HomeIt` 的初创公司——这是一家专门帮助租客寻找符合其生活方式需求的完美公寓的公司。\n\
  \n租客可能面临哪些问题？\n\n这里是我们可以列出的一些可能的问题。记住，“问题”是对当前问题的描述，或者是你的目标用户所面临的不理想状况：\n\n* 并非所有中产介都是值得信任的\n\
  * 租赁房屋广告有时会隐藏已有问题\n* 与房东和中产介的关系可能难以管理\n* 可用的支付选项有限\n* 合同定稿需要很长时间\n* 缺乏良好的保险选择\n\n\
  在租房的过程中，你还能想象到租客面临哪些其他问题？在进入下一节之前，请花些时间思考一下。\n\n### 创建问题-解决方案陈述矩阵\n\n现在我们已经创建了租客面临的当前问题列表，让我们为每个问题创建一个可能的解决方案列表。每个问题可能有多个一个解决方案：\n\
  \n* 并非所有中产介都是值得信任的：\n    * 提供一份可靠的中产介列表\n* 租赁房屋广告有时会隐藏已有问题：\n    * 允许租客对进入租赁房屋时发现广告中未提及的问题进行报告\n\
  \    * 当租客在租赁房屋中发现未报告的问题时，对他们进行补偿\n* 可用的支付选项有限：\n    * 提供不同类型的支付选项\n    * 为所有方（中产介、房东和租客）提供方便快捷的支付\n\
  \    * 为房东提供财务担保，以防租客在某个月无法支付租金\n    * 为租客提供财务担保，以防他们在某个月无法支付租金\n\n我没有考虑其中某些解决方案可能在商业上不可行。这里提供的示例仅供说明之。\n\
  \n现在我已经提供了一些解决方案示例，你可以继续练习，并为前面的章节中提到的其他问题提供新示例。你也可以使用你想出的问题示例创建新的解决方案。\n\n在进入下一节之前，请花些时间完成这项练习。\n\
  \n### 描述解决方案的高层需求\n\n现在我们已经确定了客户面临的问题和他们需要的解决方案，让我们概述将他们从面临问题转向接受解决方案所需的软件。\n\n\
  考虑 `HomeIt` 的这种场景：\n\n![图 1.4 – HomeIt 问题和解决方案示例](img/B18632_01_4.jpg)\n\n图 1.4\
  \ – HomeIt 问题和解决方案示例\n\n在这种情况下，`HomeIt` 系统应该提供哪些所需的特性？\n\n让我们用一些简单的段落来说明产品的价值，例如：\n\
  \n我们的系统将为每位中产介配备一个业务质量评分，这是根据租客和房东在成功交易后提供的反馈出的 1 到 5 星。这一特性将像一个信任计，帮助用户通过选择与高评分专业人士做出明智决策。\n\
  \n此外，`HomeIt` 平台将包含调解功能，允许租客、中产介和房东在我们的系统中直接处理和解决冲突。这确保了道路上的任何波折都能得到有效解决，培养一个信任和支持的社区。\n\
  \n此外，`HomeIt` 将为租客和房东提供保险选择，以防止其他第三方可能造成的意外事故。\n\n这三项特性——可靠的中产介评分、简单的冲突解决和全面的保险——为一个信赖的环境奠定了基础，每个人可以在那里安心地做生意。\n\
  \n这个示例提供了一个广泛的概述，关注系统在让用户从面临问题转向享受解决方案时应采取的通用行动。\n\n\n\n\n\n以下指南是我多年参与不同项目，通过个人经验总结出来的。即使是每月收入达数百万美元的产品，也可能出现此类错误。让这些问题的发生会浪费公司大量的时间和金钱，并导致技术债、架构设计不佳、交付延迟等问题。从我的经验中学习吧；你也不希望这些错误也发生在你身上。\n\
  \n## 原型设计是业务需求吗？\n\n虽然视觉原型和 Figma 设计是当今软件开发中不可或缺的一部分，但它们本质上是对定义良好的业务需求的解读。\n\n这一点非常重要，因为有时你可能会质疑某个功能的\
  \ Mock 用户旅程是否真的真实且完整地交付了需求。作为软件工程师和分析师，你的责任还包括检查建议的视觉方案是否会在开发过程中、用户旅程或性能中引发问题——甚至视觉方案是否识别了业务需求和用例中未明确的业务规则（下一章将详细介绍用例）。\n\
  \n在没有提供明确业务需求的情况下仅提供视觉表达，开发风险就会变得显著。清晰的书面声明来定义产品团队的预期，对于顺开发流程来说是必不可少的。\n\n## 需求不应表达技术选择\n\
  \n在我们的领域，经常会遇到规定实现某功能的技术方法的业务需求。然而，至关重要的一点是，技术建议不应与定义“业务需求”的内容混淆。\n\n如果养成将需求中的技术指令视为不可逾越的习惯，会让你陷入选择有限的陷阱，关闭了发现更好解决方案的可能性。这种做法会给企业带来巨大的盲点。\n\
  \n将技术选择纳入业务需求的另一个负端是，它会限制产品团队，仅限于所选技术的各种。开发团队对各种技术及其权衡有深入的理解，能够更好地确定满足需求的最合适技术。\n\
  \n指出业务需求应避免包含技术指令，这为产品团队提供了更宽泛地定义功能的机会，使他们有更自由的思维。这种方法允许更多创新，让开发团队自由选择最优的实现方法。\n\
  \n## 客户知道他们正在经历的问题吗？\n\n有一点非常有趣：有些问题在解决方案提出之前，对客户来说是不可见的。通常，是那些创新型公司揭示了这些隐藏问题，为客户甚至不知道存在的问题提供了解决方案。事实上，客户可能处于不理想的状况，却并没有还有其他选择。\n\
  \n考虑社交媒体平台的发明。它们为人们提供了一种快速分享和接收朋友更新的新方式。最初，这项服务是针对精通技术的人的，而其他人则犹豫不决或没有意识到其益处。我记得试图让我的朋友也加入，但他们很大程度上并不感兴趣。\n\
  \n然而，随着时间的推移，社交媒体已成为一种通用工具，即使是反感技术的祖父母也能发现保持联系的价值。今天，很难找到不使用至少一个社交媒体平台的人。例如，我奶奶现在在\
  \ `Instagram` 上的活跃程度比我还要高，而且非常享受其中。\n\n这种转变凸显了社交媒体如何解决了一个曾经未被意识的需求。最初被许多人认为没有必要，现在已成为我们日常通信不可或缺的一部分。\n\
  \n## 解决方案是最后一步吗？\n\n当然，每种情况都可以代表一个问题。在这种情况下，将客户引导到解决方案状态实际上可能会揭示代表问题的新情况。\n\n以我们的社交媒体场景为例。人们涌向这些平台，是为了有机会与跨越生活阶段的广泛朋友和影响力保持联系。这是连接性的现代奇迹。\n\
  \n然而，转折点在于：成为一个热衷的社交媒体用户会导致花费大量时间刷手机，这可能是对个人时间的消耗，并成为由于不断的比较而产生的嫉妒和心理压力的来源。更不用说鼓励过度分享，为了片刻的在线认可而冒隐私的风险。这是一个悖论，对吧？这种促进连接的惊人解决方案同时也产生了一系列新挑战。\n\
  \n这种循环是创新的心跳。我们设计的每个解决方案都揭示了改进的新领域，预示着完善和演进我们产品的无限机会。开发软件就像在社交媒体领域导航，是一个发布、反馈和迭代的持续循环。\n\
  \n## 打破技术债的诅咒\n\n`technical debt` 类似于软件开发领域的财务债务。它代表了虽然权方便但可能导致以后复杂问题的编码选择：\n\n\
  *   缺乏自动化测试的代码更容易受到变化的影响\n*   设计不当的软件可能会损害生产环境中的系统稳定性\n*   低效的流水线可能会导致更新期间停机\n\n\
  在我在不同公司的经验中，平衡技术债偿还与功能开发并不总是易的。许多团队优先考虑新功能，而不是解决底层问题。以下是我们如何转变这种心态的。\n\n### 将技术解决方案纳入功能交付\n\
  \n将重构工作包含在功能更新中成为一种标准做法。这种方法确保了在大多数新交付时，我们也在增强系统的架构和工程质量。\n\n积极寻找机会，将重构集成到产品实现的技术解决方案中。这是我们责任的一部分，通过主动改进系统来预判潜在问题。\n\
  \n这里一个非常简单的例子是强制要求每次发布都创建自动化测试。这不仅应该涵盖新功能，还将测试范围扩展到可能测试不足的现有功能。这种策略逐渐增加了我们系统的可靠性，增强了对其在生产环境环境中性能的信心。\n\
  \n通过以应得的严肃态度对待技术债，我们可以确保一个更稳定、高效且面向未来的软件生态系统。\n\n### 明确技术债是如何让用户失望的\n\n通过检查技术债并追踪其对用户旅程的影响，我们可以识别并衡量它在系统中引起的问题。以下是技术债可能让你的用户失望的方式：\n\
  \n*   **性能问题**：类似于陷入交通堵，技术债会导致流程变慢到用户放弃的程度\n*   **数据不一致**：用户可能会丢失或看到他们的关键数据被破坏，导致挫败感和信任问题\n\
  *   **易用性差**：复杂、不直观或完全无法使用的界面会让用户感到困惑，使他们感到失望或愤怒\n*   **部署延迟**：更新变慢意味着用户等待改进的时间更长，公司的上市时间可能会受到非常不利的影响\n\
  \n为了真正理解影响，请花时间量化特定技术债实例影响了多少用户，以及这些影响的严重程度。\n\n\n\n\n\n当你能够直接将糟糕的设计决策与用户的不满联系起来时，量化浪费的时间、金钱和精力，并说服你的产品团队优先解决技术债将变得容易得多。清晰地建立这些联系，对于争取进行必要的改进以提升用户体验至关重要。\n\
  \n如果你能为技术债引起的问题贴上金钱标签，并证明存在大量的资金浪费，那么高层管理人员几乎不可能不优先考虑这些变更。\n\n这两种策略——将偿还技术债纳入当前版本的开发任务中，以及衡量其对用户的直接影响——都非常有利于让系统的改进更顺利地实现。\n\
  \n## 密集的文档\n\n在糟糕的敏捷实践领域中，遇到信息极其密集以至于无法读懂的需求文档的情况并不罕见。这种方法可以追溯到 2000 年初，当时软件是通过安装光盘（CD-ROM）交付的，开发周期可能长达从六个月到几年不等，才能发布一个捆绑的功能更新版本。\n\
  \n回到今天，应用程序通常由微服务网络组成，偶尔还可能伴有遗留的单体系统。这种转变意味着更新是按功能处理的，甚至每天在生产环境中发布部分更新，直到整个功能就可以可以通过功能标记（feature\
  \ flag）启用。从现实来说，一个功能的描述不应该超过 1000 行，更不用说跨越数百页了。\n\n如果你发现自己为了即将发布的各种细节海洋中挣扎，并被要求同时发布所有内容……是时候表达你的担忧了。以这种方式发布产品严重偏离了敏捷原则，而敏捷原则通常对于实现用户旅程的平滑过渡和改进非常有益。偏离这些良好的敏捷实践会显著增加出错的风险。不要忘记，在数字时代，敏捷和清晰不仅仅是锦上添花，更是成功的关键。\n\
  \n## 模糊的文档\n\n另一方面，遇到只提供高层业务目标的需求文档会引起一个重大的警报。这种细节的缺失会让开发者陷入停滞，由于缺少流程和业务规则而无法开始编码。\n\
  \n开发者擅长将复杂的用户需求转化为功能性代码，但他们通常不熟悉业务运营的复杂性。他们是技术热衷者，专注于最新、最先进的技术，而不是特定市场的细微细节或产品的法律细差别。他们的优势在于构建，而不是推测业务或客户未言言的需求。\n\
  \n在当今快速发展的技术格局中，找到既有才又理解用户需求的开发者变得越来越可行。这些开发者类似于广阔技术宇宙中的探险家，总是在寻找下一个突破性技术。然而，他们的旅程往往会让他们远离市场特定细节和围绕产品的法律复杂性。与与客户密切互动的产品和支持团队不同，开发者可能对客户需求或塑造产品开发的法律框架没有同等深度的理解。\n\
  \n如果你拿到的需求感觉更像是一个预告片而不是脚本，那么推回是至关重要的。向产品团队要求完整的故事——完整的流程和业务规则。在没有这些信息的情况下就投入项目规划，将迫使你离开自己的技术专长，进入一个领域，在那个领域，尽管你付出了最大努力，结果可能无法符合项目需求。记住，你的主要角色是让技术解决方案变为现实，而不是猜测业务拼图中缺失的碎片。\n\
  \n## 展望“快乐路径”之外\n\n在产品开发领域，需求文档通常描绘了一幅万事顺利的蓝图，我们亲切地将这种场景称为 `happy path`（快乐路径）。这就像是想象一次天气完美且没有交通拥堵的公路旅行；然而，现实需要一个\
  \ B 计划。\n\n有效的需求文档深入了“如果……怎么办”领域以确保健壮性：\n\n* 如果用户偏离了产品的预期用途会怎样？\n* 如果系统性能出现小故障怎么办？\n\
  * 如果我们的第三方服务临时宕机了怎么办？\n\n良好的需求会预见并计划任何不理想的情况。确保需求文档具备应对“糟糕日子”的能力是至关重要的。通过对异常和坏场景进行规划，我们使自己能够直面挑战，而系统从从起就会做好更充分的准备。\n\
  \n## 忽视其他业务领域和流程\n\n偶尔，产品经理提供的需求没有考虑到公司其他部门应该发生的情况。在产品开发中，确保每个部门都准备好各司其职是发布成功服务的关键。\n\
  \n假设你的公司指派你为网站开发一项突破性的新服务。你和你的团队以惊人的速度将该服务推向生产环境，并满分通过了每一个质量测试和用户验收测试。发布是成功的，客户感到非常兴奋，购买量直线上升。但随后出现了一个意料之外的情况：负责交付该服务的部门在开发期间处于不知情状态。突然之间，他们对这个新产品的独特需求没有做好准备。\n\
  \n无论你的组织规模有多大，确保没有部门被排除在之外都是至关重要的；为了确保这一点，你可以采取以下操作：\n\n* 从一开始就让所有部门。\n* 提出探索性问题，以理解该服务如何集成到公司整体生态系统中。\n\
  * 确保业务需求文档反映了每个部门的角色和需求。\n* 让所有可能的部门签署文档，即使是那些未受变更影响的部门。展示哪些团队未参与也总是好的。\n\n通过采用整体性的项目规划方法，你不仅防止了最后时刻的障碍，还培养了协作和创新的文化。\n\
  \n## 对其他领域假设过多\n\n看到产品人员带来的需求可能没有完全理解公司不同部分是如何相互作用的，这并不罕见。\n\n例如，假设你正在处理前面提到的产品，并且将一个请求转发给发运部门。在测试期间，如果不先与该领域的开发团队同步信息，不要继续是至关重要的。\n\
  \n这条建议回到一个关键点：需求文档是否已获得公司所有关键利益相关者的批准？确保该文档由理解我们各种系统和部门的人进行审核是至关重要的。\n\n想象你正准备开启一段旅程。在没有大家同意的地图的情况下，你不会开始的，对吧？基于未经检查的文档进入编码就像是使用误导性的地图导航。你可能会沿着错误的路径，建立在可能站不住脚的假设之上。\n\
  \n# 总结\n\n这一章到此结束。我们深入探讨了编写为成功的软件开发铺平道路的业务需求的准与忌。\n\n这里的核心要点是：完美、组织良好的需求不仅支持良好的架构——它们还是基础。优秀的系统设计源于清晰的业务需求。记住，你从一开始就开始为成功奠定基础。\n\
  \n\n\n\n现在轮到你了：留出一些时间思考一些你觉得很有趣现有问题。不要太严肃地对待这项练习。保持玩乐的心态，想象你能用软件解决任何问题。你可以针对 HomeIt\
  \ 场景进行更深入的工作。从我们列出的启动问题开始，请考虑以下内容：\n\n*   扩展到租赁物业领域的其他现有问题。\n*   创建一个愿景，用以代表你所想象的问题的解决方案。\n\
  *   编写一些高层级需求来交付你定义的解决方案。记住，可以想象多个不同的需求和功能来增强所需的解决方案。\n\n在接下来的章节中，我们将讨论如何将需求组织成用例（use\
  \ cases）、用户故事（stories），以及所有与为需求添加细节、周期、流程和业务规则相关的内容。我们将通过你在本章中学到的高层级需求，为我们创建的愿景注入生命和快乐。\n\
  \n# 2. 将复杂需求分类为特性、用例和用户故事\n\n在本章中，我们将继续讨论如何构建健壮的需求。在上上一章节中，我们创建了高层级需求。虽然这些需求对于设定我们即刻创建的产品方向很有用，但它们是模糊的。换句话说，它们没有讲述完整的故事。它们缺乏能让我们开始编写软件的细节。如果你在那个阶段就有太多的细节，说明你做得方法了。\n\
  \n在本章中，我们将关注以下主题：\n\n*   为你的产品的不同特性（features）命名\n*   识别角色（actors）、事件、生命周期、阶段、类型、级别和循环\n\
  *   创建用户旅程、用例和用户故事\n*   构建最终的业务需求文档\n*   这些产物中哪些应该优先？\n*   通过长期业务需求扩展结果\n\n如果说高层级需求是系统开发过程的“骨架”，那么本章将围绕“肌肉”、“皮肤”和“器官”。\n\
  \n我们将通过区分特定的特性、生命周期、用例和角色，让高层级业务需求的愿景和梦想落地。这些元素允许我们开始投影领域，这些领域最终成为设计良好的 `Spring\
  \ services`。让我们现在开始吧。\n\n## 为你的产品的不同特性命名\n\n在本节中，我们将回到 HomeIt 启动示例。但在那之前，弄清楚一点非常重要。\n\
  \n上一章完全关于扩展我们的想法。我们当时处于脑风暴模式。在脑风暴过程中，我们并不太在意结构或细节。脑风暴旨在是一项自由思维和创造力的练习。我们不想用“如何做”（*how*）过度限制自己，而是对“做什么”（*what*）感兴趣。\n\
  \n这种意识在软件开发中至关重要。你不希望通过问诸如“这个解决方案真的可行吗？它是应该如何工作的？谁来构建这个？我们正在使用什么技术来创建这个服务？”来限制你的思考。这些询问现实的问题应该在过程的后期再出现，理解这一点是关键。\n\
  \n现在，在 `Chapter 1` 中进行了一次显而易见的思维扩张后，我们将为产品需求增加更多结构。为了做到这一点，回顾我们在 `Chapter 1` 中为\
  \ HomeIt 启动系统想象的高层级产品需求。\n\n为了在这一阶段保持清晰性，我们应该识别并命名不同的解决方案需求。通过命名它们，它们将更容易被引用。以下是我们的\
  \ HomeIt 系统的特性：\n\n*   房产经纪评分\n*   调解\n*   保险\n\n现在，让我们进入下一步：识别我们想要创建的系统结构。\n\n\
  ## 识别角色、事件、生命周期、阶段、类型、级别和循环\n\n通过理解我们系统的冲突和不同特性，我们知道客户在哪里，以及我们想引导他们去哪里。下一步是确保我们理解系统的真实结构。换句话说，哪些关键元素将通向我们想要提供的未来解决方案的旅程？\n\
  \n以下章节对于理解如何剖析产品需求并发现你可以提供给用户的许多隐藏特性至关重要。\n\n## 谁将在系统中执行操作？\n\n回到我们的 HomeIt 启动想法，我们的系统中有各种角色（actors）。这些角色中的每一个都将被允许执行一组定义良好的操作。我们也可以将角色视为系统中的*角色定义（roles）*。\n\
  \n让我们快速看一些角色：\n\n*   **租客（Tenants）**：加入网站搜索租赁物业的用户。\n*   **房东（Landlords）**：将其租赁物业提供给租客的用户。\n\
  *   **房产经纪（Realtors）**：促进租赁协议的用户。他们是连接租客和房东的人。\n*   **管理员（Admins）**：在系统中具有极高管理权限的用户。这些管理员任务包括例如阻止试图实施欺诈的用户。\n\
  \n正如管理员所示，系统不仅包含网站上的终端用户；它还包含几个不同的流程和可能性，将内部用户包含进来，我们需要向这些用户提供特殊权限以协助运行系统。\n\n以下是内部用户的其他示例：\n\
  \n*   **法务（Legal）**：可以编辑房东使用的合同模板的用户。\n*   **财务操作员（Finance operators）**：负责确保支付系统正常运行的用户，执行如授权网站上保单退款等任务。\n\
  *   **调解员（Mediators）**：负责在网站两个角色之间进行冲突解决的用户。调解员的目标是确保不同的用户可以相处并达成协议。\n\n想象 HomeIt\
  \ 系统的其他角色，但要意识到随之而来的挑战。\n\n### 识别系统中的关键角色\n\n正像 HomeIt 系统一样，在你与产品团队进行的每一次系统分析中，你都必须经过识别关键角色/参与者的过程。有些产品团队会将这些角色定义得非常好。然而，在某些情况下，某些角色在产品需求中并不明显。如果你能发现缺失的角色，你将为公司提供巨大的价值。这有助于系统开发和架构决策。\n\
  \n现在我们理解了关于谁将在系统中操作的基础知识，下一步是揭示系统流程。让我们迈出实现这一点的第一步。\n\n## 为每个角色定义关键事件\n\n一旦我们识别了系统中的关键角色，就是理解他们将拥有的力量了。在这种背景下，我们将这些力量或操作称为\
  \ `关键事件`。换句话说，我们想要允许每个角色有哪些可能的行为？\n\n在 HomeIt 系统案例中，我们知道我们为租客为选择合适的租赁物业提供更可靠的体验。你可能注意到我们还允许房东与房产经纪合作，这对双方都有利。\n\
  \n让我们进行一些关键事件的练习，以便你更好地理解如何识别这些事件。在这种情况下，我们将从零开始，但在市场上，常见的情况是产品团队已经定义了许多内容。你需要意识到可能会缺失许多关键事件。尽早识别那些缺失的事件，这有助于你规划正确的架构和最好的服务。\n\
  \n\n\n\n在本节中，我们看到的关键事件是租户在系统中能够执行的操作。\n\n让我们从一个练习开始。思考租户可能需要的所有功能。这可以是从他们注册成为租户、搜索房产，再到提交报价的任何内容。但需要记住的是，在进行此练习时，你可能会识别出与我们在之前章节中区分的关键特征不相关的事件（例如调解、保险和中介质量评分）。这些新事件将属于我们必须识别出的新功能。\n\
  \n我们的组织方式如下：在列出我们想要在系统中实现的所有可能事件后，我们将把每个事件 `assign`（分配）到我们希望这些关键事件所属的功能中。这些功能可以是从注册到搜索房产的任何一项。\n\
  \n以下列表本质上是将每个事件归为一个功能之一：\n\n*   注册：在网站上注册租户账户\n*   房产搜索：\n    *   搜索租赁房产\n    *\
  \   查看租赁房产详情\n*   人员搜索：\n    *   搜索中介\n    *   查看中介个人页\n*   房产租赁：\n    *   预约看房\n\
  \    *   提交租赁报价\n    *   签署租赁合同\n*   支付：支付租赁合同费用\n*   消息：\n    *   向中介发送消息\n   \
  \ *   向房东发送消息\n*   通知：查看最新更新——新消息、合同更新等\n*   取消：取消租赁合同\n*   人员搜索：搜索房东\n*   中介质量评分：给中介打分\n\
  \n这些操作（或称关键事件）代表了我们可能允许用户在系统中执行的操作。\n\n关键事件的一个核心特征是，尽管它们可能没有对执行每个事件所需的步骤提供一个清晰且完整的描述，但与高层需求相比，它们提供了一个详尽得可能操作列表。\n\
  \n现在，让我们继续检查下一组角色及其各自的关键事件。\n\n### 房东的关键事件\n\n当然，创建我们的 `HomeIt` 系统不仅仅是让租户在网站或移动应用上进行操作。我们还需要允许中介和房东进行互动，以便这三个角色能够为市场带来价值。\n\
  \n在这一步中，我们将深入研究房东的世界。我们将允许他们执行什么种的关键事件呢？这里是一些示例，以及我们预计将这些事件分配到的功能：\n\n*   注册：\n\
  \    *   注册成为房东\n    *   填写个人详细信息\n*   租赁房产注册：\n    *   注册新的租赁房产\n    *   设置接受访客的可用日期\n\
  \    *   启用/禁用房产租赁状态\n*   中介合作：批准/拒绝某处房产的中介\n*   人员搜索：\n    *   查看中介的个人详情\n    *\
  \   查看租户的个人详情\n*   房产租赁：批准租赁报价\n*   账户：\n    *   查看租赁账户余额\n    *   从租赁账户中提现资金\n\n\
  编写关键事件的另一个有趣方面是，你几乎可以想象出用户执行该操作的场景。你可能无法想象出系统的每一个视觉细节，但通过关键事件，你总会有一种动作正在发生的感觉。这种视角有助于将抽象的想法转化为具体的功能，这些功能对用户体验（UX）和整个系统设计有重大贡献。\n\
  \n关键事件涉及个人在系统中采取步骤以实现他们的目标。这些步骤应该引导他们通向高层需求中预想的解决方案。\n\n某些系统始终会有标准功能，例如注册流程和查看其他用户个人资料的能力。始终记住这些核心功能至关重要；否则，你可能会留下漏洞和缺失的部分，使得难以以一致且现实的方式完整描述你的系统。\n\
  \n现在，轮到你了：你还会为系统中的房东分配哪些其他关键事件？记住，我们还有一些尚未涉及的命名功能。例如，我们还没有分配任何代表我们之前讨论的调解或保险功能的关键事件。\n\
  \n为房东的调解或保险功能列出一份关键事件列表。完成此练习后，你就可以继续探索中介的关键事件示例。\n\n### 中介的关键事件\n\n与最后两个章节相同，我们将为中介创建一个关键事件样本。让我们在这里看看：\n\
  \n*   房产搜索：\n    *   搜索租赁房产\n    *   查看租赁房产的详情页\n*   中介合作：\n    *   针对某处房产发送合作提案\n\
  \    *   取消合作提案\n    *   设置房产访客的可用日期\n*   消息：读取与租赁房产相关的消息\n*   账户：\n    *   查看账户余额\n\
  \    *   提取账户余额\n*   调解：与中介/租户发起纠纷\n\n现在轮到你了：你认为中介在系统中还可以做什么？还会发生哪些其他关键事件可以为租户和房东双方提供价值？\n\
  \n在移动到下一步之前，花些时间思考中介的关键事件。还要考虑我们系统中的其他角色。调解员、财务运营、法律和管理员可以做什么来提供价值，并促进我们三个关键外部角色（租户、中介和房东）之间的互动？\n\
  \n正如你所见，从零开始规划系统愿景是一项艰巨的任务。一切都始于理解关键问题、脑风暴解决方案、创建高层需求，然后将这些需求扩展为角色和关键事件列表。\n\n##\
  \ 列出系统的主要功能\n\n到为止，我们在这个练习中探索并识别了一些有趣的新功能，我希望你通过自己的自由思考练习也发现了一些新功能。\n\n以下是我们目前发现的功能：\n\
  \n*   房产搜索：用户搜索租赁房产并查看其详情的能力\n*   中介合作：中介与房东合作并向新租户展示其房产的能力\n*   消息：用户交换消息的能力\n\
  *   账户：用户管理系统内账户余额的能力\n*   调解：用户在平台内解决冲突的能力\n*   租赁房产注册：房东在系统中管理其房产的能力\n*   支付：租户支付租金的能力\n\
  *   人员搜索：用户在系统中搜索其他用户的能力\n*   中介质量评分：针对中介的声誉系统\n*   取消：租户取消租赁合同的能力\n\n在系统探索过程中，你还发现了哪些其他功能？现在，让我们组织事件时间轴。\n\
  \n## 提取功能的事件时间轴\n\n现在我们已经为每个角色脑风暴了几个事件，并识别了许多新关键功能，我们需要探索如何详细描述单个功能并将其放置在时间轴上。这意味着通过有序的关键事件序列来描述每个功能。\n\
  \n\n\n此外，我们旨在创建这种功能时间线，以便我们能够映射出给定功能的依赖关系。换句话说，随时间推移的正确顺序是什么？用户必须满足什么条件才能使用该功能？\n\
  \n在本节中，我们不会深入探讨目前发现的每一个功能。那将需要大量的页面和时间，而且这本书是关于如何使用 `Spring Framework` 构建系统的。我们将运行几个关键示例，剩下的取决于你，如何通过遵循相同的流程，在我们发现的其他功能上应用你的功能化思维。\n\
  \n我们是否应该用本章中的技巧完全取代 UX/UI 工作？\n\n你可能会查看接下来的页面并想：作者是否在提议用这里列出的工具来替代标准的 UX/UI 研究实践？我的回答是：“不！”我们永远不应该将这些页面视为正规的市场调研和专业\
  \ UX/UI 方法论的替代品。这里的页面旨在作为对领域优秀专业人士在 UX 研究方面工作的补充。这仅仅是以一种非常“干练”、直击主题的方式编写事件序列。这将有助于工程师更深入地理解他们正在构建的系统。然而，偶尔你可能会发现，即使在特定的项目中，UX\
  \ 工作的执行也存在许多空白。在这种情况下，你可能需要通过创建时间线来帮助完善产品和业务需求。\n\n让我们首次尝试为 `HomeIt` 系统中的一些最重要的功能创建时间线。\n\
  \n### 在时间线中组织注册功能\n\n执行此任务没有先决条件，因为这是使用 `HomeIt` 的第一步。你可以按照以下步骤来组织注册功能：\n\n1. 用户进入初始网站页面。\n\
  2. 系统验证提供的信息。\n3. 如果必要，用户可以纠正任何无效或缺失的信息。\n4. 用户提交信息。\n5. 账户成功创建，用户现在已登录。\n\n注意，我们正在对事件进行排序，但我们并没有对此时点所需的特定信息做过多的假设。我们挖掘的深度足以让我们在宏观上理解这些事件在功能中应该如何组织。\n\
  \n现在，让我们来看下一个功能。\n\n### \U0001F4A1 在时间线中组织租赁房产注册\n\n为了在时间线中组织租赁房产注册，必须有一个已注册的房东处于主页登录状态。然后，执行以下步骤：\n\
  \n 1. 房东选择添加新租赁房产的选项。\n2. 房东提供注册租赁房产所需的信息。\n3. 系统验证发送的信息。\n4. 房东根据需要纠正租赁房产信息。\n\
  5. 房东完成提交所有信息（描述、地址、价格等）。\n6. 房东进入新房产页面，该页面目前处于非活跃状态。\n7. 系统为房东提供上传媒体文件（图片或视频）的选项。\n\
  8. 房东选择上传媒体文件的选项。\n9. 房东提供注册租赁房产所需的媒体文件。\n10. 租赁房产移动到 `processing media files`（处理媒体文件）状态。\n\
  11. 系统开始处理提供的媒体材料（结果待定义）。\n12. 当媒体处理完成后，租赁房产移动到 `ready`（就绪）状态。\n13. 房东获得 `publish`（发布）租赁房产的选项，以便租户和中介可以使用。\n\
  14. 房东选择发布租赁房产的选项。\n15. 租赁房产现在处于 `published`（已发布）状态，可以使用房产搜索功能找到。\n\n正如你看到的，这个特定的功能概述了我们所说的**对象生命周期**。租赁房产从“非活跃”状态开始，随着房东在功能的各个步骤中推进，经过“处理媒体文件”、“就绪”并在最后的“已发布”状态。\n\
  \n我们将在书的后续章节和章节中深入探讨生命周期。然而，显而易见，只有当我们通过时间线上的关键事件仔细安排一个功能时，才可能识别生命周期。\n\n### 在时间线中组织房产搜索功能\n\
  \n为了组织房产搜索功能，要求必须有一个注册了租赁房产的已注册房东。该租赁房产处于“已发布”状态。一个可选要求是有已注册的租户。执行以下步骤：\n\n1. 用户进入\
  \ `HomeIt` 网站的第一页。\n2. 未注册/已注册的用户在第一页的搜索栏中输入所需的租赁房产位置（邮政编码、街道名称、州、城市等）。\n3. 用户可以提供排序过滤器（按价格升序或降序；按街道名称；按距离等）。\n\
  4. 系统提供找到的列表房产列表及其各自的图片。\n5. 用户可以查看列表中每个房产的图片。\n6. 用户可以点击查看所列表房产的详情页，并查看房东提供的所有信息。\n\
  \n正如你注意到的，这个功能有许多要求或先决条件。这意味着在我们可以使用此功能之前，必须存在其他功能。这开始为我们提供关于哪些功能应该先开发的某些线索。但还有很多需要考虑的内容，我们将在本章结束时进行探索。现在，让我们转向另一个有趣的功能。\n\
  \n### 在时间线中组织中介合作关系\n\n组织中介合作的先决条件是：已注册的中介、已注册的房东、已注册的租赁房产以及房产搜索功能。还要求中介和房东都已登录。执行以下步骤：\n\
  \n1. 中介登录，并在搜索房产后进入房产页面。\n2. 中介选择 `Partner with the Landlord`（与房东合作）选项。\n3. 中介告知他们哪些可以在可以在房产接待租客。\n\
  4. 中介指定他们每周每天可以接待访客的时间段。\n5. 中介说明他们希望作为合作伙伴收取的租金百分比。\n6. 中介完成合作提案的提交。\n7. 合作提案现在处于\
  \ `pending partnership approval`（等待合作审批）状态。\n8. 房东查看他们当前的合作提案列表。\n9. 房东访问其中一个合作提案。\n\
  10. 房东可以在提案页上查看中介的信息（用户详情、地址、评分、接待访客日期和时间等）。\n11. 房东选择接受合作提案。\n12. 合作提案移动到 `approved`（已批准）状态。\n\
  13. 中介可以在合作列表中看到已批准合作。\n14. 中介的联系方式现在显示在租赁房产页面上。\n\n在这个功能中，需要注意几个重要点。首先，该功能依赖于许多先决条件，并涉及到不同用户之间的交互。就像租赁房产对象的情况一样，现在为合作对象定义了生命周期。这些对象从等待合作审批移动到已批准。我们在描述中还提到了“合作列表”，但到目前为止我们还没有在任何地方定义该功能。也就是说，我们需要意识到，当我们在清晰的时间线上编写功能时，往往会揭示出对其他基本功能的需求。这个新的列表功能现在也应该包含在先决条件部分。\n\
  \n\n\n\n此功能描述仅指“良性路径”（happy path）——即庆祝成功伙伴关系的情况。记住我们在`第 1 章`中讨论的内容，当时我们讨论了映射用户可能犯错误和问题。我们还应该解决此类问题，例如如果房东拒绝或从未回复合作提议将会怎样。\n\
  \n正如你所见，随着时间的推移，复杂功能可能会变得非常复杂。现在，让我们转向此处概述的最后两个功能。\n\n### 在时间轴上组织房屋租赁功能\n\n对于此部分，要求有一个已注册的房东、已注册的租赁房屋、房屋搜索功能以及已登录的租客。此外，我们还需要支付方式和\
  \ HomeIt 的财务详情。\n\n以下是步骤：\n\n1. 租客访问房产页面。\n2. 租客选择向房东发送租赁提议的选项。\n3. 租客查看租赁协议合同并在系统中签名。\n\
  4. 签署后，将创建一个“待审批”状态的租赁提议。\n5. 房东审核租赁提议并并视化相关的租客信息（待定义）。\n6. 房东选择接受租赁提议的选项。\n7. 生成带有双方电子签名的租赁协议文件。\n\
  8. 租赁提议 移至“已接受”状态。\n9. 通知租客租赁提议已获批准。\n10. 租客选择选择支付方式的选项。\n11. 租客发送支付信息。\n12. 支付成功完成。\n\
  13. HomeIt 在公司账户中获得其支付份额。\n14. 如果有房产经纪人，他们直接在账户中获得支付份额。\n15. 房东在其账户中获得剩余金额。\n\n\
  16. 每个月都会再次支付，所有方都会收到其份额金额。\n\n这是我们概述的一个非常复杂的功能，此处需要添加以下观察结果：\n\n* 此流程中可能有三类用户交互：租客、房产经纪人和房东。\n\
  * 需要建立 HomeIt 财务工作流，以便公司能够接收其款项份额。\n* 此流程中存在一个循环循环，即需要发生的每月款项。\n* 此功能还必须扩展以适应异常用例，例如：\n\
  \    * 如果由于系统故障，某个月的支付未通过怎么办？\n    * 如果用户（租客）在某个月没有足够的余额支付租金怎么办？\n    * 在向各方分配支付份额时，如果其中一次转账失败了怎么办？\n\
  \n你在这里还能发现哪些其他异常行为？\n\n* 我们有多种可能的支付方式可供。事实上，取决于 HomeIt 运营的国家，可能有几十种不同的支付方式可用：\n\
  \    * 不同的支付方式运作方式不同。因此，这里的一个关键问题是：我们如何准备该系统，以最灵活的方式接收支付，以便尽可能快速地整合来自不同国家的支付？\n\n\
  这种分析总结了我们为了为系统创建适当需求而需要采取的一些关键步骤。随着时间的推移，它可能会变得复杂。然而，这正是软件工程的本质：确保我们能够尽可能清晰地列出需求，以便我们未来的架构选择更加容易。\n\
  \n### 简化需求\n\n从所有这些练习中，你可能会认为实现这些需求将花费大量时间，你是的。要求开发团队在发布网站之前完美地实现每个功能将使事情变得非常复杂且昂贵。这通常不是我们在软件开发世界中的做法。完美的需求并不总是可以实现的。那么，面对这种复杂性，我们如何采取更务实的方法呢？\n\
  \n在需求变得过于复杂、昂贵且耗时开发的情况下，一种关键方法是缩小工作范围。为了以最低的成本建立我们的在线业务，我们可以重新构 HomeIt 系统，通过更简单的功能实现类似的结果。\n\
  \n这就是我们所说的 `scope reduction`（范围缩减）。通过省略某些功能，我们可以在更短的时间内实现成功发布。\n\n在 HomeIt 系统研究背景下，简化复杂需求的简单示例如下：\n\
  \n* 我们可以从开发一个基础网站开始，让房东能够注册账户并列出他们的租赁房屋。我们将排除其他类型用户的注册功能。\n* HomeIt 初期将不会处理每月租金支付。\n\
  \n通过省略许多其他功能，我们确保网站在包含核心组件的情况下发布，以建立在线业务。附加功能可以随着时间的推移加入。这种方法被称为 `roadmap`（路线图）。\n\
  \n现在，让我们深入研究系统内部阶段和循环。\n\n### 理解阶段、级别、类型、生命周期和循环\n\n每个系统都将由阶段、级别、类型、生命周期和循环的组合构建。让我们现在对它们定义以便理解。\n\
  \n#### 阶段 (Stages)\n\n这意味着实体随着用户旅程的进展，随时间经历的一系列“阶段”或“状态”。在 HomeIt 系统中，到为止，我们已经有了以下对象的阶段：\n\
  \n* **租赁房屋**：非活动、处理媒体文件和已发布\n* **合作提议**：待合作审批、已接受和已拒绝\n* **租赁提议**：待审批、已接受和已拒绝\n\n\
  将阶段视为对象在系统中可能代表的成熟步骤。用对象中的 `status` 属性来表示阶段是常见的，这意味着我们可以随时间推移在不同的开发步骤上监控对象。\n\n\
  #### 级别 (Levels)\n\n“级别”是一组独特的特征或品质，你可能希望你的实体在系统中获得这些，使其与其他层级的对象脱颖而出。为对象创建级别的一个关键方面是，任何对象都可能遍历这些级别并在其生命周期中丰富。随着对象在系统中演变，它实现了不同的级别并获得了更多的价值和某些特权。\n\
  \n换句话说，在对象在系统中演化的过程中，可以赋予它不同的级别，每个级别为对象带来特殊属性。在我们的 HomeIt 初创公司，到目前我们还没有在需求中发现任何不同的级别。但我们可以设计一些，例如：\n\
  \n* **房产经纪人**：为了给房产经纪人提供激励，我们可以实施一个基于声誉评分的分级系统。新注册的经纪人被指定为铜牌经纪人，限制与不超过四处租赁房屋合作。获得\
  \ 3 星声誉后，他们将成为金牌经纪人，能够与最多 10 处租赁房屋合作。声誉五星的经纪人将的指定为钻石经纪人，对他们可以合作的租赁房屋数量没有限制。\n* **房东**：对房东的激励可能包括根据活跃租赁协议的数量减少费用。例如，同时拥有五份协议可以获得\
  \ 10% 的费用折扣。\n\n\n\n\n\n**租户**：为了激励租户和房东，可以根据租赁物业的历史记录提供保险价格折扣。如果物业在某些月数内没有发生任何事故，将有权获得较低的保险价格。这创建了一个质量分级体系，质量越高的物业保险价格越低，使其对租户更有吸引力，并鼓励房东良好地维护他们的物业。\n\
  \n你可以将级别（levels）视为系统中对象的“上升层”。它们是区分我们系统中有价值的行为的一种，并为最优秀的用户授予更多的权利、权限、权力、奖金或特权。\n\
  \n# 类型\n\n一个对象在系统中可以有不同的类型。在我们初创公司 HomeIt 中，一个清晰的例子就是我们识别出的各种角色。虽然所有参与者在网站上都是“用户”，但由于他们的目标是在系统内完成不同的任务，因此具有不同的特征。\n\
  \n我们可以设计其他类型，例如：\n\n- **房产类型**：通过在 HomeIt 系统中区分房屋和公寓，我们可以实施更有效的过滤器，在房产搜索功能中更好地服务我们的客户。\n\
  - **租赁协议类型**：提供多种协议可能用于表示具有不同保障范围和条款的不同类型的保险。\n\n将类型视为一种手段，用于区分对象在系统中可能拥完全不同的属性和行为包。我们并不一定认为某种类型优于另一种；相反，它们只是截然不同并服务于不同的用途。\n\
  \n### 生命周期和循环\n\n你可以将生命周期视为对象随时间推移跨越不同级别或阶段的过程。在视觉上区分并表示生命周期至关重要，以便更好地理解和沟通系统中的所有可能性的。\n\
  \n通过允许生命周出现，我们可以创建状态图，状态图是开发人员的关键产物。通过这些状态图，我们可以以很高的准确度来映射测试用例。\n\n在我们 HomeIt 初创公司的案例研究中，我们可以将几个对象的生命周期可视化。让我们来看一些例子。第一个是`租赁物业\
  \ 生命周期`：\n\n![Figure 2.1: Rental property life cycle](img/B18632_02_1.jpg)\n\n图\
  \ 2.1：租赁物业 生命周期\n\n正如你在 `Figure 2.1` 中看到的，视觉化表示租赁物业生命周期的阶段——在这种情况下，从未激活到处理媒体文件再到发布——有助于理解对象在系统的整个历史。此外，在过渡到不同阶段时，我们可以视觉上识别导致转换发生的触发器。\n\
  \n接下来，让我们可视化`中介人级别`的生命周期：\n\n![Figure 2.2: Realtor levels life cycle](img/B18632_02_2.jpg)\n\
  \n图 2.2：中介人级别 生命周期\n\n正如你在 `Figure 2.2` 中看到的，我们为系统创建的声誉级别允许中介从低级别移动到高级别，然后回到低级别。有时对象的生命周期会变成一个循环。事实上，我们可以认为用户始终会在我们的系统中循环，因为他们可以从“外部世界”作为新注册用户开始，成为客户，然后活跃一段时间，最后重新激活账户。\n\
  \n将用户的生命周期视为一个总的循环是非常重要的，因为我们希望在系统中开发留存策略。参见此示例中的最后一张图：\n\n![Figure 2.3 – Tenant’s\
  \ website loop](img/B18632_02_3.jpg)\n\n图 2.3 – 租户网站循环\n\n最后，正如 `Figure 2.3` 所示，我们对创建生命周期循环的条件有更通用的描述——在这种情况下，用户从未注册变为已注册租户，然后移动到具有活跃租赁协议的租户，依此类推。我们并不一定需要在对象中设置特定的\
  \ `status` 属性来设计系统性循环或生命周期。意识到系统中现有的隐式循环至关重要。这种意识让我们能够识别杠杆点，确保我们随着时间的推移持续提供更多价值。\n\
  \n这里非常重要一点，未能识别循环和生命周期面临忽视有价值见解和策略的风险。创建这些结构的视觉表示是需求分析中最重要的任务之一。\n\n#### 警告\n\n\
  我遇到过无数项目，系统中的生命周期和循环完全没有记录。状态和级别会在软件中定义，结果变成了设计松散的实体和功能。提供包含所有现有状态、情况以及转换触发器的清晰图表，可以提供一种强大且直接的方法，帮助你的产品团队获得更多见解，从而丰富你的用户体验。\n\
  \n在许多情况下，在记录和视觉化表示级别、阶段、循环和生命周期时，你可能会发现并不是所有的触发器都是清晰的，甚至在软件或业务需求中并不存在。这些看似简单的视觉图中通常隐藏着机会。事实上，我职业生涯中收到的很多反馈都归于我尽可能创建这些视觉图的习惯。我建议即使在与他人合作的项目中也练习创建这些图表。\n\
  \n以这种步进方式投影需求的价值在于，我们有很大的自由为我们的系统想象任何东西。这作为一种非常强大的头脑风暴方法也有帮助。我们不是从尝试定义特定功能开始的，而是从扩展我们为正在构建的系统所设的可能性开始。\n\
  \n如果你是一个开发者，理解这些软件需求的“维度”（问题、解决方案、高级需求、角色、关键事件、级别、阶段、生命周期和循环）将非常有帮助，因为你将能够剖析通常带有大量假设和模糊信息的需求文档。\n\
  \n\n\n\n\n用户旅程允许我们可视化长时间跨度内的用户行为。在某种意义上，用户旅程可以被视为一种特定的方式，使整个用户生命周期在用户系统中执行的操作方面变得更加明确。\n\
  \n用户旅程也可用于表达系统内很一段时间内不同用户之间的关系。虽然我们在某个功能中收集的关键事件会描述更细粒度上的细节，但用户旅程将通过几个区块来展示较大规模的用户动作。\n\
  \n## 为逐个用户创建用户旅程\n\n让我们回到我们的 HomeIt 创业公司上。看看这个用户旅程：\n\n![Figure 2.4: Tenant user\
  \ journey](img/B18632_02_4.jpg)\n\n图 2.4：租户用户旅程\n\n在第一个示例中，如`Figure 2.4` 所示，我们可以通过逐个区块总结用户的动作，在\
  \ HomeIt 网站上展示整个租户旅程。每个区块代表一个完整的功能，该功能反过来可以以不同的方式进行分解。\n\n现在让我们来看房东的用户旅程：\n\n![Figure\
  \ 2.5: Landlord user journey](img/B18632_02_5.jpg)\n\n图 2.5：房东用户旅程\n\n正如你在`Figure\
  \ 2.5`的示例所示，可以简要地总结网站上的整个房东旅程。\n\n这种使用用户旅程的方法关注于单一用户。在两个示例中，我们都忽略了一些实际功能，例如中介功能和保险功能。当然，如果你已经练习过自己创建需求，我们我们也略去了你所发现的功能。不过，你可以理解其中的思路。用户旅程能够在很小的视觉空间内传达大量信息。\n\
  \n让我们探索另一种创建用户旅程的方法。\n\n## 包含多个用户的用户旅程\n\n在这种情况下，我们将多个用户引入到同一个用户旅程中。看看`Figure 2.6`：\n\
  \n![Figure 2.6: Multiple users in the same user journey](img/B18632_02_6.jpg)\n\n\
  图 2.6：同一用户旅程中的多个用户\n\n由于空间限制，我只包含了整个用户旅程的一个部分，其中涉及四个角色：租户、房产中介、房东和 HomeIt。用户旅程被分为水平泳道，每个泳道代表一个用户。泳道中的动作显示在左侧，方框按照这些动作随时间发生的顺序排列。\n\
  \n跟踪每个用户的动作及其发生的顺序非常容易。在现实世界中，你可以创建跨越多个部门并涉及各种类型用户的广泛用户旅程。\n\n这种涉及几个不同用户的用户旅程，也可以适用于非常高层的流程，也可以适用于非常具体的细节流程。这完全取决于你的需求。\n\
  \n作为一个练习，请为中介流程创建一个用户旅程。花些时间仔细思考，并创建泳道以及所有涉及的不同用户，以及每个用户随时间应该执行的各种动作。\n\n## 用户故事（User\
  \ stories）\n\n由于团队成员往往会深陷在项目的技术细节中，鼓励他们从最终用户的角度进行思考可能具有挑战性。当我们未能采用用户的观点时，就面临着创建不符合他们需求的产品或功能的风险。遗憾的是，这在市场中是一个常见现象。\n\
  \n这就是用户故事证明其无价价值的地方。这些产物的设计旨在从用户的角度传达需求，使其对于帮助团队成员与用户产生共情特别有效。用户故事让项目中的同事能够通俗地“戴上用户的帽子”。它们的目标是将每个人的注意力转向理解并优先考虑用户需求，而不是软件的复杂性。\n\
  \n### 用户故事模板\n\n用户故事本质上是一个简短的描述，遵循特定的模板来从用户的角度传达需求。用户故事最常见的格式如下：\n\n*标题*：房产中介为租赁物业发送合作提议书\n\
  \n作为一名房产中介，我想为一处租赁物业发送合作提议书，以便帮助房东找到优质的租客。这不仅将帮助我增加月收入，还能为房东创造收入。此外，合作提议书将帮助租客找到他们理想的家。\n\
  \n*验收标准*：\n\n房产中介可以为租赁物业发送合作提议书。\n\n合作提议书可供房东审核。\n\n正如你所见，用户故事是动作中一个集中的部分。在读者脑海中创建视觉形象的能力是一个非常重要的努力目标。用户故事应该完全专注于描述那些易于以总结方式可视化的。\n\
  \n显而的是，用户故事可以与应该发生的关键事件列表相结合，允许我们有效地传达我们希望在软件中实现的逐步价值创造过程。\n\n### 用户故事回答了哪些问题？\n\
  \n用户故事通过回答以下关键问题，在软件开发过程中起着至关重要的作用：\n\n*   是谁在尝试完成什么？\n*   用户在这个故事中应该采取什么动作？\n*\
  \   为什么允许用户执行该动作对他们来说很重要？\n*   还有哪些用户受了影响？\n*   为什么这个故事中的动作对这些其他用户来说也重要？\n\n在许多情况下，用户故事最初可能不包含许多业务规则。我更倾向于将它们视为说明动作、系统用户关系以及通过这些动作创造价值的工具。\n\
  \n在编写用户故事时，通常建议不要一次描述过多的动作。如果你的故事太长，可能说明它应该被分成多个故事。\n\n## 学习跳出技术框架思考\n\n正如之前提到的，一个有效的用户故事不会深入探讨技术细节。它的设计初衷是帮助人们关注用户、关系、人类行为以及动机。如果你发现自己提到了最新的\
  \ JSON 格式或应该使用哪种 HTTP 方法，那么你就偏离了重点。用户故事关于功能背后的“为什么”，而不是“如何做”。\n\n### 为用户故事撰写好的标题\n\
  \n引入用户故事的最佳方式是使用一个标题，它是对用户在系统中执行的动作的简短描述。如何用简洁的句子描述用户动作，而不包含任何特定的软件细节？换句话说，你如何解释用户应该对系统做什么，而不提到系统本身？\n\
  \n对于许多人来说，避免讨论软件和技术并不是一项容易的任务！我们必须描述用户应该做什么，而不是引用屏幕、按钮、数据格式、网络协议、设计模式等。我们应该从用户故事中移除所有技术术语。\n\
  \n### 什么是验收标准？\n\n每个用户故事的一个关组成部分是验收标准。它确保了我们完成了故事的实现。一个优秀的验收标准提供了一个全面的业务测试列表，以判断开发是否完全完成。\n\
  \n\n\n\n验收标准在创建我们的测试中起着关键作用，它标志着我们开始深入分析软件的起始点。在用户故事中，一个设计良好的验收标准部分将指导我们创建一个详细、简洁的自动化测试列表，并在软件中执行执行。有了清晰的验收标准，对于软件是否已准备好发布将不再有争议。验收标准部分充当了我们将产品部署到生产环境的守门员。\n\
  \n现在是停下阅读并为我们的 `HomeIt` 系统编写一些出色的用户故事的好时机。你可以遵循此模板：\n\n`Title`: <<用户 X 用一个简短的句子描述了一个操作。>>\n\
  \n`Description`:\n\n作为一名 <<在此处添加角色>>，我希望能够 <<在此处添加操作>>以便我能够 <<在此处添加所需的结果>>。\n\n\
  这样做将让我能够 <<后果 1, 后果 2, 后果 3>>。\n\n这还将让我避免 <<负面后果 1, 负面后果 2>>。\n\n这将以以下方式影响 <<其他用户或角色>>：\
  \ <<在此处添加后果列表>>。\n\n`Business Rules`:\n\n<<你可能想在这里添加业务规则，永远不要谈论技术细节、按钮、屏幕等。>>\n\n\
  `Acceptance Criteria`:\n\n*   <<我们需要验证在系统中是否正在正确执行的操作>>\n*   <<在软件完成后可以验证其正确性的其他操作或后果>>\n\
  \n如果你在网上搜索用户故事，你会遇到各种模板。我更倾向于使用这个定制的模板，它允许对其他常用模板无法允许的关系和收益进行更深层次的探索。\n\n在练习编写了一些用户旅程后，移动到下一部分。\n\
  \n## 用例描述 (Use cases descriptions)\n\n到为止，我们已经探索了各种协助阐述我们业务需求的工具。如果你是一个画家，这些需求工具可以被比作不同的颜色，让你能够画出你软件的肖像。\n\
  \n`用例描述` (use case description)是我偏喜欢的另一个关键工具，用于确保开发者理解需要构建的内容。它的目的与用户故事相似：通过`用例描述`，我们可以描述用户为了与我们的系统交互而将采取的过程。\n\
  \n### 注意\n\n在我们深入研究用例描述之前，我想澄清一个潜在的混淆点。在软件工程领域，存在一种广为人知的的工具被称为`用例图` (use case diagram)。当我提到`用例描述`时，我指的不是`用例图`。考虑到它们的流行程度，我不会在此语境下讨论用例图。此外，我更倾向于使用用户旅程图而非用例图来从非常高层的视角解释用户操作。\n\
  \n### 比较用户故事和用例描述\n\n回到我们的主话题：如果`用例描述`与用户故事相似，它们之间有什么区别？这是我的观点：用户故事被刻意保持简短，以避免对所描述的过程进行过多细节。该过程旨在由另一个工具来来说明。相比之下，`用例描述`是我们旨在提供更多细节的地方——事实上，是多得多的细节。\n\
  \n它是这样运作的：虽然用户故事旨在避免深入研究系统的细节，但`用例描述`允许将用户故事与我们讨论过的其他产物相结合。\n\n例如，一个`用例描述`可能以用户故事的文本开头，然后详细说明构成我们需要编程的过程的关键事件序列。它还可能在`用例描述`中包含相关的图表，以便开发者更清楚地理解系统是如何运行的。\n\
  \n`用例描述`充当用例的全面文档。从用户故事开始使人们理解其背后的操作、动机和关系。进展到关键操作序列为在软件中开发该过程奠定了基础。添加对象阶段或生命周期图增强了随时间变化的视觉效果。\n\
  \n在`用例描述`中，视觉效果、附带的用户故事和关键事件结合形成了一个传达你软件目标的强大工具。引入额外的图表（例如解释各种系统级别的图表）进一步增强了清晰度。\n\
  \n关于`用例描述`的最后一个想法是，它们应该被视为画布，你在上面添加颜色和草图来表达软件意图要做什么。\n\n### 触发器 (Triggers)\n\n另一个纳入`用例描述`中的关键元素是`触发器`\
  \ (triggers)，我认为是允许用户启动故事中所提操作的上下文。事实上，用户可以通过多种途径开始参与一个用户故事。例如，在我们的`HomeIt` 系统中，当租客正在寻找租赁物业时，我们可以考虑以下触发器：\n\
  \n*   **直接搜索房产**：租客通过应用的搜索功能启动搜索寻找符合其标准的可用房产。\n*   **来自手机**：用户正从手机开始搜索租赁物业。在这种情况下，从手机开始可能会显著改变过程。在这种情况下，我们可以让什么工作得不同呢？也许我们可以使用手机本地化功能来寻找地理位置上靠近用户的房产。在这种情况下，添加一个让用户在搜索时选择距离其位置的距离来寻找房产的功能，可能很有趣。\n\
  *   **来自个人电脑**：如果用户从电脑开始搜索，我们可以考虑提供一种完全不同的布局，以利用更大的屏幕空间。使用带有高分辨率图像的网格可能有助于更多地吸引用户。也许我们可以设置一个在同一屏幕上比较不同房屋图像的功能。谁知道呢？\n\
  *   **推荐系统**：租客根据其搜索历史和偏好接收个性化的房产推荐。\n*   **通知警报**：租客订阅通知，当有符合其标准的新房产可用时收到警报。\n\
  *   **代理人联系**：租客通过应用联系房地产经纪人寻求寻找房产的帮助。\n\n简单的例子说明，尽管我们只有一个用例（在本例中为租赁房产搜索），但该功能运作将取决于上下文。我们使用`触发器`一词来指代用户可以开始用户故事的每个不同上下文。\n\
  \n注意\n\n在脑中记住这一点非常重要：对于同一个用例，不同的触发器可能有一套不同的关键事件。\n\n现在，让我们看看用于创建用例描述的有用模板。你可以自由将其用于任何用例描述：\n\
  \n`用例名称`：遵循与用户故事相同的规则。\n\n`用户故事`：介绍将发生的操作，以及系统中的动机和关系。它包含了用于断我们已完成故事开发的验收标准。\n\n\
  `触发器 #1 – 触发器标题`：识别用户执行操作的唯一上下文：\n\n*   `触发器描述`\n*   `触发器的关键事件时间线`\n*   `阶段、级别、类型、生命周期、循环`(或任何其他相关的图表）\n\
  \n最后，让我们来看一个用例描述示例，房东发布一个新的租赁房产。\n\n### 用例示例\n\n`Title`: 房东发布一个新的租赁房产\n\n`Description`:\n\
  \n\n\n作为一名房东，我希望能够在系统中发布新的租赁房产，以便我让我的房产供人出租。这样做可以让我吸引潜在租客、筛选出最佳租客、在房产出租时创造新的收入来源，并吸引新的房地产中介人作为合作伙伴以接触更多的租客。这还将帮助我避免房产空置且没有新收入来源的情况。此外，这将影响中介人，为他们提供额外的房产源来向潜在客户展示，并让他们在协助我管理房产时获得新的收入来源。\n\
  \n## 业务规则\n\n只有在提供所有媒体文件后，房产才能完全开放租赁和合作提案。\n\n房东除了媒体文件外，必须提供房产的完整地址、租金以及房产的条件和特征。\n\
  \n## 验收标准\n\n房东用户能够在系统中发布新的租赁房产，并附带照片和视频。\n\n### 触发器 #1\n\n租赁房产在网站上发布。\n\n## 关键事件时间线\n\
  \n1. 在网站上，房东选择添加新租赁房产的选项。\n2. 房东提供注册租赁房产所需的信息。\n3. 系统验证发送的信息。\n4. 房东根据需要修正租赁房产信息。\n\
  5. 房东完成所有信息（描述、地址、价格等）的提交。\n6. 房东被引导至新房产页面，目前处于非活动状态。\n7. 系统为房东提供上传媒体文件（图片或视频）的选项。\n\
  8. 房东选择上传媒体文件。\n9. 房东上传租赁房产注册所需的媒体文件。\n10. 租赁房产状态变为处理媒体文件中。\n11. 系统开始处理上传的媒体素材（具体结果待定义）。\n\
  12. 媒体处理完成后，租赁房产状态更新为已就绪。\n13. 房东获得发布租赁房产的选项，供租客和中介查看。\n14. 房东选择发布租赁房产。\n15. 租赁房产现在处于已发布状态，并出现在房产搜索功能中。\n\
  \n简而言，此用例是关于房东添加所有所需信息以注册租赁房产，使其能够在搜索功能中使用。\n\n让我们再次可视化房产的生命周期：\n\n![图 2.7 – 租赁房产注册生命周期](img/B18632_02_7.jpg)\n\
  \n图 2.7 – 租赁房产注册生命周期\n\n这是在完整的业务需求文档中构建单个用例的一种非常的方法。\n\n现在让我们检查如何创建最终的业务需求文档。\n\n\
  # 构建最终的业务需求文档\n\n本节将讨论一份优秀的业务需求文档的特征。在创建或审查你自己的文档时，记得检查是否涵盖了这些方面。这将使你在面对几乎任何项目时处于良好状态。\n\
  \n### 范围定义的单一概念/功能\n\n业务需求文档应该专注于交付仅仅“一个概念”。这到底意味着什么？这意味着文档通常包含一组用例，但它们都贡献于你的软件旨在提供的单一“价值产物”。这部分价值是自给自足的，不依赖于任何其他内容来增强用户价值。整个流程从头到尾是完整构建的。\n\
  \n例如，我们之前讨论过推出 HomeIt 网站第一个简化版本的想法，该版本仅允许房东注册。其他人都是访问客，可以从发布的房产中获取房东的电话号码。这意味着为首次发布创建的业务需求文档（我们称之为\
  \ `landlord flow release`）本质上包含以下用例：\n\n1. 房东在网站上注册\n2. 房东发布新的租赁房产\n3. 未注册的访问客搜索租赁房产\n\
  4. 未注册的访问客访问房产页面\n\n正如你所观察到的，通过仅提供四个用例就可以为所有方在市场中创造价值。这种方法比尝试实现我们目前发现的所有用例/功能有助于更快地进入市场。\n\
  \n但当有其他用例时你该怎么办？\n\n你经常会发现产品团队没有彻底考虑替代行为。需求通常关注于增加价值的新功能。逻辑上的下一步可能是“租客流”，它可能包括：\n\
  \n1. 租客在网站上注册\n2. 租客发送针对纽约的租赁提案\n3. 房东接受租赁提案\n4. 租客发送信息\n5. 每月处理支付\n\n在这种情况下，对于第二次发布，我们向系统添加了五个用例，使我们能够管理支付情况。尽管如此，我们仍将此功能限制在纽约。\n\
  \n### 清晰的输入和输出\n\n我们将在接下来的章节中深入探讨输入和输出。但基本上，这意味着用例应该尽可能准确地描述过程的输入和输出。例如，在处理租赁房产注册的输入时，这里考虑以下问题：\n\
  \n* 我们期望在 HomeIt 系统中为租赁房产注册的精确属性有哪些？\n* 我们期望支持什么类型的媒体文件？\n* 租赁房产描述的最大接受长度是多少？\n\n\
  以下是我们预期回答的问题，以明确输出：\n\n* 我们期望在处理媒体文件后产生什么种类型的媒体文件？\n* 在处理视频后，我们期望视频具有什么种接受的？\n\n\
  如果我们不知道需求中预期的输入和输出，可能会在后期阻碍程序员。\n\n### 异常用例显式化\n\n在接受和审查来自产品团队或部门的业务需求文档时，请确保采取以下行动：\n\
  \n#### 用户替代行为问题\n首先，在阅读描述和关键事件后，确保识别系统流中用户可能偏离预期路径的地方。对于用户旅程中的每一个此类节点，至关重要的是询问：“如果用户在某点的行为与预期不同，系统应该如何响应？”\n\
  \n#### 系统错误和故障\n其次，在审查记录的功能和需求时，你还应该标记可能发生系统故障的步骤。虽然业务需求文档不是讨论技术问题的精确位置，但它可能会揭示需要考虑的重要点。\n\
  \n\n\n\n例如，如果你知道某项需求依赖于特定的合作伙伴系统，而该系统可能会离线，那么你需要强调这一关注点。产品团队打算如何处理该系统的故障？他们的目标是在客户不察觉故障的情况下实现无缝恢复吗？还是计划将客户重定向到客户支持团队？这些问题同样重要。\n\
  \n观察事情可能被误用或出错之处，是规划开发过程中非常重要的一步。接下来，让我们看看如何确保你在记录文档的过程中能够获得最多的关注以及新鲜的视角和想法。\n\n\
  ### 包含所有受影响区域的完整签署流程\n\n在产品需求文档中，你可能希望产品团队提供一份端到端的流程图，该图横跨受发布影响的所有不同区域，并详细说明哪些用户在整个过程中采取了操作，直到流程结束。\n\
  \n正如上一章所述，让所有区域的每个人都意识到新发布是新软件成功的关键。这就是为什么作为程序员，你应该要求这些流程经过不同团队的签署确认（signed-off）。如果我们获得了一份详尽的用户旅程，显示了不同区域应该做什么，并且每个区域的管理层都签署了该文档，那么假设流程是正确的将要安全得多。\n\
  \n### 在编写文档时避免阻塞\n\n在某些情况下，在编写或阅读需求文档以及其他文档时，会有许多开放的、未定义的点。那时你该怎么办？你应该开始猜测应该发生什么吗？还是应该等到下一次团队会议来报告你被阻塞了？\n\
  \n这种情况经常发生。我们作为程序员，经常面临需求没有达到应有的详尽程度，而且会缺失许多细节。作为在这种时期继续推进的通用良好做法，我建议在文档中创建一个“开放问题”部分（open\
  \ questions section）。你可以继续编写文档，添加所有你确定的内容，然后将你想要由他人回答的问题留出来。\n\n# 这些产物中哪些应该优先？\n\
  \n当我们到达第 2 章的结尾时，你已经看到在编写详细业务需求时有很多有效的工具可以使用。那么一个关键问题随之产生：有这么多起点可用，你应该先创建哪些产物？\n\
  \n答案显而易见：这取决于软件开发生命周期的现状。以下是一些很好的起点：\n\n* **如果你正在完善定义良好的需求**：可能流程已经清晰列出，所缺失的只是输入/输出格式\n\
  * **如果你正在定义系统流应该如何工作**：需求可能很模糊，但如果你对整个用户旅程有通用的理解，那么可能是时候关注关键事件了\n* **如果你在识别团队中最大的知识缺口**：需求可能太具体了，如果尚不清楚它们如何融入更大范围的用户旅程中，那么从高层角度设计整个用户旅程可能是必要的\n\
  \n要确定产出最佳的需求文档，请从解决这些问题开始。此外，请注意以下几点：\n\n* **公司规模**：在拥有许多不同区域的组织中，为每种类型的用户提供通用的用户旅程图可以极大促进跨公司沟通。\n\
  * **当前系统的成熟度**：如果要在现有系统上添加功能，请审查当前文档以识别差距。\n* **小公司的惯做法**：程序员可能会在文档极少的情况下就冲入实现，这是一个致命的错误。未来的团队成员需要了解实现了什么，而仅仅依赖代码或程序员来获取这些信息是不可持续的且不可扩展的。\n\
  \n文档对于规模化流程和通信至关重要。避免让你的项目遭受缺乏文档的苦，，否则你可能会成为基础问题的随随求助者，制造瓶颈并消耗宝贵的时间。通过一套健壮且清晰的文档，你可以为更高价值的活动腾出时间，这可以带来未来更高的报酬。\n\
  \n# 通过长期业务需求扩展成果\n\n本节旨在帮助你完成一项关键任务：揭示并解决业务需求中的短期限制。这样做可以在你的工程工作中节省大量成本，并促进工程成果在长期内得到有效扩展。\n\
  \n这个专业提示（pro tip）是许多开发者由于习惯于短期思维而忽视的。如果你屈服于业务领域为了在不久后快速发布以产生新收入流的压力，你可能会在下一年面临指数级增长的工程成本。\n\
  \n让我们从理解这一点开始：当我们只考虑下周或下个月发布而开发软件时，我们往往忽略了未来为公司产品需要承担的大许多类似任务。\n\n这不是你希望自己处的位置。\n\
  \n例如，在我们的 HomeIt 系统中，我们可以从为租户实现一种支付系统开始——例如美国的信用卡。如果我们指派一个工程师团队在下个月之前部署信用卡支付，接下来会什么？嗯，美国的租户可能也希望通过电转账支付租金。这将增加工程工作，对吧？而且这是一个与第一项类似的任务。假设我们接着花一个月时间引入电转账，随后产品团队又要求下个月使用\
  \ ACH 支付方式。\n\n这种场景对于在美国的运营来说可能是满意的，假设我们的目标仅提供三种支付方式。尽管如此，我们可能会遇到不同美国州之间流程的差异——例如，每个州需要不同的税收处理。如果我们决定也自动支付税收，这可能意味着为每个独特的场景聘佣工程师。\n\
  \n你可能已经明白大意了。许多公司忽视了长期思考，结果是它们的架构将需要工程师介入为更多类似的用例编写代码。这有时在开发第一年后才被发现——也许在第四个类似的用例发布到生产环境之后。\n\
  \n嗯，在我们的 HomeIt 系统案例中，假设产品团队想要将公司扩展到 30 个国家。如果他们按月要求新的支付系统，而没有明确表示他们在未来 5 到 10 年内引入\
  \ 200 多种支付方式的意图，将出现若干限制：\n\n* 可能无法许多团队并行工作，因为服务的设计方式使得协调多个团队同时工作而不产生冲突变得困难\n* 可能我们必须为每个新的支付系统花费数百小时，这会让开发者开始觉得自己在不断重复相同的工作\n\
  * 在 5 到 10 年内扩展到 30 个国家可能是可能的，因为架构并非为了加速每个用例的开发而创建的\n\n你明白我的意思，对吧？当我们只关注短期思维时，我们就无法预见到能够更快扩展的良好设计决策。\n\
  \n长期业务需求的关联\n\n\n\n\n事实上，这种方法似乎违背了`你现在不需要它`（`YAGNI`）原则。然而，通过理解并与产品团队的长期目标保持一致，你可以从一开始就构建出能够适当扩展的代码，从而避免未来进行大量重构或重新开发的必要性。这种主动的方法最终将带来一个更高效、更具利润的软件开发过程。\n\
  \n现在，你如何能发现哪些可以编写可扩展代码的区域呢？\n\n你可以向产品团队提出以下问题，以确定你的软件应该如何准备以适应长期目标（5 到 10 年）：\n\n\
  * 在未来 5 到 10 年内，我们将在系统中创建哪些类型的新类型？\n* 在未来 5 到 10 年内，我们将创建哪些新的级别？\n* 在未来 5 到 10 年内，我们将发布哪些新产品？\n\
  * 在未来 5 到 10 年内，我们希望增加多少销售额？\n* 在未来 5 到 10 年内，我们计划在哪些新地区发布软件？\n* 在未来 5 到 10 年内，我们计划多开发多少个用例？\n\
  \n一旦你得到了这些问题的答案，请考虑以下内容：\n\n* 我的架构是否提供了一种通用方法，以便于添加新的用例、级别和类型？\n* 工程团队是否会为了添加每个新的里程碑、级别或用例而花费大量的开发时间？\n\
  * 如果需要，我们能否有效地协调额外的工程师来开发更多的用例？\n* 随着我们增加更多的用例，我们的开发成本是线性增长还是指数级增长的？\n* 在发布了一定数量的新用例后，当前的架构会产生不可管理的复杂度吗？\n\
  * 为了在投入相同工程努力的情况下快速交付多个用例，对架构进行哪些是必要的？\n* 我们如何减少交付一个用例所需的代码行数，并更高效地扩展我们的软件？\n\n\
  提出这些问题将帮助你设计出随时间推移提供指数级价值的软件，并为你的公司释放巨大的潜力。\n\n# 练习\n\n好了，关于如何制定真正产生影响并为公司增加巨大价值的优秀业务需求，还有许多重要的方面需要讨论。我们稍后会回顾那些额外的原则。\n\
  \n目前，我在这里介绍的工具将是我在理解了`第 1 章`中的通用、高级业务需求后，深入研究具体细节时使用的工具。\n\n本节将帮助你回想起在本章中学到的内容。可以随时回到相应的章节以获取细粒细节：\n\
  \n* `命名功能`将帮助你划分应用程序的正确区块。\n  查看`第 1 章`中之前讨论过的高级业务需求，找到一些你想在我们的 HomeIt 启动项目中扩展的新新功能。你对深入研究哪些功能感兴趣？\n\
  * `关键事件`将帮助头脑风暴我们必须确保在系统中发生的最重要的事件。\n  对于你想出的功能，你能想出哪些关键事件？你`不`应该忘记向产品中的某项功能添加哪些内容？\n\
  * `事件时间轴`将帮助彻底理解功能如何按步骤工作。\n  对于本次练习中的每项功能，你将如何安排事件时间轴？\n* `阶段、级别、类型、生命周期和循环`将帮助理解系统中随时间推移的价值流，以及如何以特殊方式区分用户和对象。\n\
  \  在你构思的功能中，你想使用这五个元素中的哪一个？\n* `用户之旅`将帮助你理解用户跨越系统的生命周期，即他们在哪里开始，在哪里结束交互，以及你如何保持他们的活跃。\n\
  \  当你考虑跨越 HomeIt 系统的整个过程时，你的用例处于什么位置？哪些用户之旅受到了影响（如果有多个），你将如何绘制端到端的体验？\n* `多用户用户之旅`将帮助你直观地理解用户应该如何相互作用。\n\
  \  当你思考影响一个以上用户的功能时，你将如何跨越不同的泳道构建多用户之旅？\n* `用户故事`帮助你理解用户执行的关键操作、他们的动机、涉及的价值，以及与其他用户的关系和影响。它们还帮助剥离技术细节，让人们思考用户和业务，而不是代码。\n\
  \  你将如何陈述你想要练习的功能的用户故事？你预见到会有哪些关系，你将使用哪些验收标准来确保功能已准备就绪？\n* `用例描述`帮助结合之前的工具，为功能如何工作提供清晰的视角。它们提供了触发器，我们可以通过这些触发器区分用例可能启动的不同上下文，这可能有助于识别业务规则和流程的差异。\n\
  \  作为一个练习，我建议你至少写一个完整的用例描述。你可以使用建议的模板来完全解释那里应该完成什么。\n* `异常用例`帮助识别用户可能以非计划的方式行为，以及在系统发生故障时该怎么办。\n\
  \  当你考虑你的用例描述时，你会发现哪些异常用例？用户在何时可能会做意料之外的事，在何时你会考虑采取额外措施以防止系统故障？\n* `清晰的输入和输出`帮助识别业务预期处理的特定数据。我们预期在过程开始收集收集数据，在过程结束时产生什么数据？\n\
  \  当你考虑你的用例以及包含其中的不同过程时，你需要哪些输入和输出来使其运行？\n* `长期业务需求`帮助你理解当前架构的隐藏成本，以及如何帮助用更少的代码和更少的工程努力交付更多功能。\n\
  \  当你考虑五年后的这个系统时，你认为哪些新用例对于处理将？这些限制暗示你应该处理哪些限制？\n\n# 总结\n\n本章涵盖了许多有用内容。这些观点不是来自其他书籍，而是来自我作为软件开发人员、技术负责人和经理的日常经验，因为我过去曾担任过所有这些职位。\n\
  \n这些业务需求实践和思维为我带来了非常丰厚的财务回报、极好的反馈以及更大的职业发展机会。我还没有开始谈代码，而是谈论那些让编写代码变得指数级容易的事情。\n\n\
  当然，我也鼓励你立即将所有这些工具应用到你目前正在工作的软件上。\n\n在下一章中，我们将开始考虑一个能够以模块化、可扩展的方式满足你的业务需求的系统。我们将讨论如何划分交付的优先级、识别领域和服务，并安排这些组件之间的活动顺序。从那里开始，我们将使用优秀的\
  \ Spring 框架工具来编写我们的软件。\n\n\n\n在本章中，我们将首先识别系统中最具价值的功能。鉴于产品团队通常有一份冗长的待实现需求列表，我们的首要任务是从交付最高价值的功能开始。接下来，我们将进入探索需要处理的领域（domains），这将指导我们需要开发的哪些\
  \ API。最后，我们将通过概述这些领域之间随时间推移的信息流来结束本章，为在你的项目中实现用例创建一个清晰的实施蓝图。\n\n我们将涵盖以下主题：\n\n*\
  \   确定优先交付哪些功能\n*   为你的应用程序定义领域和边界\n*   为你的领域定义合适的服务\n*   绘制你的领域图\n*   对跨服务的活动进行排序\n\
  \n本章是连接健壮需求与你代码之间的关键纽带。在这里，我们开始对你的系统进行建模。我们将教你如何从需求中提取关键系统组件（我们将其称为 `domains`），以及如何创建图表，以简化与非程序员关于系统编程的讨论。涵盖的内容将使你能够让跨学科团队参与到关于你正在设计的架构的讨论中，以阐明需求。\n\
  \n理解这里介绍的工具和技能，将为你成为一名受尊敬的架构师的旅程提供巨大的助力——使你能够将业务需求转化为简单、全面的系统设计。如果你掌握了这一点，你就成功了一。\n\
  \n你感到兴奋吗？我很。。让我们开始吧！\n\n# 技术需求\n\n在本章中，你需要使用两个简单的工具来完成各个章节中提出的分析：\n\n*   `draw.io`，一个在线绘图工具\n\
  *   `PlantUML`，一个帮助绘制序列图的工具，我们将在最后的章节之一看到它\n\n你可以在此 GitHub 仓库访问本章的所有代码：\n\nhttps://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-03\n\
  \n## 确定优先交付哪些功能\n\n如果你在任何公司工作过——无论是初创公司还是大科技公司——你会发现这种情况很熟悉：待办列表（backlogs）是无尽的。产品团队可以构思的功能数量是没有限制的。如果你还没有在大公司工作过，待办列表本质上是一份等待开发团队评估、精炼和开发的功能与想法列表。\n\
  \n为什么待办列表总是变得这么大？首先，作为一个具有创造力的人，意味着只要时间足够，你就能不断回答关于客户不同生活情况的这三个问题：\n\n*   这种情况是一个问题吗？\n\
  *   如果我们在这种情况下执行 `X` 会怎样？\n*   在这种情况下我们还能做些什么？\n\n这种持续的创造力确保了我们始终能够识别出需要解决的新问题，以及通过添加新功能来支持我们的客户可能获益的新用例和场景。随着待办列表越来越大，关键问题自然变成了如何选择最好的功能进行优先交付。\n\
  \n## 关于无用功能的大警告\n\n许多公司在选择最有价值的功能进行工作方面挣挣扎。随着潜在功能数量的增加，选择对客户最有用功能的概率与产品团队评估和比较不同功能想法价值的熟练程度成正比。\n\
  \n随着敏捷方法的广泛采用，我注意到产品领域出现了一种“新功能综合症”。这种综合症的出现，是因为敏捷方法强调快速发布新事物，这激励了团队不断创建新功能，有时只是“仅仅因为如此”。换句话说，因为团队嵌入在一个优先考虑频繁发布的流程中，他们会继续生产新功能——即使这些功能可能并不特别有用。\n\
  \n这通常发生是因为许多团队缺乏批判性地思考不同功能将为市场带来价值的技能。结果是许多无关的功能每天都被添加到各个市场的产品中。\n\n现在我们已经看过了一些重要问题，让我们来回答另一个重要问题：我们应该优先考虑哪些业务需求？\n\
  \n## 业务需求的优先级排序标准\n\n作为一名与产品团队合作的开发者，我经常讨论被要求处理的功能的相关性。我运用了几种关键标准和问题来评估一个发布版本对市场有多大价值。我观察过许多情况，只需在产品会议期间提出这些问题，就能促使产品团队重新审视计划发布的功能的可行性和优先级。这些讨论对于确保每个功能都能增加真实价值并符合市场需求至关重要。\n\
  \n### 愿景对齐\n\n作为一名开发者，你需要能够理解公司的愿景是什么。公司正试图给世界带来什么？你的公司想在市场上产生什么影响？考虑到这些，你被要求处理的功能是否履行了这一承诺？或者这个新功能对我们的客户来说只是完全无关？\n\
  \n我观察到许多公司在执行以下操作之一：\n\n*   `频繁更改产品策略`，通常是短期的，由于由于关键董事和经理由于带着不同的想法离开或加入了公司。\n* \
  \  `仓促交付项目`，因为有消耗预算的需求。这种情况通常源于担心如果资金未用完，业务部门将面临负面后果。\n*   `追逐市场趋势`而没有明确的策略。公司仅仅开发功能或产品是因为它们目前在市场上很流行，这很常见。加密和人工智能等行业经常根据市场热度出现兴趣激增，导致公司在没有深思熟虑的情况下追流。\n\
  \n这些行为可能会将资源从真正创新或必要的项目中转移，并导致开发出可能无法为公司或客户提供真实价值的功能。\n\n在为你的客户开发新功能时，要考虑的最相关因素是它将解决的具体问题，因此与产品团队进行挑战性讨论至关重要。如果提议的功能没有解决明显的问题，或者与公司的长期愿景不符，那么向上反映这一担忧是必要的。让该功能可能不发布——或者至少需要精炼直到它符合公司的长期目标。这种方法确保了每个开发努力都能为公司的目标做出重大贡献，并真正满足客户需求。\n\
  \n### 市场规模\n\n在评估潜在功能时，评估该功能将覆盖或吸引的市场规模至关重要。即使你正在解决的问题高度相关并符合公司的愿景，对客户群的影响也是一个重大的考虑因素。\n\
  \n解决广泛问题的特征自然会吸引更大的受众。考虑你的产品团队是否正在计划开发一个用户群体可能并不普遍需要或想要的使用用例。它对整体市场的贡献将有多意义？\n\n\
  如果你意识到你正在开发的功能可能对大部分用户群感兴趣，那么表达这种担忧是关重要的，因为软件开发是一项高昂的工程。\n\n\n\n另一个需要考虑的关键方面是，该功能是否可以调整以吸引更广泛的受众。如果有一种修改功能的方法使其与更多人产生关联，那么追求这种适配是非常明智的。这种方法不仅能最大限度地挖掘功能的市场潜力，还能增强其对公司的价值。\n\
  \n在针对大型用户群这一准则上，有一个重要的例外：如果公司意识到针对一个较小、更专业的细分市场仍然可以产生大量收入，那么整体市场规模就变得不那么关键。这种方法允许公司在市场中开辟出一片利基市场，这在战略上是有优势的。通过专注于利基市场，公司通常能发现建立强大定位并可能获得忠实客户群的机会，即使用户数量相对较少如此。这种有针对性的策略可以带来显著的回报，并在市场中形成独特的产品身份。\n\
  \n### 问题发生频率\n\n这是决定是否开发和发布新功能的另一个基本标准：考虑你的客户遇到该功能旨在解决问题的频率。分析该问题发生的频率——是每天、每周、每月还是每年——并确定你的客户是否有足够的机会经常使用你的产品，或者它是否仅仅作为一次性的解决方案。\n\
  \n让你的产品能够更频繁地整合到用户的日常活动中至关重要。如果你能以某种方式影响客户的一些频繁行为，引导他们更经常使用你的产品，那么该功能就是发布的强有力候选者。\n\
  \n### 问题强度\n\n在评估新功能的潜力时，考虑它旨在解决问题的强度很重要。问问自己以下问题：问题是否足够显著，足以激励用户寻找你的功能？问题是否如此紧迫，以至于你解决方案的存在就能驱动用户使用你的产品？\n\
  \n市场上充斥着许多无法解决特别激烈问题的功能；虽然这在某些情况下是可以接受的，但识别哪些功能对于解决客户面临的重大问题真正有益是至关重要的。记住，引起高水平不适或剧烈痛苦的问题更有可能激励用户采取行动。有效缓解此类问题的功能可以大大增强用户对你产品的依赖，从而提升客户的满意度和忠诚度。\n\
  \n### 市场购买力\n\n评估目标客户是否买得起你的产品是软件开发的一个关键方面。许多公司（特别是初创公司）为不太可能向他们投入大量资金的客户细分开发产品。初创公司之间有一种普遍观点，建立大型用户群最终会转化为重大的业务回报。这种目标市场通常通过\
  \ `freemium`（免费增值）模式来运营。\n\n### 对解决方案的付费意愿\n\n这一点与之前讨论的确保目标客户在财务上有能力且意愿购买你的产品紧密相关。在某些情况下，客户可能意识到他们有一个问题，但不愿意为解决方案付费。想想你想要买某件有趣东西的时候，例如，但你发现它不值那个价。你有钱，但它的价格让你放弃了在上面花钱。\n\
  \n在这样的情况下，问问自己几个关键问题至关重要：\n\n* 我们的客户是否已经在花钱解决我们的功能旨在解决的问题了？\n* 他们是否正在积极寻找该问题的解决方案？\n\
  * 是否有证据表明客户准备投入资金来解决这个问题？\n\n这些问题对于确定你的功能是否存在可行市场至关重要。它们有助于理解你的潜在客户不仅需要，而且愿意为你提供的解决方案付单。这种评估可以指导你的开发工作，并确保这些工作被投入到既需要又在财务上可持续的功能中。\n\
  \n### 预计交付成本\n\n开发解决方案的成本——无论是时间、金钱或其他资源——对于决定其可行性都起着至关重要的作用。回顾我自 2000 年以来在该行业的经验，当时由于资源限制，类似于社交网络的概念似乎是不可能的，这凸显了可行性如何随时间而变化。今天，社交网络无处不在，但在那时，资源需求使得这样的项目变得不可。\n\
  \n在考虑新开发时，评估与交付产品团队构想的解决方案相关的成本至关重要。需要考虑的问题包括：\n\n* 开发成本是多少？\n* 有办法降低这些成本？\n* 你的团队是否拥有执行该项目所需的时间、技能、技术和人员？\n\
  \n如果成本高到可能危及公司稳定性的程度，那么重新考虑或推迟开发工作可能是明智之举。\n\n### 预计投资报报率\n\n在考虑开发新功能时，评估潜在收入是否证明了付出的努力并与公司规模相匹配至关重要。新功能的收入预测必须足够大，以值得投入其中的资源，特别是在规模较大的公司中。\n\
  \n例如，如果一家公司每年产生超过 `$4000 万美元` 的收入，那么引入一个预计在头几年仅带来 `$100,000 美元`的功能可能在财务上是不行通的。我在职业生涯中与其合作过的一位\
  \ CEO 曾强调过这种差异，他拒绝了一个产品团队的提议，因为其对整体收入的影响微乎其微，要求提供更多的贡献以证明使用开发资源的合理性。\n\n这种情况为产品团队提供了关键提醒，要求他们采取以下：\n\
  \n* **评估财务影响**：确保功能的预计收入与公司的财务目标和开发成本一致。\n* **评估对增长的贡献**：考虑该功能是否会对业务增长产生重大贡献。它不仅应该自担成本，还能带来额外价值。\n\
  * **证明开发工作的合理性**：开发成本（包括时间和资源）必须通过功能的潜在收入来平衡。\n\n在规划新功能时，产品团队创建有根据的收入预测以反映该功能对公司的真实价值至关重要。这确保了开发工作在经济上是可行的，在战略上是有益的。\n\
  \n### 获取成本\n\n产品的可扩展性不仅取决于其质量，还取决于营销策略的成本效益。这是一个关键点，特别是考虑到近几年科技行业范围内的大规模裁员，成千上万的开发者亲眼目了不可持续业务模式的后果。\n\
  \n许多公司被迫进行裁员，主要是因为他们无法负担获取客户和维持净正收益所需的高昂营销成本。即使产品设计良好且功能完备，过高的客户获取成本也会耗尽资源，导致企业在烧光投资者资金的情况下产生足够的收入。这一问题导致了许多公司的规模缩减或关闭。\n\
  \n考虑到与获取客户相关的财务压力，产品团队在规划新功能时，评估几个关键问题是关重要的：\n\n\n\n\n*   获取此功能的客户成本将是多少？了解吸引每位客户的营销支出是否与其其将产生的收入相符是至关重要的。\n\
  *   此功能是否增加了客户想要该产品的概率？能够显著增强产品吸引力或满足客户关键需求的功能可以证明较高的初始合理的，因为它们有助于长期的客户留存和满意度。\n\
  *   此功能是否可以提高购买转化并帮助降低获取成本？如果一个新功能可以提高潜在客户向付费客户的转化率，它可能会抵消较高的初始营销费用，并从长远来看证明其财务上的效益。\n\
  \n解决这些问题有助于确保新开发项目符合财务现实并与更广泛的业务目标一致。这种方法鼓励产品团队保持务实的观点，在创新与成本效益之间平衡，以支持可持续增长。\n\n\
  ## 交付的影响\n\n在开发产品时，不仅要评估客户问题的频率和强度，评估解决方案的实际影响也至关重要。问自己以下问题：你的功能将为客户带来什么重大差异？你的功能的影响是巨大的吗？它是完全消除问题还是只部分缓解？解决方案将有效多久？虽然解决频繁出现是有价值的，但确保你的产品具有重大且积极的影响同样重要——即使这意味着在未来长一段时间内完全解决客户的问题。\n\
  \n## 依赖映射\n\n评估开发某个功能是否为时机涉及到考虑你的软件目前是否拥有必要的基础，让用户能够从此新功能中受益。依赖映射对于确保新功能的引入及时且有效至关重要。现在交付此功能的时机对吗？\n\
  \n我见过某些产品表现不佳或缺乏扩展性，但产品团队仍渴望推出下一个`杀手级功能`。这种方法往往导致诸等问题，如 `API`响应缓慢、依赖客户支持团队进行人工干预以及在引导新客户方面的挑战。尽管存在这些障碍，重点仍然放在引入另一个重大功能上。\n\
  \n产品团队这种追求下一个吸引人的功能的倾向很常见，即使基础基础设施还没有稳健到足以支持它。作为开发者，挑战这些假设是有重要的。通过检查功能成功集成的决条件，你可以帮助产品团队意识到首先需要进行某些基础性的改进。这项基础工作确保了当下一个闪亮的功能被引入时，它将真正有效并受到用户的欢迎。\n\
  \n## 隐性问题\n\n这是市场动态中一个迷人的方面，可以在心理健康和职业发展等领域中注意到，在这些领域中，潜在用户可能不会轻易承认他们面临的问题。这种意识的缺乏会显著影响旨在解决这些问题的解决方案的采用和有效性。\n\
  \n当被赋予开发新功能的任务时，深入探能够评估市场意识和接受度的问题是至关重要的：\n\n*   我们有多少潜在客户意识到他们面临着我们软件旨在解决的问题？\n\
  *   我们能多容易地向潜在用户证明我们解决方案的必要性？\n*   我们可以采取哪些策略来帮助他们识别我们解决方案所解决的问题？\n\n通过回答这些问题，你可以更好地评估所提功能的潜在影响和相关性。这种方法不仅有助于开发更有可能被目标受众接受和使用的功能，还增强了产品的整体价值主张。主动理解和解决用户意识可以显著影响你开发工作的成功。\n\
  \n## UX 影响\n\n在畅销产品的世界中，引入过的功能有时会导致客户体验下降。确保新功能易于理解并无缝集成到现有产品中，以维持和增强提供给客户的价值是至关重要的。此外，确保这些功能不会混淆用户或损害整体用户体验也是至关重要的。\n\
  \n要确定新功能请求的有效性，请考虑询问以下问题：\n\n*   添加此功能是否会提高整体客户体验/用户旅程？\n*   客户会意识到新功能的存在吗？它与其他功能和用户旅程集成得良好吗？\n\
  *   这个新功能可能会以任何方式混淆客户吗？\n*   此功能会与任何现有功能冲突吗？\n\n这些问题对于理解新功能是否对客户可用且有利至关重要。\n\n此外，收集良好的指标是有重要的。理想情况下，你的产品应该有收集使用数据的机制。这些数据可以帮助确保随着功能的增加，用户体验不会随时间化。\n\
  \n## 独特性\n\n观察竞争对手的功能并尝试模仿他们的成功确实是产品开发中常见的策略。它通常从分析行业内已存在的内容开始，试图改进或获得优势。然而，这可能导致一个循环，竞争对手由于不断采用相似的功能而变得越来越相似，扼杀了你产品的真正创新和独特性。这也导致市场充斥着相似的产品，最终削减了每个产品的独特价值。\n\
  \n此外，确保你的功能不会被市场上现有的免费工具轻易复制或替换也是重要的。这可能涉及提供更优的功能、更好的用户体验或免费工具未提供的独特服务。\n\n## 优先级排序\n\
  \n我们在上一节中讨论的内容是我过去用来帮助团队确定产品需求优先级的最有效的标准。看到它们都列在一个易于记忆的格式中对我来说非常棒，这样你可以利用它。我花了多年经验才知道在选择开发哪个功能时，这些真的是非常重要的需要解决的问题。\n\
  \n但你应该如何应用这些标准呢？这没有一种通用的方法。每个项目可能面临不同的挑战，取决于情况，某些标准可能比其他标准更相关。然而，帮助你识别要开发的最佳功能的通用方法是确保产品在每项标准上的得分尽可能高。\n\
  \n如果你面临长长的待实现潜在功能列表，尝试根据我们列表上的每个标准对每个功能进行评分。然后，按评分从高到低对列表进行排序。这将为你对客户最重要的内容给出一个粗略估计。\n\
  \n### 比较并优先排序 HomeIt 功能\n\n现在，我们将概述我们 HomeIt 初创公司的一些主要功能，以理解如何更好地对功能进行评分。你可能在这里困惑“分数”是什么，但不要担心；随着我们的进行，你会理解的。我们将使用之前节中列出的标准。记住，这些解释是主观的并开放讨论的。这只是功能评分背后推理类型的一个示例：\n\
  \n*   **房产搜索**：\n\n\n\n\n\n- 针对属性搜索，我的评分如下：愿景：10，市场规模：10，问题频率：10，市场购买力：10，意愿：10，预估成本：10，预期\
  \ ROI：10，获取成本：10，交付影响：10，依赖映射：10，隐性问题：10，UX 影响：10，独特性：1，总分为 121 分。\n- 注意，属性搜索是我们系统的系统的核心，因为每个租客都必须使用它。无论如何，他们都在“搜索”新房。该功能评分低的唯一标准是“独特性”。尽管如此，我们可以想象属性搜索如何以独特的方式运作，从而超越我们的竞争对手。\n\
  \n### 中产经纪人合作\n\n- 针对中产经纪人合作，我的评分如下：愿景：10，市场规模：10，问题频率：3，市场购买力：10，意愿：5，预估成本：5，预期\
  \ ROI：8，获取成本：10，交付影响：6，依赖映射：4，隐性问题：4，UX 影响：6，独特性：10。总分为 91 分。\n- 对于中产经纪人合作，我们得到的总分较低。许多租客和房东实际上并不在乎是否有经纪人，只要他们可以方便地交流（这导致“问题频率”得分较低）。此外，许多人不想与经纪人打交道，这降低了“意愿”分。我们预计，经纪经纪的引入可以帮助系统更具扩展性（有时，房东无法抽空看房，但经纪人可以），从而将“ROI”提高到\
  \ 8。许多人看不到经纪人能提供什么帮助，这使得“隐性问题”分降到了 4。我正在考虑将“依赖”标准降至 4，因为在我们能够向系统引入经纪人之前，许多条件已经需要就绪。\n\
  \n### 消息传递\n\n- 针对消息传递，我的评分如下：愿景：10，市场规模：10，问题频率：10，市场购买力：10，意愿：10，预估成本：10，预期 ROI：10，获取成本：10，交付影响：10，依赖映射：7，隐性问题：10，UX\
  \ 影响：10，独特性：1。总分为 118 分。\n- 当然，每个人都需要沟通，因此消息传递在几乎所有方面都获得了高分，除了“独特性”和“依赖关系”。尽管如此，我们仍然可以思考我们的\
  \ HomeIt 系统中，消息传递可以通过哪些独特的方式进行。\n\n通过查看这些示例评分，我们得到了以下路线图，按评分从高到低排序：\n\n1. **属性搜索**：121\n\
  2. **消息传递**：118\n3. **中产经纪人合作**：91\n\n显而易见，我们在其他功能之前需要搜索功能，因为所有功能都依赖于它。这种方法确保了我们甚至可以将某些功能排除在之外。看到这些评分，请为自己回答这个问题：HomeIt\
  \ 真的需要一个中介功能吗？\n\n通过使用这些按评分排序的功能列表，团队现在可以对未来几个月甚至几年进行预测。一种良好的做法是每季度选择一些要开发的功能。规划季度里程碑可以更容易向所有利益相关者传达产品方向。\n\
  \n在确定了功能优先级并制定了里程碑路线图后，我们现在可以专注于软件建模。到此为止，我们正式完成了对业务需求的处理、组合、按摩、练习、探索和扩展。你现在拥有了我最喜欢的工具，我用此帮助产品团队决定应该开发哪些功能，以及如何以简化软件开发人员工作的方式描述这些功能。\n\
  \n现在让我们进入软件建模的世界。我希望你对接到来感到兴奋！\n\n# 为你的应用程序定义领域和边界\n\n一旦决定了下一个要开发哪个功能，就是时候识别构成你实际系统的构建模块了。这正是我们开始揭示软件建模过程中关键组件的地方。\n\
  \n在本节中，我将演示如何识别你需要编写代码的关键对象，以及如何确定你将实现的各种服务。\n\n## 什么是产品领域（Domains）以及它们为什么重要？\n\n\
  领域（Domain）可以被看作你需要在软件中表达的专业业务知识。换句话说，无论你使用 `Spring` 或你选择的任何其他工具或技术栈构建内容，你都应该这样做，以最好的方式代表你所能接触及的顶尖专家的专业知识。这些人是在市场中你的产品特定领域内真正出类拔萃的人士。\n\
  \n在你的软件中，一个表达良好的领域应该包含两个不可或缺的特性：\n\n- **设计良好的实体（Entities）**：这是一组经过仔细精炼的对象，准确地反映了存在于业务和现实世界的概念或事物。\n\
  - **设计良好的服务（Services）**：这涉及到一个彻底的过程，通过该过程实体可以被处理——创建、在不同的生命周期阶段之间移动，以及其他满足你旨在交付的业务需求的内容。\n\
  \n注意：交付优秀软件的基础在于建模出色的实体和服务。实现这一点的前提条件是拥有编写良好的业务需求。这突显了前两章中讨论的所有工具和技术的关键需求性。请记住，即使是市场上表现最优秀的公司，在他们期望你实现的需求方面也可能存在巨大差距。你需要正确的工具来彻底分析这些需求，确保它们能以最好的方式表述，从而简化实体和服务的提取。\n\
  \n本节总结了参与领域建模最重要的步骤。然而，正如你所预期的，有专门针对该主题的著作。我推荐的一本基础性书籍是 Eric Evans 的 `Domain-Driven\
  \ Design – Tackling Complexity in The Heart of Software`。\n\n现在，让我们识别所需的实体和服务步骤。\n\
  \n## 在用例中检测共同概念并消除冗余\n\n在领域建模过程中，第一步是识别跨用例频繁出现的名词或实质性术语。这些关键术语将形成构建软件的核心词汇。\n\n\
  例如，在我们的 HomeIt 系统中，我们需要通过建模表达的一些关键概念包括：\n\n- 用户、租客、房东和经纪人\n- 租赁房产、租赁提案、租赁协议和合作提案\n\
  - 支付\n- 信誉\n\n衡量概念在软件中重要性的有效方法是观察该特定术语在不同功能请求中出现的频率。这种频率表明了它对系统功能的重要性和中心性。\n\n\n\
  \n\n\n当你遇到像后述那样的歧义时，你需要审查你的文档以确定 `users` 被提到的具体上下文，然后为每种情况指定更精确的术语。这种方法有助于消除困惑，并确保每个术语都能准确反映其在系统中的预期意图。\n\
  \n例如，在我最近参与的一个项目中，有一个术语被用来代表三个截然不同的东西。它指代一个 CMS 平台、一个重要的虚拟服务器，以及第三个我有点不记得的项。当我加入该项目时，关于该术语的讨论让我很困惑，因为它的应用并不一致。起初这种困惑让我感到格格不入，但在进一步提问后，我意识到不同的人在使用相同的名称指代完全不同的元素。问题不在于我的理解，而在于该术语被误用的方式。作为团队的新成员，或者即使是现有成员，澄清并统一所使用的术语也将对项目大有益益。这将帮助大家更有效地沟通，并避免误解。\n\
  \n## 为你的产品设置并定义领域\n\n如果你能有效地从需求文档中消除歧义和冗余，那么识别软件所需的实际领域将变成一个简单的过程。本质上，你只需要列出产品需求中被频繁提到的名词即可。\n\
  \n在此时，我想让你以一种极其简单的方式来思考领域。将每个名词或概念视为一个独立的领域。对于 HomeIt，我们之前提到的每个关键词都将代表一个不同的领域。因此，我们将拥有诸如\
  \ `Tenants` 领域、`Landlords` 领域和 `Rental Proposal` 领域等领域。这种方法简化了领域建模的初始步骤，为进一步开发奠定了清晰的基础。\n\
  \n## 设置领域组成、边界和限制\n\n现在我们已经识别了各个领域，考虑每个领域的边界和组成就变得至关重要。这一阶段更多是哲学层面的而非技术性的，可能会引发广泛的讨论，因为不同的团队成员对这些模型如何结构化可能会有不同的观点。\n\
  \n运用你的批判性思维技巧，你需要定义每个领域的实际职责。这些职责应该基于产品团队使用的语言以及他们如何描述他们的用例。\n\n在上一章中，我们利用工具深入研究了需求，为流程设计了输入和输出。这些输入和输出，以及概念之间的关系，将告诉我们每个领域的组成。对于对于建立清晰的领域边界并确保每个领域在系统内有效发挥其作用至关重要。\n\
  \n例如，在 HomeIt 中，我们发现租赁房产包含了基本信息，如媒体（图片、视频）、地址、房间数量和以平方米为单位面积。此外，租户可能有一个或多个 `Payment\
  \ Information` 对象，假设有人可以使用多种方式支付租赁服务。\n\n理解领域是如何组成的将引导我们到达所需要的精确位置。以下是你在深入研究领域边界时需要回答的四组关键问题：\n\
  \n*   我正在定义哪个领域/概念？这个领域是什么？它起什么什么作用？\n*   这个领域由什么组成？哪组信息构成了这个领域？\n*   这个领域没有考虑到什么？哪些内容应该被排除在该领域之外，是因为它们属于另一个领域，还是因为我们想对它的定义设定某些限制？\n\
  *   这个领域与其他哪些领域相关？哪些其他领域与此领域相互作用？这些关系如何被表达或解释？\n\n为了有效地为 HomeIt 系统中的 `Realtors`\
  \ 领域回答这些问题，我们可以系统地遍历每一个问题：\n\n*   **我正在定义哪个领域/概念？那个领域是什么？它是用来做什么的？**\n    正在被定义的领域是\
  \ `Realtors`。房地产中介是那些通过促进房产租赁来换取佣金的用户。该领域用于管理与房产租赁相关的交互，并在租户和房东之间建立沟通桥梁。\n*   **中介由什么组成？**\n\
  \    中介应该拥有个人联系信息以方便沟通，以及一份他们正在管理的当前租赁提议列表。中介还应该与每个用户（租户、房东）拥有独立的沟通渠道。\n*   **这个领域没有考虑到什么？哪些内容应该被排除在该领域之外，是因为它们属于另一个领域，还是因为我们想对它的定义设定某些限制？**\n\
  \    中介不会直接拥有可用日历，因为该日历是专门针对租赁合同的。然而，由于中介管理这些租赁合同，他们可以通过查看合同获取所有相关的日历。我们还可以通过循环合同提取出一个汇总日历。这种划分防止了\
  \ `Realtors` 领域的混乱，并使其聚焦在主要职责上。\n*   **这个领域与其他哪些领域相关？哪些其他领域与此领域产生关系？这些关系如何被表达或解释？**\n\
  \    中介本质上与租户、房东、合作伙伴协议和租赁房产领域相关：\n    *   他们与租户拥有沟通渠道，用于讨论租赁机会和解决问题\n    *   他们与房东签署合作伙伴协议，授权他们管理房产并代表房东进行交互\n\
  \    *   与租赁房产的关系是通过管理与这些房产相关的租赁提议和合同来实现的\n\n这一讨论为我们如何提议和精炼领域提供了一个视角，这通常是与同事交流的重要组成部分。随着讨论的进行，清晰度得到了提高，使团队能够放心地记录这些领域及其相互关系。\n\
  \n根据你的领域建模结果，某些领域可能会被表示为自己的微服务，而另一些可能会被组合在同一个微服务中。此外，某些领域可能仅作为其他领域的属性。这种结构使我们更接近实际开始编码的过程。\n\
  \n在移动到下一节之前，我邀请你思考我们在 HomeIt 系统中拥领域。除了我列出的之外，你还会增加哪三个领域？你将如何回答关于这些新领域的关键问题？考虑这些问题，在你形成想法后，你就可以进入下一节，在那里我们将精炼属于每个领域的服务。\n\
  \n\n\n\n\n一旦你确定了不同的领域，下一步就是理解这些领域是如何运作的。这涉及到识别领域执行的动词或动作。这是一个至关重要的阶段，我们开始发现与每个领域相关的操作或功能——本质上就是核心服务。理解这些服务是本节的重点，因为它们对于系统如何运行和交互是至关重要的。\n\
  \n## 什么是服务？我们为什么应该考虑它们？\n\n在本章中，我们将服务定义为在特定领域内执行的任何操作或动作。例如，在 HomeIt 系统中`Partnership\
  \ Proposal`（合作伙伴提案）被视为一个领域。在该领域内，可以发生各种操作，例如创建、发送、拒绝或接受提案。这些每项操作都区视为 `Partnership`\
  \ `Proposal` 领域中的一项服务。\n\n理解这些服务至关重要。忽视这些特定的领域操作会导致开发者出现重大的盲点和缺口。我一位明智的同事和朋友经常说：“通过编程的奇迹，一切皆有可能。”然而，我认为，如果我们不清楚自己的领域应该支持的操作，那么这些编程奇迹就不再那么神奇了。\n\
  \n自从 RESTful API 标准引入以来，许多开发者都致力于设计完美的 API。有关构建结构良好的 API 的细节将在稍后的章节中讨论。然而，重要的是要到，许多开发者陷入了仅在\
  \ API 中表示基本对象和资源的陷阱。这里，“基本”指的是最直观的对象，如产品、客户、购物车等。他们通常关注于在 URL 中映射关键的领域资源，因为他们执迷于这种方法。由于没有在\
  \ API 中充分表示操作和动作，他们无意中创建了许多令人困惑的代码，因为这些操作必须通过在基础资源上添加额外逻辑来支持。随着时间的推移，这会变得一团糟。\n\n\
  这种缺乏表达能力的 API 往往无法充分表示系统随时间推移的操作，可能导致代码混乱、参数过载、类臃肿以及过少的端点处理了过多的职责。\n\n忽视服务的设计经常会导致所谓的“意大利面条代码”（spaghetti\
  \ code）。试着吃意大利面条：即使使用叉子，也很难控制和操纵食物。同样，意大利面条代码由于其错综复杂的线条而难以管理，许多职责被挤在少数几个端点和方法中。这种复杂性使得随着时间的推移，你几乎无法清晰地理解和维护自己的代码。\n\
  \n另一方面，通过仔细识别并列出你的领域应该表达的关键操作和动作，你可以更容易地将这些动作划分到代码的不同部分。这种分离允许更好的隔离，使你的代码更易管理。随着我们在随后的章节中开始编写服务，为每个领域建模关键动作的优势将变得显而易见。现在，在本章中，我们的重点将放在理解如何有效记录不同的服务上。\n\
  \n## 如何正确建模和记录领域服务\n\n当对你软件中的领域执行卓越的服务建模工作时，以下四个步骤是必不可少的：\n\n- **基本动作（Basic actions）**：定义你的领域将支持的基础动作。这些通常被称为\
  \ `CRUD`（代表 `Create` 创建、`Read` 读取、`Update` 更新和 `Delete` 删除）。这些操作构成了领域交互的骨干。\n- **特殊动作（Special\
  \ actions）**：识别并记录你的领域除基本 CRUD 操作之外支持的所有特殊动作。这些可能包括特定业务逻辑或领域独特功能的动作。\n- **转向新领域（Actions\
  \ to new domains）**：评估当前领域中的任何动作是否可以作为新的、独立的领域提供更好的服务。这一步涉及评估进一步模块化架构的潜力，以增强可扩展性和可维护性。\n\
  - **输入、过程、业务规则和输出描述（Inputs, processes, business rules, and output descriptions）**：对于每个服务，提供所需输入、涉及的过程、适用的业务规则以及预期输出的详细描述。这些文档对于确保服务实现和集成的清晰性和一致性至关重要。\n\
  \n在下一节中，我们将探索并对 HomeIt 系统的一个功能进行建模：`Partnership` `Proposal` 服务。\n\n### Partnership\
  \ Proposal 服务建模\n\n为了有效地建模 HomeIt 系统中 `Partnership Proposal` 领域内的服务，以下是你应用之前概述的每个步骤的方法：\n\
  \n- **基本动作**：\n    - **创建（Create）**：为了创建合作伙伴提案，输入包括租赁房产 ID、中介人 ID 以及中介人编写的介绍信。由于租赁房产有一个所有者（房东），可以使用房产\
  \ ID 识别所有者。此动作的输出是新创建的 `Partnership Proposal` 领域对象的标识。\n    - **删除（Delete）**：系统将不支持永久删除记录的硬删除，而是实现软删除。此动作在数据库中将提案标记为\
  \ `deleted`，使其在面向客户的界面上不可见，但为了一致性而保留了数据。所需的输入是合作伙伴提案 ID。\n    - **读取（Read）**：此动作使用\
  \ ID 获取合作伙伴提案对象，返回与该 ID 相关的所有相关细节。\n    - **更新（Update）**：更新服务允许更改合作伙伴提案的状态，例如从 `open`（开启）更新为\
  \ `accepted`（接受）或 `rejected`（拒绝）。此动作的输入是新状态和合作伙伴 ID。\n- **特殊动作**：\n    - **发送合作伙伴提案**：假设合作伙伴提案在系统内创建时会自动被\
  \ `sent`（发送），这使其成为创建过程中集的基本操作之一。\n    - **消息服务（Messaging service）**：如果需要一个聊天功能，允许中介人和房东在合作伙伴提案的背景下直接通信，则需要实现一个消息服务。该服务将处理专门与合作伙伴提案相关的消息交换。\n\
  - **转向新领域**：\n    - **将消息作为新领域**：实现消息服务可能需要将消息视为合作伙伴提案中的一个新领域对象。这意味着每条消息都是与特定提案相关的消息列表的一部分。通过将消息定义为新的领域对象，可以直接对每条消息应用基本操作（`CRUD`），反映了参与方之间的动态交互。消息将作为子对象存储在合作伙伴提案领域。\n\
  \n这种方法确保了 `Partnership Proposal` 领域是健壮的，每个服务都有明确的职责，并考虑了如消息等潜在扩展。这种系统化的分解不仅简化了系统的维护，还增强了功能和用户体验。\n\
  \n\n\n\n现在，让我们开始布局系统领域组件以及不同领域随时间演变的交互。\n\n# 绘制你的领域图\n\n所以，情况是这样的：如果你正在处理多个领域，并发现你有许多领域，且追踪开始变得困难，你可能会发现通过视觉化的方式对它们进行映射容易得多。由于我们在第一章中讨论的原因的原因，视觉化表示将加速所有人对你所在领域的理解。\n\
  \n绘制领域图的过程非常简单。你只需要画简单的方框，其中一个领域指向与其有某种关系的另一个领域。创建这种视觉图有多种方法，因此我将提供一个包含我们目前为止讨论过的许多\
  \ HomeIt 领域的示例。`Figure 3.1` 中的图是我之前推荐的同一个免费 `draw.io` 应用创建的。\n\n![Figure 3.1: HomeIt\
  \ domain diagram sample](img/B18632_03_1.jpg)\n\n图 3.1：HomeIt 领域图示例\n\n如你所见，我在箭头上增加了动词，表示每个领域都相对于另一个领域采取行动。这张领域图帮助我们识别我们正在构建的系统中的关键流程，并为我们想要构建的内容提供了更全局的视角。而且，正如你清楚观察到的，我们正在让在单个页面上对整个系统的概念变得容易得多。\n\
  \n从这个领域设计中，我们可以提取微服务、API 合约、类、属性、流程以及我们的 `Spring Framework` 将帮助交付许多其他组件。\n\n注意：我在图中画的虚线箭头是为了更容易追踪租赁提议和租赁物业之间的关系。\n\
  \n我想让你注意此处的另外一点：`Counteroffer`（还价报价）领域是从探索在 `Rental Proposal`（租赁提议）流程期间允许租客和房东协商租赁物业价格的可能性而提取的。这个领域从字面上代表了我们可以提供的一种以促进价格谈判的重要服务，这是现实世界中开展业务的关键部分。此外，此价格谈判功能有助于跟踪合同敲定后我们在付款中看到的金额。\n\
  \n在这个 HomeIt 领域图的示例中，我省略了我们在之前的章节中讨论过的几个领域和用例——例如 `Mediation`（调解）功能。我这样做是为了简化图表，以便我们有一个更简单的示例来查看，并留出一些空间让你练习自己的技能，以提高你的理解。\n\
  \n在进入下一章节之前，我想挑战你来表示其他我刻意遗留的领域。你会如何为这些额外功能设计领域图？\n\n在你考虑了针对 HomeIt 或你感兴趣的任何系统的自己的领域图后，我们将学习如何使用序列图对跨领域和服务的活动随时间演进进行排序。\n\
  \n# 跨服务的活动排序\n\n在深入研究需求之后，我们现在理解了我们的系统看起来是什么样。我们刚刚构建的领域图可以作为我们建模微服务的的基础。然而，一个关键且及时的问题仍然存在。\n\
  \n领域之间是如何随时间相互作用的？此外，我们如何能以最简单的方式表达这些随时间变化的交互，以便所有团队都理解需要构建什么？\n\n## 租赁提议序列图\n\n\
  为了解决这些问题，我们转向序列图。在我担任各种编程角色的经验中，我发现这种图表在解释系统流程如何工作方面特别有效——特别是信息如何从一个服务传递到另一个服务——以及在让团队进行有效协作方面。\n\
  \n为了解释这一点，请看 `Figure 3.2`：\n\n![Figure 3.2: Complete rental flow sequence diagram](img/B18632_03_2.jpg)\n\
  \n图 3.2：完整的租赁流程序列图\n\n此序列图说明了 HomeIt 核心系统是如何运作的。重要的是，我们在图表的两侧表示了不同的参与者：左侧是租客，右侧是房东和房产经纪人。\n\
  \n注意，这些参与者之间的交互并不涉及从一个人到另一个人的直接通信。相反，箭头只指向领域，证明交互是通过系统的结构化领域发生的。这种设计确保了领域能够促进并反映现实世界的场景。例如，一个租客搜索物业、与房东协商要约并使用他们的银行账户处理付款，是一个自然的过程。这种系统设置实现了清晰且结构化的交互，镜像了房地产交易中涉及的实际步骤。\n\
  \n在这张图中，我高亮了三个关键领域：`Rental Properties`（租赁物业）、`Rental Proposal`（租赁提议）和 `Payments`（付款）。这些领域有效地说明了系统内部的搜索、谈判和付款流程。\n\
  \n每个序列图的结构都设计成能够清晰地显示动作发生的顺序，随着时间从上到下随箭头进展。这种设置使得理解服务如何交换消息变得非常容易。\n\n\n\n\n要构建类似的图表，你可以使用\
  \ [plantuml.com](http://plantuml.com) 提供的免费在线应用程序。该工具允许你通过编写简单的脚本来快速生成序列图（或其他类型的图表）。为了开始，你可以参考我渲染之前讨论的序列图时使用的脚本。你可以在这里找到该脚本：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-03/sequence-diagram-sample.txt`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-03/sequence-diagram-sample.txt)。\n\
  \n要重新创建我们讨论的序列图，你只需将提供的代码复制并粘贴到 [plantuml.com](http://plantuml.com) 的文本区域即可。这个在线工具将根据你输入的脚本渲染序列图。\n\
  \nPlantUML 还能绘制其他类型的图表。但我今天只用它来绘制序列图。互联网上有大量的教程可以教你如何探索这个神奇且免费的工具的其他功能。\n\n# 总结\n\
  \n在本章中，我们涵盖了如何有效地对功能进行优先级排序以制定路线图，以及如何识别和表达表达软件精髓必需的领域。理解和定义这些领域至关重要，它们充当了健壮的需求与成功开发优秀软件之间的桥梁。一位富有洞察力的工程师曾向我强调，在软件开发中花费大量时间讨论命名规范的重要性，因为这些名称从根本上塑造了我们功能和系统的结果。正确的命名可以显著促进软件的成功构建。\n\
  \n此外，我们还处理了跨领域活动排序的关键步骤，以为我们的用例建立一个完整的流程。这种排序更清楚地揭示了哪些系统和服务需要被实现，从而增强了我们的理解和规划过程。\n\
  \n在进入下一章之前，我鼓励你练习所讨论的概念。你可以选择将这些策略应用于我们 HomeIt 系统示例中的某些用例，或者尝试对你目前正在工作的系统进行功能排序、领域识别和序列图绘制。\n\
  \n在彻底处理了业务需求后，我希望你期待进入下一章。在下一章中，我将介绍一种全面的方法来选择技术和 Spring 项目来构建我们的软件，以满足我们指定的特定。这将涉及深入`非功能需求`（`NFRs`）的世界，并探索它们如何影响技术选择和系统的架构。\n\
  \n# 4\n\n# 为你的领域定义服务\n\n我非常期待这一章。在这里，你将进入技术需求的世界，或者更准确地说，非功能需求的世界。我们将对你想要实现的系统技术质量进行深度分析。这对于确保你的应用程序能够生存并保持在线至关重要。\n\
  \n本章是关于对系统的技术方面进行思考的介绍。我们将在未来的章节中在编写不同服务的代码时进一步深入探讨这一主题。以下是我们在本章中将涵盖的内容：\n\n* 什么是非功能需求？\n\
  * 为什么我们需要非功能需求？\n* 用户处理\n* 基础 I/O 和数据维护问题\n* 处理\n* 测试\n* AI、数据工程和分析\n* 灾难恢复\n* 协议\n\
  \n正如我们将看到的，非功能需求是业务需求的好朋友。它们是我们为正在开发的系统所需要实现的功能和流程的骨干。没有非功能需求，系统的结果和性能大部分是不可预测的。\n\
  \n# 理解非功能需求\n\n到目前为止，我们在业务需求领域讨论的所有内容都被视为功能性需求——即在代码中表示的业务功能。此类业务功能是公司需要执行的特定日常流程。在\
  \ HomeIt 示例中，功能性需求与属性搜索、收集支付信息以及允许各方之间发送提案有关。这些都是日常的业务事务。\n\n相反，存在`非功能需求`。也就是说，你需要在软件中整合的功能，使得功能性或业务需求能够随着推移而持续，并且所有用户都能从你的软件中受益。\n\
  \n可以这样考虑：一个需求是在支付中选择支持 Visa 信用卡。另一个需求是确保你的软件每分钟支持多达一千笔信用卡支付。这些是来自不同层的需求。\n\n支持信用卡支付是你软件的一个功能性部分。确保你可以同时处理大量支付是你的软件的非功能或支持性方面。\n\
  \n现在，你可能会问自己这个问题：我们为什么需要非功能需求？许多大型企业实际上对非功能需求的考虑得不多或不够彻底。也就是说，他们过于关注业务流程，而没有确保系统能够支持各种挑战性情况。例如，网站用户数量的激增可能会使其完全停止工作。你想确保你的系统在重负载下能够运行。你的软件不能失败。或者，如果它失败了，你希望确保它能够在不产生数据不一致的情况下进行恢复。\n\
  \n在接下来的章节中，我们将讨论非功能需求的各个方面。我将为你许多在设计软件时可以提的极佳问题。我通过多年软件开发收集的极佳问题个人宝库。我经常回来看它，以确保我正在工作的系统对于我们需要经历的情况具有了正确的支持。\n\
  \n请记住，这些问题中的许多在本章中只解释了一半。这些是我们将在书的剩余部分中回来探索的问题。本章将成为你一次性找到大量丰富问题的首选之地。然而，具体的细节将在所有未来的章节中进行探讨。有很多内容要说，让我们开始吧。\n\
  \n# 处理用户需求\n\n当我们开始构建一个系统或系统中的某个功能时，思考如何处理我们的用户是非常重要的。这些问题中的许多（例如系统中将存在的用户类型）已经在之前的章节中处理过了。以下是关于用户处理的其他问题：\n\
  \n* 完美的用户旅程是怎样的？\n* 是否存在用户“级别”、“类型”，或两者兼有？\n* 我们的系统中有人类用户吗？\n* 我们有其他系统作为客户端/用户吗？\n\
  * 如何进行每个用户的入驻？\n* 如何授权其他系统访问不同的系统功能？\n* 人类用户如何处理身份验证和授权？\n* 用户将使用什么种设备，它们将如何限制或开启用户体验？\n\
  * 每个用户可以正确处理的数据格式是什么？我们需要向这些用户显示的数据格式是什么？\n\n\n\n\n\n*   哪些重要的用户操作需要输入到 BI 系统（如转化数据），以及为什么？你将如何对用户数据进行匿名化，以达到\
  \ `GDPR` 等数据合标准（它要求完全保护用户的个人信息）？如果你的系统需要个人信息，用户将如何同意使用此类数据？你将如何避免组织中的任何人员（从开发到运营、营销等）滥用用户的个人信息？\n\
  *   如何向用户提供最佳的前端服务？通过浏览器、客户端还是移动应用？\n*   是否有必要在用户之间或用户与系统之间保持实时、活动连接？\n\n让我们通过 HomeIt\
  \ 项目来探索并尝试回答这些问题。在阅读这些问题后，我们可以感觉到，这是一个思考移动端体验的好机会，用户可以使用 `GPS` 附近的房产。如果用户处于桌面环境并偏好使用\
  \ `Excel` 等其他类似软件对房产进行筛选，以 `CSV` 格式提供搜索结果可能是一个聪明的主意。使用 `OAuth 2.0` 协议为不同的用户提供访问/权限可能是一个好主意。也许我们想为其他开发者启用\
  \ `API` 访问，以便他们从我们的网站获取数据。我们可能希望以某种方式跟踪和记录支付操作，以便更容易发现是否存在欺诈尝试。\n\n通过深入思考这些问题，我们还可以想到无数其他事情。你还能想到哪些其他非功能性方面？\n\
  \n现在，让我们谈谈如何处理数据。\n\n## I/O 和数据维护需求\n\n这是我们思考如何处理系统中的数据的地方。因此，取决于你正在构建的功能，你将希望逐序考虑这些问题，以便更好地思考我们面临着哪些技术问题以及如何在我们的软件中解决它们。以下是你应该解决的关键问题：\n\
  \n*   预期的输入和输出是什么？例如，在 `HomeIt` 中，注册租赁房产我们需要哪些图像作为输入，处理完媒体文件后的输出格式是什么？\n*   将使用哪些数据类型？我们预计接收\
  \ `PNG`、`JPG` 还是视频？在我们系统的每个重要过程中，我们预计接收什么类型的数据？\n*   数据需要进行地理标记吗？\n*   你有多少个不同的实体或业务对象？\n\
  *   使用了什么数据结构？例如，在我们的租赁房产搜索功能中，从后端向前端返回什么数据？是列表还是映射（map）？考虑到搜索功能的需求，最佳的数据结构是什么？\n\
  *   我们是否以自动方式生成组合或排列？例如，如果我们以自动方式为租赁房产生成 ID，我们生成数据的方式是否正确？或者我们的算法在为房东注册的每个房产创建唯一\
  \ ID 时会失败？\n*   数据的宇宙规模有多大，或者将占用多少空间？我们是否能为用例生成所需的任意组合？我们的数据空间是太受限还是太大了？例如，为了识别租赁房产，我们如何为每一个房产创建\
  \ ID？我们的 `ID` 系统是否允许我们长期生成系统所需的数量的 ID？或者，我们是否受到所选数据类型大小的限制？\n*   我们的数据需要什么程度的精度？\n\
  *   我们是否有可以接受的误差允许范围？\n*   需要保留的是事务性数据吗？\n*   数据需要立即保持 100% 的一致性吗？或者，我们是否接受创建不一致的数据，稍后通过其他进程进行排序，一致性可能可以在流程的下游稍后解决？\n\
  *   应该使用哪种 I/O 通道？你的函数需要网络访问吗？你是否需要在数据库或硬盘中加载或存储数据？你是否有内存密集型应用程序或用例？\n*   我们会持久化数据吗？将使用哪种持久化存储？\n\
  *   要求的每秒输入/输出次数 (`IOPS`)、存储容量、耐用性和延迟（我们能负担起等待系统响应的时间是多少）是多少？\n*   持久化数据将使用文件系统还是数据库？在文件系统的情况下，我们应该选择哪种持久化存储？\n\
  \    *   我们应该选择实例存储（instance store）吗？这是你托管应用程序的服务器硬盘；此选项通常有最大限制（它被视为临时存储类型，但速度很快）。\n\
  \    *   应该是块存储（block storage）吗？即网络中的持久化硬盘，它很快，但仅供一台计算机使用；某些网络文件系统（你不需要太担心最大大小，它没那么快，但可以连接到多台计算机上）。\n\
  \    *   或者，应该是对象存储，例如 `Amazon S3` 以及云供应商提供的其他类似产品，它具有极强的可扩展性？\n*   文件是否存在并发访问或写入？\n\
  *   将使用哪种协议来传输/接收数据？你需要传输控制协议 (`TCP`)、用户数据数据报协议 (`UDP`)、`FTP`、`HTTP` 还是 `GraphQL`\
  \ 吗？\n*   需要全文搜索吗？\n*   系统中存在哪些排序/查询模式？例如，在 `HomeIt` 中，预计将针对 `ZIP code` 或街道名进行优化。取决于预期的用户行为，按地理位置（通过\
  \ `ZIP code`）对系统租赁房产进行排序可能很有。\n*   将使用哪些数据表示？是 `XML`、`JSON`、`Avro`、Protocol Buffers\
  \ (`Protobuf`)、二进制格式、表格还是文件？\n*   哪种协议支持数据大小和通信需求？\n*   存储或传输信息是否需要优化？我们需要处理不同的文件分辨率、文件类型等？\n\
  *   是否需要修剪、存活时间 (`TTL`) 或数据清洗？\n*   数据在传输过程中或存储时需要加密吗？\n*   是否需要数据分片（sharding）？供参考，请查看：\n\
  \    *   垂直分片是不同服务器上的不同表。\n    *   水平分片是分布在不同服务器上的同一表，按属性值分离。\n*   数据是频繁访问还是不经常访问，或者是大部分不访问的归档数据？如果是归档数据，我们应该多快地访问它？\n\
  *   数据需要保留多久？是否有具有不同时间持久化要求的数据类别？\n*   数据需要掩码吗？我们是否有需要向某些用户隐藏的个人身份信息 (`PII`)？\n\
  *   异步处理可以提高速度吗？\n*   该服务需要数据分页吗？\n*   数据包在传输中可能会丢失吗（通过使用 `UDP`，它更适用于进行流媒体，你可以丢失一些数据包而不会对视频、音频等质量产生显著影响），或者是否需要高一致性（这是\
  \ `TCP/HTTP` 的情况，即在传输信息时你不能丢失任何字节）？\n\n\n\n\n再次，这里还有很多问题。让我们回答几个与我们 Homelt 示例相关的问题。假设我们正在对房产搜索功能进行分析。在这种情况下，我们肯定需要分页功能，而且是的，我们确实拥有识别房东的\
  \ PII（个人身份信息）。也许我们想向随机的、未注册的用户隐藏房东信息？这是一种可能。搜索功能需要返回准确的数据，因此我们将使用 `TCP` 作为数据传输协议。我们还需要为搜索提供排序功能。如果我们发现数据库中有大量数据，我们需要对搜索功能进行优化，以缩短响应时间。我们希望实现快速的搜索。\n\
  \n在房产注册过程中，我们同时发送文本数据和图像。我们必须考虑如何支付图像存储的费用。我们可以假设将求助于 `S3` 桶来存储所有图像，因为这种云资源非常适合处理此类数据。然而，我们必须对将存储多少数据以及随着时间推移产生的费用进行彻底研究。\n\
  \n考虑到由于我们允许用户上传媒体资源，每处租赁房产都会占用大量的存储空间，那么支付费用的最佳方法是什么？我们应该假设每个用户都可以上传任意数量的图片，并在我们帮助房东出租房产时通过服务费来涵盖这些费用吗？如果是这样，媒体存储空间就是我们基础设施成本的重要组成部分。\n\
  \n在你处理数据存储问题时，有很多非常好的见解可以与产品团队一起研究，使你的服务更适用于你当前的用例。在考虑数据处理需求时，你还能想到哪些非功能性方面？\n\n\
  在讨论完数据之后，让我们快速看看存储数据的其他方面。\n\n## 探索规模需求\n\n根据你将使用的数据结构和类型，创建的数据字节大小是多少？单个对象在内存中占用多少字节？一个包含大量对象的列表需要多少字节？这些都是评估的重要事项。\n\
  \n- 随着时间的推移会出现多少对象，对象数量的增长计划是什么？\n- 随着时间的推移存储这些对象需要多少磁盘空间？\n- 管理查询以及你需要实现的不同数据处理能力需要多少\
  \ RAM？\n\n根据你的用例，由于信息字节大小的不同，将推荐不同的算法。例如，如果你实现一个需要查询一组租赁房产的功能，你需要评估同时能向内存中加载多少个对象。理想情况下，如果你需要从数据库加载成千上万甚至几十万个对象，你可能希望使用流（streams）而不是整个集合（collections）来管理这些对象，因为集合会同时在内存中加载所有对象，而流就像循环遍历对象一样，在你操作它们时逐个加载和丢弃。\n\
  \n## 存储类型\n\n以下是在处理不同类型数据时，你可能想要考虑的几个方面：\n\n- **SQL 数据库（实时交易数据）**：首先，如果你处理重要的实时交易数据，并且需要它们完全一致，你将希望使用\
  \ SQL 数据库（`Oracle`、`SQL Server`、`Postgres`、`MySQL` 等）。例如，如果你正在编写处理金钱的功能（如支付系统和任何形式的货币交换），或者你需要保留某些产品库存记录，就应该使用\
  \ SQL 数据库。也许你只是想在一个安全且一致的地方存储用户数据。这些都是 SQL 数据库的优秀用例，因为它们在正确运行时可以强制数据和事务一致性。\n- **NoSQL\
  \ 数据库**：如果你处理的是非结构化数据（经典的例子是电子商务目录中的产品信息），或者你处理的是形成没有完全强制格式的实体的文本数据，那么 `NoSQL` 数据库（如\
  \ `MongoDB`）将非常好。NoSQL 数据库对数据访问的限制通常较少，这意味着它们可能比 SQL 数据库更快（尽管这在所有情况下并不如此）。其他的 NoSQL\
  \ 示例还有 `Couchbase`、`Cassandra`、`DynamoDB` 等。\n- **二进制文件**：在处理文件本身时，最好使用类似 `Amazon-S3`\
  \ 服务，它允许你使用 `HTTP` 请求存储和检索单个文件。对于二进制大对象（blob）、静态文件和媒体（图像、视频），你可能还会考虑使用安全文件传输协议（`SFTP`）或网络文件系统（`NFS`）；当文件非常大时，你不需要在网站中直接暴露它们，但你需要像访问普通文件系统一样访问它们。你需要为合作伙伴提供大文件吗？也许一个\
  \ `SFTP` 就足够了，它允许对目录进行加密访问，该目录可以被远程映射并表现得像本地硬盘目录。你是否仅仅需要你的服务访问某些大文件，并希望有一个特定的文件系统来管理这些大对象，就像它们是你服务的本地目录一样？那么，你可能需要一个使用\
  \ `NFS` 的共享文件系统。\n- **内容分发网络 (CDN)**：在处理静态文件时，如果你需要以极低模式交付给用户——换句话说，如果你需要为用户提供极快的检索时间，特别是当他们使用浏览器或移动端应用时——你应该考虑使用\
  \ `CDN`。它会将你系统静态文件的缓存版本在地理上靠近你的用户。CDN 通常用于加速网站资源的检索，如图像、视频、字体、静态 HTML 页面等。\n- **文本搜索**：如果你需要为你的网站提供特定的搜索功能，那么使用\
  \ `Elasticsearch` 将不会出错。请记住，`Postgres` 也具有很强大的搜索能力（实际上，`Postgres` 在数据存储和管理方面有很多用例）。\n\
  - **快速且高可用数据**：如果你需要一组消费速度非常快的数据，并且你拥有具有简单查询的简单表，你可能希望使用 `Cassandra` 作为你的数据库。它在实现数据高可用方面也具有非常特殊的能力。我曾看到\
  \ `Cassandra` 被有效地存储用户 Cookie 和凭据哈希值，使得验证用户操作时检索这些数据是非常快速的操作。对于更简单的数据结构提供相同快速检索性的另一种方案是使用\
  \ `DynamDB`，这是来自 `AWS` 的云服务。\n- **事件中心**：如果你需要为你的事件选择一个存储系统，有很多很棒的替代方案：你要么选择 `Apache\
  \ Kafka`（市场上的明显选择）或来自 `AWS` 的云服务，例如 `Kinesis`。尽管它们的属性不同且用途不同，但它们都用于为你的系统提供实时处理能力。\n\
  - **移动端数据存储**：如果你为移动设备需要数据存储，你可以考虑选择 `SQLite` 或 `Realm` 作为优秀的解决方案。它们在硬件受限的设备上具有卓越的功能。\n\
  \n\n\n\n- **分析 (Analytics)**：当你考虑分析类数据存储时，你需要思考一下你的用例。如果你有非常大的数据集并希望以并行进行批处理，可以选择\
  \ `Hadoop`。如果你真正想要的是数据流的极快处理速度，那么你需要 `Apache Spark`。如果你只是想要一个可以存储大量数据集用于生成报告的数据仓库，你可能希望使用类似\
  \ `Snowflake` 的工具。正如你所看到的，该领域还有其他非常好的选择，但它们大多针对特定的使用场景进行了微调。\n\n- **地理空间数据库 (Geospatial\
  \ Databases)**：如果你想在应用程序中存储地理数据，这意味着你的数据库需要支持特殊的地理数据类型。大多数主流 SQL 供应商已经支持它们。`Oracle`、`MS\
  \ SQL Server` 甚至 `Postgres` 都为这些特殊数据类型提供了支持。\n\n- **图数据库 (Graph databases)**：假设你想将数据表示为网络或图。一个经典的例子是社交网络，在其中人们会关注其他人。为了在存储中表示这类数据，可以使用特殊的图数据库。两个例子是\
  \ `Neptune` 和 `Neo4J`。图数据库使得搜索操作和关系导航变得快得多，因为关系本身就表示在存储中。相比之下，SQL 数据库通常会慢一些，因为关系是通过外键表示的，需要在查询期间进行计算。图数据库在原级数据库结构中维护关系的表示。\n\
  \n- **缓存 (Caching)**：如果你需要以极快的检索时间存储和访问简单的数据结构，并且你不太在意这些数据的实际持久化，你可以选择内存数据库，例如 `Redis`\
  \ 和 `Memcache`。尽管它们的功能不同（`Redis` 提供数据持久化并支持更复杂的数据结构），但它们的作用相同。通常，这两个数据库都用于持久化存储之前，通过创建临时数据缓存来加速数据检索。\n\
  \n- **时序数据 (Time Series Data)**：当你的信息对时间敏感——换句话说，如果优化时间排序数据会对你的用例产生影响——你可以选择我们所谓的时序数据库。`InfluxDB`\
  \ 就是这种用例的示例。它让按时间排序的数据检索快得多，并且能以时间敏感的方式对数据进行切片。时序数据库还针对写入进行了优化，其数据采集速度快得多。这听起来没什么，但请考虑报告类的用例，例如：如果你想实时绘制图表并在图表上显示事件，时序数据库将是最佳选择。另一种处理时序数据的优秀技术是\
  \ `Prometheus`。这种情况的特殊之处在于，该数据库可以随时间从源拉取数据并帮助为指标创建报警。这使得 `Prometheus` 监控系统的绝佳选择。\n\
  \n- **聚合日志 (Aggregated Logging)**：具有搜索能力的数据库的一个特殊案例是日志聚合器。在过去，当单体应用是常态时，应用程序只有一个巨大的日志文件是常见情况，排查问题无非是登录服务器并过滤异常文件。那是单体架构的时代了。今天，微服务已非常常见；我们有几十个包含许多小型应用程序的容器。在这种情况下该怎么办？我们如何排查应用程序的问题？这就是日志聚合器。诸如\
  \ `Sumo Logic`、`Datadog` 和 `Splunk` 等技术是特殊的数据库，用于聚合和索引来自各种服务及其相应 pod/容器的日志。它们使得跨越几十个微服务实例查询日志变得非常简单。\n\
  \n现在我们已经讨论了许多数据存储，让我们学习如何处理我们的数据。\n\n# 数据处理的需求 (Requirements for data processing)\n\
  \n除了用户和数据处理外，我们还需要考虑如何处理正在存储和表示的数据。这些是我在处理系统设计和编程时，反复用来思考数据处理事项的问题：\n\n- 使用什么算法可以快速解决问题？\n\
  - 你的远程客户端系统需要什么样的延迟或响应时间？\n- 地理位置接近是否相关？\n- 数据状态有哪些？\n- 它的生命周期是什么？对象是如何创建的？它如何随时间存活？它是如何消失的？\n\
  - 是否允许信息延迟？\n- 是否需要高可用？\n- 你需要哪种可扩展性？应该是以下哪一种？\n    - **水平扩展 (Horizontal)**：是否由多台服务器处理你的请求？\n\
  \    - **纵向扩展 (Vertical)**：你是否应该升级服务器硬件以处理更重的负载？\n- 弹性能力（Resiliency）如何？你是否需要服务在架构某处发生故障时继续提供服务？你是否需要实现容错，例如让你的应用程序能够在不丢失重要数据的情况下从故障中恢复？\n\
  - 你的预期**吞吐量 (TP)** 是多少？你预计每秒处理多少次请求？你需要处理多少次读取和写入尝试？每秒输入或输出的字节数是多少？这些 `TP` 会在一天/一周/一月/一年中变化吗，意味着在特定时间会有更多操作？\n\
  - 是否存在单点故障？\n- 此时有多少并发用户？\n- 可能的瓶颈有哪些，你如何解决它们？\n- 是否允许或需要任何延迟操作？\n- 你的系统是否需要任何周期性操作？你是否需要每天运行批作业来合并数据？你是否需要定期计划将数据导出到其他系统？你是否需要转换数据并发送到其他系统，例如数据仓库？\n\
  - 是否需要批量数据操作？你是否需要任何一次性处理大量数据的系统？例如，假设在 `HomeIt` 中，你将所有属性的媒体添加到队列中，然后每小时由单个进程遍历整个队列并一次处理整批媒体，为网站的不同部分生成不同尺寸的优化图片。\n\
  \n\n\n\n通过使用这些处理问题来思考我们的 HomeIt 系统，我们可以得出一些有趣的点。例如，当我们考虑租源物业媒体时，很可能我们需要提供快速的计算时间，以便从用户的原始图像创建缩略图。我们还需要确保能够从图像处理失败中恢复。在考虑系统负载负载较重的时间段时，我们可以认为上午\
  \ 9 点到下午 5 点是最忙碌的时段。在这种情况下，我们可能应该部署一些基础设施，能够根据一天中不同的时间进行扩容和缩容，以处理更重或更轻的负载。我们需要一个能够同时为多个用户进行图像处理的集群。但我们想要同时服务多少个用户呢？我们绝不希望图像处理服务成为瓶颈。否则，当多个房东尝试同时注册他们的租源物业时，我们将面临大量的延迟和错误。\n\
  \n在回顾本节中的不同问题时，HomeIt 系统的其他哪些方面引起了你的注意？\n\n在下一节中，我们将查看几个重要的测试问题。\n\n# 测试需求\n\n我们将在本书中涉及测试。不过，首先让我们考虑以下问题，这些问题将帮助我们理解如何为应用程序设计测试方案。以下是这些问题：\n\
  \n* 你的功能将如何被测试？\n* 系统的不同部分是否需要不同类型的测试？\n* 我们想进行多少程度的单元测试？\n* 我们想进行多少程度的集成测试？\n*\
  \ 我们会有行为测试或 UI 测试吗？\n* 这种设计选择的副作用是什么？按照我们现在的方式选择程序结构会产生意外之外的后果吗？如果有副作用，它们是理想的还是完全不可接受的？\n\
  \n为了通过一个良好的场景进行简单探索，我们可以假设 HomeIt 系统将同时拥有单元测试和集成测试。UI 测试不是本书的主题，因为我们主要讨论的是使用 `Spring\
  \ 6` 的后端软件开发。\n\n# AI、数据工程和分析需求\n\n对于数据分析我有几个关键问题。它们有助于引导我们对数据的关注关注。本书将会有章节专门介绍使用\
  \ `Spring 6` 的数据分析技术，但如果你真的想深入了解如何处理数据，你应该寻找更多参考文献。以下是主要问题：\n\n* 这些系统中需要哪些类型的报告和分析？\n\
  * 我们需要跟踪的关键业务性能指标是什么？\n* 我们能从当前数据中提取那些`关键性能指标` (`KPIs`) 吗？\n* 我们能根据当前的数据设计预测那些 `KPIs`\
  \ 吗？\n* 是否需要 ETL（提取、转换、加载）？我们将如何构建提取、转换和数据加载？\n* 该产品中需要机器学习吗？我们需要任何数据标记/分类系统吗？\n\
  * 我们需要使用任何回归技术吗？\n* 我们需要在某些地方使用生成式 AI 吗？\n\n出于多个原因，数据分析对企业来说是一个至关的话。如果我们考虑到 HomeIt\
  \ 初创公司，我们可以规划仪表板来显示每日收入。我们还可以报告关闭/被拒绝的提案数量。我们还可以显示每个提案中平均创建的反报价数量。此外，我们还可以报告在网站上注册的用户数量（甚至可以在分析仪表板中对不同类型的用户进行分类）。\n\
  \n另一方面，我们可以根据物业描述的内容自动创建易用的标签来过滤物业。我们还可以使用生成式 AI 帮助房东改进描述，例如纠正文本、创建更具吸引力的描述等。当然，为了构建仪表板，我们需要考虑需要部署哪些技术以在\
  \ ETL 系统上获得卓越的性能。我们还可以通过机器学习对重要的用户尝试做出反应，建立实时欺诈检测系统。\n\n报告和数据分析的可能性是无尽的。\n\n# 灾难恢复能力\n\
  \n另一个需要考虑的系统关键方面——这是一个许多公司会忽略的要点——是考虑灾难恢复能力。假设你的公司大楼失火了。你能够保持所有关键系统的运行吗？如果黑客成功入侵了你的服务器，你将如何关闭他们的访问并让系统恢复正常运行？你执行此类操作有多快？这里是更多帮助你进行评估的问题：\n\
  \n* 备份的频率是多少？\n* 从数据丢失到上一次备份点可以容忍多久？\n* 将保留多少次备份事件？\n* 备份数据是如何存储的？\n* 是否会有备份冗余？\n\
  * 谁有权访问备份？\n* 灾难后的目标恢复时间是多少？\n* 容忍多少停机时间？\n* 恢复过程将如何进行？什么会触发它？\n* 将使用哪些地理区域来防止灾难？\n\
  * 将使用哪种策略？是备份/恢复、试点灯（pilot light），还是热备/多站点（hotsite/multisite）？\n\n在我们的家庭 IT 系统中，有一些可以做的简单事情，例如为数据库每日备份选择策略。事实上，有一些云供应商提供了这些功能。保留窗口也是另一个需要考虑的重要事项。例如，我们可以定义每天进行一次数据库快照。此外，保留窗口可以是整一周。这样，我们就一直拥有最后七个快照。\n\
  \n根据损害的大小和你你想要考虑的恢复能力，我们可以设置不同的策略来允许更快或更慢的恢复。例如，如果你希望为你的应用程序准备一个完全运行的数据库副本以便连接（以防主数据库实例故障），那么你需要为该额外实例付费，并配置你的系统，使所有写入操作实时应用到灾难恢复数据库中。也就是说，有很多不同的可能的配置和设计可以可以使用。\n\
  \n在下一节中，我们将讨论用于实现应用程序通信的不同协议。\n\n# 选择协议\n\n在过去的几节中，我们讨论了存储、处理、数据格式、用户如何入驻等。现在，我们需要关注如何传输对象。我们将选择哪些协议在服务之间交换数据？\n\
  \n\n\n\n- **gRPC**: 如果你正在寻找一种比 REST 更精简且吞吐量更高的协议，gRPC 是一个强力的替代方案。它使用 `HTTP/2` 进行传输，使用\
  \ `Protobuf` 进行高效的数据序列化，提供了低延迟和双向流支持。gRPC 适用于高可用、高性能的应用程序，特别是在事件驱动架构中。\n- **WebSockets\
  \ / WebRTC**: WebSockets 在单个 `TCP` 连接上提供全双工通信通道，允许客户端和服务器之间的实时数据传输。它们实现了高效、持久的连接，是聊天应用程序、实时数据馈和协作工具的理想选择。\n\
  - **Web 实时通信 (WebRTC)**: 这是一个协议套，允许 Web 浏览器或应用程序之间直接进行点对点的音频、视频和数据共享。它驱动了视频会议和文件共享等应用功能，提供了无需中介的低延迟通信。\n\
  - **GraphQL**: GraphQL 是由 Facebook 开发的一种用于 API 的查询语言和运行时，提供了一种灵活、高效的数据检索方法。GraphQL\
  \ 允许客户端精确请求它们需要的数据，减少过度获取或获取不足。它以基于模式的强类型结构组织数据，允许客户端在单个请求中查询多个资源。它还支持通过订阅处理实时数据，并允许开发者精确构建\
  \ API 响应以匹配前端需求。\n\n如你所见，在不同服务之间实现数据交换有许多不同的方法。\n\n# 总结\n\n在本章中，我们概述了在设计应用程序时需要考虑的各个技术方面。本章并不应该是你深入研究技术要求的唯一资源。做出此类决策通常需要一个由不同专专家组成的完整团队。\n\
  \n当你身处大公司时，许多决策可能已经由别人为你做好了。然而，了解如何发起讨论、理解目前存在哪些假设，以及这些假设如何影响整体应用程序性能至关重要。通过本指南，你可能会更有效地提出好问题，并暴露你所工作系统中的风险和弱点。\n\
  \n为了交付出色的系统，你还需要深思考软件开发的其他方面。目前来说，这是一个非常棒的起点。以下是一个我经常回阅的检查清单，它帮助我评估了许多应用程序并发现了改进机会。\n\
  \n在思考你的系统时，你应该考虑以下问题：\n\n- 你将如何处理用户？\n- 你将如何表示应用程序数据？\n- 你将如何处理应用程序数据？\n- 你将如何存储数据？\n\
  - 你将如何传输数据？\n\n考虑到这些方面和分析，我们终于可以开始理解 Spring 如何帮助你构建此类系统。在下一章中，我们将深入 Spring Framework\
  \ 编码。让我们讨论服务设计和编程。\n\n# 第 2 部分：设计出色的 Spring 服务\n\n在打下坚实的基础上，是时候开始编码了。这部分涵盖了使用 Spring\
  \ Framework 将需求转换为结构良好的 API 和服务的过程。我们将定义 REST API、实现服务层、管理依赖，并确保我们的服务与数据库及外部系统进行有效通信。\n\
  \n本部分包含以下章节：\n\n- *第 5 章, *编写你的服务 – 使用 Spring Framework 引入 REST API*\n- *第 6 章,\
  \ *将业务需求转换为设计良好的 Spring API*\n- *第 7 章, *处理数据并演进你的微服务*\n\n# 5\n\n# 编写你的服务 – 使用 Spring\
  \ Framework 引入 REST API\n\n我们终于准备好开始编码了！本章提供了我们在之前章节中所做的所有产品和系统分析，与将这些想法转化为稳健的 Spring\
  \ 服务之间的联系。\n\n这些是我们在本章中将涵盖的主题：\n\n- 从领域设计到编程\n- 引入 HTTP 协议\n- 编写你的第一个 Spring 应用\n\
  - 设计你的 API 服务\n- Spring 应用在内部是如何运行的\n- 在 Spring 中创建 RESTful API\n\n某些章节对于经验较丰富的开发者来说可能像是一次复习。如果你愿意，可以跳过那些回顾某些\
  \ HTTP 基础知识的章节。\n\n在回顾了理解协议工作原理所需的重要 HTTP 知识后，我们将向你介绍 Spring Bean 的内部世界，以及框架如何为你处理关键对象。然后，我们将转向如何使用\
  \ Spring Web 项目编写良好的控制器，这使得你的 API 能够正确处理 HTTP 请求。此外，我们还将提供许多关于如何向输入数据添加验证的示例。\n\n\
  好了，介绍得够了。让我们开始旅程吧！\n\n# 技术要求\n\n你需要安装以下工具：\n\n- **Java 21 SDK**: 标准 Java 软件开发包，版本\
  \ 21\n- **Gradle**: 行业标准的构建工具\n- **IntelliJ Community edition**: Java 语言领先集成开发环境\
  \ (`IDEs`) 之一的免费版本\n- **SDKMAN**: 我们用于安装 Java 和 Gradle 的包管理软件\n\n## 从领域设计到编程\n\n\
  让我们回顾一下你目前所学的内容。通过在前几章中遍历我们的 HomeIt 示例，如果你遵循了所有建议练习，我们为你的产品进行了一系列业务需求分析。我们深入研究了功能应该如何运作的细节。我们研究了生命周期、输入、输出、用户等。我们最终为不同的功能获得了用户故事和用例描述。然后，我们为应用程序定义了领域和服务，并创建了出色的领域图和时序图。在这一切之后，我们研究了如何思考非功能性需求——即如何思考我们的系统限制，以便选择合适的技术来实现我们的服务。\n\
  \n本章是我们第一次使用 Spring Framework 编写服务的章节。你感到兴奋吗？通过学习这本书的开头几课，我们已经配备了出色的工具，使我们成为真正的系统分析师。下次当你收到实现某功能的任务（ticket）时，你现在可以回到这些任务和用户故事的基础，深入进行一系列性推理过程，这将帮助你与团队进行大量的精彩对话。\n\
  \n例如，我们如何从领域图和时序图有效地编写我们的软件？\n\n我们首先想要发现的是，我们的系统中到底需要多少个“程序”。在互联网的早期时代，我们通常为整个网站只提供一个后端服务。我们编写的代码基本上是在单个代码库中实现所有领域和服务，并只编译成一个二进制文件——或者在\
  \ PHP 的情况下，页面被“打包”到一个目录中，并由单个 HTTP 服务器（大多数情况下是 `Apache`）提供。然后是服务器副本：同一个程序在多台计算机上运行，以便服务更多用户。情况仅此此。\n\
  \n\n\n\n过去的日子要简单，那些程序被称为`单体架构（monoliths）`。但那种设计带来了许多问题。最主要的问题是，单体程序会增长为海量的代码，变得难以维护。另一个大问题是，大型单体服务需要消耗大量的系统资源——CPU、内存等。开发者开始意识到，为了避免这些巨大的限制（以及许多其他限制），可以将服务拆分为不同的、更小且更简单的程序。今天，已经有公司拥有几十个甚至上百个这样不同的程序。这些被称为`微服务架构（microservice\
  \ architectures）`。\n\n微服务架构的想法是，你的领域和服务将被拆分到一定数量的程序中，以便它们能够相互通信。微服务世界的承诺是，通过允许我们维护相互隔离的较小服务，编程将变得更简单。每个服务使用的资源更少，代码库也更小，而且团队可以专注于少数几个领域，而不是承担维护一个在同一代码库中实现了许多业务区域的整个单体的责任。\n\
  \n然而，微服务的热潮并没有如其承诺那样。微服务架构可能会变得非常复杂。例如，当我们进行交易时，我们如何保证不同的程序在时序图流中保持 100%的一致性？如果其中一个系统在更新过程中失败，而它们使用不同的数据库，我们如何保证其他服务不会保持错误的对象状态呢？这只是讨论的开始。选择编写微服务还有许多其他缺点。\n\
  \n好了，今天，单体架构和微服务将共存。你何时应该编写一个或多个程序来反映你的领域图，这取决于你自己。这张图说明了在单体架构和微服务架构这两个极端之间通常发生的情况：\n\
  \n![图 5.1：公司规模与服务器应用程序数量](img/B18632_05_1.jpg)\n\n图 5.1：公司规模与服务器应用程序数量\n\n通过观察图中的不同象限，你可以看到服务器数量与每个服务器中领域数量之间的关系。\n\
