  # Spring Web 备忘清单\n\n这里有一份实用列表，方便你在需要提醒自己应该在何时使用哪些 Spring Web 注解时快速参考：\n\n*   `@RestController`:\
  \ 这应该添加到类定义中。它告诉 Spring 你的类将处理 HTTP 请求。\n\n*   `@RequestMapping(\"api/v1/your-resources\"\
  )`: 这也应该添加到类级别。它告诉 Spring 你的 REST API 的资源地址。资源地址是 API 中的一个目录，可以在其中找到领域和领域对象。使用复数形式的资源名称（如\
  \ `rental-properties`、`landlords`、`payments` 等）是一个良好的习惯。\n\n*   `@GetMapping`, `@PatchMapping`,\
  \ `@PostMapping`, `@PutMapping` 和 `@DeleteMapping`: 这些应该在方法级别使用。它们定义了类方法将处理哪种 HTTP\
  \ 动词。如果你要把领域对象的 ID 作为 URL 的一部分，则需要在它们定义路径参数。你还需要在这里定义请求和响应负载中接受（accept）和产生（produce）的内容。\n\
  \n*   `@PathVariable`: 这应该添加到方法参数之前。它帮助将路径参数从 URL 直接提取到你的方法参数中。只有当方法参数名称与 URL 映射注解中定义的路径参数相同时，它才有效（请参考我们在前面的章节中展示的示例）。\n\
  \n*   `@RequestParam`: 这应该添加到方法参数中。它帮助从 URL 中提取查询参数。\n\n*   类级别的特定验证注解如下：\n\n  \
  \  *   `@Validated`: 这应该添加到类级别。它帮助告知某些方法参数中将使用 Spring 验证功能。\n\n    *   `@Valid`:\
  \ 这应该添加到方法中的参数上。它帮助根据参数类类型自动验证输入规则。\n\n*   字段级别的特定验证注解如下：\n\n    *   `@NotNull`:\
  \ 确保被注解的字段不为空。此用于必填字段。\n\n    *   `@NotEmpty`: 确保被注解的集合、map 或字符串不为且不为空。此用于非空且非空的字符串或集合。\n\
  \n    *   `@NotBlank`: 确保被注解的字符串在修剪后不为且不为空。它适用于必填的非空白字符串。\n\n    *   `@Size`: 验证集合、map、数组的大小或字符串的长度。它通过指定\
  \ min 和或 max 属性来设置边界。\n\n    *   `@Min`: 确保被注解的数值不小于指定的最小值。此用于为数字设置下限。\n\n    *\
  \   `@Max`: 确保被注解的数值不大于指定的最大值。此用于为数字设置上限。\n\n    *   `@DecimalMin`: 确保被注解的十进制数值不小于指定的最小值。它支持使用字符串来处理大数或浮点精度。\n\
  \n    *   `@DecimalMax`: 确保被注解的十进制数值不大于指定的最大值。它支持使用字符串来处理大数或浮点精度。\n\n    *   `@Positive`:\
  \ 确保被注解的数值大于 `0`。此用于验证正数。\n\n    *   `@PositiveOrZero`: 确保被注解的数值为 `0` 或更大。此用于验证非负数。\n\
  \n    *   `@Negative`: 确保被注解的数值小于 `0`。此用于验证负数。\n\n    *   `@NegativeOrZero`: 确保被注解的数值为\
  \ `0` 或更。此用于验证非正数。\n\n    *   `@Digits`: 确保被注解的数值具有精确的整数和小数位数，并指定了整数和小数的属性。\n\n\
  \    *   `@Pattern`: 验证被注解的字符串是否匹配指定的正则表达式。此用于自定义字符串格式。\n\n    *   `@Email`: 验证被注解的字符串是有效的电子邮件地址，并确保电子邮件地址的正确格式。\n\
  \n    *   `@Past`: 确保被注解的日期或时间在过去。此用于历史日期。\n\n    *   `@PastOrPresent`: 确保被注解的日期或时间在过去或现在。它适用于历史或当前日期。\n\
  \n    *   `@Future`: 确保被注解的日期或时间在未来。此用于必须之后发生的日期。\n\n    *   `@FutureOrPresent`:\
  \ 确保被注解的日期或时间在未来或现在。它适用于未来或当前日期。\n\n    *   `@AssertTrue`: 确保被注解的 Boolean 字段为 `true`。此用于必须为\
  \ `true` 的布尔条件。\n\n    *   `@AssertFalse`: 确保被注解的 Boolean 字段为 `false`。此用于必须为 `false`\
  \ 的布尔条件。\n\n    *   `@CreditCardNumber`: 确保被注解的字符串是有效的信用卡号（Luhn 算法）并验证信用卡号。\n\n\
  \    *   `@URL`: 确保被注解的字符串是有效的 URL 并验证 URL 的正确格式。\n\n# 总结\n\n在本章中我们涵盖了大量内容。我们全面回顾了网络请求是如何发生的、HTTP\
  \ 协议及其主要部分，并学习了 Spring 框架内部如何工作以及如何为你管理 Spring Bean。然后，我们编写了第一个 Spring Web REST\
  \ API。\n\n在下一章中，我们将涵盖补充本章内容的佳主题和模式，例如学习如何测试我们的 API；如何使用本地化模式使我们的 API 支持多种货币。\n\n\
  \n\n\n\n# 图 6.1：Spring 服务主蓝图\n\n如你所示，此图中包含三个垂直层和四个水平层。我们将从概念上解释这些垂直层和水平层，并在后续的章节和节中详细介绍这些每一个方面。\n\
  \n## 探索垂直层\n\n你在`图 6.1` 中看到的三个垂直层将帮助你组织源代码，从而隔离出三个特殊范类：客户端接口代码、内部服务和数据持久化层，这样你的应用程序在需要时就可以维持长期状态。这些层并不是每时候都严格强制要求的，但它们对于理清思路非常有帮助。在接下来的小节中，将对每一层进行更详尽的解释。\n\
  \n### 远程接口\n\n左侧的垂直层包含一组专门负责为远程客户端提供接口的类。这是客户端的入点。在上一章的示例中，通过使用`Spring Web`，我们学习了如何实现\
  \ `HTTP` 和 `REST` API。但远程接口层可以根据我们的用例以多种方式实现（我们将在整本书中看到这一点）。你应尽避免向这组类中添加业务规则，因为在远程接口层中，你的代码仅仅捕获客户端请求并将它们委托给中间垂直层中的业务服务。这种方法与我们在过去章节示例中写的类似，当时我们将\
  \ `RentalPropertyService` `Spring Bean` 注入到 `RentalPropertyController` 类中。这一层还负责格式化要在网络上传输的数据。在\
  \ `REST APIs` 中，这意味着我们可以接受 `JSON` 对象。\n\n### 业务\n\n中间的垂直层代表了你应该编写领域业务规则的类集合。你对产品的任何专业知识都应该在这一层中表示并实现，而不是其他地方。执行业务操作并强制其特定规则的典型类被称为`service`，它将接受并返回“数据传输对象”（`DTOs`），即表示结构化业务对象的\
  \ Java Java 类。这些服务类还与远程服务（我们在正在编写的服务内部需要调用的其他微服务）以及`repositories`（我们存储长期数据需要使用的数据源）交互，以保存数据并将调用到网络中的其他服务器。\n\
  \n### 持久化\n\n这是右侧的垂直层，负责确保我们可以从数据存储中存储和检索结构化数据。它通常实现对不同类型数据库的连接、某种大对象存储（blob storage）机制，或任何我们需要的存储和检索数据的接口（可以是远程文件系统，如\
  \ `FTP`、`NFS`，甚至是云端的 `Google Sheet`）。\n\n随着我们的进行，这三个垂直层将变得更加清晰。\n\n## 理解水平层\n\n\
  水平层将每个垂直层进一步划分为一些公共区域。它们将为你提供四种区分：顶层由你将用于处理系统中数据的对象组成（因此，每个垂直层都有自己的数据对象格式）。中间层由接口组成（字面上的你用于定义系统功能的\
  \ Java 接口——它们需要什么输入以及返回什么输出）。第三层是驱动你所定义的服务接口实现的 Java 代码。第四层描述了你正在与之关联的远程系统（例如，客户、另一个微服务或数据库）。让我们对水平层进行更详细的描述。\n\
  \n## 对象\n\n顶部的水平层包含了我们将处理的实际数据结构。由于特殊需求，将网络对象、服务对象和存储对象的实现隔离开，因为这些数据结构虽然代表相同的业务概念，但会有不同的需求。网络数据表示可以是\
  \ `REST APIs` 中的 `JSON` 对象。`DTOs` 是纯 Java 对象，具有原始属性和用于处理我们需要强制执行的任何业务规则的简单方法。它们通常是我们服务类的输入和输出参数。另一方面，`Entities`\
  \ 是代表我们需要强制执行的数据持久化任何要求的类。我们经常会看到服务类将 `DTOs` 转换为 `entities` 反之亦然，并进行 1-1 映射，特别是当它们非常相似时。`Spring\
  \ Web` 自动将 `JSON` 对象转换为 `DTOs`。在某些情况下，对带有简单 `DTO` 的服务类的单个调用可能会导致许多实体对象在 `repository`\
  \ 中创建并持久化。由于这些不同因素，我们通常会有这三种核心数据类型：\n\n*   网络数据表示\n*   DTOs\n*   Entities\n\n##\
  \ 接口\n\n中间水平层代表了整个应用程序中可用的去实现的方法。对于 Java 程序员来说，这意味着我们应该只在此层中添加接口类或非常薄的实现（例如，我们的\
  \ `RentalPropertyController` 在每个方法中只包含几行代码）。这一层将帮助你保持抽象尽可能清晰和有序，以便你可以从业务的角度思考，而无需过多担心如何实现这些方法，或者你正在与哪种技术交互。这对于以隔离的方式表达服务器的概念和哲学非常有帮助。在接口层的左侧，我们将拥有处理远程通信的所有接口。在中间，我们将有业务接口。在右侧，我们将有持久化接口。\n\
  \n## 实现\n\n第三个水平层（从上到下）是你创建类来实现位于接口层（从上到下的第二层）中接口的地方。根据惯例，在`左`侧，`REST controllers`\
  \ 的实现由 `Spring Web` 依赖以及我们学过的注解提供。你可以使用其他 `Spring Web` 注解来丰富你的 `HTTP` 协议处理，例如 `@RestControllerAdvice`，用于映射\
  \ Java 异常如何产生正确的 `HTTP` 响应（我们将在本章查看该）。\n\n在整个层中，你将使用 `Spring Projects` 中提供的任何注解为你的应用程序实现特定行为（你也将使用\
  \ `Spring AOP` 来此，这将在书的后面介绍）。\n\n在实现层的`中间`部分，服务实现有两种类型：要么你正在实现对另一个远程服务的调用（`remote\
  \ service calls`），该实现将封装任何所需的样板代码；要么你正在实现业务规则（`service implementations`），这意味着你可以处理\
  \ `DTOs` 和实体对象，并在实现中注入其他服务接口。你不应该让实现类直接注入另一个实现类，因为当服务需要调用另一个服务时，如果你直接注入实现类，这将你的特定实现细节暴露给代码的其他部分，这可能会导致从长远来看你的代码更难维护。相反，你应该将服务接口注入到任何需要的类中，以保持抽象清晰并使实现相互隔离。Spring\
  \ Framework 知道如何为你的服务提供正确的实现类；我们将看到一些示例。\n\n\n\n\n\n在这一层的右侧，我们可以找到从不同数据库和其他类型持久化机制存储和检索对象的实现。这些实现通常由你从右侧\
  \ Spring 依赖中获取的注解提供。你可以在服务器中包含不同的 Spring 项目，它们将允许你连接到你想要的任何数据库，例如。\n\n## 远程访问\n\n\
  最后，底部的水平层是为了让你意识到你的 Spring 服务器所维护的外部连接。在项目的左侧，对于 REST API，我们指的是远程客户端的 HTTP 连接。在中间，它让你知道你的服务可以向其他远程服务器执行请求。在右侧，远程访问当然就是你选择的数据库。通过这一张图，你就可以理解使用\
  \ Spring Framework 创建任何微服务的整个哲学。对于了解一个 Spring 服务器应该如何实现，这确实是你需要看到的所有内容。要真正理解这一点可能需要一点时间，但一旦你重读几次这些章节并查看我们接下来的示例，你应该会有更好的理解。\n\
  \n请记住，通常情况下，每个 Spring 微服务将为你的应用程序中的一个或几个非常密切相关的领域或概念服务。\n\n以下是一个基于我们的 HomeIt 启动项目的示例。\n\
  \n# 租赁提议服务设计\n\n我们可以设想租赁提议服务，它将使用 Spring Web 作为左垂直层（远程接口 – REST API），在中间垂直层（业务）中实现几个服务以将\
  \ DTO 转换为租赁提议实体，并在右侧垂直层（持久化）中将租赁提议保存为 MongoDB 数据库中的文档。将书向右旋转，你就能完整地看到整个图像。\n\n![图\
  \ 6.2：租赁属性服务的 Spring 布局](img/B18632_06_2.jpg)\n\n图 6.2：租赁属性服务的 Spring 布局\n\n要实现此服务，我们应该执行以下操作：\n\
  \n1. 创建 `RentalProposalController` 接口，使用 Spring Web 定义 API 和 HTTP 方法。\n2. 创建 `RentalProposalDTO`\
  \ 类，它包含租赁提议字段。JSON 结构应该是开箱即用的，因为 Spring Web 会自动将 DTO 转换为 JSON 反之亦然。\n3. 创建 `RentalProposalService`\
  \ Java 接口，包含创建/存储租赁提议所需的所有操作。\n4. 创建 `RentalProposalServiceImpl`，它将实现接口中的方法。\n5.\
  \ 创建 `MessageService` 接口，封装我们在创建或更改租赁提议时发送给用户的消息。\n6. 创建 `MessageService` 实现，使用\
  \ Spring Feign client 向我们的消息服务发送 HTTP 请求（我们将在后续章节中查看 Feign client 如何工作）。\n7. 创建\
  \ `RentalProposalEntity` 类，将用于从 MongoDB 中存储和检索我们的租赁提议对象。\n8. 创建 `RentalProposalRepository`\
  \ 接口，声明对我们的存储库进行所有可能的操作。\n9. 访问 MongoDB 的实现将由 Spring Data MongoDB 实例提供。\n10. 我们需要实现自动化测试，以确保所有类都能正常工作。\n\
  \n我们将在后续章节中查看实现。目前，这个步骤计划基本上是为了向你展示 HomeIt 启动项目中的不同服务。在下一节中，我们将讨论并练习 Spring 软件开发中一个重要但经常被忽略的方面：如何以结构化、清晰的方式处理异常和错误。\n\
  \n# REST API 中的错误处理\n\n由于我们在上章节的示例中讨论了 REST 服务，让我们稍微扩展一下以解决 Spring REST API 中的一个关键问题。\n\
  \n假设你的应用程序中的各个端点会抛出一个特定的异常。你如何实现适当的错误处理并向远程客户端返回有意义的响应，而又不会在到处复制相同的 `try`/`catch`\
  \ 语句？\n\n一个实用的例子是 HTTP 中的 `500` 错误码。你见过多少次完全没有格式化且无关紧要，或者只是空的意外服务器错误？要预判生产环境中代码可能崩溃的每种情况基本上是不可能的。因此，至少应该建立某种机制来捕获代码中抛出的所有意外异常，并对其进行此类处理，使得你的远程客户端在任何情况下都能接收到标准的、格式良好的消息。\n\
  \n在这些恼人的情况下，我们可以使用 `@ControllerAdvice` 和 `@ExceptionHandler` Spring Web 注解来标准化响应，并使用\
  \ `ProblemDetail` 类作为标准化的返回对象。\n\n让我们看看它是如何工作的。首先，我们将在当前的 `RentalPropertyController`\
  \ 类中创建此示例缺陷端点，它将故意抛出一个 `RuntimeException`：\n\n```\n@GetMapping(value = \"/error\"\
  )\npublic ResponseEntity<List<RentalPropertyDTO>> runtimeExceptionSample() {\n \
  \   throw new RuntimeException(\"This was a sample unhandled runtime exception\"\
  );\n}\n```\n\n这个异常仅仅是为了象征发生在应用程序任何地方的运行时错误。\n\n接下来，让我们使用 `curl` 向此端点发送请求：\n\n![图\
  \ 6.3：向始终触发异常的端点的示例请求](img/B18632_06_3.jpg)\n\n图 6.3：向始终触发异常的端点的示例请求\n\n正如你所看到的，我们得到了一个没有提供任何有用信息的内部错误。现在，让我们这个简单的类来处理所有未捕获的异常：\n\
  \n```java\n@RestControllerAdvice\npublic class SampleExceptionHandler {\n    @ExceptionHandler(RuntimeException.class)\n\
  \    public ResponseEntity<ProblemDetail> handleRuntimeException(RuntimeException\
  \ ex) {\n        ProblemDetail problemDetail = ProblemDetail.forStatus(HttpStatus.INTERNAL_SERVER_ERROR);\n\
  \        problemDetail.setTitle(\"Customized Internal Server Error\");\n       \
  \ problemDetail.setDetail(\"An unexpected error occurred: \" + ex.getMessage());\n\
  \        problemDetail.setInstance(URI.create(\"/api/v1/rental-properties/error\"\
  ));\n        problemDetail.setProperty(\"timestamp\", LocalDateTime.now().toString());\n\
  \        return new ResponseEntity<>(problemDetail, HttpStatus.INTERNAL_SERVER_ERROR);\n\
  \    }\n}\n```\n\n这里是一些亮点：\n\n- 我为类使用了 `@ControllerAdvice` Spring Web 注解，这让 Spring\
  \ 知道这是一个用于处理方法中声明的任何异常的 Bean。我们的代码中可以有多个 `@RestControllerAdvice` 类，但许多项目只会维护其中一个。\n\
  - 我们为单个方法标记了 `@ExceptionHandler` 注解，这允许我们指定由该方法处理哪个异常。在我们的案例中，我们只需要一个可以捕获所有运行时异常的方法，以便我们更好地为\
  \ HTTP 客户端格式化 **500** 错误消息。\n- 我们创建了 `ProblemDetail` 类的实例，它具有非常有用的字段，可以告知远程客户端我们的错误信息。\n\
  \n\n\n\n\n*   如果你想在代码中使用 `RestControllerAdvice` 机制处理多个不同的异常，你可以为你想要处理的每种异常创建不同的处理方法。\n\
  \n现在，让我们来看看实际运行效果。一旦你写了一个 `RestControllerAdvice` 类，Spring *仅仅就知道*如何通过我们在上一节中讨论过的\
  \ Spring Beans 管理机制，将错误转发到该类的实例上。\n\n`@RestControllerAdvice` 注解会通知 Spring Framework\
  \ 由此创建一个 Spring Bean，并在整个应用程序生命周期内保留该实例。\n\n这里是尝试发送相同的 `GET` 请求，但这次的响应是由我们的 `@RestControllerAdvice`\
  \ Bean 自定义的：\n\n![Figure 6.4: RestControllerAdvice 类返回的自定义响应](img/B18632_06_4.jpg)\n\
  \n图 6.4: RestControllerAdvice 类返回的自定义响应\n\n如你所见，我们原始的异常信息现在传递到了远程客户端。请注意，这有助于排查重要的错误消息，但如果你不妥善处理错误消息，也可能导致安全漏洞。让错误消息流向远程\
  \ HTTP 客户端可能会泄露有关你架构的重要安全细节。你需要对这些错误消息非常小心。\n\n# 在 Spring 中实现业务服务\n\n现在，让我们回答另一个关于\
  \ Spring Framework 魔法的阶问题，以及它是如何融入我们在本节初向你展示的通用设计图中的。\n\n在实现 Spring 服务器应用并编写业务垂直层时，我们应该如何声明服务接口和实现类？\n\
  \n## 在 Spring 中声明服务接口\n\n答案相当简单，我们可以在几分钟内通过 `RentalPropertyController` 服务类来演示这一点。首先，Spring\
  \ 基本要求你遵循以下四个步骤：\n\n1.  对于服务器中的每个特殊领域，你可以拥有一个或多个服务接口类，代表你可以在你的领域对象上执行的特有操作。\n\n\
  2.  对于你声明的每个服务接口，你需要一个相应的服务实现类，该类将扩展你的服务接口并向其方法中添加代码。我们通常按照约定将这些类命名为 `YourServiceNameImpl`。\n\
  \n3.  你应该始终使用 `@Service` 注解标记那些服务实现类。这就是 Spring 在运行时将你的服务接口转换为 Spring Bean 所需知道的全部信息。\n\
  \n4.  你可以仅通过接口名称将服务注入到其他 Bean 中。Spring 会在启动时就知道如何为该接口搜索正确的实现类。\n\n让我们看看它在 `RentalPropertyService`\
  \ 类中是如何实现的。这是我们的服务接口：\n\n```java\npublic interface RentalPropertyService {\n   \
  \ List<RentalPropertyDTO> getAllProperties();\n    Optional<RentalPropertyDTO> get(UUID\
  \ id);\n    RentalPropertyDTO create(RentalPropertyDTO property);\n    Optional<RentalPropertyDTO>\n\
  \        update(UUID id, RentalPropertyDTO updatedProperty);\n    Optional<RentalPropertyDTO>\n\
  \        updateSomeFields(UUID id,\n            RentalPropertyDTO partialUpdate);\n\
  \    Optional<RentalPropertyDTO> delete(UUID id);\n    List<RentalPropertyDTO> search(String\
  \ name,\n        String address, String city, String country,\n        String zipCode);\n\
  }\n```\n\n如你所见，`RentalPropertyService` 接口维护了与租赁物业对象相关的所有可能操作。我们可以通过 `UUID` 获取租赁物业、创建一个新的租赁物业、更新整个对象、更新某些字段、删除或搜索租赁物业。\n\
  \n## 为你的服务编写实现类\n\n现在，对于这个接口对象，我们需要添加一个相应的实现类。让我们来看一些重要的部分：\n\n```java\n@Service\n\
  public class RentalPropertyServiceImpl\n        implements RentalPropertyService\
  \ {\n    private final Map<UUID, RentalPropertyDTO>\n        rentalProperties =\
  \ new HashMap<>();\n    @Override\n    public List<RentalPropertyDTO> getAllProperties()\
  \ {\n        return List.copyOf(rentalProperties.values());\n    }\n    @Override\n\
  \    public Optional<RentalPropertyDTO> get(UUID id) {\n        return Optional.ofNullable(\n\
  \                rentalProperties.get(id));\n    }\n    // ... 其他方法放在这里\n}\n```\n\
  \n以下点在这里非常重要：\n\n*   我们可以看到 `@Service` 注解，它向 Spring Framework 表明这是一个 Spring Bean。因此，默认情况下，每当我们尝试注入\
  \ `RentalPropertyService` 时，Spring 都会提供 `RentalPropertyServiceImpl` 实例。\n*   通过使用接口，我们可以轻松更换实现类，而无需更改使用服务的代码。\n\
  *   `@Service` 注解对于 Spring 识别该类为数 bean 至关重要。\n*   在这个示例中，我们使用 `HashMap` 来存储数据，但将来这将由数据库取代。\n\
  \n\n\n\n如你所见，目前有三个主要的包：`service`、`dto` 和 `controller`。service 接口及其相应的实现类位于同一个 service\
  \ 文件夹中。同样，控制器和异常处理器也位于同一个文件夹中。这种结构有一些变体，但对于刚开始来说，这种约定已经足够了。\n\n在这个示例中，我们在同一个 service\
  \ 接口中创建了一系列方法。这只是我们遵循的一个约定，因为实现的方法非常轻量（thin）。如果你的 service 实现类非常大且包含大量代码，你可以将 service\
  \ 接口拆分到更多的文件中。\n\n你在项目中可以采取的另一种路线是将每个单独的服务方法分离到单独接口中，然后为每个接口创建一个仅包含一个方法的实现类。这是你和你的团队需要做出的决定。\n\
  \n当你和你的团队决定如何组织接口和实现（甚至包括控制器）时，请问自己这些重要问题：\n\n*   项目中的文件数量是否在管理范围内？是否能够容易查看项目结构并导航到不同的接口/类文件？\n\
  *   包的数量和目录结构是否也易于管理和导航？包的名称在你的产品语境下是否合理？开发者能否通过直观地浏览包文件夹结构找到他们想要的接口和实现类？\n*   接口和实现类是否易于阅读？是否可以阅读、学习和维护这些\
  \ service 实现方法？\n\n如果你发现自己理解一个 service 实现类非常困难，那么很可能是时候进行一些重构了。你可以将接口拆分为更小的接口并使其更具专业性。你可以通过提取新类和工具方法到其他文件和包中来重构大型\
  \ service 类。你可以在代码中进行各种类型的重组。\n\n现在，轮到你了。在进入下一节之前，花些时间计划甚至实现一个 Spring Web REST 应用程序。也许你想尝试我们\
  \ HomeIt 系统中的某一个微服务？或者，你想为另一个企业创建一个 RESTful 微服务？这取决于你。只要不要让这种实践机会从指缝溜溜。使用 Spring\
  \ 创建良好的 API 是非常容易，因为大多数复杂的实现都由 Spring 项目依赖（如 Spring Web）提供。你可能已经注意到，使用 Spring Framework\
  \ 时你唯一的工作有两点：\n\n*   知道将使用哪个 Spring 项目为你的存储和远程连接技术选择提供实现\n*   深入了解你的产品领域，以便为核心服务创建最佳接口\n\
  \n你准备好接受“在做中学习”的挑战了吗？我将在下一节等候。\n\n# 为你的 Spring 应用编写自动化测试\n\n现在我们已经了解了 Spring 应用的结构，让我们来看看如何为你的应用编写自动化测试。在编写软件时，你永远不应该将测试排除在计划之外，因为你不想在每次发布新功能时都花时间手动测试所有重要内容。更糟的是，你不想在没有测试所有可能测试的内容的情况下发布新版本。这将导致生产环境出现非常糟糕的结果，产生大量的\
  \ Bug 和故障。\n\n自动化测试套件将保证你的软件始终符合需求。一组良好的自动化测试实际上是业务运行良好的保证。此外，正如我们所看到的，自动化测试会让你的开发变得更快、更容易。一旦你拥有了一个优秀的测试自动化套件，每当你发布新软件时都会非常有信心。\n\
  \n## 理解基本测试模式\n\n那么，让我们学习如何编写自动化测试。首先，你需要理解基本的自动化测试模式，也称为 `test case`（测试用例）。每一个自动化测试用例——即使是手动用例——都是根据相同的模式创建的，如图\
  \ 6.6 所示：\n\n![Figure 6.7: The test pattern](img/B18632_06_7.jpg)\n\n图 6.7: 测试模式\n\
  \n这个从左到右创建测试用例的三个步骤的过程意味着：\n\n1.  **Given – Input（假设 - 输入）**：这是一组你想要开始测试的背景对象。这意味着测试设置。这也被称为\
  \ `test scenario`（测试场景）。在这个阶段，你正在模拟、复制你想要开始测试的场景。\n2.  **When – Operation Is Tested（当\
  \ - 测试的操作）**：这是你使用准备好的设置（输入或测试场景）来触发你想测试的操作。这意味着模拟用户在应用程序生产环境下运行时的行为。\n3.  **Verify\
  \ – Desired Output（验证 - 预期输出）**：此阶段意味着你的操作将产生输出，你可以与预期输出进行比较。如果测试的操作输出等于你预期的输出，则你的测试成功了。如果不是，应用程序发生了错误，你需要修复代码。\n\
  \n这种测试用例模式非常容易理解。在设计测试时，你应该始终知道期望从测试场景中接收什么输出。否则，为什么要测试某个东西呢？\n\n## 使用 Spring Test\
  \ 创建集成测试\n\n好了，理论部分够了。在我们的代码库中，我们为 `RentalPropertyController` 类提供了一个测试套件的示例实现。它位于章节的仓库中。我们将首先查看这个示例，然后回过探索使用\
  \ Spring 的不同测试方法。\n\n首先，让我们看看测试类的位置。这是你在任何典型 Spring 项目中找到测试类的相同位置：\n\n![Figure 6.8:\
  \ The test class location](img/B18632_06_8.jpg)\n\n图 6.8: 测试类的位置\n\n测试文件通常以你针对的原始类命名。在我们的案例中，我们将测试\
  \ `RentalPropertyController`，它是 `RentalPropertyControllerTest`类的起源。所有的测试类都存储在 `test`\
  \ 目录中，并反映被测试类的结构。\n\n这个测试类包含不同的测试用例，我们称之为 `test suite`（测试套件）。测试套件包含一组遵循我们过的模式的测试用例。\n\
  \n另一个需要理解点是，Spring 测试是由特定的项目 Spring Test 驱动的，我们需要将其包含在项目构建文件中：\n\n```gradle\ndependencies\
  \ {\n  implementation 'org.springframework.boot:spring-boot-starter-web'\n  testImplementation\
  \ 'org.springframework.boot:spring-boot-starter-test'\n  implementation 'org.springframework.boot:spring-boot-starter-validation'\n\
  \  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'\n}\n```\n\n由于 Spring\
  \ Test 与 JUnit 开箱集成，这些是我们需要包含在 `build.gradle` 文件中的两个指令。这些依赖自动包含在 Spring Initializr\
  \ 生成的项目中。\n\n现在让我们进入 `RentalPropertyControllerTest` 类声明：\n\n```java\n@SpringBootTest\n\
  public class RentalPropertyControllerTest {\n  private final WebApplicationContext\
  \ context;\n  private final ObjectMapper objectMapper;\n\n  @Autowired\n  RentalPropertyControllerTest(\n\
  \      WebApplicationContext context,\n      ObjectMapper objectMapper){\n    this.context\
  \ = context;\n    this.objectMapper = objectMapper;\n  }\n\n  // ... 剩下的测试代码写在这里\n\
  }\n```\n\n这些是代码中的重点：\n\n\n\n\n\n*   我们包含了 `@SpringBootTest` 注解。这意味着一旦 Spring 开始运行你的测试，它实际上会为你创建一个整个\
  \ `SpringApplicationContext`。换句话说，在测试运行期间，你的整个 Spring 应用程序都会运行。是的，如果你没有对某些服务进行 mock（模拟），这也包括你的数据库连接（我们稍后会看到它是如何运作的）。\n\
  \n*   我们声明了对 Web 应用容器的引用。我们需要它以便能够用测试用例对我们的应用程序进行目标操作。\n\n*   我们声明了一个 JSON 解析器。`ObjectMapper`\
  \ 类将帮助我们从 API 响应中提取 DTOs。\n\n*   我们声明了测试类的构造函数。我们要求 Spring Boot 注入 `ObjectMapper`\
  \ 和 `WebApplicationContext` 的 Bean。请记住，Spring Framework 会自动为我们创建并管理每个类的单例。\n\n*\
  \   我们要求在构造函数上添加 `@Autowire` 注解，以便 Spring 能够在测试环境中注入这些 Bean。这个注解仅在运行测试类时是严格强制的，但你也可以在应用程序代码中使用它。在\
  \ Spring 中有多种使用 `@Autowire` 注解的方法，但由于构造函数注入是获取其他 Bean 引用的更好方式，因此我们不会在书中介绍 `@Autowire`。\n\
  \n这总结了如何声明你的测试类。现在，让我们来看后续部分：\n\n```java\nprivate RentalPropertyDTO createdProperty;\n\
  private MockMvc mockMvc;\n@BeforeEach\nvoid setUp() throws Exception {\n    mockMvc\
  \ = MockMvcBuilders\n        .webAppContextSetup(context).build();\n    createdProperty\
  \ = createProperty();\n}\nprivate RentalPropertyDTO createdProperty;\nprivate MockMvc\
  \ mockMvc;\n@BeforeEach\nvoid setUp() throws Exception {\n    mockMvc = MockMvcBuilders\n\
  \        .webAppContextSetup(context).build();\n    createdProperty = createProperty();\n\
  }\n```\n\n以下观察是非常重要的：\n\n*   我们声明了 `MockMvc` 类引用，这是我们用于向你的端点发送 HTTP 请求的类。\n\n* \
  \  我们声明了一个 `setUp()` 方法，该方法在每个测试方法被调用之前都需要运行。`@BeforeEach` 注解正是如此。使用它来标记你需要 Spring\
  \ 运行的方法，以便为测试用例准备一个干净的上下文。这个准备方法是我们测试用例模式中 *Given – Input*（假设 - 输入）步骤的一部分。\n\n*\
  \   我们定义了 Spring 将为 `MockMvc` 创建一个新实例（用于发送 HTTP 请求的类），正如我们之前提到的。\n\n*   我们声明了一个类型为\
  \ `RentalPropertyDTO` 的实例属性，名为 `createdProperty`。该对象每次运行测试用例时都会重新创建，为每个测试用例的运行提供干净的设置。\n\
  \n*   我们可以看到对 `createProperty()` 方法的调用，它向我们的 API 发送真实的 HTTP 请求，并在 API 仓库中插入一个全新的租赁物业实例。\n\
  \n好了，现在我们已经学会了如何准备测试用例上下文，让我们看看在每个测试用例之前是如何创建一个新的租赁物业的：\n\n```java\nprivate RentalPropertyDTO\
  \ createProperty() throws Exception {\n    RentalPropertyDTO property = new RentalPropertyDTO(\n\
  \        null, UUID.randomUUID(),\"Test Property\",\n        \"123 Test St\",\"\
  Test City\",\n        \"Test Country\", \"12345\",1200.0);\n    // Simulate 创建一个\
  \ property\n    String responseBody = mockMvc.perform(\n            post(\"/api/v1/rental-properties\"\
  )\n            .contentType(\"application/json\")\n            .content(objectMapper.writeValueAsString(property)))\n\
  \        .andExpect(status().isCreated())\n        .andReturn().getResponse().getContentAsString();\n\
  \    return objectMapper\n        .readValue(responseBody, RentalPropertyDTO.class);\n\
  }\n```\n\n在这段代码中，我们有：\n\n*   我们创建了一个新租赁物业对象的样本，作为 JSON 负载发送到我们的 API 请求中\n\n*   我们向\
  \ API 执行了一个 `POST` 请求以创建租赁物业\n\n*   我们指定了 `POST` 地址\n\n*   我们指定了请求的内容类型（content\
  \ type）\n\n*   我们将 `RentalPropertyDTO` 解析为 JSON 字符串，并作为请求的内容（负载）包含\n\n*   我们验证了\
  \ HTTP 返回值为 `201`（已创建），这是我们在新物业成功创建时从 API 预期的结果\n\n*   我们将响应内容提取到名为 `responseBody`\
  \ 的字符串中\n\n*   我们使用 `objectMapper` 对象将 JSON 字符串解析为新的 `RentalPropertyDTO` 实例，然后返回它\n\
  \n这很棒，不是吗？我们实际上在验证结果。这意味着如果出现问题，测试将失败。如果出现问题，Spring 会通知我们。现在让我们来看一个实际测试用例的示例：\n\n\
  ```java\n@Test\nvoid testGetPropertyById() throws Exception {\n    mockMvc.perform(get(\"\
  /api/v1/rental-properties/{id}\", createdProperty.id())\n            .contentType(\"\
  application/json\"))\n        .andExpect(status().isOk())\n        .andExpect(jsonPath(\"\
  $.name\").value(\"Test Property\"));\n}\n```\n\n适用以下考虑因素：\n\n*   我们为想要测试的测试用例命名了一个方法（`testGetPropertyById`）。在这种情况下，该方法应该测试\
  \ GET 请求在我们的应用程序中是否有效。我们通过 `@Test` 注解指明 Spring 在运行自动化测试时应该自动运行此方法。\n\n*   请记住，此方法只有在\
  \ Spring 调用 `setUp()` 方法之后才会被调用，因为我们用 `@BeforeEach` 声明了它。这意味着此测试用例将有一个全新的租赁物业实例可供。\n\
  \n*   我们正在使用 `mockMvc` 执行一个操作。\n\n*   执行的操作是对 `/api/v1/rental-properties/{id}` 的\
  \ `GET` 调用。`{id}` 路径参数将被替换。这是我们测试用例模式中的 *When – Operation Is tested*（当 - 测试操作）步骤。\n\
  \n*   GET 请求还添加了 `contentType` Header。\n\n*   最后一部分是我们测试用例模式中的 **Verify – Desired\
  \ Output**（验证 - 预期输出）步骤：\n\n    *   我们确保 HTTP 返回值为 `200` (`OK`)\n\n    *   我们使用\
  \ JSON 路径查询确保我们的响应负载根属性 `name` 包含字符串 `Test Property`，这是我们在运行测试之前创建的物业名称。\n\n这简洁地总结了如何声明你的测试类。你可以通过本章节仓库中的整个测试类来查看其他测试用例。\n\
  \n## 隔离测试 Bean\n\n尽管非常有效，我向你展示的这种模型实际上会测试整个 Spring 应用程序，并为你创建所有原始的 Spring Beans。这意味着你的整个应用程序将以其最初设计的方式运行。\n\
  \n这对于你进行集成测试来说足够了，这很好。但有时，你只想测试单个 Spring Bean，或者一个极其特定的场景，使用这种自动化测试模型进行设置可能非常困难。这里的复杂测试场景示例是你希望对应用程序上下文有更多控制\
  \ {的例子：\n\n*   如果你的测试用例会导致你的应用程序向其他远程应用程序发送请求，或尝试连接到外部服务（如数据库），你可能会发现在本地机器运行集成测试很困难，因为你的环境可能无法访问外部应用程序的实例。\n\
  \n\n\n\n\n- 如果某个特定的测试用例要求你的外部应用程序向被测试的应用程序返回特定结果，即使你的 Spring 应用可以连接到其他应用，也可能无法让它们返回你想要的结果。\n\
  - 如果你有一个极其复杂的服务类实现，其中包含许多复杂的业务规则并引用了其他注入的 Spring Beans，那么在集成测试模型中，可能无法让其他 Bean 按照你完全想要的方式运行。\n\
  \n对于所有这些复杂的场景，如果 Spring Test 能够根据你的需求注入伪造（fake）Beans，不是很有用吗？想象一下，你可以在测试期间为任何 Spring\
  \ Bean 方法提供新的实现，并让该 Bean 在测试用例期间以你完全想要的方式做出响应。\n\n使用 `@MockBean` 注解就可以实现这一点。\n\n\
  让我们来看一个说明这一点的测试类。你还记得我们之前简要讨论过如何为你的 Spring 应用设置默认异常处理器吗？让我们使用 `@MockBean` 注解强制服务抛出异常，然后我们就可以确保\
  \ `RestControllerAdvice` 类工作正常。你觉得觉得怎么样？\n\n异常处理器测试类的完整代码可以在本章的仓库中找到：\n\n```\n@SpringBootTest\n\
  public class SampleExceptionHandlerTest {\n    private final WebApplicationContext\
  \ context;\n    @MockBean\n    private RentalPropertyService rentalPropertyServiceMock;\n\
  \    private final ObjectMapper objectMapper;\n    @Autowired\n    SampleExceptionHandlerTest(\n\
  \            WebApplicationContext context,\n            ObjectMapper objectMapper){\n\
  \        this.context = context;\n        this.objectMapper = objectMapper;\n  \
  \  }\n    private MockMvc mockMvc;\n    // ... 其他部分在这里\n}\n```\n\n这段代码的大部分对你来说是熟悉的，除了声明我们想要控制\
  \ `RentalPropertyService` Spring Bean 的部分。`@MockBean` 注解会在原始的 `RentalPropertyService`\
  \ bean 上创建一个包装器，我们可以在测试用例期间覆盖该 bean 的任何行为。\n\n它的工作原理如下：\n\n```\n@Test\nvoid testGetPropertyById()\
  \ throws Exception {\n    Mockito.when(rentalPropertyServiceMock.get(any()))\n \
  \       .thenThrow(new RuntimeException(\n            \"an unexpected 500 error\"\
  ));\n    mockMvc.perform(\n            get(\"/api/v1/rental-properties/{id}\",\n\
  \                UUID.randomUUID())\n                .contentType(\"application/json\"\
  ))\n        .andExpect(status().is5xxServerError())\n        .andExpect(jsonPath(\"\
  $.title\")\n            .value(\"Customized Internal Server Error\"));\n    Mockito.verify(rentalPropertyServiceMock,\n\
  \        times(1)).get(any());\n}\n```\n\n这是一个测试用例，其中当我们的 Spring 应用中的任何类调用 `get()`\
  \ 方法并传入任何值时，我们强制我们的 `RentalPropertyService` Spring Bean 抛出一个运行时异常。\n\n你甚至可以自定义参数来满足你的需求，以防你在测试用例中期望精确匹配。你可以看到我们正在使用\
  \ `Mockito.when()` 方法来实现这一点。每当满足条件时，模拟的响应就会通过 `thenThrow()` 方法被激活。我们基本上是在那里传递了一个运行时异常的新实例，以便\
  \ Mockito 在合适的时机可以抛出它。\n\n顺便说一下，你可能已经注意到 Mockito 是 Spring Test 项目的一个瞬时依赖。这意味着你不需要在应用程序依赖中手动包含此库，因为\
  \ Spring Test 已经导入了它。\n\n以下是一些你可以在测试用例中使用的实用 Mockito 方法：\n\n- `thenReturn(T value)`：指定方法被调用时返回的值。\n\
  - `thenThrow(Throwable... throwables)`：指定方法被调用时要抛出的异常。\n- `thenReturn(T value, T...\
  \ values)`：指定每次调用方法时按顺序返回的多个值。\n- `thenDoNothing()`：指定方法被调用时不执行任何操作，通常用于 `void`\
  \ 方法。\n\n这有多神奇？现在我们现在测试 Spring 应用的任何方面。我们可以根据需要操纵响应。在测试步骤期间，我们还可以验证特定方法是否被调用。\n\n\
  ## 其他测试选项\n\n在某些情况下，你可能不想运行整个 `ApplicationContext`。在这种情况下，你可以采用单元测试。这里是一个示例：\n\n\
  ```java\npublic class SampleUnitTest {\n    private final SampleExceptionHandler\
  \ handler = new SampleExceptionHandler();\n    @Test\n    public void testHandler()\
  \ {\n        ResponseEntity<ProblemDetail> myException = handler.handleException(\n\
  \            new RuntimeException(\"unexpected error\"));\n        ProblemDetail\
  \ problemDetail = myException.getBody();\n        assert problemDetail != null;\n\
  \        String detail = problemDetail.getDetail();\n        Assertions.assertEquals(\"\
  unexpected error\", detail);\n    }\n}\n```\n\n在这种情况下，我们正在测试 `SampleExceptionHandler`\
  \ 类，当我们的 Spring 应用发现未处理的异常时，就会调用该类。在 `testHandler` 方法中，我们只是测试 `ProblemDetail` 是否作为\
  \ `handleException()` 返回的 `ResponseEntity` 出现。你可以在我们的仓库中找到此单元测试的完整代码。它很简单。\n\n##\
  \ 列出测试用例列表\n\n最后提醒一下，由于编写应用程序总是包含成千上万个变量，因此编写针对应用程序关键位置的测试是关重要的。你需要列出一个结合了正向和反向场景的测试用例列表：\n\
  \n- **正向测试用例（Positive test cases）**如果在测试场景期间传递了正确的信息，断言应用程序运行正常。例如，在我们的 API 中，正向测试用例就是当我们传递正确参数时\
  \ API 创建对象。\n- **反向测试用例（Negative test cases）**是指应用程序对错误数据做出正确反应。换句话说，你希望确保在操作中传递错误数据时应用程序会产生正确的错误。\n\
  \n我们已经看到了 `RentalPropertyController` 的许多正向测试用例和一个针对运行时异常的反向测试用例。现在，让我们来看另一个测试用例。我们在创建租赁属性时会在请求中发送错误的数据。我们期望\
  \ Spring 验证能够完成工作：\n\n```java\n@Test\nvoid testCreatePropertyNullAddress() throws\
  \ Exception {\n    RentalPropertyDTO newProperty = new RentalPropertyDTO(\n    \
  \    UUID.randomUUID(), \n        UUID.randomUUID(),\n        \"New Property\",\
  \ \n        null,\n        \"New City\", \n        \"New Country\",\n        \"\
  67890\",\n        1500.0);\n    mockMvc.perform(\n        post(\"/api/v1/rental-properties\"\
  )\n            .contentType(\"application/json\")\n            .content(objectMapper.writeValueAsString(newProperty)))\n\
  \        .andExpect(status().isBadRequest());\n}\n```\n\n\n\n\n\n如你所见，这个测试用例的方法名准确描述了我们想要测试的场景：客户端发送了一个空地址，预期会返回错误。我们故意插入了空地址。在最后一行，我们验证了我们的应用返回了\
  \ `400`，即错误的请求（bad request）HTTP 码。当 Spring Validation 依赖在客户发送的数据中发现数据违规时，默认情况下会返回错误的请求。当然，我们可以实现一个新的\
  \ `RestControllerAdvice` Bean，以便能够向用户返回更清晰的答案，告知请求中哪些字段是无效的。\n\n此测试用例的代码可以在本章仓库中找到。\n\
  \n## 随着时间推移完善测试\n\n好了，现在你可以编写自己的测试套件了。在创建测试用例时，你必须做到详尽，以确保测试能够保证应用程序的健壮性。但记住，你永远无法做到完美。\n\
  \n无论你尝试为每个变量的组合创建测试用例，你总会在测试套件中遗漏一些有趣的组合。这就是 Bug 的定义。比努力成为完美的软件开发者更重要的是，成为一个在发现问题和遗漏测试用例时能够快速反应并找到优秀解决方案的开发者。噢，老天，你会发现很多问题，因为这就是软件的本质。\n\
  \n一旦团队中有人报告了 Bug，请确保修复代码，并尽力在套件中包含新的测试用例来覆盖该场景。如果你多年来这样做，你的应用程序将达到显著提升的成熟度。\n\n\
  ## 在控制台中运行测试\n\n为了运行测试，我们需要指示 Gradle 在控制台中输出非常清晰的结果。你需要在 `build.gradle` 文件的 `tests`\
  \ 章节内添加 `testLogging{}` 指令：\n\n```\ntasks.named('test') {\n    useJUnitPlatform()\n\
  \    testLogging {\n        events \"passed\", \"skipped\", \"failed\"\n    }\n\
  }\n```\n\n然后，你就可以在项目根目录的控制台中运行以下命令：\n\n```\n> gradle clean test\n```\n\n`clean`\
  \ 指令让 Gradle 清空构建缓存并重新运行所有构建任务。如果你不添加它，Gradle 可能会将构建和测试结果存储在缓存中，除非更改了某些代码，否则它不会再次运行测试。一旦你熟悉了它的原理，就可以移除\
  \ `clean` 指令并直接运行此命令：\n\n```\n> gradle test\n```\n\n这是我在我的电脑上执行时得到的输出：\n\n![图 6.9：带有测试结果的\
  \ Gradle 输出](img/B18632_06_9.jpg)\n\n图 6.9：带有测试结果的 Gradle 输出\n\n如你所见，每个测试类和测试方法都是透明运行的，你可以看到哪些通过了，哪些没有通过。每个\
  \ IDE 也有运行测试的特殊功能，让你看到你所操作一切的日志。\n\n我们将在 *第 11 章 中更多地讨论日志和透明度，届时我们将展示如何为生产环境准备服务。本章的测试就此结束。现在，是增强你的\
  \ Spring Web 应用性能了。\n\n# 调整 Spring Web 以达到巅峰\n\n正如我们在介绍 Spring Web 项目时提到的，过去 Spring\
  \ Web 并不推荐处理大量的并行客户端请求（数千次并发调用），或在同一个调用中处理许多 I/O 操作（例如数据库连接、事务和对其他微服务的请求）。\n\nI/O\
  \ 操作会为 API 增加显著延迟，因为访问网络甚至本地硬盘的速度远比处理内存中的数据慢得多。在 Spring 6 和 Java 19 之前，Spring Web\
  \ 完全依赖线程池来处理这些并行请求。这些线程池由操作系统管理，一旦你的 API 发起 I/O 操作，整个操作系统线程就会挂起，等待操作结果。管理大量线程是不切实际的，因为每个线程都会消耗大量的\
  \ CPU 和内存资源，使得在服务器高负载下运行 API 的可行性变低。\n\n随着 Java 19 的引入，我们看到了 Loom 项目的到来，它引入了 `virtual\
  \ threads`（虚拟线程）——这一功能通过使用 JVM 内部机制降低了挂起线程执行的成本。虚拟线程比传统的操作系统线程轻得多，能够以更少的资源开销处理更多的并发任务。Spring\
  \ 6 现在提供了一种在你的 API 中启用虚拟线程的方法。\n\n让我们如何为你的 Spring Web API 启用虚拟线程。我们将查看未来如何通过属性文件、环境变量等来配置应用程序。当我们在讨论\
  \ Spring 的部署策略和可配置性时，这将非常重要。现在，让我们保持尽可能简单，只需修改我们的 `RentalPropertiesApplication`\
  \ 类。它将被重写如下：\n\n```\n@SpringBootApplication\npublic class RentalPropertyApplication\
  \ {\n    public static void main(String[] args) {\n        SpringApplication app\
  \ = new SpringApplication(RentalPropertyApplication.class);\n        app.setDefaultProperties(Map.of(\"\
  spring.threads.virtual.enabled\", \"true\"));\n        app.run(args);\n    }\n}\n\
  ```\n*等待，让我完全重新格式化源码中提供的代码块，以确保逻辑不被损坏*：\n\n```\n@SpringBootApplication\npublic class\
  \ RentalPropertyApplication {\n  public static void main(String[] args) {\n    SpringApplication\
  \ app = new SpringApplication(RentalPropertyApplication.class);\n    app.setDefaultProperties(Map.of(\"\
  spring.threads.virtual.enabled\", \"true\"));\n    app.run(args);\n  }\n}\n```\n\
  *修正：原文提供的文本中的代码块在提示中略有碎片，我将根据提供的逻辑进行清理*：\n\n```\n@SpringBootApplication\npublic\
  \ class RentalPropertyApplication {\n  public static void main(String[] args) {\n\
  \    SpringApplication app = new SpringApplication(RentalPropertyApplication.class);\n\
  \    app.setDefaultProperties(Map.of(\"spring.threads.virtual.enabled\", \"true\"\
  ));\n    app.run(args);\n  }\n}\n```\n实际上，回看提供文本中的特定代码块：\n```\n@SpringBootApplication\n\
  public class RentalPropertyApplication {\n  public static void main(String[] args)\
  \ {\n    SpringApplication app = new SpringApplication(RentalPropertyApplication.class);\n\
  \    app.setDefaultProperties(Map.of(\"spring.threads.virtual.enabled\", \"true\"\
  ));\n    app.run(args);\n  }\n}\n```\n\n启用虚拟线程的效果非常显著，使得处理并行请求和 I/O 密集型操作变得非常高效。这种增强使得\
  \ Spring Web 的性能更接近 WebFlux（这是我们未来将会学习的微服务高性能架构）。通常情况下，虚拟线程比 WebFlux 更具可读性且易于调试。\n\
  \n如你所见，我们为 `spring.threads.virtual.enabled` 键设置了属性值。如果你使用的是 Java 21，这就足够。你可以通过查看\
  \ `build.gradle` 文件来确保你在使用 Java 21。如果你指示 Spring Initializr 创建应用时使用了最新的 Java 版本，你会看到：\n\
  \n```\njava {\n    sourceCompatibility = '21'\n}\n```\n等等，原文具有 `java { sourceCompatibility\
  \ = '21' }` 逻辑。\n\n为了确保我们确实在使用虚拟线程，我在 `RentalPropertyController` 类中添加了一个工具端点：\n\n\
  ```\n@GetMapping(\"/thread-model\")\npublic String getThreadName() {\n    return\
  \ Thread.currentThread().toString();\n}\n```\n\n这段代码的作用是访问当前线程并调用其 `toString()`\
  \ 方法。你将看到创建线程的类名。当我们向此端点发送 `curl` 请求时会得到：\n\n![图 6.10：发送 curl 请求的输出](img/B18632_06_10.jpg)\n\
  \n图 6.10：发送 curl 请求的输出\n\n如你所见，用于响应你请求的线程类是 `VirtualThread` 类。如果我们将 `spring.threads.virtual.enabled`\
  \ 属性设置为 `false`，我们将得到：\n\n![图 6.11：确定你的系统正在使用虚拟线程还是线程](img/B18632_06_11.jpg)\n\n\
  图 6.11：确定你的系统正在使用虚拟线程还是线程\n\n如你所见，通过将虚拟线程属性设置为 `false`，你的 `curl` 调用将在常用的 `Thread`\
  \ 类上运行。\n\n性能评估和对比超出了本书的范范围，但互联网上有许多关于线程、虚拟线程以及异步处理与 Webflux 性能对比的研究。通常情况下，线程与虚拟线程的使用会有很大改进，且虚拟线程更接近\
  \ Webflux 的性能。但在处理需要极高吞吐量的应用程序场景时，Webflux 仍是你的首选。\n\n接下来，我们将学习如何编写结构良好的 API 端点。\n\
  \n\n\n\n\n# 让你的 API 设计对客户端更加友好\n\n现在，让我们转向另一个重要主题。假设我们已经将 `Rental Property API`\
  \ 发布到了 HomeIt 网站上。以这个端点 URL 为例：\n\n`httpss://homeit.com/api/v1/rental-properties/c2d538fa`\n\
  \n让我们回顾一下这个地址的结构：\n\n* `https`: 这是请求的协议。在这种情况下，我们处理的是一个安全的 HTTP 连接，我们将在讨论 API 安全时涉及到它。\n\
  * `homeit.com`: 这是我们所说的 `base URL`（基础 URL）。它代表发布你 API 的域名。\n* `/api`: 这是 API 的根目录，HomeIt\
  \ 的所有 API 均发布在这里。\n* `v1`: 这是你 API 的版本。\n* `rental-properties`: 这是你 API 的名称，对应于域名或资源的名称。\n\
  * `/c2d538fa`: 这是你的域资源对象的 ID。\n* `rental-properties/c2d538fa`: 这是我们所说的`唯一资源标识符`\
  \ (`URI`）。它告诉你在哪里找到这个特定租产对象的精确 HTTP 地址。\n\n回顾这些元素非常重要，因为我们现在将讨论 API 的成熟度级别。换句话说，我们要回答以下问题：我们如何知道自己的\
  \ REST API 结构良好且文档完全？这个问题的最佳答案在于我们现在将学习的一个特殊模型。\n\n## 用于创建/编写 REST API 的 Richardson\
  \ 成熟度模型\n\nLeonard Richardson 是一位极有影响力的作家，他注意到某些 REST API 在提供直观设计方面比其他 API 好，更重要的是，它们遵循了\
  \ Roy Fielding 提出的原始 REST 标准。REST 标准就像是服务的理想实现，而 Leonard 的设计提供了关于实际实现与顶尖水平之间差距的信息。\n\
  \n在接下来的几个子章节中，我们将回顾四个成熟度级别，它们分别是：远程过程（0 级）、资源（1 级）、HTTP 动词（2 级）和超媒体控制（3 级）。\n\n\
  ### 探究度度为 0 级的远程过程\n\n许多 HTTP API 设计师会遵循一种策略：创建任意的 URL，这些 URL 反映了提供给远程客户端的操作名称。如果我们的租产\
  \ API 是这样做的，在成熟度 0 级，我们将得到类似下面的示例：\n\n* `POST httpss://homeit.com/api/createRentalProperty`\n\
  * `POST httpss://homeit.com/api/deleteRentalProperty`\n* `POST httpss://homeit.com/api/updateRentalProperty`\n\
  * `POST httpss://homeit.com/api/sendRentalProposal`\n* `POST httpss://homeit.com/api/acceptRentalProposal`\n\
  \n如你所见，所有的 URL 都让要执行的操作显式化，这意味着客户端需要理解并记忆每个可能操作的一系列特定地址。这导致了一组非常无结构的 URL 集合，随着 API\
  \ 增长以支持更多功能和特性，在未来可能会导致完全出意之外的设计。这让用户感到很困惑，他们不知道需要处理多少个域名和实体，更不用说用 API 可以做什么了。\n\
  \n这就是我们认为的 0 级 API 成熟度级别。使用了 URL 和 HTTP 协议，但没有遵循任何原始设计标准和意图。动词是根据开发者的直觉选择的。这些 URL\
  \ 简直是一场灾难，类似于代码中的函数名。\n\n如果你已经在行业内至少待了几年，你一定遇到过这样的 API。如果你设计过类似的东西（我知道我设计过），你需要提升到下一个级别了。\n\
  \n### 在 1 级创建目录\n\n在第二个级别，API 被认为已进入了 REST 的领域。在这里，API 将一致地使用 URL 模式来为你将要操作的对象创建目录。这些目录还允许你通过仅将对象\
  \ ID 作为路径参数来直接定位于对象。以下是一些示例：\n\n* `POST httpss://homeit.com/api/rental-properties`\n\
  * `GET httpss://homeit.com/api/rental-properties/123`\n* `POST httpss://homeit.com/api/rental-properties/123/delete`\n\
  * `GET httpss://homeit.com/api/rental-proposals/456`\n* `GET httpss://homeit.com/api/rental-proposals`\n\
  \n如你所见，在第一、第二和第三个示例中，我们能够定位 ID 为 `123` 的单个对象，并对其触发不同的操作。但这一次，我们可以在同一个 URL 中使用不同的动词，这将导致不同的结果。正如我们之前看到的，这个指向同一个对象实例的唯一地址被称为\
  \ `URI`。这意味着你的对象现在在 API 中有了它们自己的唯一地址，你可以从该 URL 执行不同的操作来处理该对象。\n\n对象的根目录是一个资源。在这些示例中，我们代表了两种资源类型：租产（rental\
  \ properties）和租房建议（rental proposals）。每个资源类型的地址都应该用复数命名。\n\n好了，我们现在为资源实例创建特定 URL\
  \ 地址方面获得了一些一致性。但在我们的示例中，我们可以看到使用正确的 HTTP 动词并没有一致性。我们看到有一个指向 `/delete` URL 的 `POST`\
  \ 请求，这是毫无意义的，因为 HTTP 中的 `POST` 动词最初设计用于创建新资源。2 级修复了这个问题。\n\n### 在 2 级使用 HTTP 动词\n\
  \n在 2 级，我们现在处理请求时一致地使用 HTTP 动词。达到这种成熟度意味着你正在为客户端提供结构化且直观的 API。请看以下示例：\n\n* `POST\
  \ httpss://homeit.com/api/rental-properties`\n* `GET httpss://homeit.com/api/rental-properties/123`\n\
  * `DELETE httpss://homeit.com/api/rental-properties/123`\n* `POST httpss://homeit.com/api/v2/rental-properties`\n\
  * `GET httpss://homeit.com/api/v2/rental-properties/123`\n* `DELETE httpss://homeit.com/api/v2/rental-properties/123`\n\
  \n通过对你的 API 进行版本控制，你还将确保任何更改都通过新 URL 发布。这让你确信不会破坏使用旧版本的客户端代码。API 用户可以根据需要开始使用更新版本的相同\
  \ URI。\n\n在 2 级，正如我之前提到的，你还被使用正确的 HTTP 响应码来响应请求。这意味着当创建租产的 `POST` 请求成功时返回 `201`，当请求中缺少必要数据时返回\
  \ `400`，或者当输入数据格式正确但存在其他冲突时（例如尝试为不存在的房东 ID 创建租产）返回 `409`。\n\n2 级的关键点在于消除差异，让所有资源以相同的标准方式运行。正如我们几个章节前所说的，通过理解对象应该具备的基本操作，我们能够设计\
  \ API 并发现 API 中应该存在的新资源。\n\n### 3 级 – 超媒体控制\n\n在这一级，你的 API 不仅使用正确的 HTTP 动词提供标准操作和响应，还将提供告知客户端给定对象可用操作的响应。这意味着一旦客户端对特定资源实例执行\
  \ `GET` 请求，他们不仅将收到对象的表示，还将接收一个结构，其中列出了客户端可以使用新的 HTTP 请求对该对象执行其他操作的可能 URI。\n\n由于这是我们理想的成熟度，让我们来看看它是如何运作的。\n\
  \n\n\n\nSpring Web 允许你创建任何你想要的 URL 和 URI，因此遵循良好的实践取决于你个人，例如我刚刚与你分享的那些做法。但有一个名为 `Spring\
  \ HATEOAS` 的工具可以帮助你创建第 3 级 API。\n\n`HATEOAS` 是“超媒体作为应用状态引擎”（Hypermedia as the Engine\
  \ of Application State）的缩写。该术由 Roy Fielding，他是开放 HTTP 协议的关键设计者之一，他认为 HTTP 客户端应用程序应该能够基于基于\
  \ HTTP 的应用返回的选项进行自我引导。换句话说，这种理念是：每个使用 HTTP 的成熟应用程序不仅应该返回客户端请求的操作结果，还应该返回一个控制选项列表，这些选项可以允许应用程序自动将这些操作暴露给用户。\n\
  \n`HATEOAS` 的最终结果——即仅知道根据超媒体控制进行自我引导的客户端应用程序——是非常な，因为开发者仍然需要文档来向服务发送 HTTP 请求。但如果你在响应中提供了这些额外的操作，那么对于我们的客户端来说可能会非常有用。\n\
  \n### 区分 DTO 与描述符（descriptors）\n\n因此，我们知道为了拥有第 3 级 API，我们需要在 HTTP 响应中提供新的 URI，以便远程客户端可以发现与它们从我们的端点获取的对象相关的后续操作。\n\
  \n我们在这里采用的方法是通过 DTO 描述符（descriptors）。一个 `descriptor`（描述符）基本上是一个封装在 DTO 外围的对象。这种方法为你的\
  \ DTOs 提供了一个容器，该容器还可以包含表示我们正在获取的业务对象的操作链接。请看下图：\n\n![Figure 6.12: Home IT HATEOAS\
  \ implementation example](img/B18632_06_12.jpg)\n\n图 6.12：Home IT HATEOAS 实现示例\n\
  \n现在，在查看代码之前，让我们看看客户端在通过它们的 URI 获取对象时会得到什么。\n\n首先，当我们运行 API 时，可以使用旧的 `v1` POST 方法创建一个\
  \ `RentalProperty` 示例：\n\n![Figure 6.13: A POST request for creating a rental property\
  \ using curl](img/B18632_06_13.jpg)\n\n图 6.13：使用 curl 创建租赁物业的 POST 请求\n\n这次，我们在\
  \ `curl` 命令中使用了 `--silent` 标志，这将简化请求和响应。我们还在使用 `jq` 命令来更好地格式化 API 响应。`jq` 命令可以安装在\
  \ Windows、Mac 和 Linux 上。它是开源的，可以在这里找到：[`jqlang.github.io/jq/`](https://jqlang.github.io/jq/)。\n\
  \n好了，现在我们创建了新的租赁物业。当我们使用 `Spring HATEOAS` 带有超媒体控制获取单个 `RentalPropertyDTO` 类时，我们将得到这些：\n\
  \n![Figure 6.14: A GET request to retrieve a Rental Property](img/B18632_06_14.jpg)\n\
  \n图 6.14：获取租赁物业的 GET 请求\n\n如你在截图顶部所示，我们现在正在使用 `v2` API URL。返回内容包含一个封装的 `rentalProperty`\
  \ 类，以及该租赁物业的 URI。\n\n让我们看看如何使用 `Spring HATEOAS` 获取一组租赁物业：\n\n![Figure 6.15: A GET\
  \ request to retrieve a list of properties](img/B18632_06_15.jpg)\n\n图 6.15：获取物业列表的\
  \ GET 请求\n\n如你所见，每个租赁物业都有自己的 URI，而整个集合包含一个获取所有租赁物业的 URI。\n\n这就是我们现在将学习使用 `Spring\
  \ HATEOAS` 实现的结果类型。\n\n现在，让我们通过下面的图，快速查看我们在解决方案中使用的类，你可以在我们的 GitHub 仓库中查看它们：\n\n\
  ![Figure 6.16: HATEOAS class structure](img/B18632_06_16.jpg)\n\n图 6.16：HATEOAS\
  \ 类结构\n\n这些是示例中使用的类：\n\n*   `RentalPropertyControllerV2`：添加了两个获取单个或一组租赁物业的新端点，并包含了超媒体控制（URIs）。\n\
  *   `RentalProperty` 和 `RentalPropertyDTO`：自我们的 V1 控制器以来就存在于系统中的两个类。\n*   `RentalPropertyHyperMediaUtils`：一个辅助\
  \ Bean，将为我们创建超媒体描述符。\n*   `RentalPropertyDescriptor`：封装租赁物业并包含该租赁物业的 URI。\n*   `PropertiesCollectionDescriptor`：封装\
  \ `RentalPropertyDescriptor` 对象集合，并包含一个一次性获取所有物业的 URI。\n\n好了，介绍完毕，让我们进入实现细节。\n\n\
  ### 添加 HATEOAS 依赖项\n\n我们在这里应该做的第一件事是将 HATEOAS 作为 Spring 依赖项。这些是我们对 `build.gradle`\
  \ 文件将做的更改：\n\n```\ndependencies {\n    implementation 'org.springframework.boot:spring-boot-starter-web'\n\
  \    implementation 'org.springframework.boot:spring-boot-starter-validation'\n\
  \    implementation 'org.springframework.boot:spring-boot-starter-hateoas'\n   \
  \ compileOnly 'org.projectlombok:lombok'\n    annotationProcessor 'org.projectlombok:lombok'\n\
  \    testImplementation 'org.springframework.boot:spring-boot-starter-test'\n  \
  \  testCompileOnly 'org.projectlombok:lombok'\n    testAnnotationProcessor 'org.projectlombok:lombok'\n\
  }\n```\n\n以下观察结果非常重要：\n\n*   HATEOAS 被包含在 `build.gradle` 文件中。它包含了创建第 3 级 API 所需的所有工具。\n\
  *   我们还将 Lombok 作为 `build.gradle` 的依赖项，以便更容易编写描述符。该依赖项必须包含在编译和测试阶段。\n\n有了 `build.gradle`\
  \ 文件中的这些新指令，我们可以开始实现具体的类。\n\n### 编写 RentalPropertyControllerV2\n\n我们将看到新的控制器类。我们将将其作为\
  \ API 的新版本编写。这样，仍然使用 v1 的旧客户端就不会受到影响，因为我们没有编辑旧端点。\n\n这是我们声明新控制器的方式（整个控制器代码可以在本章节的仓库找到）：\n\
  \n```java\n@RestController\n@RequestMapping(\"/api/v2/rental-properties\")\n@Validated\n\
  public class RentalPropertyControllerV2 {\n    private final RentalPropertyService\
  \ rentalPropertyService;\n    private final RentalPropertyHyperMediaUtils rentalPropertyMediaUtils;\n\
  \n    public RentalPropertyControllerV2(\n            RentalPropertyService rentalPropertyService,\n\
  \            RentalPropertyHyperMediaUtils rentalPropertyMediaUtils) {\n       \
  \ this.rentalPropertyService = rentalPropertyService;\n        this.rentalPropertyMediaUtils\
  \ = rentalPropertyMediaUtils;\n    }\n    // ... 其余在这里\n}\n```\n\n你会识别这个类中的大部分模式，除了：\n\
  \n*   我们现在声明此 URI 将嵌套在 V2 版本中，这样我们就可以保持旧 API 不做任何更改。\n*   我们现在注入了一个 `rentalPropertyMediaUtils`\
  \ Bean，它将帮助我们渲染第 3 级 API 的 URL。\n\n现在让我们看看我们将如何获取单个租赁物业，它将带有超媒体控制（换句话说，客户端可以使用这些执行与我们获取的对象相关的操作有用端点链接）：\n\
  \n\n\n\n\n```java\n@GetMapping(\n    value = \"/{id}\",\n    produces = \"application/json\"\
  )\npublic ResponseEntity<RentalPropertyDescriptor>\n    getPropertyById(@PathVariable\
  \ UUID id) {\n    return rentalPropertyService.get(id)\n        .map(rentalPropertyHyperMediaUtils::\n\
  \            describeRentalProperty)\n        .map(ResponseEntity::ok)\n       \
  \ .orElse(ResponseEntity.status(\n            HttpStatus.NOT_FOUND)\n          \
  \      .body(null));\n}\n```\n\n让我们分析当前的代码：\n\n- 我们声明该方法将返回 `RentalPropertyDescriptor`\
  \ 而不是旧的 DTO 类。\n- 我们从 `RentalPropertyService` 获取通常的 `RentalPropertyDTO`。\n- 我们使用\
  \ `rentalPropertyHyperMediaUtils` 组件将我们的 `RentalPropertyDTO` 封装在 `RentalPropertyDescriber`\
  \ 中（我们将在几分钟后看到它是如何运作的）。\n- 然后，我们继续执行当前算法，它将返回找到的响应；如果查找的 ID 没有对象，则返回 `404 - NOT_FOUND`。\n\
  \n现在，让我们查看获取可用租赁房产的方法，但现在整个集合将被封装在 `CollectionDescriptor` 中：\n\n```java\n@GetMapping(produces\
  \ = \"application/json\")\npublic ResponseEntity<PropertiesCollectionDescriptor>\
  \ getAllProperties() {\n    return Optional.ofNullable(\n        rentalPropertyHyperMediaUtils\n\
  \            .describeRentalPropertyCollection(\n                rentalPropertyService\n\
  \                    .getAllProperties()))\n        .map( describedCollection ->\n\
  \            ResponseEntity.ok().body(describedCollection))\n        .orElse(ResponseEntity.noContent().build());\n\
  }\n```\n\n你可以看到以下内容：\n\n- 我们正在使用 `rentalPropertyService.getAllProperties()` 方法来获取我们拥的所有\
  \ DTO；然后，我们使用 `rentalPropertyHyperMediaUtils` 组件将 DTO 集合封装在针对整个集合的超媒体描述符中。我们将在几分钟后看到它是如何实现的。\n\
  - 我们声明集合描述符的返回可以是 `null`（在不存在 DTO 的情况下），这意味着客户端将在负载中接收不到任何内容。当请求成功但响应中没有负载可以接收时，设置\
  \ HTTP 返回代码 `204` 是一种良好的做法。\n\n正如你看到的，这两个方法在控制器中都足够简单，这保持了代码的隔离性并易于阅读和理解。现在让我们来看看我们的描述符，这样你就知道当客户端向任何端点发送\
  \ HTTP 请求时我们返回的是什么。\n\n### 编写租赁房产超媒体描述符\n\n这是我们实现 `RentalPropertyDescriptor` 类的方式，它是\
  \ `RentalPropertyDTO` 类的容器：\n\n```java\n@EqualsAndHashCode(callSuper = true)\n@Data\n\
  public class RentalPropertyDescriptor\n    extends RepresentationModel<RentalPropertyDescriptor>\
  \ {\n    private RentalPropertyDTO rentalProperty;\n}\n```\n\n足够简单，对吧？让我们来分解一下这段代码（整个类可以在章节仓库中找到）：\n\
  \n- 该类标记了 Lombok 注解以减少我们的样板代码（`@EqualsAndHashCode` 和 `@Data`）。\n- `@Data` 定义此类应该拥有所有属性的\
  \ getter 和 setter，Lombok 会在编译期间自动生成字节码。\n- `@EqualsAndHashCode` 注解赋予 Lombok 指令，以自动生成两个方法——`equals()`\
  \ 和 `hashcode()`。\n- 我们定义了描述符应该封装 `RentalPropertyDTO` 类，这使得 DTO 与相对链接保持隔离。\n- 我们定义了描述符类扩展\
  \ `RepresentationModel`，这是一个 Spring HATEOAS 类，它增加了对超媒体链接的支持。这意味着我们的描述符有一系列属性和辅助方法来将这些链接添加到我们的响应中。\n\
  \n好了，这简单且信息丰富。现在让我们来看看如何为 `RentalPropertyDTO` 集合创建一个描述符（此类可以在章节仓库中看到）：\n\n```java\n\
  @EqualsAndHashCode(callSuper = true)\n@Data\npublic class PropertiesCollectionDescriptor\n\
  \    extends RepresentationModel<PropertiesCollectionDescriptor> {\n    private\
  \ Collection<RentalPropertyDescriptor> describedRentalProperties;\n}\n```\n\n这个类也非常简单，具有以下亮点：\n\
  \n- 它是作为 `RepresentationModel` 类的扩展构建的，该类增加了存储超媒体链接的属性。\n- 该类维护了一个 `RentalPropertyDescriptors`\
  \ 集合，因为我们想要返回单个 DTO 的描述符以及整个集合的描述符。\n\n描述符部分到此结束。让我们进入解决方案的最后一部分。\n\n### 编写 RentalPropertyHyperMediaUtils\
  \ Spring Bean\n\n我们现在可以查看章节仓库中的主要代码部分，我们将其命名为 `RentalPropertyHyperMediaUtils`。它创建了带有链接的响应。让我们先看看如何声明这个类：\n\
  \n```java\n@Component\npublic class RentalPropertyHyperMediaUtils {\n    // ...\
  \ class body\n}\n```\n\n`@Component` 注解来自 Spring Framework 核心。它告诉 Spring 该类应该被视为一个\
  \ Spring Bean——框架将创建一个单例并使其供其他 bean 使用。\n\n- `@Component` 注解是...\n- ` ` ``` 作为输入并到功能描述符。\n\
  - 我们正在创建一个流，以便我们可以使用函数式，is is is more..\n--\n\n the the the the the,,,,.......\n\
  \ is is is ` the the the the the the the the the to functional..\n- `@Controller`\
  \ 和 `@Service` 注解是用于 `@Component` 的两个。\n\n现在，让我们看看如何创建 `RentalPropertyDescriptor`：\n\
  \n```java\npublic RentalPropertyDescriptor describeRentalProperty(\n    RentalPropertyDTO\
  \ propertyDTO) {\n    return Stream.of(new RentalPropertyDescriptor())\n       \
  \ .peek(desc ->\n            desc.setRentalProperty(propertyDTO))\n        .peek(desc\
  \ -> desc.add(\n            WebMvcLinkBuilder.linkOn(RentalPropertyDescriptor.class)\n\
  \                .getPropertyById(propertyDTO.id())\n                .withRel(\"\
  self\")))\n        .findFirst().get();\n}\n```\n\n让我们看看这里一些重要的说明：\n\n- 此类接收 `propertyDTO`\
  \ 作为输入并返回其等效的描述符，它基本上封装了原始 DTO。\n- 我们正在创建一个流，以便我们可以使用函数式风格，这种风格更简洁紧凑。`peek()` 方法意味着我们获取上一个对象，对其进行一些操作，然后移动到下一个函数操作，传递相同的对象引用。它与\
  \ `map()` 不同，`map()` 将把当前操作的输出对象传递给下一个函数。\n- 一旦我们创建了 `RentalPropertyDescriptor`，我们就将\
  \ `RentalPropertyDTO` 添加到其中，然后将链接添加到描述符中。\n- `add()` 方法来自 Spring HATEOAS `RepresentationModel`\
  \ 类。我们自动继承了它。\n- `WebMvcLinkBuilder` 是构建 URI 的关键工具类。我已经在这里的一些注释中添加了一些示例。\n\n\n\n\
  \n\n*   你可以看到，链接构建器的工作原理是找到你选择的控制器类的地址，然后添加租赁属性的 ID，从而为我们正在检索的租赁属性创建一个 URI。\n\n\
  好了！如果你愿意，可以返回前几页查看输出结果，并查看 API 的 JSON 响应中映射的 URIs。让我们继续查看我们的超媒体 `util` 类。下一个方法返回一组属性描述符的集合描述符：\n\
  \n```\npublic PropertiesCollectionDescriptor\n    describeRentalPropertyCollection(\n\
  \        List<RentalPropertyDTO> allProperties) {\n    if(allProperties.isEmpty())\n\
  \        return null;\n    List<RentalPropertyDescriptor> parsedProperties =\n \
  \       parseProperties(allProperties);\n    return Stream.of(new PropertiesCollectionDescriptor())\n\
  \        .peek( cDes ->\n          cDes.setDescribedRentalProperties(\n        \
  \      parsedProperties))\n        .peek(this::addAllPropertiesLink)\n        .findFirst().get();\n\
  }\n```\n\n这个方法非常有趣。让我们来回顾一下它：\n\n*   我们接收了一个普通的租赁属性列表，并将将其封装在描述符中。\n*   我们定义了如果列表为空，该方法应返回\
  \ `null`。\n*   我们有一个工具方法用于将我们的 `RentalPropertyDTO` 列表解析为 `RentalPropertyDescriptors`，现在我们有了一份完整的描述符列表，每个描述符都包含\
  \ URI 和超媒体控制。\n*   现在，我们创建了一个根描述符来封装我们的 `RentalPropertyDescriptors` 列表。我们将 `RentalPropertyDescriptors`\
  \ 列表插入其中，并添加 `GET` `/properties` 超媒体链接。\n*   然后我们返回找到的结果，实际上实际上我们之前创建的根集合描述符。\n\n\
  `describeRentalPropertyCollection()` 方法是最复杂的，因为它将某些调用委托给了其他工具函数。现在让我们来看看这些持久的工具函数：\n\
  \n```\nprivate List<RentalPropertyDescriptor>\n    parseProperties(\n    List<RentalPropertyDTO>\
  \ allProperties) {\n    return allProperties.stream()\n        .map(this::describeRentalProperty).toList();\n\
  }\npublic void addAllPropertiesLink(\n        PropertiesCollectionDescriptor collectionDescriptorDTO)\
  \ {\n    collectionDescriptorDTO.add(\n        WebMvcLinkBuilder.linkTo(\n     \
  \       RentalPropertyControllerV2.class)\n                .withRel(\"allProperties\"\
  )\n    );\n}\n```\n\n我们可以看到将 `rentalPropertyDTOs` 解析为其相应描述符的方法。这实际上使用了我们刚刚看到的函数\
  \ `describeRentalProperty()`。我们从输入列表创建一个 `stream()`，并对于每个对象，我们使用 `map()` 将 `rentalPropertyDTO`\
  \ 元素转换为 `RentalPropertyDescription` 对象。那行代码包含了 Java 函数式编程的特殊语法，这超出了本书的涉及范围。\n\n\
  我们有一个简单的工具方法来向 `RentalPropertyCollectionDescriptor` 添加 `GET` `/properties` URI。你可以将此方法作为参考，以后为你的任何自定义描述符添加任何链接。\n\
  \n现在，让我们最后检查一下类和包结构是如何布局的。\n\n这就是我们通过 Spring HATEOAS 实现带有超媒体控制的 3 级 REST API 的结果：\n\
  \n![图 6.17: 3 级 REST API 的类和包结构](img/B18632_06_17.jpg)\n\n图 6.17：3 级 REST API 的类和包结构\n\
  \n正如你所看到的，为了在响应对象中包含超媒体链接，这里付出了大量的努力和思考。\n\n### 3 级 REST API 值得投入精力吗？\n\n尽管 HATEOAS\
  \ 是一个非常有用的工具，而且 3 级 REST API 的承诺创造了一个让 HTTP 客户端能够发现功能的愿景，但现实是，我们的 API 用户仍然需要详尽的文档来了解如何使用我们的\
  \ API。因此，HATEOAS 并不是创建优秀 API 的万无一策。它可以在某些方面帮助我们的客户端，但可能并没有人们承诺的那么好。\n\n不过，我确实见过过非常棒的超媒体控制实现。也许当用户获取这些内容时，你可能希望他们了解某个特殊操作。\n\
  \n# 总结\n\n在本章中，我们涵盖了大量内容，以确保你的 API 设计良好、测试充分且结构合理。我们还学习了如何随时间创建服务。现实是，我们的 API 用户仍然需要详尽的文档来了解如何使用我们的\
  \ API。因此，HATEOAS 并不是创建优秀 API 的万无一策。它可以在某些方面帮助我们的客户端，但可能并没有人们承诺的那么好。\n\n最后两章代表了进入微服务思维的关键步骤。接下来的章节将涵盖大量的技术细节。\n\
  \n# 7 处理数据和演进你的微服务\n\n欢迎来到第 7 章！在本章中，我们将探索关于如何创建服务的数据持久化层的几个主题。这里的主题将使用 SQL 数据库实现，但我们将深入探讨架构，这将帮助你理解应该如何处理任何数据库类型的数据建模和持久化。\n\
  \n我们将在本章中涵盖以下主题：\n\n*   使用 Spring 应用程序中的数据持久化\n*   响应式与非响应式数据处理\n*   SQL 与 NoSQL\
  \ 数据存储\n*   微服务与单体应用的数据设计\n*   实现非响应式 SQL 数据库持久化层\n*   JpaRepository：Spring Data\
  \ 中首选的 SQL 接口\n*   在 Spring Data 中处理事务\n*   使用 `NamedParameterJdbcTemplate` 运行原生\
  \ SQL\n\n本章从如何对数据建模架构决策以及每种方法的成本进行通用解释开始。然后，我们将进入实现阶段，向你展示使用 Spring Data 进行不同级别的数据库交互。\n\
  \n本章还将让你理解在讨论每个主题时如何随时间演进你的服务。你经常会遇到需要某种重构的微服务。我们将向你展示如何在 Spring 中通过对同一服务接口使用多个实现来实现。\n\
  \n\n\n\n\n以下是本章中创建的类和服务的完整代码：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07/rental-property-microservice`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07/rental-property-microservice)\n\
  \n# Spring 应用中的数据持久化\n\n到目前为止，我们一直关注如何启用 Spring Web API，而不过度关注数据持久化。在我们的 RentalProperty\
  \ API 中，服务层实现目前仅使用一个简单的 map 在运行时收集租赁物业对象。当然，这不足以构建一个完整的 REST API。显然，对象需要被正确地持久化。\n\
  \n事实是，对于应用程序开发者来说，添加真实数据库的支持可能是一项非常麻烦的任务。在编写 Spring 应用时，大多数开发者只想直接开始编写代码，而不想过多关心数据库基础设施的细节。事实上，即使是选择数据库技术以及如何连接它也会因公司、因云平台而异。\n\
  \n以下是可能影响数据库技术选择的一些情况：\n\n* 你的公司可能已经为你的应用准备了一个偏好的数据库实例供连接\n* 大公司可能会使用本地设备，例如 Oracle\
  \ 的 Exadata 服务器\n* 你可以连接到云端的托管数据库，例如 Amazon Aurora\n* 公司可能在 Kubernetes 集群中部署了使用\
  \ Postgres 等工具的数据库 pod\n\n数据库连接的选项有很多，因此我们将首先为你提供一种非常灵活的方式来开始编写你的服务代码。为了理解我们将要做什么，让我们回顾一下通用的\
  \ Spring 应用结构图：\n\n![Figure 7.1: Spring application anatomy](img/B18632_07_1.jpg)\n\
  \n图 7.1：Spring 应用结构\n\n当我们查看此图表时，可以看到 `Interfaces`（接口）和 `Implementations`（实现）水平层是独立构建的。如果你观察它们如何影响\
  \ `Persistence`（持久化）垂直层，这意味着 Spring 的设计方式让你倾向于编写持久化存储库接口，这些接口与指定实际使用数据库的代码完全分离。\n\
  \n换句话说，你编写用于管理数据的代码可以在不进行任何更改的情况下，用于你喜欢的任何数据库实例，只要数据库类型相同（在本中我们将与 SQL 数据库工作）。你可以通过回顾`第\
  \ 4 章`来回顾我们拥有的数据库类型。要更改数据库实例，只需为 Spring 提供一些配置选项和依赖项，即可：你就可以连接到不同的数据库实例甚至不同的数据库供应商。Spring\
  \ 将提供你连接到不同数据库所需的基础设施。\n\n通过仅更改配置文件和依赖项随时指向不同的数据库类型，这在以下情况下非常有帮助：\n\n* 你正处于编写应用程序的初期，开发团队仍然不确定切要连接到哪个数据库实例，因此你可以从内存数据库开始，并确保其余开发工作不受阻塞。\n\
  * 你的公司正在迁移到另一种数据库架构，你需要在不影响实现的情况下重新配置连接，例如从本地迁移到云端托管数据库。\n* 你在不同的环境中部署同一个应用程序，每个环境都有不同的数据库实例需要连接（dev、stg、prod\
  \ 等）。这对于在进入环境之前运行质量保证过程非常有用（我们将在后续章节中查看如何实现）。\n* 你正在运行集成测试，需要在不更改代码的情况下提供一个测试数据库。\n\
  * 你的公司正在迁移到另一个数据库（例如从 Oracle 迁移到 Postgres），你需要更改配置并对代码进行非常微小的更改。\n\n在其他场景下，将数据存储库实现与数据库连接解耦也很有用。在本章中，我们将连接到内存数据库。\n\
  \n# 响应式与非响应式数据处理\n\n在考虑数据时的另一个关键因素是我们有两个基本选择：响应式（reactive）和非响应式（non-reactive）。在本节中，让我们讨论这两个选项。\n\
  \n## 非响应式数据处理\n\n在`non-reactive data handling`（非响应式数据处理）中，我们编写在执行数据库操作时会阻塞单个线程。正如你在前面的章节中所看到的，当你有大量并发请求时，线程阻塞操作会让你的应用程序变慢。你仍然可以在\
  \ Spring 应用上启用虚拟线程，使应用程序运行更快。\n\n非响应式数据处理适用于 Spring Web 应用，或你想到的任何对处理极高并发请求没有严格要求的应用。\n\
  \n## 响应式数据处理\n\n另一方面，`reactive data handling`（响应式数据处理）代码将在不阻塞线程的情况下运行。当应用启动 I/O\
  \ 操作时，该代码将进入等待模式。当请求的数据可用时，Spring 将再次运行剩余代码，使得线程可以在许多请求之间共享。\n\n## SQL 与 NoSQL 数据存储\n\
  \n今天，每个具有经验的开发者都知道应用程序可以有各种数据库。我们有许多方法来存储数据。但所有类型可以分为两大类：SQL 或 NoSQL。\n\n## SQL\
  \ 数据库\n\n`Structured Query Language`（`SQL`）数据库是数据存储机制，可以帮助你保持数据的完整性。它们具有几个特性：\n\n\
  * 固定的表列格式：你的表将对数据强制常规格式，这意味着所有行都具有相同数量的属性（列），所有属性都具有相同的类型。这意味着你非常有力的保证，你的所有数据将是高度标准化的。\n\
  * 约束：你可以根据不同表中其他数据的数据设置创建数据时的限制。在我们的 HomeIt 示例中，我们可以说除非有房东，否则无法创建租赁物业。\n\n\n\n\n\
  \n- **ACID 保证**：在使用 SQL 数据库时，你可以让事务处理许多不同表中的大量数据，并且只有当事务中的每一个操作都成功时，事务才会成功。这意味着如果其中一个操作失败，所有其他操作都将回滚到之前的状态，数据库将保持完整的数据完整性。此外，并发事务之间不会相互影响。`ACID`\
  \ 代表 `Atomic`（原子性：单个请求中的所有操作应该像单个操作一样工作）、`Consistent`（一致性：使用约束来保证数据完整性）、`Isolated`（隔离性：一个事务不会受到另一个并发事务的干扰）以及\
  \ `Durable`（持久性：除非更改数据的事务成功，否则数据将保持其状态）。\n\n使用 SQL 数据库有两个非常有趣的意义。首先，你在如何创建对象的方式上将无法拥有那么大的灵活性。其次，每个对象应该具有相同的属性和类型。\n\
  \n约束是在数据库中处理的，这意味着具有许多约束的数据模型会比约束较少的数据模型慢。\n\n在处理需要高度完整性的数据时，你很可能想要使用 SQL 数据库。最常见的应用当然是记录财务交易。此外，医疗记录、合规性要求以及任何听起来像高风险的数据都应该是\
  \ SQL 数据库的候选。\n\n## NoSQL 数据库\n\n当不同表之间的数据完整性不是特别优先的需求时，你可以求其他类型的数据库。它们都属于`非结构化查询语言`（`NoSQL`）数据库。根据其结构，这些数据库将帮助各种用例。最著名的是\
  \ `MongoDB`，它是一个文档数据库。\n\n`MongoDB` 可以存储非结构化数据。这意味着如果你的数据在某种程度上是不可预测的，且格式具有高度变性，那么可以使用\
  \ `MongoDB` 成功存储这些数据。对于 `HomeIt`，我们可以将租赁物业数据作为 NoSQL 文档存储，允许房东为其注册的租赁物业添加尽可能多的描述部分。代表不同房产的数千个文档将存储在一个\
  \ `MongoDB` 集合中。每个部分都是文档的不同字段，以便房东在描述中更具创意。\n\n在你的 `Spring` 应用中，还有其他出色的 NoSQL 数据库：\n\
  \n- **Cassandra**：实现为宽列存储，针对高可用性和可扩展性进行了优化，适用于物联网（`IoT`）数据、时间序列数据和实时分析。\n\n- **Redis**：键值存储，提供快速的内存数据访问，非常适合缓存、会话管理、实时分析和消息中间件。\n\
  \n- **Neo4j**：专为处理高度连接数据设计的图数据库，适用于社交网络、推荐引擎和网络分析。\n\n- **Couchbase**：具有集成缓存和全文搜索能力的文档存储，适用于交互式\
  \ Web 和移动应用。\n\n- **Elasticsearch**：针对全文搜索、分析和复杂搜索查询优化的搜索引擎，适用于日志和事件数据分析。\n\n如你所见，NoSQL\
  \ 数据库有很多用例。`Spring` 包含了用于使用所有数据库的驱动程序和依赖项。\n\nNoSQL 数据库的其他重要特性如下：\n\n- 因为开发者通常不会对\
  \ NoSQL 数据设计设置很多约束，这通常意味着更快的处理速度。但你通过移除 SQL 数据库中的约束也可以获得几乎相同的效果。\n\n- 如果你有许多需要应用到\
  \ NoSQL 数据上的约束，这意味着你将必须在应用程序中实现它们。这意味着如果你有并发事务访问同一个文档，你可能会面临许多复杂性。\n\n- 将约束移到数据库之外意味着能以更少的钱获得更多的读写性能，但你通常放弃了\
  \ `ACID` 保证。架构决策总是伴随着代价。\n\n如你所见，使用 NoSQL 数据库应该谨慎行之。你需要确保你不需要诸如 `ACID` 事务这样的功能。\n\
  \n### 注意事项\n\n由于本章主要关于如何在 `Spring` 应用中管理数据，我需要向你说明并警告，有整本书的书都是关于如何正确处理数据的。如果你想真正深入研究这个课题，我推荐将\
  \ Martin Kleppmann 写的书籍*Designing Data-ensive Applications: The Big Ideas Behind\
  \ Reliable, Scalable, and Maintainable Systems*作为一个很好的起点。它将完美地补充本章，让你成为一个更优秀的数据架构师。\n\
  \n现在，我们需要讨论在应用程序中实现数据结构和持久化需要什么程度的复杂性。\n\n## 微服务与单体应用数据设计\n\n在互联网早期，数据设计严重侧重于确保数据完整性。由于大多数应用程序是单体的，数据库模式会将应用程序中的所有实体和对象都集中在一个处。\n\
  \n这种中心化的方法是有益的，因为它允许使用约束来有效地强制执行各种业务规则。此外，数据库还提供了 `PL/SQL`（过程语言扩展），它们本质上是数据库内部用于各种目的的程序。\n\
  \n然而，在现代，广泛使用 `PL/SQL` 和大型数据库模式通常被认为是反模式，因为不同的领域被混合在同一个代码库和数据库中，使其更难以维护。\n\n随着微服务架构的出现，通用规则是每个服务都应该包含自己的数据库。但所有的梦想都会终结，微服务架构也有其缺点。随着时间的推移，原始微服务建议的局限性变得显而易见。为每个微服务设置独立数据库的主要问题是在尝试执行影响多个服务的事务时产生的复杂性。例如，在我们的初创公司\
  \ `HomeIt` 中，当租客为已批准的租赁提议付费时，事务必须确保支付服务和租赁提议服务之间的一致性。除非租赁提议敲定并允许租客入住，否则你不想接受租客的付款。\n\
  \n为了确保这种分布式事务能够正常工作，你需要设计服务，使得如果一个服务失败，其他服务的状态也相应更新。这个例子只涉及两个服务，当你向事务中添加更多服务时，复杂性会呈指数级增长。例如，如果你添加一条规则，规定如果房产已出租则它不应出现在搜索结果中，你需要在同一个事务中协调三个服务。\n\
  \n如你所见，微服务架构并非没有挑战。放弃大型、中心化的模式意味着巨大的代价。在单个数据库上运行相同的事务要简单得多，因为你可以确保对多个表的更新在单个事务中完成。数据库会处理\
  \ ACID 保证。\n\n总而言之，微服务架构将一直存在，因此你必须有意识地权衡并设计你的服务。有一些你必须做的的关键决策。让我们在本节中查看它们。\n\n\
  ### 数据复杂性与粒度级别\n\n\n\n\n当你设计一个服务实体（例如我们的 `RentalProperty` 对象）时，你需要评估你希望该对象具有多大复杂程度。你是希望\
  \ `RentalProperty` 只是一个属性尽可能少的扁平 Java 对象，还是希望让它“膨胀化”，包含许多嵌套对象？\n\n如果你选择一个包含大量嵌套对象的、更完整且更复杂的对象，你的\
  \ API 将在单次调用中返回大量数据，这使得对象在网络中传输变得更加沉重。此外，更新操作可能会花费更长时间，因为你可能正在更改大量的嵌套数据，这可能会触发许多外键约束。你的微服务的内存占用也将需要更大，特别是当你的应用程序需要处理大型对象列表时。\n\
  \n在某些情况下，发现允许开发者检索数百个非常膨胀的对象列表 并不罕见，而且每个对象都包含许多嵌套对象（例如，获取一个房东列表，并将他们所有的租赁房都作为房东的属性）。这些操作对于服务的内存（RAM）、网络和数据库来说都是非常昂贵的。你应该谨慎地使用它们。\n\
  \n另一方面，在端点上使用轻量级对象可能意味着你需要从不同的服务中多次获取数据，从而通过多次请求给网络带来负担。想象你需要从一个服务获取房东列表，然后从另一个微服务获取他们的租赁房列表。取决于它在应用程序中的用法方式，这可能会变得不可忍受。\n\
  \n让我们来看看你决策的另一个关键驱动因素。\n\n## 数据库组织\n\n另一个重要的决策是关于如何组织你的数据库。当然，如果你有很多不同类型的数据库，你只能在不同的实例中存储信息。假设你有一个\
  \ NoSQL 数据库来存储属性属性，可能有一个 SQL 数据库来存储用户信息，可能可能有一个图数据库来存储用户和合同之间的关系……这意味着你只能在不同的地方托管数据。\n\
  \n但如果你只使用单一数据库类型——假设是 `Postgres`——你可能可以在同一个数据库实例中存储不同服务的 schema。将每个微服务隔离在不同的 schema\
  \ 中是可能的，这可以成为优势，因为你只需要一个实例来进行备份和维护，但也可能成为一种负担，因为所有微服务实例都会给同一个数据库实例带来压力。如何组织数据库取决于你和架构团队。决策应该同时考虑功能性需求和非功能性需求。这意味着需要回到前面的章节来理解以下内容：\n\
  \n* 哪些用户应该能够访问这些数据，以及他们何时访问？\n* 一个操作每天会被使用多少次？\n* 用户可以等待很长时间得到结果，还是应用程序应该在极低延迟内返回结果？\n\
  * 同时会有多少用户访问同一个服务？\n\n从产品角度以及也从频率和场景角度来研究应用程序是如何被使用的，是做出最佳设计的关键。\n\n这是我喜欢向与我合作的团队提出的一个关键问题，每当我们面临此类权衡时：*我们想要*遇到*什么样的问题？*\n\
  \n因为问题总会发生。一旦你做出了架构决策，你最终将面临该选择所带来的负担。这意味着如果一个系统可能失败，它最终将会失败的。\n\n我们将在未来的章节中更多地讨论性能、韧性和资源限制。现在，废话不再说，让我们开始编写我们的租赁服务，并使用\
  \ Spring 为开发者提供的各种数据处理策略。\n\n# 实现非响应式（non-reactive）SQL 数据库持久化\n\n直至今天，SQL 数据库仍然是任何类型\
  \ API 最重要的存储类型。由于非响应式实现在整个行业被广泛使用，让我们从这个选项开始，帮助你理解在 Spring 中实现持久化层的各种方法。\n\nSpring\
  \ Data 项目为你想要实现的任何数据架构提供了极佳的功能。让我们看看它是如何适用于非响应式 SQL 数据库持久化的。\n\n## 为开发数据库添加支持\n\n\
  本章代码也将基于 `RentalProperty` Spring 应用程序完成。完整代码可以在此处找到 [`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07)。\n\
  \n由于我们关注尽可能地启用应用程序以编写数据持久化存储库，我们将启用内存数据库作为开发的起点。第一步是添加正确的依赖。你可以将此代码添加到 `build.gradle`\
  \ 文件的 `dependencies` 部分：\n\n```\nimplementation 'org.springframework.boot:spring-boot-starter-data-jpa'\n\
  // 内存数据库，仅用于测试\nimplementation 'com.h2database:h2'\n```\n\n有了这些行代码，你将拥有所需的所有依赖。\n\
  \n现在我们已经有了正确的依赖，让我们配置我们的内存数据库。你需要在你的租赁房应用程序上设置一些属性。这是一个方便的方法，通过你可以设置运行持久化层所需的所有属性：\n\
  \n```\nprivate static void databaseProperties\n    (SpringApplication app) {\n \
  \   // # PostgreSQL 模式 H2 数据库配置\n    app.setDefaultProperties(\n      Map.of(\n\
  \      \"spring.datasource.url\",\n      \"jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL\"\
  ,\n      \"spring.datasource.driverClassName\",\n          \"org.h2.Driver\",\n\
  \      \"spring.datasource.username\",\n          \"sampleuser\",\n      \"spring.datasource.password\"\
  ,\n          \"samplepass\",\n      \"spring.jpa.database-platform\",\n        \
  \  \"org.hibernate.dialect.H2Dialect\",\n      \"spring.h2.console.enabled\",\n\
  \          \"true\",\n      \"spring.h2.console.path\",\n          \"/h2-console\"\
  ,\n      \"spring.jpa.hibernate.ddl-auto\",\n          \"create\",\n      \"spring.jpa.show-sql\"\
  ,\n      \"true\"));\n}\n```\n\nSpring 允许通过类似的属性设置各种连接。在我们的情况下，我们信号表明这是一个支持 Postgres\
  \ 的内存数据库。此方法应该在你的 `main` 类中这样调用：\n\n```\npublic static void main(String[] args)\
  \ {\n    SpringApplication app =\n        new SpringApplication(RentalPropertyApplication.class);\n\
  \    virtualThreads(app);\n    databaseProperties(app);\n    app.run(args);\n}\n\
  ```\n\n注意，我提取了 `virtualThreads` 方法以便添加虚拟线程支持。\n\n将这些指令添加到应用程序后，你的程序不仅可以访问内存数据库，在运行程序时还可以访问完整的\
  \ SQL 终端。这就是 `spring.h2.console.enabled` 属性的作用。通过这种方式，你将能够连接到内存 H2 数据库并运行任何所需的 SQL\
  \ 查询。这使得检查持久层状态变得更容易。H2 是一个用 Java 编写的非常轻量级的开源数据库。它对于快速为应用程序添加 SQL 能力非常有用，特别是原型设计阶段。\n\
  \n启动 Spring 应用时，你应该能在控制台日志中看到这一行：\n\n```\no.s.b.a.h2.H2ConsoleAutoConfiguration\
  \ : H2 console available at '/h2-console'. Database available at 'jdbc:h2:mem:testdb'\n\
  ```\n\n这意味着你可以在浏览器中访问此 URL `http://localhost:8080/h2-console` 来连接到你的内存 SQL 开发数据库实例。\n\
  \n\n\n访问此 URL 时，你将看到以下页面：\n\n![图 7.2：H2 数据库 SQL 登录界面](img/B18632_07_2.jpg)\n\n图\
  \ 7.2：H2 数据库 SQL 登录界面\n\n从日志信息可以看出，当你将 `JDBC URL` 更改为 `jdbc:h2:mem:testdb` 时，就可以连接到此数据库。然后在\
  \ `User Name` 字段中添加 `sampleuser`，并在 `Password` 字段中添加 `samplepass`。设置好字段并点击 `Connect`\
  \ 后，你会看到：\n\n![图 7.3：H2 SQL 控制台](img/B18632_07_3.jpg)\n\n图 7.3：H2 SQL 控制台\n\n这是一个完整的\
  \ SQL 控制台，连接到 Spring Data 内存 H2 数据库实例，这有助于开发和快速原型设计。但由于你的持久层没有编写任何代码，因此我们没有任何应用程序表。\n\
  \n我们在应用程序属性中设置的另外两个有趣属性是 `spring.jpa.hibernate.ddl-auto` 和 `spring.jpa.show-sql`。我们设置这些属性值的方式告诉\
  \ Spring：如果数据库架构尚未创建，则创建它；并在启动应用程序时在控制台输出中显示执行的 SQL 命令。在代码中声明实体后，就可以看到这些输出。\n\n\
  稍后我们将再次连接到数据库实例。让我们先为服务器添加一些新代码。\n\n## 定义要持久化的实体\n\nSpring Data 提供了多种方式供你编写数据库访问和数据处理程序。我们将介绍最重要的几种方式以及为什么要使用它们。但在选择使用何种工具从表中保存或检索数据之前，你将需要定义要持久化的对象。这是任何\
  \ Spring API 持久层实现中最重要的部分。这些对象被称为 `entities`（实体）。\n\n`entity` 是你的领域对象在数据库中的实际表示。通常，一个实体代表你其中一张表中的行（如果你处理的是\
  \ NoSQL 数据库，则代表集合/文档）。\n\n在本章中，正如你所知到的，我们将深入研究实现 RentalProperties 服务持久持久几种方法方法。在我们的示例中，将实现从\
  \ `RentalPropertyDTO` 类到 `RentalPropertyEntity` 类的一一映射。这意味着每当我们调用其中一个 API 端点时，我们都希望尽可能简单地将\
  \ DTO 转换为实体，以便你理解 Spring Data 中持久层是如何工作的。\n\n让我们开始吧。以下代码是实现 `RentalPropertyEntity`\
  \ 类的示例。我们这样声明该类：\n\n```\n@Entity\n@Table(name = \"rental_properties\")\n@Data\n\
  public class RentalProperty {\n    @Id\n    @Column(updatable = false, nullable\
  \ = false)\n    private UUID id;\n    @NotNull(message = \"Landlord id is required\"\
  )\n    @Column(nullable = false)\n    private UUID landlordID;\n    @NotEmpty(message\
  \ = \"Name is required\")\n    @Column(nullable = false)\n    private String name;\n\
  \    @NotEmpty(message = \"Address is required\")\n    @Column(nullable = false)\n\
  \    private String address;\n    @NotEmpty(message = \"City is required\")\n  \
  \  @Column(nullable = false)\n    private String city;\n    @NotEmpty(message =\
  \ \"Country is required\")\n    @Column(nullable = false)\n    private String country;\n\
  \    @NotEmpty(message = \"Zip code is required\")\n    @Column(nullable = false)\n\
  \    private String zipCode;\n    @NotNull(message = \"Rent is required\")\n   \
  \ @Column(nullable = false)\n    private Double rent;\n    @PrePersist\n    protected\
  \ void onCreate() {\n        if (id == null) {\n            id = UUID.randomUUID();\n\
  \        }\n    }\n}\n```\n\n这里的观察结果非常重要：\n\n*   `@Entity` 注解告诉 Spring 该类将用作表行的表示。\n\
  *   `@Table` 注解帮助你命名表。你可以设置任何你认为合适的名称。如果你漏掉了此注解，Spring 将使用实体的名称作为数据库中对应表的名称。也可以指定表所在的架构（schema），但\
  \ H2 不支持这一点，因此我们将实现我们的租赁逻辑。\n*   `@Data` 注解来自 Lombok。\n*   `@Id` 注解将 `id` 定义为主键。\n\
  *   `@Column` 注解用于配置数据库列。\n*   `@NotEmpty` 和 `@NotNull` 注解用于确保数据存在。\n*   `@PrePersist`\
  \ 注解确保该方法在 Spring Data 保存实体之前被调用。\n*   `UUID.randomUUID()` 方法用于生成唯一标识符。\n*   此代码中的另一个关键点是使用\
  \ `@PrePersist`。它确保该方法在 Spring Data 保存实体之前被调用。这就是我将此实体添加到项目中的地方：\n\n![图 7.4：RentalProperty\
  \ 实体](img/B18632_07_4.jpg)\n\n图 7.4：RentalProperty 实体\n\n现在我们已经在项目中声明了这个实体，如果重新运行\
  \ Spring ，将出现新的日志，证明 Spring Data 能够创建与实体匹配的列。我们得到的输出：\n\n```\nHibernate: drop table\
  \ if exists rental_properties cascade\nHibernate: create table rental_properties\
  \ (rent float(53) not null, id uuid not null, landlordid uuid not null, address\
  \ varchar(255) not null, city varchar(255) not null, country varchar(255) not null,\
  \ name varchar(255) not null, zip_code varchar(255) not null, primary key (id))\n\
  ```\n\n你可以看到，在这种开发设置中，Spring 将始终在我们的 H2 内存数据库中重建所有表。这提供了一个非常快速且有价值的开发环境。但是，以后当你连接到远程数据库实例时，你可能想为\
  \ `spring.jpa.hibernate.ddl-auto` 使用不同的属性值，即 `validate`。`validate` 指令告诉 Spring 检查表是否存在以及列的类型是否与实体类中声明的类型相同。这对于确保你的应用程序与正在使用的数据库实例兼容非常有用。\n\
  \n现在我们已经知道如何声明实体，让我们开始编写持久化或检索数据库表行的代码。有不同的方法可以实现这一点，我们现在进行探索。\n\n以下注解对于表示列中的数据也很有用：\n\
  \n*   `@Lob`：指定持久化属性应被存储为大对象。\n*   `@Enumerated`：指定持久化属性应被存储为枚举。\n*   `@Temporal`：指定持久化属性的日期/时间精度。\n\
  *   `@Transient`：标记字段被 JPA 忽略且不持久化到数据库中。\n\n接下来，我们将简单讨论一下创建不同实体之间的关系。\n\n### 声明实体之间的关系\n\
  \n如果你想在代码中声明实体之间的关系，这些是实用的实体注解。我不建议你使用这些注解声明类，除非你想在 API 中显式地表达实体约束，这并不总是明智之：\n\n\
  \n\n\n\n* `@OneToOne`: 定义两个实体之间一对一的关系\n* `@OneToMany`: 定义两个实体之间一对多的关系\n* `@ManyToOne`:\
  \ 定义两个实体之间多对一的关系\n* `@ManyToMany`: 定义两个实体之间多对多的关系\n* `@JoinColumn`: 指定关联关系的外键列\n\
  * `@JoinTable`: 定义多对多关系的连接表\n\n这些注解是 Java Persistence API 中 `javax.persistence`\
  \ 包的一部分。你可以在 `javax.persistence` 的 javadocs 中看到每个注解的清晰示例：[`docs.oracle.com/javaee%2F6%2Fapi%2F%2F/index.html?javax/persistence/JoinColumn.html`](https://docs.oracle.com/javaee%2F6%2Fapi%2F%2F/index.html?javax/persistence/JoinColumn.html)。\n\
  \n由于声明中涉及了多个不同的表，使用这些注解会让你的应用程序编写变得更加复杂，维护也更加困难。此外，你的代码也不会非常易读。\n\n由于纯微服务方法要求存在简单的\
  \ API 来表达非常简单的领域对象，因此你不应该在微服务中声明大量的实体，也不应该在代码中声明过多的关系。每当你需要在一个实体中引用另一个实体时，只需在那里添加\
  \ UUID `id` 属性，并确保你的服务知道如何验证该信息。你越简单，定义 API 的速度就越快，进入生产环境也越快。\n\n大量使用这些关系注解揭示了你的应用程序正在变成一个单体，单个服务内部存在大量关系，这是一种反模式。确保你的服务尽可能简单。ID\
  \ 通常是你需要的，以确保能够从其他系统中检索对象。\n\n一个有趣的事实：如果你的产品团队增加了大量功能，而你发现每次需要发布新功能时都要向数据库添加许多新实体或列，那么可能是你时候向上跳一个抽象并进行重构了。以下是一些供你思考的想法：\n\
  \n* 现在是时候从当前的单体中拆分出一个微服务了吗？\n* 现在是时候创建一个更高抽象的领域对象了，它能够存储所有这些用例的数据，而不需要你频繁更改数据库吗？\n\
  \n例如，假设你正在一家公司工作，该系统有一个 `car` 服务，产品团队开始提出支持其他类型车辆的需求，而你正强迫你的 `car` 服务也支持这些用例，并为服务添加了新属性。在开发期间你将面临许多限制。也许你和你的团队应该执行以下操作之一：\n\
  \n* 拆分出一个更通用的 `vehicle` 服务，它可以托管汽车以及你拥有的任何车辆，这样你的数据库现在就有更通用的表和列名\n* 创建其他服务来处理其他类型的车辆\n\
  \n这两个想法都符合这样一个理念：一旦你完全理解了产品团队想要交付的 5 年路线图，就应该对你的架构进行前瞻性设计。\n\n### 在列中作为 JSON 写入聚合对象\n\
  \n如果你需要在实体中使用嵌套对象，但又觉得它们不应该拥有自己的表，可以将它们作为 JSON 对象写入表中的单列中。如果你想将此属性作为 JSON 发送到数据库的单列中，你应该这样定义实体属性：\n\
  \n```\n@Lob\n@Convert(converter = JsonAttributeConverter.class) @Column(columnDefinition\
  \ = \"TEXT\")\nprivate Address address;\n```\n\n这表示名为 `address` 的属性将作为我们实体的子对象存在。但每当我们我们需要向表中写入该对象或从表中读取它时，Spring\
  \ Data 都会调用转换器类，并将转换后的值读取/写入属性的列中。\n\n这就是我们编写转换器类的方式，它接收 `Address` 类，将其序列化为 JSON\
  \ 并将其存储在列中。然后，当我们要求 Spring Data 从表中读取该类时，转换器类可以将 JSON 解析回 `Address` 类。这是我们刚才提到的\
  \ `Address` 对象的示例：\n\n```\npublic record Address (\n    String streetAddress,\n\
  \    String city,\n    String zip,\n    String country\n){}\n```\n\n如你所示，我们正在使用\
  \ `record` 类型，因为这是一个用于持有数据的简单类。\n\n从代码中可以看出，`Address` record 是一个聚合了地址数据的对象。我们需要一个\
  \ `AddressConverter` 类来帮助 Spring Data 将数据库读/写此对象。其工作原理如下：\n\n```\n@Converter\npublic\
  \ class AddressConverter\n    implements AttributeConverter<Address, String> {\n\
  \    private final ObjectMapper objectMapper =\n        new ObjectMapper();\n  \
  \  @Override\n    public String convertToDatabaseColumn(Address address){\n    \
  \    try {\n            return objectMapper\n                .writeValueAsString(address);\n\
  \        } catch (ProcessingException e) {\n            throw new IllegalArgumentException(\"\
  Error converting Address to JSON\", e);\n        }\n    }\n    @Override\n    public\
  \ Address convertToEntity(String dbData){\n        try {\n            return objectMapper.readValue(dbData,\
  \ Address.class);\n        } catch (IOException e) {\n            throw new IllegalArgumentException(\"\
  Error converting string to Address\", e);\n        }\n    }\n}\n```\n\n`Address`\
  \ record 将将帮助我们简化 `RentalProperty` 类：\n\n```\n@Entity\n@Table(name = \"rental_properties\"\
  )\n@Data\npublic class RentalProperty {\n    @Id\n    @Column(updatable = false,\
  \ nullable = false)\n    private UUID id;\n\n    @NotNull(message = \"Landlord is\
  \ required\")\n    @Column(nullable = false)\n    private UUID landlordID;\n\n \
  \   @NotEmpty(message = \"Name is required\")\n    @Column(nullable = false)\n \
  \   private String name;\n\n    @Lob\n    @Convert(converter = AddressConverter.class)\n\
  \    @Column(columnDefinition = \"TEXT\")\n    private Address address;\n\n    @NotNull(message\
  \ = \"Rent is required\")\n    @Column(nullable = false)\n    private Double rent;\n\
  \n    @PrePersist\n    protected void onCreate() {\n        if (id == null) {\n\
  \            id = UUID.randomUUID();\n        }\n    }\n}\n```\n\n当我们把 `Address`\
  \ 作为 `RentalProperty` 类的子对象时，我们可以移除其他可能让原始实体变得杂乱的原始属性。现在，通过在将数据保存到 `RentalProperty`\
  \ 表时将其 JSON，我们将地址数据隔离了出来。\n\n注意，在最后一个示例中，我们可以将 `Address` 的 `columnDefinition` 值改为\
  \ `jsonb` 而不是 `TEXT`。这里有一个很好的理由，正如我们在后续章节中看到的。\n\n### 其他实体生命周期注解\n\n这里是一些可以在实体生命周期期间触发方法的有趣注解。这些注解非常重要，特别是当你的实体在通过不同阶段时需要调用业务规则或安全系统时，或者你想通过额外的日志来调试系统时：\n\
  \n* `@PrePersist`: 在第一次持久化（插入到数据库）之前触发\n* `@PostPersist`: 在实体持久化（插入到数据库）之后触发\n*\
  \ `@PreUpdate`: 在更新数据库之前触发\n* `@PostUpdate`: 在更新数据库 之后触发\n* `@PreRemove`: 在移除实体（从数据库删除）之前触发\n\
  * `@PostRemove`: 在移除实体（从数据库删除）之后触发\n\n\n\n\n\n- **@PostLoad**: 在实体从 `database.Jsonb`\
  \ 类型列加载后调用\n\nPostgres 是一个非常有意思的数据库。尽管它传统上是一个功能齐全的 SQL 数据库，但具有许多许多特性。其中之一就是支持将 JSON\
  \ 对象作为基本类型存储在表列中。这允许 Postgres 提供特有的 JSON 查询，这可以为你的数据建模工作带来巨大改变。\n\n在最后一个示例中，通过将表中的\
  \ `Address` 字段设置为 `jsonb` 列，允许你像对待文档一样对 `Address` 字段进行操作并运行查询。事实上，无论你在该 `Address`\
  \ 列中存储了什么 JSON 对象，你都能够对该对象进行特殊的 JSON 搜索。你可以向该对象中添加尽可能多的新属性。没问题。只要你更新了转换器类，列就会知道如何存储它。\n\
  \n最相关的 SQL 数据库也支持类似的功能。Oracle、SQL Server 和 MySQL 都提供了方法，让你存储 JSON 数据并查询这些数据，就好像该列是一个\
  \ NoSQL 文档一样。\n\n在实体中以 JSON 格式存储子对象可以极大地减少你应用程序中的样板代码和表数量。决策点在于：如果子对象只能从父实体访问，那么它就是作为其父实体表中\
  \ JSON 列的理想候选者。这可能会影响你对 SQL 数据库的选择。现在你有了一种整洁的方法，可以让你的实体在数据库中更加灵活，而不会让 SQL 脚本变得复杂，也不需要编写许多不同的表来存储新数据。\n\
  \n如果你带有这个特殊的 JSON 特性重新运行 Spring 应用程序，这就是当 Spring 创建表时你得到的 SQL 输出：\n\n```\nHibernate:\
  \ drop table if exists rental_properties cascade\nHibernate: create table rental_properties\
  \ (rent float(53) not null, id uuid not null, landlordid uuid not null, name varchar(255)\
  \ not null, address jsonb, primary key (id))\n```\n\n如你所示，`address` 属性现在被声明为 `jsonb`\
  \ 列，即使在 H2 内存数据库中也是如此。这对于让你进行快速原型开发简直有多棒呢？\n\n目前这种方法只有一个问题：在使用 H2 数据库时，我们无法使用特有的原生\
  \ JSON 搜索查询。因此，我们暂时使用文本类型。请记住，当你连接到真实数据库时，可以切换到特殊的列类型。\n\n在建模实体时有很多需要考虑的地方。现在让我们进入允许我们检索和存储这些实体的代码。\n\
  \n## Spring Data 中的 ORM 与原生 SQL\n\n在编写与数据库交互的代码时，Spring 提供了两种极端方案：你既可以对访问和存储数据时执行的确切\
  \ SQL 语句进行细粒度的控制，也可以让框架决定要执行的适当 SQL 语句。\n\n允许 Spring 将类映射到数据库查询的框架被称为 `对象关系映射`（`ORM`）。这意味着\
  \ Spring 中的某些包可以检查你的实体类，并决定如何在配置的数据库中对其进行查询。这也是 Spring Data 在配置为如此时能够自动创建你的数据表的方式。\n\
  \n你可能在 SQL 日志中注意到过 `Hibernate` 这个词。`Hibernate` 是 Spring Data 中的一个特殊包，作为临时依赖包含在内。它实现了一个名为\
  \ `JPA` 的 Java 规范，该规范被设计为通过单一接口将对象映射到关系型数据库的标准。\n\n`Hibernate` 是 `ORM` 的实现，可以用于在我们的内存\
  \ H2 数据库中查询和存储数据。\n\n在接下来的章节中，我们将探索处理来自我们定义的实体数据的各种方法。这些方法将涵盖两种极端情况：在 Spring Data\
  \ 中操作原生 SQL 查询，以及使用用户友好的 Spring Data 接口来简化数据的查询和存储。\n\n通常，在实现数据访问时，有一个原则指导你的决策：在\
  \ Spring Data 中获取和存储数据越容易，计算开销就越高。这意味着如果你优先考虑速度和高性能，就应该选择原生 SQL 实现。如果速度不是主要考虑因素，那么使用简洁且易于使用的\
  \ API 就足够了。\n\n根据经验，我建议从最简单的方法开始。如果你需要微调你的应用程序，可以再添加利用原生 SQL 查询的实现。\n\n好的。我们将先从最易用的仓库（面向\
  \ ORM）开始，然后移动到高性能的仓库。\n\n# JpaRepository – 你在 Spring Data 中的首选 SQL 接口\n\n在接下来的章节中，我们将深入研究\
  \ Spring 中最重要且易用的 SQL 接口。我们将探索它们的优缺点，并实现我们大部分的租赁房产服务。\n\n##将 JpaRepository 作为启用\
  \ ORM 的仓库\n\n从你的数据库 SQL 表中检索和保存数据最简单的方法是扩展 Spring 中的 `JpaRepository` 接口。如果你不想写，甚至不需要编写任何方法。这就是\
  \ Spring Data 的力量。\n\n看看这个示例：\n\n```java\npublic interface RentalPropertyJpaRepository\n\
  \   extends JpaRepository<RentalProperty, UUID> {\n}\n```\n\n这个接口做了很多工作。让我们通过为我们的\
  \ `RentalPropertyService` 接口创建一个新的实现来看看它是如何工作的。如果你还记得，我们的第一个实现类 `RentalPropertyServiceImpl`\
  \ 是使用简单的内部 `HashMap` 编写的，它作为一个非常原始的持久化层工作。\n\n现在创建一个名为 `RentalPropertyServiceJpaImpl`\
  \ 的类，它现在注入了我们刚刚创建的仓库。类声明如下：\n\n```java\n@Service\npublic class RentalPropertyServiceJpaImpl\
  \ implements RentalPropertyService{\n    private RentalPropertyJpaRepository jpaRepository;\n\
  \    public RentalPropertyServiceJpaImpl(RentalPropertyJpaRepository jpaRepository)\
  \ {\n        this.jpaRepository = jpaRepository;\n    }\n    // ... RentalPropertyService\
  \ 实现\n    // 在这里\n}\n```\n\n很有趣吧？该类应该标记 `@Service` 注解，这告诉 Spring 在另一个 Spring Bean\
  \ 尝试注入 `RentalPropertyService` 接口时将此 `impl` 类作为 Spring Bean 注入。\n\n等等，我们已经写了第一个\
  \ `RentalPropertyServiceImpl` 类。现在 Spring 将有两个选项供其选择，而我的 `RentalPropertyController`\
  \ 类将接收其中一个。\n\nSpring 如何知道在 `RentalPropertyController` 类中注入哪个实现类呢？\n\n嗯……它不知道。你必须告诉\
  \ Spring 要注入哪个实现类。在这样做之前，让我们实现 `RentalPropertyServiceJpaImpl` 类的剩余部分，以便你理解如何使用 `JpaRepository`。\n\
  \n看看从 `RentalPropertyService` 接口中完整实现的方法签名：\n\n```java\npublic interface RentalPropertyService\
  \ {\nList<RentalPropertyDTO> getAllProperties();\nOptional<RentalPropertyDTO> get(UUID\
  \ id);\nRentalPropertyDTO create(RentalPropertyDTO property);\nOptional<RentalPropertyDTO>\
  \ update(UUID id, RentalPropertyDTO updatedProperty);\nOptional<RentalPropertyDTO>\
  \ updateSomeFields(UUID id, RentalPropertyDTO partialUpdate);\nOptional<RentalPropertyDTO>\
  \ delete(UUID id);\nList<RentalPropertyDTO> search(String name, String address,\
  \ String city, String country, String zipCode);\n}\n```\n\n如你所示，`RentalPropertyService`\
  \ 类的所有这些方法都在返回或接收 `RentalPropertyDTO` 类。但仓库将与我们刚刚创建的、接收了 `@Entity` 注解的 `RentalProperty`\
  \ 类一起工作。\n\n## 使用 Lombok 在 DTO 和实体类之间进行相互转换\n\n\n\n\n正如我们在通用 Spring 实现图（**图 7.1**）中所看到的，`Persistence`\
  \ 垂直层与实体类（entity classes）配合，而 `Remote Access` 层则与 `Data Transfer Object`（**DTO**）类配合。这意味着所有的服务类在从数据库检索信息时都应该将实体转换为\
  \ DTO，并在将数据保存到数据库时将 DTO 转换为实体类。\n\n正如此，我们需要准备至少两个工具方法。虽然其他方法可以实现从 DTO 到实体以及反向的映射，但我倾向于不在项目中引入另一个依赖项。更多的依赖项意味着你的服务可能会面临漏洞，并且更快地过时。\n\
  \n通过使用 `Lombok` 依赖，可以减少一些构建这些转换器所需的代码。首先，为 `RentalPropertyDTO` 类、`RentalProperty`\
  \ 实体类以及 `Address` 类添加 `@Builder` 注解，因为 `Address` 是 `RentalProperty` 实体类的子属性。`RentalProperty`\
  \ 实体类的注解方式如下：\n\n```\n@Entity\n@Table(name = \"rental_properties\")\n@Data\n@Builder\
  \ // 这是我们的 lombok Builder 注解\n@NoArgsConstructor\n@AllArgsConstructor\npublic class\
  \ RentalProperty { ... }\n```\n\n而且由于 `@Builder` 注解以及我们将使用的 `JpaRepository`，我们还需要包含一个默认构造函数和一个全参数构造函数。这就是为什么我们为为类添加了\
  \ `@NoArgsConstructor` 和 `@AllArgsConstructor`。\n\n这是 `Address` 类的声明方式。只需在 record\
  \ 类上添加 `@Builder` 注解即可：\n\n```\n@Builder\npublic record Address ( /* 我们的属性在这里*/\
  \ )\n```\n\n最后，为我们的 `RentalPropertyDTO` record 类添加相同的 `@Builder` 注解：\n\n```\n@Builder\n\
  public record RentalPropertyDTO( ... ){}\n```\n\n在我们这两个类都标记了 `@Builder` 后，现在创建一个\
  \ `RentalPropertyUtil` 类来实现一个类到另一个类的转换。我们将采用一种非常简单的方法，声明一个包含两个方法的 `RentalPropertyConverter`\
  \ 类。第一个方法将把 DTO 对象转换为实体对象：\n\n```\npublic static RentalProperty toEntity(RentalPropertyDTO\
  \ dto) {\n    return RentalProperty.builder()\n        .rent(dto.rent())\n     \
  \   .id(dto.id())\n        .name(dto.name())\n        .landlordID(dto.landlordID())\n\
  \        .address(Address.builder()\n            .zip(dto.zipCode())\n         \
  \   .city(dto.city())\n            .streetAddress(dto.address())\n            .country(dto.country())\n\
  \            .build())\n        .build();\n}\n```\n\n第二个方法将把实体对象转换为 DTO 对象：\n\n\
  ```\npublic static RentalPropertyDTO toDTO(RentalProperty entity) {\n    return\
  \ RentalPropertyDTO.builder()\n        .address(entity.getAddress().streetAddress())\n\
  \        .name(entity.getName())\n        .rent(entity.getRent())\n        .city(entity.getAddress().city())\n\
  \        .landlordID(entity.getLandlordID())\n        .id(entity.getId())\n    \
  \    .country(entity.getAddress().country())\n        .zipCode(entity.getAddress().zip())\n\
  \        .build();\n}\n```\n\n如你所示，这两个静态方法都可以自由地导入到任何 `RentalPropertyService` 实现类中。让我们在\
  \ `RentalPRopertyServiceJpaImpl` 类中使用它。\n\n这是我们通过 ID 返回租赁房产的方式：\n\n```\n@Override\n\
  public Optional<RentalPropertyDTO> get(UUID id) {\n    return jpaRepository.findById(id)\n\
  \        .map(RentalPropertyConverter::toDTO);\n}\n```\n\n这是我们创建房产的方式：\n\n```\n\
  @Override\npublic RentalPropertyDTO create(RentalPropertyDTO property) {\n    return\
  \ jpaRepository.save(RentalPropertyConverter.toEntity(property));\n}\n```\n\n\n\n\
  \n```java\npublic interface RentalPropertyJpaRepository\n    extends JpaRepository<RentalProperty,\
  \ UUID> {\n    // 根据房东 ID 查找所有属性\n    List<RentalProperty> findByLandlordID(\n \
  \       UUID landlordID);\n    // 查找租金低于指定金额的属性\n    List<RentalProperty> findByRentLessThan(\n\
  \        Double maxRent);\n    // 根据房东 ID、城市和租金范围查找属性\n    List<RentalProperty>\
  \ findByLandlordIDAndAddress_CityAndRentBetween(\n        UUID landlordID, String\
  \ city,\n        Double minRent, Double maxRent);\n}\n```\n\n如你所见，这里有很多可能性。即使是 `Address`\
  \ 对象的属性也可以用于在 `JpaRepository` 之上创建你的自定义查询。这为你提供了许多选择，让你能够充分利用你的 Spring `JpaRepository`\
  \ 接口。\n\n这里有一个小知识：优秀的 IDE（如 `IntelliJ`）会通过提供代码补全工具来帮助你编写这些自定义查询。当我在 `RentalPropertyJpaRepository`\
  \ 中编写新的自定义方法时，这就是我在 `IntelliJ` 中输入时看到的内容：\n\n![Figure 7.6: IntelliJ JpaRepository\
  \ code completion feature](img/B18632_07_6.jpg)\n\n图 7.6: IntelliJ JpaRepository\
  \ 代码补全功能\n\n这使得编写新的自定义查询变得非常简单。\n\n## 使用 JPQL 创建自定义查询\n\n以下是你可以通过使用 `@Query` 注解在\
  \ Spring `JpaRepository` 之上创建自定义查询的一些其他示例，该注解让你能够访问 JPQL 声明式语言：\n\n```java\n// 按租金范围查找属性的自定义查询\n\
  @Query(\"SELECT rp FROM RentalProperty rp WHERE rp.rent BETWEEN :minRent AND :maxRent\"\
  )\nList<RentalProperty> findByRentRange(@Param(\"minRent\") Double minRent, @Param(\"\
  maxRent\") Double maxRent);\n// 按名称查找属性\n// 并按租金升序排序\n@Query(\"SELECT rp FROM RentalProperty\
  \ rp WHERE rp.name LIKE %:namePart% ORDER BY rp.rent ASC\")\nList<RentalProperty>\
  \ findByNameAndSortByRent(@Param(\"namePart\") String namePart);\n```\n\n如你所见，Spring\
  \ 支持一种类似于 SQL 但能直接处理对象的声明式语言。如果你觉得创建更清晰的 SQL 类型语法是你处理问题的方式，就可以使用它。由于空间限制，我不会花大量时间讨论\
  \ JPQL。这个主题需要很多章节才能全面涵盖。如果你想深入研究这个主题，可以从官方文档开始：[`docs.oracle.com/cd/E29542_01/apirefs.1111/e13946/ejb3_langref.html`](https://docs.oracle.com/cd/E29542_01/apirefs.1111/e13946/ejb3_langref.html)。\n\
  \n## 关于微服务性能和范围的注意事项\n\n在 Spring Data JPA 中使用自定义查询时，记住它们并不是万能的。复杂的查询可能会给数据库带来挑战，特别是当它们涉及非索引列的大表时，会导致查询执行时间过长。考虑数据库结构至关重要，包括它的大小、索引、列类型、必要操作以及表之间的关系。\n\
  \n例如，如果你的 `RentalProperty` 实体与 `Landlord` 实体有关系（使用 `@ManyToOne` 注解），你可以创建一个自定义查询，在\
  \ `RentalProperty` 和 `Landlord` 表之间执行连接操作。然而，这种关系可能会使你的微服务架构复杂化。让 `RentalProperties`\
  \ 微服务访问所有房东数据可能是不理想的。如果 `Landlord` 与系统中的其他用户存储在一起，那么让 `RentalProperties` 微服务访问整个用户集会导致数据不必要的暴露。\n\
  \n避免使用这些功能使你的数据模型过度复杂至关重要。仅仅因为 Spring Data JPA 让创建自定义查询变得简单，并不意味着你应该始终使用它们。关键在于两点：抵制诱惑并理解应用程序的非功能性和功能需求。分析你的数据是如何组织的，确定用户体验的最佳流程，并调整数据库以更高效地处理低性能查询。\n\
  \n## 理解 JpaRepository 的其他限制\n\n请注意，在 `RentalServiceJpaImpl` 类中，我们不支持搜索，因为该接口并不是创建搜索查询的最优。以下是搜索方法的实现，我们基本上是抛出一个\
  \ `UnsupportedOperationException`：\n\n```java\n@Override\npublic List<RentalPropertyDTO>\
  \ search(\n        String name, String address,\n        String city, String country,\
  \ String zipCode) {\n    throw new UnsupportedOperationException(\n        \"此服务实现不支持搜索。\"\
  );\n}\n```\n\n## 处理海量数据\n\n正如我们几个章节前看到的，与任何其他系统开发 API 的另一个关键部分是，当你知道资源量极大时使用分页机制。\n\
  \n想象一下，用户访问我们的网站并决定列出整个州（如加利福尼亚州）的属性。当网站观众开始增长，每天可能有数百万次请求时，我们如何确保 GET 不撑垮我们的服务器？\n\
  \n你希望你的服务是成功且可扩展的，对吧？以下你可以进行的一些优化以使你的网站实现扩展：\n\n- **索引**：确保关键搜索查询运行在数据库的索引字段上。正确声明的列索引将最大限度地提高搜索效率。\n\
  - **缓存**：为运行最频繁的查询创建缓存并将结果存储在内存中，从而实现快速响应。例如，在查询所有加利福尼亚州的属性时，缓存前 20 页的结果。由于大多数用户不会超过\
  \ 10 页，这种方法将服务绝大多数用户。\n- **数据库分片**：考虑为每个州创建一个独立的 `RentalProperty` 数据库以分担负载。保持微服务数据模型简单可以为优化非功能需求提供更大的灵活性。例如，你可以为每个州创建一个服务实现，你的微服务可以根据保存的州来存储数据。\n\
  - **负载均衡**：即使使用了分片，某些州可能仍然面临沉重负载。在这种情况下，创建数据库的读副本将查询负载分布到多个数据库实例上。\n- **进一步查询优化**：与技能丰富的\
  \ DBA 协作寻找优化数据库查询的方法。专业的 DBA 可以提供非常有价值的优化见解和技术。\n- **移除抽象层**：由于 ORM 映射的开销，`JpaRepository`\
  \ 可能不再性能关键型查询。相反，使用 `JdbcTemplate` 仓库直接执行原始 SQL 命令，跳过 ORM 映射成本。\n- **异步处理**：利用响应式处理来高效处理多个并发任务。异步处理将在未来的章节中介绍。\n\
  \n\n\n\n\n*   **物化视图 (Materialized views)**：将大量查询的结果预计算并存储在临时表中，这些表可以定期刷新。虽然这种方法可能无法提供最新的结果，但取决于你的用例和非功能性需求，这种实时性差距是可以接受的。\n\
  *   **从根本移除约束**：你可能想减轻数据库表对外键或数据格式验证（例如可空列与非空列）的约束。这些约束中的一些可以作为新代码添加到微服务中，这样它们就只会在特定条件下激活。\n\
  *   **完全或部分迁移到 NoSQL 数据库**：在服务实现中迁移到其他类型的数据库也能极大提高查询速度。根据你的用例，你可以利用各种优化的数据库。我曾见过使用\
  \ `Cassandra` 的实现，它每秒支持超过 15,000 次数据检索请求。那是非常大的数据检索量！另一个很好的例子是 `Neo4J`，它可以加速任何图搜索（与传统的\
  \ SQL 数据库相比），因为关系在执行 `join` 命令时不需要在计算。如果你需要提供图搜索，这可能就是你想要的优化方式。\n\n此外，Spring Data\
  \ 在 `JpaRepository` 接口中提供了分页查询（pageable queries）。让我们看看它是如何工作以优化我们的搜索的。\n\n## 在 Spring\
  \ JpaRepository 中检索分页结果\n\n现在我们已经讨论了提高数据库查询性能的方法，让我们创建一种方法来减轻 API 对数据库压力。\n\n传统上，当我们向\
  \ `/rental-properties` 资源发送 `GET` 请求时，我们应该返回微服务中包含的所有对象列表。然而，由于多个原因，如果我们同时需要检索成千上万个属性，这种通用想法的效果并不理想。其中一个原因无疑是，如果你有大量对象，它会耗尽你的微服务资源（例如\
  \ RAM 内存）。但即使你拥有硬件资源，从用户的角度来看它也是不切实际的，因为系统无法同时处理这么多对象。从易用性的角度来看，如果用户无法以非常实际的方式处理你提供的数据，你的系统就变得毫无用处。\n\
  \n这时我们可以实现一种解决方案，创建一个 `GET` `/rental-properties` 端点，它可以返回结果页，而不是仅仅是一大堆无法管理的对象。\n\
  \n首先，我们需要对 `RentalPropertyService` 接口进行细小的调整。我们将添加以下方法来检索一页属性：\n\n```java\nPage<RentalPropertyDTO>\
  \ getPagedProperties(\n    int page, int size);\n```\n\n如你所见，可以指定返回哪一页以及该页的大小。现在，在\
  \ `RentalPropertyServiceJpaImpl` 类中，让我们添加一个有意义的方法实现，以带分页功能检索租赁属性：\n\n```java\n@Override\n\
  public Page<RentalPropertyDTO> getPagedProperties(\n    int page, int size) {\n\
  \    final PageRequest pageable =\n        PageRequest.of(page, size);\n    return\
  \ PageableExecutionUtils.getPage(jpaRepository\n        .findAll(pageable)\n   \
  \     .getContent().stream()\n        .map(RentalPropertyConverter::toDTO)\n   \
  \     .toList(), pageable, jpaRepository::count);\n}\n```\n\n如你所示，此实现利用了 `JpaRepository`\
  \ 接口中的 `findAll()` 方法。它将获取数据库中的 `RentalProperty` 实体列表，并全部包含在一个 `Page` 对象中。然后我们将该结果页转换为包含\
  \ DTO 的页面。这就是我们从 Spring Data 的 `JpaRepository` 中所需的所有内容，以确保我们为 API 用户分块返回数据。\n\n\
  由于该方法是在 `RentalService` 接口级别声明的，我们还必须在 `RentalServiceImpl` 类中实现一个不支持的异常：\n\n```java\n\
  @Override\npublic Page<RentalPropertyDTO> getPagedProperties(\n    int page, int\
  \ size) {\n    throw new UnsupportedOperationException(\n        \"cannot retrieve\
  \ a paged result \" +\n        \"with this implementation\");\n}\n```\n\n这只是为了确保项目能够正确编译。我不想在\
  \ `RentalPropertyServiceImpl` 类中使用实现，只使用 `RentalPropertyServiceJpaImpl` 中的实现。\n\n\
  在我们的 `RentalPropertyController` 类中，我们需要实现对 `RentalPropertyService` 接口的调用：\n\n```java\n\
  @GetMapping(produces = \"application/json\")\npublic ResponseEntity<Page<RentalPropertyDTO>>\n\
  \    getAllProperties(\n        @RequestParam(defaultValue = \"0\") int page,\n\
  \        @RequestParam(defaultValue = \"10\") int size\n) {\n    return ResponseEntity.ok()\n\
  \    .body(rentalPropertyService.getPagedProperties(page, size));\n}\n```\n\n##\
  \ 使用多个服务实现\n\n现在我们正确编写了 `RentalPropertyServiceJpaImpl` 类（这是一个实现了 `RentalService`\
  \ 的服务），让我们在 `RentalPropertyController` 上使用这个新实现。\n\n记住：在 Spring 框架哲学中，服务实现应该始终注入另一个接口，而\
  \ Spring 应该寻找实现类。这里有一个事实可以证明这一点。在我们的代码中，`RentalPropertyServiceImpl` 注入了 `JpaRepository`，它只是一个接口。Spring\
  \ 能够在运行时为你提供 `JpaRepository` 的实现。事实上，实现 `JpaRepository` 的类被称为 `SimpleJpaRepository`。这一切都是通过我们在前面的章节中讨论过的\
  \ Spring Beans 管理为你完成的。\n\n现在，我们面临着以下情况。`RentalPropertyService` 有两个实现：\n\n![图 7.7：具有两个实现的服务接口](img/B18632_07_8.jpg)\n\
  \n图 7.7：具有两个实现的服务接口\n\n另一方面，我们的 `RentalPropertyController` 类注入了 `RentalPropertyService`\
  \ 接口的引用，记得吗？回顾一下。这是 V1 API 的代码：\n\n```java\npublic class RentalPropertyController\
  \ {\n    private final RentalPropertyService rentalPropertyService;\n// ... other\
  \ existing code\n}\n```\n\n而这是 V2 API 的代码：\n\n```java\npublic class RentalPropertyControllerV2\
  \ {\n    private final RentalPropertyService rentalPropertyService;\n    private\
  \ final RentalPropertyHyperMediaUtils rentalPropertyMediaUtils;\n// ... other existing\
  \ code\n}\n```\n\n正如我们之前说的，Spring 将尝试寻找该接口的实现类。当我们运行这段代码时会发生什么？\n\n答案是：我们无法运行这段代码，因为我们没有向\
  \ Spring 说明在两个类中使用哪一个实现作为 `RentalPropertiesService` 接口引用的 Bean。由于我们现在使 Bean 注入产生了歧义，我们需要使用一些特殊语法来指定\
  \ Spring 应该使用哪些实现以及在哪里使用。\n\n以下是我们在不更改声明 Bean 的方式尝试运行 RentalProperties API 时所得到的错误输出：\n\
  \n\n\n\n\n```\nParameter 0 of constructor in [...].controller.RentalPropertyController\
  \ required a single bean, but 2 were found:\n- rentalPropertyServiceImpl: defined\
  \ in file [.../RentalPropertyServiceImpl.class]\n- rentalPropertyServiceJpaImpl:\
  \ defined in file [.../RentalPropertyServiceJpaImpl.class]\nThis may be due to missing\
  \ parameter name information\n```\n\n现在，该项目仅由对 `Service` 层采用不同实现方法的类组成。我们直接删除 `RentalPropertyServiceImpl`\
  \ 类就可以，对吧？毕竟，这是一个使用内存 `HashMap` 的实现。一旦我们删除了它，一切都应该正常了。\n\n但如果我们需要以不同方式实现同一个服务接口的多个\
  \ bean 呢？这在接下来的章节中将会有意义，因为我们将实现访问数据库的其他方式（并且我们将会实现搜索功能）。\n\n## 使用 @Qualifier 为同一服务注入多个\
  \ bean 实现类\n\n在大型 Spring 项目中，需要同一个服务接口的两个实现并不罕见，特别是当你正在优化实现方案或更改后台工作方式时。在这里，我们将为同一个\
  \ `RentalPropertyService` 接口注入两个引用，但其中一个实现是旧的，即使用 hashmap 作为存储库的版本。另一个实现将使用 SQL\
  \ 数据库作为存储库。我们将在几分钟后创建其他实现。\n\n为同一服务注入不同实现的关键在于 `@Qualifier` 注解，它出现在几个位置：\n\n*  \
  \ 在服务实现类本身中，以便为我们的 Spring bean 命名\n*   在将注入 bean 的类构造函数中\n\n这是我们如何在我们的 `RentalProperty`\
  \ 实现类上方声明 `@Qualifier` 注解的：\n\n```\n@Service\n@Qualifier(\"hashMapRentalPropertyService\"\
  )\npublic class RentalPropertyServiceImpl\n    implements RentalPropertyService\
  \ {\n// ... other service code\n}\n@Service\n@Qualifier(\"jpaRentalPropertyService\"\
  )\npublic class RentalPropertyServiceJpaImpl implements RentalPropertyService{\n\
  // ... other service code\n}\n```\n\n你可以看到，现在我们为冲突的服务实现类添加了两个名称或别名。\n\n下一步是在想要使用这些\
  \ bean 的类的构造函数中，使用各自的 qualifier 声明这些 bean：\n\n```\n@RestController\n@RequestMapping(\"\
  /api/v1/rental-properties\")\n@Validated\npublic class RentalPropertyController\
  \ {\n    private final RentalPropertyService\n        mapRentalPropertyService;\n\
  \    private final RentalPropertyService\n        jpaRentalPropertyService;\n  \
  \  public RentalPropertyController(\n        @Qualifier(\"hashMapRentalPropertyService\"\
  )\n            RentalPropertyService mapRentalPropertyService,\n        @Qualifier(\"\
  jpaRentalPropertyService\")\n            RentalPropertyService jpaRentalPropertyService)\n\
  {\n        this.mapRentalPropertyService =\n            mapRentalPropertyService;\n\
  \        this.jpaRentalPropertyService =\n            jpaRentalPropertyService;\n\
  }\n// ... other code\n}\n```\n\n这是 V2 实现：\n\n```\n@RestController\n@RequestMapping(\"\
  /api/v2/rental-properties\")\n@Validated\npublic class RentalPropertyControllerV2\
  \ {\n    private final RentalPropertyHyperMediaUtils\n        rentalPropertyHyperMediaUtils;\n\
  \    private final RentalPropertyService\n        mapRentalPropertyService;\n  \
  \  private final RentalPropertyService\n        jpaRentalPropertyService;\n    public\
  \ RentalPropertyControllerV2(\n        @Qualifier(\"hashMapRentalPropertyService\"\
  )\n            RentalPropertyService mapRentalPropertyService,\n        @Qualifier(\"\
  jpaRentalPropertyService\")\n            RentalPropertyService jpaRentalPropertyService,\n\
  \        RentalPropertyHyperMediaUtils\n            rentalPropertyHyperMediaUtils)\n\
  {\n        this.rentalPropertyHyperMediaUtils =\n            rentalPropertyHyperMediaUtils;\n\
  \        this.mapRentalPropertyService =\n            mapRentalPropertyService;\n\
  \        this.jpaRentalPropertyService =\n            jpaRentalPropertyService;\n\
  }\n}\n```\n```\nParameter 0 of constructor in [...].controller.RentalPropertyController\
  \ required a single bean, but 2 were found:\n- rentalPropertyServiceImpl: defined\
  \ in file [.../RentalPropertyServiceImpl.class]\n- rentalPropertyServiceJpaImpl:\
  \ defined in file [.../RentalPropertyServiceJpaImpl.class]\nThis may be due to missing\
  \ parameter name information\n```\n\n`JpaRepository` 由一个名为 `SimpleJpaRepository`\
  \ 的类实现，该类又注入了 `EntityManager`。\n\n如果 `Jpa` 是高层抽象，那么 `EntityManager` 呢？\n\n### 它是如何工作的？`EntityManager`\
  \ 是 JPA 中的一个核心接口，用于管理持久上下文（persistence context）内实体的生命周期。它对事务、缓存和查询执行提供细粒度的控制，对于数据访问操作至关重要。\n\
  \n### 它是如何工作的？\n\n`EntityManager` 负责确保实体的状态与数据库同步。它对事务、缓存和查询执行提供细粒度的控制，对于数据访问操作至关重要。\n\
  \n这里是 `EntityManager` 实现的一个重要方法列表，你可以在任何地方注入它们：\n\n*   `persist(Object entity)`：将新实体持久化到数据库\n\
  *   `merge(Object entity)`：更新数据库中的现有对象\n*   `remove(Object entity)`：从数据库删除实体实例\n\
  *   `find(Class<T> entityClass, Object primaryKey)`：根据主键查找实体\n*   `createQuery(String\
  \ qlString)`：根据标准创建 JPQL 查询\n*   `createNamedQuery(String name)`：根据实体类创建命名查询\n*\
  \   `createNativeQuery(String sqlString)`：为特定数据库创建原生 SQL 查询\n*   `getTransaction()`：获取\
  \ `Transaction` 对象以手动管理事务\n*   `flush()`：强制将更改推送到数据库\n*   `clear()`：清除持久上下文，分离所有管理的实体\n\
  *   `detach(Object entity)`：从持久上下文中分离实体\n*   `refresh(Object entity)`：从数据库刷新实体状态\n\
  *   `getCriteriaBuilder()`：获取 `CriteriaBuilder` 实例用于创建查询\n\n`EntityManager` 有一个重要功能，可以跟踪你对对象所做的更改并自动将其同步到数据库。我们将在下一个章节中看到。\n\
  \n# 在 Spring Data 中处理事务\n\n**transaction**（事务）如你所知，是数据库的更改序列被视为一个原子操作，这意味着它们不会被并发操作中断。它们是一批执行的，只有在计算出最终结果后对其他并发查询才可见。\n\
  \n使用 Spring Data 管理事务有两种主要方法。\n\n## 在方法中使用 @Transactional 注解\n\n\n\n\n你可以在类中声明任何你想要被视为事务的方法。基本上，只需在所需的方法上标记\
  \ `@Transactional` 注解，该方法所包含的所有内容都将被视为事务上下文的一部分。\n\n这是一个简单的示例。这使得 `RentalServiceJpaImpl`\
  \ 的 `update` 方法成为一个完整的事务：\n\n```\n@Override\n@Transactional\npublic Optional<RentalPropertyDTO>\
  \ update(UUID id,\n    RentalPropertyDTO updatedProperty) {\n    if(jpaRepository.existsById(id))\
  \ {\n        return Optional.ofNullable(\n            RentalPropertyConverter.toDTO(\n\
  \                jpaRepository.save(RentalPropertyConverter\n                  \
  \  .toEntity(updatedProperty))));\n    }\n    return Optional.empty();\n}\n```\n\
  \n再次，如果你需要在数据库上执行多个更新操作，并且出于对数据一致性的考虑，你希望保证所有这些操作都在同一个步骤中执行，那么你可能希望所有这些操作都是事务性的。只需将它们都移动到单个服务方法中，并声明该方法为\
  \ `@Transactional` 即可。\n\n`@Transactional` 注解有几个重要的参数，允许你探索事务管理的细微差别。你可以查看 Spring\
  \ 文档来了解这些变体。让我们来看看在 Spring Data 中声明事务的另一种方式。\n\n## 通过使用 EntityManager bean 管理事务\n\
  \n由于 `EntityManager` bean 是用于底层管理数据库连接和查询的核心 bean 之一，你可以通过在 bean 上使用 `@PersistenceContext`\
  \ 注解将其注入到任何服务中。如果你使用了该注解，也可以在你的方法上使用 `@Transactional` 注解，以定义哪些方法应该被视为单个事务的一部分。\n\
  \n你也可以使用 `EntityManager` bean 手动管理事务。只需使用以下资源：\n\n*   将 `EntityManagerFactory` 类注入到你的服务中。\n\
  *   每当你需要开始事务时，使用工厂创建 `EntityManager` 引用。\n\n以下方法是 `EntityManager` 接口的一部分：\n\n*\
  \   `getTransaction().begin()`：启动事务。\n*   `getTransaction().commit()`：将事务提交到数据库并完成提交。\n\
  *   `getTransaction().rollback()`：回滚事务（如果你在执行指令期间发现错误，例如异常或某些提示中止事务的业务逻辑，使用此方法非常有用）。\n\
  \n操作非常简单。让我们来看看如何实现。记住，我们在这里也需要使用 `@Qualifier` 来标识此实现：\n\n```\n@Service\n@Qualifier(\"\
  entityManagerRentalPropertyService\")\npublic class RentalPropertyServiceEntityManagerImpl\n\
  \    implements RentalPropertyService{\n    private EntityManagerFactory entityManagerFactory;\n\
  \    public RentalPropertyServiceEntityManagerImpl\n        (EntityManagerFactory\
  \ entityManagerFactory) {\n        this.entityManagerFactory = entityManagerFactory;\n\
  \    }\n// ... other methods\n}\n```\n\n这就是在手动管理事务时将 `EntityManagerFactory` 注入到你的\
  \ bean 中的方式。\n\n这是我们使用 `EntityManager` bean 进行手动事务处理的方法：\n\n```\n@Override\npublic\
  \ Optional<RentalPropertyDTO> delete(UUID id) {\n    EntityManager entityManager\
  \ =\n        entityManagerFactory\n            .createEntityManager();\n    EntityTransaction\
  \ transaction =\n        entityManager.getTransaction();\n    RentalPropertyDTO\
  \ dto;\n    try {\n        transaction.begin();\n        RentalProperty property\
  \ =\n            entityManager.find(RentalProperty.class, id);\n        dto = RentalPropertyConverter.toDTO(property);\n\
  \        entityManager.remove(property);\n        transaction.commit();\n    } catch\
  \ (Exception e) {\n        if (transaction.isActive()) {\n            transaction.rollback();\n\
  \        }\n        throw e;\n    } finally {\n        entityManager.close();\n\
  \    }\n    return Optional.ofNullable(dto);\n}\n```\n\n重要的亮点是：\n\n*   我们正在创建 `EntityManagerFactory`。\n\
  *   然后，我们创建了 `EntityManager` 引用。\n*   最后，我们需要 `EntityManager`。\n\n这就是你可以轻松迁移到 `NamedParameterJdbcTemplate`\
  \ 的方法。\n\n### 如果你需要运行 SQL 怎么办？\n\n`JdbcTemplate` 是 SQL 注入的窗口：它存在一个缺陷，攻击者不发送你预期的数据，而是发送他们想要的任何命令，导致你的查询运行任意代码。\n\
  \n由于使用 `JdbcTemplate` 风险很高，我建议改用 `NamedParameterJdbcTemplate`。与 `JdbcTemplate` 唯一有意义的变化是\
  \ Spring 会确保查询输入是正规数据。\n\n现在，让我们来看下一节。\n\n## 使用 ParameterJdbcTemplate 运行原始 SQL\n\
  \n`JdbcTemplate` 是 Spring JDBC 模块的核心组件，旨在简化数据库交互。它为查询、更新和批量处理等常见操作提供了方便的方法，消除了管理连接和处理异常所需的大部分代码。它对于需要对\
  \ SQL 查询和事务进行精确控制，且不想引入 ORM 框架开销的应用来说，它是理想的选择。它提供了灵活性、性能和简单性，使其成为需要执行自定义 SQL 并程序化管理数据库交互的开发者的首选。\n\
  \n例如，我为 `RentalPropertyService` 创建了另一个实现，它现在使用 `NamedParameterJdbcTemplate` 作为仓库。这次，我将仅实现\
  \ `search()` 方法。其他所有方法将抛出 `UnsupportedOperationException`，因为它们都在 `RentalPropertyServiceJpaImpl`\
  \ bean 中实现。\n\n以下是 `RentalPropertyServiceJdbcImpl` 中 `search` 方法的示例。这就是我注入 `NamedParameterJdbcTemplate`\
  \ 仓库的方式（我也使用了 `@Qualifier` 来标识此实现）：\n\n```java\n@Service\n@Qualifier(\"jdbcRentalPropertyService\"\
  )\npublic class RentalPropertyServiceJdbcImpl implements RentalPropertyService{\n\
  \    private final NamedParameterJdbcTemplate jdbcTemplate;\n    public RentalPropertyServiceJdbcImpl(\n\
  \        NamedParameterJdbcTemplate jdbcTemplate) {\n        this.jdbcTemplate =\
  \ jdbcTemplate;\n    }\n\n    @Override\n    public List<RentalPropertyDTO> search(String\
  \ name) {\n        // 使用 jdbcTemplate 实现\n        return Collections.emptyList();\n\
  \    }\n}\n```\n\n\n\n\n\n```java\n@Override\npublic List<RentalPropertyDTO> search(String\
  \ name, String address, String city, String country, String zipCode) {\n    StringBuilder\
  \ sql = new StringBuilder(\"SELECT * FROM rental_properties WHERE 1=1\");\n    MapSqlParameterSource\
  \ params =\n        new MapSqlParameterSource();\n    if (StringUtils.hasText(name))\
  \ {\n        sql.append(\" AND name LIKE :name\");\n        params.addValue(\"name\"\
  , \"%\" + name + \"%\");\n    }\n    if (StringUtils.hasText(address)) {\n     \
  \   sql.append(\" AND address LIKE :address\");\n        params.addValue(\"address\"\
  , \"%\" + address + \"%\");\n    }\n    if (StringUtils.hasText(city)) {\n     \
  \   sql.append(\" AND address LIKE :city\");\n        params.addValue(\"city\",\
  \ \"%\" + city + \"%\");\n    }\n    if (StringUtils.hasText(country)) {\n     \
  \   sql.append(\" AND address LIKE :country\");\n        params.addValue(\"country\"\
  , \"%\" + country + \"%\");\n    }\n    if (StringUtils.hasText(zipCode)) {\n  \
  \      sql.append(\" AND address LIKE :zipCode\");\n        params.addValue(\"zipCode\"\
  , \"%\" + zipCode + \"%\");\n    }\n    return jdbcTemplate.query(\n        sql.toString(),\
  \ params, rentalPropertyRowMapper);\n}\n```\n\n如你所见，我正在使用简单的 `LIKE` 运算符来查找 `Address`\
  \ 列中实际文本的部分。这是因为 H2 的实现不支持 Postgres 原生的 `jsonb` 字段。当你迁移到真实的数据库时，可以使用 `->>` 运算符或你的数据库支持的任何其他\
  \ JSON 特有的搜索运算符。`JdbcTemplate` 和 `NamedParameterJdbcTemplate` 都是帮助你在与数据库交互时使用原生操作的类。但再次强调，这应该谨慎使用，因为这消除了未来进行透明、无痛数据库迁移的可能性。这取决于你、你的团队以及公司如何决定应该进行到何种程度的原生或低级操作。如果你真的需要优化代码，仅在需要改进的方法中进行优化。\n\
  \n这里有一些背景信息：Postgres 的文本搜索功能可以实现高性能查询，其性能几乎接近 Elasticsearch 数据库查询。但如果你想保留两个不同的微服务（一个用于使用\
  \ Elasticsearch 进行全文搜索），你确实可以进一步强化你的设计。你可以这样设置系统设计：无论负责维护租赁房产注册的微服务发生什么变化，搜索微服务都会收到通知，然后更新它自己的版本的租赁房产数据。我们将在讨论事件驱动架构时看到其中一些内容。\n\
  \n## 引用我们目前为止完成的所有实现\n\n现在，让我们在 V1 `RentalPropertyController` 中使用所有这些实现：\n\n```java\n\
  @RestController\n@RequestMapping(\"/api/v1/rental-properties\")\n@Validated\npublic\
  \ class RentalPropertyController {\n    private final RentalPropertyService\n  \
  \      jpaRentalPropertyService;\n    private final RentalPropertyService\n    \
  \    jdbcRentalPropertyService;\n    private final RentalPropertyService\n     \
  \   entityManagerRentalPropertyService;\n    public RentalPropertyController(\n\
  \        @Qualifier(\"jpaRentalPropertyService\")\n            RentalPropertyService\
  \ jpaRentalPropertyService,\n        @Qualifier(\"jdbcRentalPropertyService\")\n\
  \            RentalPropertyService\n              jdbcRentalPropertyService,\n \
  \       @Qualifier(\"entityManagerRentalPropertyService\")\n            RentalPropertyService\n\
  \              entityManagerRentalPropertyService) {\n        jpaRentalPropertyService\
  \ = jpaRentalPropertyService;\n        jdbcRentalPropertyService = jdbcRentalPropertyService;\n\
  \        entityManagerRentalPropertyService = entityManagerRentalPropertyService;\n\
  \    }\n    // ... 其他代码\n}\n```\n\n这是我们使用 `EntityManager` 实现的地方：\n\n```java\n@DeleteMapping(\"\
  /{id}\")\npublic ResponseEntity<Void> deleteProperty(@PathVariable UUID id) {\n\
  \    return entityManagerPropertyService\n        .delete(id)\n        .map(opt\
  \ ->\n            ResponseEntity.noContent()\n            build())\n        .orElse(ResponseEntity\n\
  \            .status(HttpStatus.NOT_FOUND).build());\n}\n```\n\n这是我们使用 JDBC 实现的地方：\n\
  \n```java\n@GetMapping(\n    value = \"/search\",\n    produces = \"application/json\"\
  )\npublic ResponseEntity<List<RentalPropertyDTO>> searchProperties(\n    @RequestParam(required\
  \ = false) String name,\n    @RequestParam(required = false) String address,\n \
  \   @RequestParam(required = false) String city,\n    @RequestParam(required = false)\
  \ String country,\n    @RequestParam(required = false) String zipCode) {\n    return\
  \ ResponseEntity.ok(\n        jdbcRentalPropertyService.search(name, address, city,\
  \ country, zipCode));\n}\n```\n\n在完成这些重构之后，我们可以从在 Spring 中创建接口实现中提取出一些有趣的几点：\n\n\
  -   首先，我们可以在同一个微服务中混合组合针对同一个接口的不同实现。\n-   通过混合组合这些实现，你可以随着开发不断优化你的微服务。从小开始，以一种未优化的方式进行，然后通过包含服务接口的优化实现来改进你的应用程序。这对于数据同样有效，也适用于其他场景。例如，如果你觉得你的微服务变得比它应该有的的大得多，你可以将某些服务的实现导出到另一个微服务。然后，在旧微服务中为该服务接口包含一个新实现，该实现将远程调用委托给新的微服务。\n\
  -   通过使用 `@Qualifier` 注解，在使用这些实现类时可以完全不触碰实现类——你只需要处理服务接口，无论注入的是哪种实现。这意味着你的代码将始终符合你原始的服务接口。这是保证契约的一种极佳方式。此外，如果你的服务接口发生变化，Java\
  \ 编译器将要求你更新所有实现类，这使得一切具有高度的一致性。\n-   你的接口实现不需要支持服务接口中的所有方法。留某些方法为不支持状态是可以的，这样你就可以在新实现中仅交付你想要优化的方法。\n\
  -   我们刚刚看到了一种在同一个应用程序中支持到数据库所有连接类型的方法。你甚至不需要关心真实的数据库连接。这不酷吗？\n-   当需要将应用程序部署到真实环境时，我们只需添加配置文件以覆盖我们的默认选项，并建立到其他数据库实例的新连接，而无需你接触代码。我们将在接下来的章节中讨论如何实现。\n\
  -   在大多数情况下，你的类可以连接到任何 SQL 数据库。如果你从 Postgres 迁移到 Oracle，你只需要重写 `/search` 端点的实现，因为这是你唯一一个想要其中使用特定的、优化的数据库原生语法的地方。想想这对于未来升级你的基础设施有多棒。\n\
  -   某些开发者会问：“为什么要在你的服务实现中留出生硬的 `OperationNotSupported` 异常？你可以使用一种回退策略将调用代理到其他实现，对吧？”这样做是可能的，但如果你这样做，可能会误导其他开发者。当你的实现不支持某个方法时，这种情况将不会那么明显。我宁愿让它直接抛出异常，这样不支持的情况对所有人都是一目了然的。\n\
  \n\n\n\n\n这就是拥有清晰的集成测试套件将对你非常有帮助的地方。我们在之前的章节中编写的自动化测试不会发生太大变化。我们基本上需要在 `test` 文件夹中添加一个属性文件，使其遵循相同的\
  \ H2 策略，并创建一个内存数据库供你进行查询：\n\n![图 7.8：application.properties 配置文件的位置](img/B18632_07_9.jpg)\n\
  \n图 7.8：`application.properties` 配置文件的位置\n\n以下是 `application.properties` 文件的内容：\n\
  \n```\n## H2 Database configuration in PostgreSQL mode\nspring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL\n\
  spring.datasource.driverClassName=org.h2.Driver\nspring.datasource.username=sampleuser\n\
  spring.datasource.password=samplepass\nspring.jpa.database-platform=org.hibernate.dialect.H2Dialect\n\
  spring.h2.console.enabled=true\nspring.h2.console.path=/h2-console\nspring.jpa.hibernate.ddl-auto=create\n\
  spring.jpa.show-sql=true\n```\n\n`RentalPropertyControllerTest` 类中更改的代码如下 ([`github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-07/rental-property-microservice/src/test/java/com/homeit/rental/property/controller/RentalPropertyControllerTest.java`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-07/rental-property-microservice/src/test/java/com/homeit/rental/property/controller/RentalPropertyControllerTest.java)):\n\
  \n```\n@Test\nvoid testGetAllProperties() throws Exception {\n    mockMvc.perform(\n\
  \        get(\"/api/v1/rental-properties?page=1&size=2\")\n        .contentType(\"\
  application/json\"))\n        .andExpect(status().isOk())\n        .andExpect(jsonPath(\"\
  $.pageable.pageNumber\").value(1))\n        .andExpect(jsonPath(\"$.content[*].name\"\
  ).exists())\n        .andExpect(jsonPath(\"$.pageable.pageSize\").value(2))\n  \
  \  ;\n}\n```\n\n`testGetAllProperties()` 方法现在将逐个查找页面。返回的 JSON 实际上更复杂一些，因为它获取了页面元数据，而不仅仅是原始对象。你可能考虑将分页端点作为\
  \ API 另一个版本的一部分，因为此更改可能会破坏期望旧格式的 HTTP 客户端。\n\n你只需要运行 `gradle test` 命令即可确保你的微服务与数据库的通信正常。你可以在\
  \ GitHub 上查看我们测试类的最终实现 ([`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07/rental-property-microservice/src/test/java/com/homeit/rental/property/controller`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-07/rental-property-microservice/src/test/java/com/homeit/rental/property/controller))。当然，我们也可以测试\
  \ H2 数据库。如果我们使用 `gradle bootRun` 命令运行服务，你将能够连接到 H2 数据库，并看到创建的精确表和类型。你将拥有一个连接到 H2\
  \ 内存数据库的完整 SQL 控制台。这有助于解决许多问题。当你使用 `sampleuser/samplepass` 连接到 `http://localhost:8080/h2-console`\
  \ 时，发生的情况如下：\n\n![图 7.9：运行 H2 SQL 查询](img/B18632_07_10.jpg)\n\n图 7.9：运行 H2 SQL 查询\n\
  \n还有测试预制数据集的棒方法。我们将在未来的章节中看到这些，随着我们继续进行更复杂的用例以及微服务之间的交互。\n\n# 总结\n\n在本章中，我们学习了在服务中处理数据的方法。虽然这里的示例都与\
  \ SQL 数据库绑定，但 Spring Data 为所有主流数据库提供了类似的方法。在本书中，我们还将查看非 SQL 的实现。但本质上，基础模板可以在其他数据库的扩展中找到：你需要添加支持其他数据库的依赖，然后查找可以使用哪些仓库类型。某些仓库将更高级，为你提供许多开箱即用的功能（就像\
  \ `JpaRepository` 那样）。其他仓库将为你提供更底层的选项，让你能够更精细地控制与数据库交互的方式。\n\n在下一章中，我们将转换思路，更多地讨论安全问题以及如何正确你的应用程序实现访问控制。本章就到此。我们在\
  \ *第 8 章* 见。\n\n\n\n\n\n3. 一旦用户通过身份验证，对某个微服务的每个请求都将由 JWT 令牌保护。换句话说，每当客户端需要使用某些应用微服务时，它需要在\
  \ HTTP 请求头中发送安全令牌，并携带请求数据（负载、标头、URL 等）。API 网关也将把令牌转发给微服务。\n\n4. 接收到请求后，所有微服务都必须接收到一个令牌，并能够返回身份提供程序查询该安全令牌是否仍然有效。这将可以确保用户已通过身份验证。此外，微服务还需要断言用户是否有权执行当前请求。一个普通用户（例如，HomeIt\
  \ 系统中的一个租户）可能会尝试执行管理员级的操作，例如尝试删除房东用户，即使该用户已通过身份验证，这种操作也是不被允许的。安全令牌还可以告知微服务用户的访问级别。\n\
  \n5. 最终，攻击者可能会尝试监听用户的连接。为了防止此类攻击，我们需要确保从应用到 API 网关的每一个连接都是通过 HTTPS 隧道进行的。这意味着所有数据都将被加密，只有客户端应用和服务器能够对其解密。\n\
  \n6. 攻击者可能会尝试代表用户向 API 网关发送请求，这意味着系统需要准备好过滤此类请求，通过`跨站请求伪造`（CSRF`）和`跨源资源共享``CORS`）配置来缓解这些尝试。\n\
  \n7. 攻击者可能会尝试访问存储在服务本身的数据，例如本地文件系统和数据库。在这种情况下，实现静态加密至关重要，这样即使攻击者可以通过终端等方式访问服务器，由于强加密机制的存在，他们仍然无法理解数据。\n\
  \n接下来，让我们发现如何使用 OAuth 2.0 标准来保护我们的应用程序。\n\n# 什么是 OAuth 2.0 以及为什么要使用它？\n\n你以前可能听过\
  \ OAuth 2.0，网网上有很多关于它的资料，但对开发者来说它可能非常复杂且令人困惑，因此我在这里用非常简单的术语来解释。从本质上说，这是一种用于应用程序用户身份验证和授权的强大标准。`OAuth`\
  \ 代表 `Open Authorization`（开放授权）。它是由`互联网工程任务组`（`IETF`）组织的 `RFC-6749` 中完全定义的授权架构和标准。`RFC`\
  \ 是指定不同互联网标准如何运作的文档；`IETF` 是目前负责维护这些文档的社区。我们的示例将符合 OAuth 规范的 2.0 版本。\n\nOAuth 2.0\
  \ 对于允许一个系统访问另一个系统中的资源特别重要。以下场景是启用 OAuth 2.0 应用程序的良好示例。\n\n## 用例 1 – 系统 A 访问系统 B\
  \ 拥有的资源\n\n假设你创建了一个可以代表用户访问其 Google Drive 上托管文档的应用程序。这需要你的应用将用户重定向到一个特殊的 Google\
  \ URL，用户可以在那里登录他们的 Google 账户并授权应用访问其文档。然后，用户将被送回你的应用程序，现在它就可以访问存储在 Google Drive\
  \ 文件夹中的用户个人文档了。\n\n下面的图说明了这一场景。数字决定了流的顺序：\n\n![Figure 8.2 – OAuth 2.0 跨域认证](img/B18632_08_2.jpg)\n\
  \n图 8.2 – OAuth 2.0 跨域认证\n\n其工作原理是 Google 通过应用自身的凭据（我们称之为 `client ID` 和 `client\
  \ secret` 凭据）授权你的应用程序，然后授权用户登录并向你的应用程序转发一个特殊的令牌，你的应用程序可以在每个请求中使用该令牌从 Google Docs\
  \ 本身检索数据。\n\n这是一个强大的模式，引发了许多有趣的用例。之一是允许用户在系统 B 上自我授权，从而在系统 A 中注册新用户。换句话说，我们只需要要求用户在\
  \ Google 网站上进行身份验证，就可以在 HomeIt 系统中注册新用户。\n\nOAuth 2.0 的第二个情况更简单。\n\n## 用例 2 – 系统\
  \ A 访问自己的资源\n\n查看下面的系统流图。它详细说明了令牌和授权如何从一个服务流向另一个：\n\n![Figure 8.3 – OAuth 认证](img/B18632_08_3.jpg)\n\
  \n图 8.3 – OAuth 认证\n\n需要强调的是，在 OAuth 2.0 中，你的客户端应用程序和你的用户都必须妥善验证自己的凭据。总而言之，我们可能会有两组令牌。现在的系统以某些细变变实现了这种模式，例如：\n\
  \n- 丢弃对客户端应用程序令牌的需求，但仍需要 `client ID` 和 `secret`，以及用户凭据（用户名和密码）。这种组合会将客户端授权服务和用户授权服务合并，这并不总是一个好主意，因为\
  \ `client ID` 和 `secret` 的验证不应与用户自己的凭据耦合。\n\n- 完全丢弃 `client ID` 和 `secret`，仅使用用户/密码凭据生成用户令牌来访问你的应用程序资源。\n\
  \n尽管我能够发现许多不符合 OAuth 2.0 标准的不同公司的应用程序（你会惊讶于发现数量之多），但出于各种安全原因，不建议在应用程序中跳过步骤。\n\n\
  另外，在我们包含 Google 授权的第一个示例中（图 8.2），用户和客户端授权服务从我们的图中删除了。但它们仍然存在于我们的系统实现中。你始终需要提供你的应用\
  \ ID 和密钥来与 Google 认证交互。我从图中移除它们是为了更容易理解流程。\n\n现在，让我们发现 OAuth 2.0 在身份验证/授权系统中提出了哪些类型的服务。\n\
  \n## OAuth 2.0 中的基础服务类型\n\n根据 OAuth 2.0 规范，为了我们的身份验证系统足够的安全性，必须具备某些关键的系统功能。如果没有这些功能，可能会丢失重要的功能，你的应用程序将更容易受到恶意攻击。\n\
  \nOAuth 规范提出了以下服务类型：\n\n- **资源所有者**：拥有访问资源的系统。在第一个示例中，Google 是你需要访问的文档的所有者。终端用户也被视为资源所有者，因为他们是所有者并有权决定何时可以访问文档（这就是为什么他们通常持有用户凭据，例如密码或授权令牌）。在第二个示例中，你的应用程序是资源所有者。\n\
  \n- **授权服务器**：这些服务负责发布访问令牌，告诉你的应用程序用户已成功通过身份验证。\n\n- **客户端应用程序**：用于允许用户登录并与资源服务交互的应用程序。区分你的客户端是非常重要的，因为\
  \ OAuth 2.0 只允许授权的客户端应用程序进行登录尝试。\n\n\n\n\n\n- **资源提供者 (Resource providers)**：这些是一项或多个为您的客户提供重要业务领域对象的服务。换句话说，任何实现关键产品需求的\
  \ API 都被视为资源提供者。例如，考虑我们的租赁房产 API（Rental Property API）。这是一个宝贵的资源，应该只能通过适当的安全过滤器（有效的客户端令牌和用户令牌）进行访问。\n\
  \n现在，许多此类提供者都存在于企业级供应商和开源项目中。让我们看看它们是如何融入我们的整体蓝图的。\n\n## 行业级授权提供者\n\n行业中有很多可用产品，允许您将现成的身份提供者集成到您的\
  \ Spring 应用程序和微服务中。其中包括 Keycloak、Auth0、Okta、Amazon Cognito 和 Google Identity Platform。它们都有许多优点和缺点。\n\
  \n不过，在本章中，我们将仅使用 Spring Security 实现一个示例授权机制。您可以在此处将授权提供者替换为未来可能需要的任何其他提供者。记住，Spring\
  \ 服务的关键在于设计接口，以便您可以用任何想要的新服务和基础设施来替换实现类。\n\n# 理解 JWT 的工作原理\n\nOAuth 2.0 标准没有强制执行任何安全令牌的实现。因此，作为架构师，由您决定如何创建和验证令牌。\n\
  \n实现安全令牌有许多方法，例如 JWT、PASETO、macaroons、CBOR Web Tokens 和 Hawk。由于 JWT 使用最广泛，我们将在本章中使用它。但请记住，如果您想切换离\
  \ JWT，可以在网上找到其他令牌规范（您可以去 Google 搜索我刚才提到的那些）。\n\n其他令牌规范有不同的工作流实现方式，我们在这里无法涵盖。但通常情况下，它们尝试通过不同的假设来解决授权挑战。在本章中，我们还将涵盖对\
  \ JWT 的大部分批评，所以不用担心，我们将能够学会如何正确使用 JWT。由于这是一个成熟公认的标准，且 Spring 的实现异常可靠并经过实战检验，让我们在本章中遵循\
  \ JWT 令牌规范。\n\nJWT 指由 JSON 结构创建的令牌，揭示了有关已验证用户的特定数据。该标准由 IETF 组织的 `RFC-7519` 定义。您可以在此处阅读完整规范：[`datatracker.ietf.org/doc/html/rfc7519`](https://datatracker.ietf.org/doc/html/rfc7519)。\n\
  \nJWT 令牌本质上是一个包含三个部分并用点分隔的字符串，如下：\n\n![图 8.4 – JWT 令牌结构](img/B18632_08_4.jpg)\n\n\
  图 8.4 – JWT 令牌结构\n\n您应该知道的第一点是，每个部分都是 Base64 编码的 JSON 字符串。接下来，让我们看看令牌每个部分的解释。\n\n\
  ## JWT Header\n\nJWT 令牌的第一部分是头部，包含了令牌类型和所使用的加密签名算法。这是一个示例：\n\n```\n{\n  \"alg\"\
  : \"HS256\",\n  \"typ\": \"JWT\"\n}\n```\n\n为了创建令牌的第一部分，我们应用 Base64 编码，将此示例头部转换为以下字符串：\n\
  \n```\ney AiYWxnIjogIkhTMjU2IiwgInR5cCI6ICJKV1QiIH0g\n```\n\n## JWT 负载 (Payload)\n\
  \nJWT 令牌的第二部分是我们所说的负载，或额外的应用程序数据。这些数据通常关于用户以及令牌生成本身。它也被称为声明（claim），指的是此令牌声称用户拥有的某些权限。\n\
  \n这是一个 JWT 负载的示例：\n\n```\n{\n  \"iss\": https://auth.homeit.com, // 生成 jwt 的者\n\
  \  \"sub\": \"user123\",               // 用户 ID\n  \"exp\": 1716242622,        \
  \       // 令牌过期\n  \"iat\": 1616239022,               // 令牌生成时间\n  \"name\": \"\
  John Doe\",             // 用户名\n  \"email\": john.doe@example.com,  // 用户邮箱\n  \"\
  groups\": [                      // 用户所属组\n    \"tenant\"\n  ],\n  \"permissions\"\
  : {                 // 权限集\n    \"rental_search\": [           // 服务名\n      \"\
  read\"                      // 访问级别\n    ],\n    \"user_info\": [              \
  \ // 权限\n      \"read\",\n      \"write\"\n    ]\n}\n```\n\n此负载转换为 Base64 后如下：\n\
  \n```\neyAKCiAglzcyI6IGh0dHBzOi8vYXV0aC5ob21laXQuY29tCAvLyB0aGUgaXNzdWVyIA\nKICAic3ViIjogInVzZXIxMjMiLCAgICAgICAgICAgICAgIC8IHRoZSB1c2VyIGlk\n\
  KICAiZXhwIjogMTcxNjI0MjYMMiwgAgAgAgAgICAgAgAg88HRHR222224\nCogICJpYXQiOiAxNjEMjM5MDIyLCAgICAgICAgICAgICAgIC8gdG9rZW4gZ2Vu\n\
  JhdhdbiB0WWllIAKKibmFtFtSI6JKJK2huIERvZSIsAgAgAgICAgICICIC8IIzzZZZXIFtFtKKCiAgIm11c300290000\n\
  ```\n\n\n\n\n\n```\neyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2F1dGguaG9t\n\
  ZWl0LmNvbSIsInN1YiI6InVzZXIxMjMiLCJleHAiOjE3MTYyNDI2MjIsImlhdCI6MTYx\nNjIzOTAyMiwibmFtZSI6IkpvaG4gRG9lIiwiZW1haWwiOiJqb2huLmRvZUBleGFtcGxl\n\
  LmNvbSIsImdyb3VwcyI6WyJ0ZW5hbnQiXSwicGVybWlzc2lvbnMiOnsicmVudGFsX3Nl\nYXJjaCI6WyJyZWFkIl0sInVzZXJfaW5mbyI6WyJyZWFkIiwid3JpdGUiXX19.t5fW4uC-g_0j8smuCV9WbdHZZmDWdaaj7Mu9WqmxNqEOOdDUSuGTo8U8S5t8fZCHtvMR5CNZXj5-VxW_q5ueAw\n\
  ```\n\n点号分隔了三个部分：头部（header）、负载（payload）和签名（signature）。\n\n你可以使用一些不同的方法来验证你的令牌。现在让我们来看一些变体。\n\
  \n# 验证令牌的不同架构\n\n在考虑如何验证令牌时，你需要考虑性能因素与安全保障之间的平衡。没有 100% 安全的系统，因此你需要了解架构中的缺陷在哪里，并计划修复它们，以防攻击者获得未经授权的访问。\n\
  \n以下是创建和验证令牌的一些可能性：\n\n* **集中式授权服务创建令牌**：所有其他服务都回溯授权服务本身来检查令牌的有效性。这会为验证令牌带来开销，因为每调用一次微服务都会产生一次额外的网络请求。这些额外的网络调用意味着你的授权服务必须处理大量的请求，这给它带来了巨大的负载压力。尽管如此，每一步都执行了更高的安全标准。\n\
  * **集中式授权服务创建令牌**：验证仅在每个用户请求时发生一次，即在 API 网关接收到请求时，无论到达了多少微服务。这减轻了授权服务的负载，因为其他微服务不需要再次调用授权服务。但它也给攻击者留了机会，他们可以向不验证令牌的服务发送伪造请求，而该服务只信任在某处完成的验证结果。\n\
  * **集中式授权服务使用私钥创建令牌**：其他服务使用公钥验证请求。这减轻了授权服务的负担，并允许其他服务自己验证令牌。但现在你需要处理一组分发式的公钥。\n\
  * **客户端每次请求都请求新令牌**：这也会给你的授权服务带来巨大的负载压力，但额外的好处是令牌的生命周期更短，这意味着窃取令牌的攻击者将无法再次使用它。\n\
  \n这只是一个开头，以便你能够产生自己的令牌生成/验证想法。\n\n以下缺点通常适用于使用 JWT：\n\n* 如果攻击者成功获取了你的密钥，你需要一个稳健的策略来在所有涉及的服务中快速撤销这些密钥。这基本上意味着每个客户都将被强制重新登录。\n\
  * 如果令牌被泄露，你应该有一种撤销该令牌的方法。如果你的授权服务将有效令牌存储在数据库中，这意味着你可以将令牌标记为无效。但请记住，你不需要在数据库中存储有效令牌。签名过程（据称只有授权服务能够创建令牌）和令牌过期时间保证了令牌的有效性。如果你不存储有效令牌，你至少应该有一个黑列表数据库。确保你的验证过程会检查该数据库，以防你想撤销令牌时可以使用。\n\
  * 客户端使用令牌的时间越长，它越容易受到攻击。确保你的过期时间不要太长，以至于攻击者可以使用被盗取的令牌持续几天。这完全取决于你的用例（GitHub 允许创建永久有效的令牌）。只需记住涉及的安全风险，并明智地选择你的过期日期。\n\
  \n好了，这就是理解 JWT 及其所有权衡需要涵盖的所有内容。现在让我们转向在 Spring 中使用 JWT 实现 OAuth 2.0 身份验证。\n\n# 实现\
  \ HomeIt 安全\n\n在处理应用级别的安全需求时，你可能应该使用 Spring Security 依赖来满足我们刚刚讨论的所有要求。该项目有很多重要的配置，有助于创建一个更安全的微服务集合。\n\
  \n尽管在你的应用程序中使用 Spring Security 有有方法，但我将在这里向你展示一种常见的系统设计模式，它可以创建让你执行以下操作的服务：\n\n\
  * 创建用户登录数据并安全地存储用户密码\n* 存储额外的个人信息，如姓/名和出生日期\n* 验证用户身份以便他们可以使用你的服务\n* 确保用户被分配到角色，这些角色用作过滤器来授权系统上的操作\n\
  * 验证并授权到达每个微服务的每个请求\n\n你准备好了吗？\n\n这是我们系统中可能有的一个示例用例。请在此处查看序图：\n\n![图 8.5 – HomeIt\
  \ 示例登录实现](img/B18632_08_5.jpg)\n\n图 8.5 – HomeIt 示例登录实现\n\n我们将基于以下假设工作：\n\n* 系统将使用非对称密钥验证令牌签名。私钥用于令牌，公钥用于验证。\n\
  * 授权服务将存储用户凭据并使用私钥创建令牌。\n* 其他服务（`User Info` 和 `Rental Properties`）将在本地验证。\n* 在创建新用户或生成令牌时，将验证\
  \ `clientId` 和 `secret`。\n\n\n\n\n\n```\ndependencies {\n    implementation 'org.springframework.boot:spring-boot-starter'\n\
  \    implementation 'org.springframework.boot:spring-boot-starter-web'\n    implementation\
  \ 'org.springframework.boot:spring-boot-starter-data-jpa'\n    implementation 'com.h2database:h2'\n\
  \    implementation 'org.springframework.boot:spring-boot-starter-security'\n  \
  \  implementation 'org.springframework.security:spring-security-oauth2-authorization-server'\n\
  \    compileOnly 'org.projectlombok:lombok:1.18.32'\n    annotationProcessor 'org.projectlombok:lombok:1.18.32'\n\
  \    testImplementation 'org.springframework.boot:spring-boot-starter-test'\n  \
  \  testCompileOnly 'org.projectlombok:lombok:1.18.32'\n    testAnnotationProcessor\
  \ 'org.projectlombok:lombok:1.18.32'\n    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'\n\
  }\n```\n\n注意，我们使用了许多在租赁物业微服务（Rental Property microservice）中用过的依赖。我们还使用了 H2 依赖，以便于内存数据库连接。\n\
  \n新的依赖项如下：\n\n*   Spring-boot-starter-security，它提供了基础过滤器基础设施\n*   Spring Security\
  \ OAuth 2.0 授权服务器\n\n可以在此处找到完整的 `build.gradle` 文件：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-08/authprovider/build.gradle`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-08/authprovider/build.gradle)。\n\
  \n## 创建你的安全配置类\n\n对于 Spring，我们需要设置安全配置类。它的写法如下：\n\n```\n@Configuration\npublic class\
  \ SecurityConfiguration {\n    @Bean\n    public PasswordEncoder passwordEncoder()\
  \ {\n        return new BCryptPasswordEncoder();\n    }\n    @Bean\n    protected\
  \ DefaultSecurityFilterChain\n        configure(HttpSecurity http) throws Exception\
  \ {\n        return http\n            .csrf(AbstractHttpConfigurer::disable)\n \
  \           .cors(AbstractHttpConfigurer::disable)\n            .authorizeHttpRequests(auth\
  \ ->\n                auth.requestMatchers(\n                    \"/users/register\"\
  ,\n                    \"/users/token\").permitAll()\n                    .anyRequest().authenticated()\n\
  \            )\n            .sessionManagement(sess -> sess.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n\
  \            .build();\n    }\n}\n```\n\n`@Configuration` 是一个重要的 Spring 注解，它告诉 Spring\
  \ 根据带注解的类创建一个 bean。`config` bean 的存在是为了帮助你以多种方式配置应用程序。在 Spring Security 中，通常有一个安全配置\
  \ bean，其目的是设置安全过滤器。\n\nSpring Security 提供了极其丰富方式来配置应用程序中的安全性。本质上，你能够选择如何验证用户（例如通过查看任何现有的数据库或远程服务），以及如何对任何方法强制执行授权。\n\
  \n在我们的案例中，由于我们基本上对创建用户和发放令牌感兴趣，因此我们只需要实现两个方法：`passwordEncoder()` 和 `configure()`。这两个方法都标记了\
  \ `@Bean`，这告诉 Spring 这些是创建 Spring beans 的工厂方法。换句话说，在实例化 `SecurityConfig` bean 时，Spring\
  \ 也会调用该类中的两个方法，以创建一个 `PasswordEncoder`（由 `passwordEncoder()` 方法返回）。\n\n\n\n\n\n\
  ### 实现授权提供者领域\n\n在这个示例实现中，授权提供者的职责是维护一个有效用户凭据数据库，该数据库允许创建用户、验证其是否存在、检查密码，并在用户自行完成身份验证后生成有效的\
  \ JWT 令牌。\n\n正因如此，我们需要以下核心类和服务：\n\n*   `UserRepository`：用于用于存储用户\n*   `UserEntity`：用于表示将要持久化的用户凭据\n\
  *   `UserService`：一个创建令牌的 JWT 服务\n*   `ClientService`：用于验证我们的客户端应用 ID 和应用密钥（记住，你的应用应该验证它自己的凭据）\n\
  *   `ScopeService`：根据用户类型产生访问范围（access scope）\n*   `UserController`：提供一个包含两个端点的\
  \ REST 接口：`/users/register` 和 `/users/token`，分别用于创建用户和根据用户凭据创建令牌。\n\n让我们详细查看这些类。本节的编译代码可以在此处找到：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-08/authprovider/src/main/java/com/homeit/authprovider`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-08/authprovider/src/main/java/com/homeit/authprovider)。\n\
  \n### UserEntity 和 UserRepository 类\n\n让我们先来看看用户是如何在数据库中创建和存储的。以下是表示将要持久化的用户凭据的\
  \ `UserEntity`：\n\n```\n@Entity\n@Table(name = \"users\", uniqueConstraints = @UniqueConstraint(columnNames\
  \ = \"email\"))\n@Data\n@NoArgsConstructor\n@AllArgsConstructor\npublic class UserEntity\
  \ {\n    @Id\n    private UUID id;\n    @Column(unique = true, nullable = false)\n\
  \    private String email;\n    private String password;\n    private String userType;\n\
  }\n```\n\n我们的 `UserEntity` 包含一个邮箱地址（登录名）、一个 ID（我们用于在其他服务中关联用户的实际主键）、密码以及用户类型（在我们的示例中为租户或房东）。\n\
  \n当你编写此类服务时，**要避免将用户邮箱作为跨微服务的用户 ID 的诱惑**。如果用户决定更改邮箱，这会在你的服务中造成一团混乱。信不由，我曾见过大公司因为在系统中选择用户邮箱作为用户\
  \ ID 而导致在身份验证系统中面临巨大挑战。不要重复这个错误！\n\n正如你所注意到的，我建议了一种架构，其中我们有另一个 `UserInfo` 微服务。User\
  \ Info 服务负责持久化其他重要的用户数据（地址、出生日期、ID 等）。这使得关键的登录信息与我们所谓的`个人身份信息`（`PII`）隔离开来，这有助于识别用户。PII\
  \ 值得完全不同的处理方式（在当今，隐私是任何系统中非常关键的非功能性需求，关于公司被如何使用或暴露用户数据有许多严格的法规）。\n\n以下是 `UserRepository`\
  \ 类：\n\n```\npublic interface UserRepository extends\n    JpaRepository<UserEntity,\
  \ UUID> {\n    Optional<UserEntity> findByEmail(String email);\n}\n```\n\n### 用户服务\n\
  \n在我们的授权提供者中，我们有一个 `UserService` 接口，负责创建用户登录并检查其是否存在。以下是接口及其方法：\n\n```\npublic interface\
  \ UserService {\n    Optional<UserDTO> createUser(\n        String email, String\
  \ password, String userType);\n    Optional<UserDTO> findByEmail(String email);\n\
  \    boolean validateUser(String email, String password);\n}\n```\n\n当然，我们还包含了实现了我们接口的\
  \ `UserInterfaceImpl` 类。它注入了两个重要的 Bean：`UserRepository` 和 `PasswordEncoder`。以下是其声明：\n\
  \n```\n@Service\npublic class UserServiceImpl implements UserService {\n    private\
  \ final UserRepository userRepository;\n    private final PasswordEncoder passwordEncoder;\n\
  \    public UserServiceImpl(UserRepository userRepository,\n        PasswordEncoder\
  \ passwordEncoder) {\n        this.userRepository = userRepository;\n        this.passwordEncoder\
  \ = passwordEncoder;\n    }\n```\n\n你可能还记得，`PasswordEncoder` 是我们在 `SecurityConfiguration`\
  \ 类中创建的 Bean，通过带有 `@Bean` 注解的方法。在实例化 `UserServiceImpl` 之前，Spring 框架将通过调用我们 `SecurityConfiguration`\
  \ Bean 中的该方法来实例化 `PasswordEncoder`，然后将其注入此处。\n\n以下是我们在此服务实现中创建用户的方式：\n\n```java\n\
  @Override\npublic Optional<UserDTO> createUser(String email,\n    String password,\
  \ String userType) {\n    if(!userRepository.findByEmail(email).isEmpty()) {\n \
  \       return Optional.empty(); // email 已使用\n    }\n    return Optional.of(userRepository.save(\n\
  \        new UserEntity(UUID.randomUUID(),\n            email, passwordEncoder.encode(password),\n\
  \            userType)))\n        .map(UserConverter::fromUserEntity);\n}\n```\n\
  \n如果用户密码已被占用，该方法将拒绝创建用户。在密码已被占用时返回一个空的 `Optional` 并不是最佳选择，因为不清楚用户创建过程中发生了什么。但在这种实现中这不是大问题。\n\
  \n此外，注意使用 `passwordEncoder` 服务非常重要。我们提供原始密码，编码器将创建一个哈希值并存储在数据库中。这通过不暴露用户明文密码来增加了安全性。\n\
  \n以下是我们验证用户的方式：\n\n```java\n@Override\npublic boolean validateUser(String email,\
  \ String password) {\n    return userRepository.findByEmail(email)\n        .map(user\
  \ -> passwordEncoder.matches(password, user.getPassword()))\n        .orElse(false);\n\
  }\n```\n\n最后，这是我们通过邮箱查找用户的方式：\n\n```java\npublic Optional<UserDTO> findByEmail(String\
  \ email) {\n    return userRepository.findByEmail(email)\n        .map(UserConverter::fromUserEntity);\n\
  }\n```\n\n### 客户端服务\n\n我们也提供了一个客户端服务，在我们的示例中这是一个非常简单的实现。以下是接口：\n\n```java\npublic\
  \ interface ClientService {\n    boolean validateClient(String clientId, String\
  \ clientSecret);\n}\n```\n\n以下是实现类：\n\n```java\n@Service\npublic class ClientServiceImpl\
  \ implements ClientService {\n    private final String clientId = \"4ca8f880-0bee-4c24-88ce-3402fe7e37f0\"\
  ;\n    private final String clientSecret = \"b08cee2b-e79f-472b-a0b9-b210465c8bf3\"\
  ;\n\n    @Override\n    public boolean validateClient(String clientId, String clientSecret)\
  \ {\n        return this.clientId.equals(clientId) && this.clientSecret.equals(clientSecret);\n\
  \    }\n}\n```\n\n本章重点是分布式地创建和验证 JWT，我基本上为客户端 ID 和密钥验证提供了一个硬编码实现。有许多方法可以改进这种实现。我见过大公司通过以下方式实现客户端验证：\n\
  \n*   将有效的客户端应用 ID 和密钥添加到外部配置文件并将其加载到 map 中，使用带有 `@Configuration` 注解的 Bean 类。该 Bean\
  \ 将提供一个从客户端 ID 到客户端密钥的 map，以便我们进行字符串比较。\n\n\n\n\n\n*   在云端创建 API 网关应用，然后将客户端 ID（client\
  \ IDs）和密钥（secrets）分配给这些 API 网关。API 网关本身具有生成客户端令牌（client tokens）的特性。\n*   API 产品（如\
  \ Twilio、Google Maps、Facebook 和 PayPal）将为你提供一种服务，让你为想要集成其服务的应用程序创建一组凭据。当然，这些 API\
  \ 产品提供了一种实现，其中客户端 ID 和密钥是按需生成并持久化在数据库中的。\n\n这里是进行客户端验证的其他方法：\n\n*   你可以扩展此服务，在尝试创建用户令牌（user\
  \ token）之前也先创建一个客户端令牌。只有当使用了有效的客户端令牌时，授权服务才能创建用户。其他服务也应该能够验证客户端令牌。\n*   你可以使用其他现成的服务（如\
  \ Keycloak）来创建客户端 ID 和密钥。\n\n还有无数其他方法；这些只是供你入门的几个选项。\n\n### 范围服务 (scope service)\n\
  \n如前所述，范围服务将根据用户类型提供 JWT 范围令牌。以下是示例接口：\n\n```java\npublic interface ScopeService\
  \ {\n    String findScope(String userType);\n}\n```\n\n以下是示例实现：\n\n```java\n@Service\n\
  public class ScopeServiceImpl implements ScopeService{\n    @Override\n    public\
  \ String findScope(String userType) {\n        if(\"tenant\".equals(userType)) {\n\
  \            return \"rental_properties:read\";\n        }\n        if(\"landlord\"\
  .equals(userType)) {\n          return\n            \"rental_properties:read rental_properties:write\"\
  ;\n        }\n        return null;\n    }\n}\n```\n\n你可以看到，这也是一个为了让你上手而写的硬编码实现。本质上，如果用户是\
  \ `tenant`（租户）类型，他们获得 `Rental Properties` 服务的权限。他们对该服务拥有读取权限。如果用户是 landlord（房东），他们将同时拥有读取和写入权限。这意味着房东能够添加自己的属性，而租户只能搜索属性并读取属性详情。\n\
  \n以下是改进此实现的几种方法：\n\n*   你可以更改范围服务的实现，并将其配置在外部文件中，这允许你在每个部署环境中配置不同的访问范围（我们将来将看到如何使用外部配置文件）。\n\
  *   你可以更改范围服务的实现，并为身份提供者添加范围实体（scope entity）、范围存储库（scope repository）以及端点（endpoints）。这将允许你使用\
  \ API 端点来设置为每个用户类型映射哪些访问范围字符串。\n*   你可以创建一个远程范围微服务，根据给的用户类型返回访问范围字符串。在该微服务中，你可以根据需要通过将配置持久化在单独的配置文件甚至数据库中，配置不同的用户类型及其对应的范围访问字符串。\n\
  *   可能有一种方法覆盖范围服务的默认返回值并将范围直接分配给用户。因此，在生成令牌时，不再尝试直接从用户类型中提取访问范围，而是从用户 ID 本身提取范围。可以通过许多不同的方式实现，例如在范围服务本身或另一个微服务中。我不建议在身份提供者的用户实体中添加此功能，因为这给该服务增加了过多的责任。\n\
  *   范围不仅可以创建服务访问权限，还可以在系统中生成用户角色，以便你可以根据角色而不仅仅是服务操作权限来添加限制。\n\n定义了这些关键服务后，让我们理解\
  \ JWT 服务本身的作用，它实际上是创建令牌的。\n\n### JWT 服务\n\n最后，让我们检查如何创建令牌。以下是 JWT 服务接口：\n\n```java\n\
  public interface JWTService {\n    TokenResponse getJWTToken(\n        TokenRequest\
  \ tokenRequest,\n        String scope, String userId);\n}\n```\n\n首先，我想向你展示一个生成非对称密钥对的方法：\n\
  \n```java\nprivate static KeyPair generateRsaKey() {\n    try {\n        KeyPairGenerator\
  \ keyPairGenerator =\n            KeyPairGenerator.getInstance(\"RSA\");\n     \
  \   keyPairGenerator.initialize(2048);\n        KeyPair keyPair =\n            keyPairGenerator.generateKeyPair();\n\
  \        // 将密钥编码为 Base64\n        String privateKeyString =\n            Base64.getEncoder().encodeToString(\n\
  \            keyPair.getPrivate().Encoded());\n        String publicKeyString =\n\
  \            Base64.getEncoder().encodeToString(\n            keyPair.getPublic().Encoded());\n\
  \        // 打印密钥\n        System.out.println(\"Private Key: \" + privateKeyString);\n\
  \        System.out.println(\"Public Key: \" + publicKeyString);\n        return\
  \ keyPair;\n    } catch (Exception ex) {\n        throw new IllegalStateException(ex);\n\
  \    }\n}\n```\n\n我使用这个方法作为在此实现中使用的密钥对的来源，但你也可以使用任何在线生成器。在 JavaScript 中知道如何生成这种密钥对的优势在于，你可以创建一个单独的微服务，专门为令牌请求创建非对称对。这会让你的服务安全得多，因为每个令牌请求都有的一组公钥和私钥作为支持。但也会增加一些延迟，因为所有微服务都需要从该微服务获取公钥。一如既常，这完全取决于权衡。\n\
  \n以下是加载一对静态密钥的方法：\n\n```java\nprivate static KeyPair loadRsaKey() {\n    // 解码 Base64\
  \ 编码的字符串\n    byte[] privateKeyBytes = Base64.getDecoder()\n    .decode(\"your base\
  \ 64 encoded key here\");\n    byte[] publicKeyBytes = Base64.getDecoder()\n   \
  \ .decode(\"your base 64 encoded key here\");\n    // 从解码的字节中生成 PrivateKey\n   \
  \ PKCS8EncodedKeySpec privateKeySpec =\n    new PKCS8EncodedKeySpec(privateKeyBytes);\n\
  \    KeyFactory keyFactory = null;\n    try {\n        keyFactory = KeyFactory.getInstance(\"\
  RSA\");\n    } catch (NoSuchAlgorithmException e) {\n        throw new RuntimeException(e);\n\
  \    }\n    PrivateKey privateKey = null;\n    try {\n        privateKey =\n   \
  \         keyFactory.generatePrivate(privateKeySpec);\n    } catch (InvalidKeySpecException\
  \ e) {\n        throw new RuntimeException(e);\n    }\n    // 从解码的字节中生成 PublicKey\n\
  \    X509EncodedKeySpec publicKeySpec =\n        new X509EncodedKeySpec(publicKeyBytes);\n\
  \    PublicKey publicKey = null;\n    try {\n        publicKey =\n            keyFactory.generatePublic(publicKeySpec);\n\
  \    } catch (InvalidKeySpecException e) {\n        throw new RuntimeException(e);\n\
  \    }\n    // 创建并返回 KeyPair\n    return new KeyPair(publicKey, privateKey);\n}\n\
  ```\n\n在此段代码中，我硬编码了公钥和私钥，但你也可以将它们添加到外部配置文件，甚至添加到数据库中。\n\n最后，这就是我们生成 JWT 令牌的方式：\n\
  \n\n\n\n\n```java\n@Override\npublic TokenResponse getJWTToken(TokenRequest tokenRequest,\n\
  \    String scope, String userId) {\n    try {\n        KeyPair keyPair = loadRsaKey();\n\
  \        RSAPublicKey publicKey = (RSAPublicKey)\n              keyPair.getPublic();\n\
  \        PrivateKey privateKey = keyPair.getPrivate();\n        Date issueTime =\
  \ new Date();\n        Date expiry = new Date(\n            System.currentTimeMillis()\
  \ + 3600000);\n        JWTClaimsSet claimsSet = new JWTClaimsSet.Builder()\n   \
  \           .subject(userId)\n              .issueTime(issueTime)\n            \
  \  .claim(\"scope\", scope)\n              .expirationTime(expiry) // 1 hour\n \
  \             .build();\n        String keyId =\n            \"fab38aa6-d05b-4ab8-b045-8362b90acfdf\"\
  ;\n        SignedJWT signedJWT = new SignedJWT(\n            new JWSHeader.Builder(JWSAlgorithm.RS256)\n\
  \                  .keyID(keyId).build(),claimsSet);\n        signedJWT.sign(new\
  \ RSASSASigner(privateKey));\n        String jwtToken = signedJWT.serialize();\n\
  \        return new TokenResponse(\n            jwtToken, \"Bearer\", \"3600\",\
  \ scope );\n    } catch (Exception e) {\n        throw new RuntimeException(\n \
  \           \"Error creating token\",e);\n    }\n}\n```\n\n该方法期望一个 `TokenRequest`，其实现如下：\n\
  \n```java\npublic record TokenRequest (String grant_type,\n                    \
  \         String username,\n                             String password,\n    \
  \                         String client_id,\n                             String\
  \ client_secret){}\n```\n\n如你所看到的，`getJWTToken()` 方法同样需要用户 ID。\n\n你可以在代码中看到，过期日期是在当前时间之后的\
  \ `3,600,000` 毫秒后计算的，这等于 `60` 分钟。如前所述，根据你的用例，你可以以任何想要的方式设置时长。如果你愿意，甚至可以设置为一整年。在某些情况下，令牌过期时间设置为整年是有合理的，例如用于低价值信息的只读令牌。\n\
  \n密钥 ID（key ID）是另一个有趣点。在这个实现中，我只是添加了一个静态 ID，但如果你有一个外部微服务来生成密钥，那么你就可以返回密钥 ID。因此，当微服务接收到你的令牌时，你就能检索密钥\
  \ ID 并向你的微服务请求公钥。`TokenResponse` 实际上是授权服务的一个实现。它的定义如下：\n\n```java\npublic record\
  \ TokenResponse(\n    String access_token,\n    String token_type,\n    String expires_in,\n\
  \    String scope){}\n```\n\nJWT 生成部分就此结束。\n\n### UserController 类\n\n为了创建我们的 `UserController`\
  \ 类——它是注册用户和创建有效签名令牌的入口——开头部分代码如下：\n\n```java\n@RestController\n@RequestMapping(\"\
  /users\")\npublic class UserController {\n    private final UserService userService;\n\
  \    private final ClientService clientService;\n    private final JWTService jwtService;\n\
  \    private final ScopeService scopeService;\n    public UserController(UserService\
  \ userService,\n        ClientService clientService, JWTService jwtService,\n  \
  \      ScopeService scopeService) {\n        this.userService = userService;\n \
  \       this.clientService = clientService;\n        this.jwtService = jwtService;\n\
  \        this.scopeService = scopeService;\n    }\n```\n\n换句话说，我们注入了四个服务：`UserService`、`ClientService`、`JWTService`\
  \ 和 `ScopeService`。接下来，让我们看看如何注册用户：\n\n```java\n@PostMapping(\"/register\")\npublic\
  \ ResponseEntity<UserDTO> registerUser(\n    @RequestBody UserDTO userDto) {\n \
  \   return userService.createUser(\n        userDto.email(), userDto.password(),\n\
  \        userDto.user_type())\n    .map(ResponseEntity::ok)\n    .orElse(ResponseEntity.badRequest().build());\n\
  }\n```\n\n创建用户是一个非常简单的任务。如果创建未成功，我们返回 `400` – 错误请求（bad request）。这意味着用户创建过程中某些信息不正确。在这个实现中，我不希望向客户端添加过多信息，因为这可能导致潜在的漏洞。考虑到安全性，如果你返回了太多细节，黑客可以利用这些信息。\n\
  \n这是我实现创建签名 JWT 令牌接口的方式：\n\n```java\n@PostMapping(\n    value = \"/token\",\n  \
  \  produces = \"application/json\",\n    consumes = \"application/json\")\npublic\
  \ ResponseEntity<TokenResponse>\ncreateToken(@RequestBody TokenRequest tokenRequest)\
  \ {\n    if(!\"password\".equals(tokenRequest.grant_type())) {\n        return ResponseEntity.status(\n\
  \            HttpStatus.UNAUTHORIZED).build();\n    }\n    if(!clientService.validateClient(\n\
  \        tokenRequest.client_id(),\n        tokenRequest.client_secret())) {\n \
  \       return ResponseEntity.status(\n            HttpStatus.UNAUTHORIZED).build();\n\
  \    }\n    if(!userService.validateUser(\n        tokenRequest.username(),\n  \
  \      tokenRequest.password())) {\n        return ResponseEntity.status(\n    \
  \        HttpStatus.UNAUTHORIZED).build();\n    }\n    UserDTO foundUser =\n   \
  \     userService.findByEmail(tokenRequest.username()).get();\n    return ResponseEntity.ok(jwtService.generateToken(\n\
  \            foundUser.id()));\n}\n```\n\n### 配置文件\n\n最后，我添加了一个外部配置文件，它位于 `resources`\
  \ 文件夹中并命名为 `application.yml`：\n\n```yaml\nspring:\n  application:\n    name: auth\n\
  \  datasource:\n    url: jdbc:h2:mem:testdb\n    driverClassName: org.h2.Driver\n\
  \    username: sa\n    password: password\n  h2:\n    console:\n      enabled: true\n\
  \  jpa:\n    hibernate:\n      ddl-auto: update\n    show-sql: true\nserver:\n \
  \ port: 8081\n```\n\n我将服务器端口设置为 `8081`。\n\n### 使用服务\n\n在本地机器上运行此应用程序时，我可以发出请求：\n\
  \n*   **创建用户**：使用 curl，我可以发送以下请求：\n\n    ```bash\n    curl --request POST \\\n \
  \   url http://localhost:8081/users \\\n    -H 'Content-Type: application/json'\
  \ \\\n    --data '{\n      \"email\": \"user@example.com\",\n      \"password\"\
  : \"userpass\",\n      \"user_type\": \"tenant\"\n    }'\n    ```\n\n    这是我收到的响应：\n\
  \n    ```json\n    {\n      \"id\": \"10a66b7f-134f-437f-a58f-ad15447c05a0\",\n\
  \      \"email\": \"user@example.com\",\n      \"password\": null,\n      \"user_type\"\
  : \"tenant\"\n    }\n    ```\n\n*   **创建 JWT 令牌**：这是请求体。我们基本上是在表示通过密码授权类型进行用户身份验证，并提供了用户名、密码、客户端\
  \ ID 和密钥：\n\n    ```json\n    {\n      \"grant_type\": \"password\",\n      \"username\"\
  : \"user@example.com\",\n      \"password\": \"userpass\",\n      \"client_id\"\
  : \"4ca8f880-0bee-4c24-88ce-3402fe7e37f0\",\n      \"client_secret\": \"b08cee2b-e79f-472b-a0b9-b210465c8bf3\"\
  \n    }\n    ```\n\n    这是我们从服务器获取的答案。\n\n\n\n\n\n```json\n{\n  \"access_token\"\
  : \"eyJraWQiOiJmYWIzOGFhNi1kMDViLTRhYjgtYjA0NS04MzYyYjkwYWNmZGYiLCJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMGE2NmI3Zi0xMzRmLTQzN2YtYTU4Zi1hZDE1NDQ3YzA1YTAiLCleHAiOjE3MjA1OTAzODcsImlhdCI6MTcyMDU4Njc4Nywic2NvcGUiOiJyZW50YWxfcHJvcGVydGllczpyZWFkIn0.CTWh7bG9WZaXRxOj0hQ-lRzLi6nCXpGPBBPD8ipXnaUOKBCqYMGK_iImj5zjr3epM68wfu3bzVYwTF_TMPcRktGS3n1e7iJOsrDePO_eanQo7ZEzGHpOPjGHq9TnRsSZiyNYT9OJXtTrzKBYrXwhn5t2Idd6VcQJJp9tiTUIPxQePgEt1yI8LVl3puNFnjP_DJi7n33x9ZR3E1tqfgiDISGo-mGjXnwy_r_GwUZOoMsWGIjMGT6v42XqhvxywaMZv1rf4iWFDGOb-2Q_lSQ-GUm_XM3Yn2uKd76DtGoMpUlPQmjNT9ZZiro9Aiq2psPr6NpYCkgQZ9fOMGvD7QYaHg\"\
  ,\n  \"token_type\": \"Bearer\",\n  \"expires_in\": \"3600\",\n  \"scope\": \"rental_properties:read\"\
  \n}\n```\n\n好了，授权服务部分就到这里。现在让我们进入 `Rental Properties` 服务中添加的更改，使其能够验证我们的 JWT。\n\n\
  ## 在 Rental Properties 服务中添加 Spring Security\n\n为了在 `Rental Properties` 服务中添加安全配置，我们需要完成以下步骤：\n\
  \n1. 添加 Spring Security 依赖。\n2. 设置配置文件。\n3. 设置安全配置类。\n4. 为受保护的端点添加注解。\n\n我们将在接下来的几个小节中详细介绍每一个步骤。\n\
  \n### 添加 Spring Security 依赖\n\n在 `build.gradle` 文件的依赖部分，添加这些库：\n\n```\nimplementation\
  \ 'org.springframework.boot:spring-boot-starter-security'\nimplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'\n\
  ```\n\n如你所知，`starter-security` 依赖提供了基础的安全过滤器体系，而 OAuth 2.0 资源服务器依赖将帮助我们通过正确的 JWT\
  \ 验证来保护端点。\n\n### 设置配置文件\n\n为了使用 OAuth 2.0 资源服务器依赖中内置的 JWT 验证功能，我们需要在租赁物业的资源文件夹中创建一个\
  \ `application.properties` 文件，并添加以下条目：\n\n```\nspring.application.name=Rental-Property-App\n\
  spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.key\n\
  ```\n\n你可能记得，两个身份提供者都使用了 YAML 文件而不是我们在这里使用的 `.properties`。Spring 支持两种文件类型来外部化配置。\n\
  \n如你所见，OAuth 2.0 资源服务器依赖提供了获取公钥的默认配置。由于我们使用的是 `classpath`，我们只需要将公钥作为文件添加到资源文件夹中，并在其中包含我们的\
  \ Base64 编码公钥即可。这是 `application.properties` 和 `public.key` 文件的位置：\n\n![图 8.6：配置文件位置](img/B18632_08_6.jpg)\n\
  \n图 8.6：配置文件位置\n\n现在，让我们来实现安全配置对象，它是你授权服务中一个重要的 Spring Bean。\n\n### 设置安全配置类\n\n\
  这是我们在 `Rental Properties` 服务中配置 Spring Security 的方式。以下是类声明：\n\n```\n@Configuration\n\
  @EnableWebSecurity\n@EnableMethodSecurity\npublic class SecurityConfig {\n    protected\
  \ DefaultSecurityFilterChain\n        configure(HttpSecurity http) throws Exception\
  \ {\n      http.csrf(AbstractHttpConfigurer::disable)\n      .sessionManagement(\n\
  \          httpSecuritySessionManagementConfigurer ->\n              httpSecuritySessionManagementConfigurer\n\
  \                  .sessionCreationPolicy(\n                      SessionCreationPolicy.STATELESS));\n\
  \      http.authorizeHttpRequests(\n          authorizeRequests ->\n           \
  \   authorizeRequests.anyRequest().authenticated())\n      .oauth2ResourceServer(oauth2ResourceServer\
  \ ->\n          oauth2ResourceServer.jwt(jwt ->\n              jwt.jwtConverter(new\
  \ JwtAuthenticationConverter())));\n      return http.build();\n}\n```\n\n通过在类级别声明注解，我们告诉\
  \ Spring Security 应该提供方法级别的 Spring 安全功能。此配置类应该标记为 `@Configuration`，以便 Spring 知道这是一个\
  \ Bean 并应该在应用程序中实例化。\n\n接下来，我们禁用了 CSRF 安全，以允许任何调用我们的 API。我们还将此服务设置为无状态（stateless）。最后，我们声明任何请求都经过身份验证。通过\
  \ OAuth 2.0 资源服务器依赖，我们还表示通过 bearer token 发送的 JWT 将转换为 `Authentication` 对象。\n\n由于\
  \ Spring Security 提供了验证用户的多种方式，你需要在安全配置类中提供有关用户应如何进行身份验证的信息。在我们情况下，我们只是声明 JWT 应被视为身份验证的证明。这个依赖的神奇之处在于，由于我们已经在配置中提供了公钥，该依赖将使用它来验证我们的令牌签名。这些都是开箱即用的。\n\
  \n现在，仅此项就能让 Spring 验证资源服务器中的 JWT 令牌签名。现在如果你为每个令牌生成不同的密钥对（这不是一个常见的场景，因为计算开销很高），你可以提供一个新的\
  \ `JWTDecoder` 实现类，从令牌中检索密钥。\n\n另一个有趣点是：如果你想查看 OAuth 2.0 资源服务器依赖在底层是如何运行的，可以查看 `NimbusJWTDecoder`\
  \ 类的源代码。`decode()` 方法提供了该实现。如果你使用 IntelliJ 或其他 IDE，甚至可以下载源代码，在 `decode()` 方法处添加断点，并实时查看\
  \ JWT 解码器的工作。可以检查所有的变量和方法。\n\n### 为受保护的端点添加注解\n\n现在我们已经验证了 JWT，我们需要确保用户有权使用这些端点。记住，如果用户是房东，我们希望他们能够访问所有租赁物业端点，以及仅读取属性的端点。如果用户是租客，他们应该只能检索属性而不进行编辑。\n\
  \n我在 `RentalProperties` 服务中添加的主要更改位于 `RentalPropertyController` 类中。以下是更改的两个示例：\n\
  \n```\n@PostMapping(\n    consumes = \"application/json\",\n    produces = \"application/json\"\
  )\n@PreAuthorize(\"hasAuthority('SCOPE_rental_properties:write')\")\npublic ResponseEntity<RentalPropertyDTO>\
  \ createProperty(\n    @Valid @RequestBody RentalPropertyDTO property) {\n  RentalPropertyDTO\
  \ createdRentalProperty = jpaRentalPropertyService.create(property);\n  return ResponseEntity.status(HttpStatus.CREATED).body(createdRentalProperty);\n\
  }\n```\n\n在这个端点中，我们基本上使用 Spring 表达式语言 (`SpEL`) 添加了 `@PreAuthorize` 注解。在这种情况下，我们要求用户具有写入租赁物业的权限。\n\
  \n另一个端点是允许我们检索属性的那个：\n\n```\n@GetMapping(\n    value = \"/{id}\",\n    produces\
  \ = \"application/json\")\n@PreAuthorize(\"hasAuthority('SCOPE_rental_properties:read')\"\
  )\npublic ResponseEntity<RentalPropertyDTO> getPropertyById(\n    @PathVariable\
  \ UUID id) {\n  return jpaRentalPropertyService.get(id)\n      .map(ResponseEntity::ok)\n\
  \      .orElse(ResponseEntity.status(HttpStatus.NOT_FOUND).body(null));\n}\n```\n\
  \n在这种情况下，我们使用了相同的 `@PreAuthorize` 注解来确保用户具有读取属性的权限。\n\n\n\n请记住，我们在授权服务器中创建的作用（scopes）应该与我们在此要求的相匹配。格式为\
  \ `<service>:<accesslevel>`。`SCOPE_` 前缀是 OAuth 2.0 依赖项添加到你解析后的 JWT 中的一个默认字符串。\n\n\
  此外，你可以在任何服务的任何方法中使用 `@PreAuthorize` ——而不仅仅是在端点上。这可以为你的资源服务器带来极大的安全自定义能力。\n\n以下是你可以在方法级校验中使用的其他两种格式（众多格式中的两种）：\n\
  \n*   `@PreAuthorize(\"hasRole('ROLE_ADMIN')\")`\n*   `@PreAuthorize(\"hasRole('ROLE_ADMIN')\
  \ and hasAuthority('SCOPE_write:rental-properties')\")`\n\n如果你对这种方法级权限感兴趣，Spring\
  \ Security 提供了许多选项，包括你也可以自己创建的自定义权限。\n\n此外，如果你希望在利用这些安全限制方面具有更强的灵活性，可以使用以下其他注解：\n\
  \n*   `@Secured`：更简单的基于角色的访问控制\n*   `@RolesAllowed`：另一种基于角色的访问控制注解\n*   `@PostAuthorize`：执行后授权检查\n\
  *   `@PreFilter` 和 `@PostFilter`：允许你根据安全指令过滤任何对象集合（例如，只返回属于某个用户的租赁房）\n\n现在，让我们实现系统安全中一个非常重要的方面，即将访问权限限制为对象的所有者。\n\
  \n### 添加所有权安全限制\n\n假设一个黑客通过在你的网站注册成为房东获取了令牌，然后决定伪造请求来删除另一个房东添加的租赁房。按照目前的实现，你的租赁服务将验证\
  \ JWT，并且删除端点将允许处理该请求，对吧？毕竟 JWT 是合法的，而且房东有删除租赁房的能力。在目前的实现下，我们甚至可能看到房东尝试在另一个房东的账户上创建租赁房。你必须对这类事情非常小心。例如，房东可能会尝试重新配置另一个房东的银行账户，以便他们接收不属于自己的合同的付款。\n\
  \n这些示例实现并没有强制所有权。因此，为了确保房东只允许删除他们自己的租赁房，你基本上可以在想要执行此限制的控制器端点中注入一个名为 `Authentication`\
  \ 对象的特殊 Spring Security Bean。参考此示例：\n\n```java\n@DeleteMapping(\"/{id}\")\n@PreAuthorize(\n\
  \    \"hasAuthority('SCOPE_rental_properties:write')\")\npublic ResponseEntity<Void>\
  \ deleteProperty(\n    @PathVariable UUID id, Authentication authentication)\n \
  \     throws ParseException {\n    Jwt jwt = (Jwt) authentication.getPrincipal();\n\
  \    String userId = jwt.getClaim(\"sub\");\n    return entityManagerRentalPropertyService\n\
  \        .delete(id,userId)\n        .map(opt ->\n            ResponseEntity.noContent()\n\
  \                  .<Void>build())\n        .orElse(ResponseEntity\n           \
  \ .status(HttpStatus.NOT_FOUND).build());\n}\n```\n\n但这个 `Authentication` 对象是从哪里来的？在\
  \ Spring Security 中，在安全过滤器批准请求后，所有授权请求都会在后台生成一个 `Authentication` 对象。接口根据你使用的任何身份验证机制构建，它本质上是一个代表已验证用户的对象，包含了所有可用的重要数据。另一个例子是：你可以配置\
  \ Spring Security 提供登录表单，并在公司现有数据库中查找用户详情。一旦用户通过这些特殊提供程序通过验证，就会实例化 `Authentication`\
  \ 对象并绑定到会话 Cookie，并在每次请求时提供它；你只需注入它。但那是完全不同的 Spring Security 配置，超出了本章节的范围。\n\n如你所见，我们实现中的\
  \ `Authentication` 对象基本上是一个 `JWT` 令牌对象的实例，它是我们所使用的身份验证机制，我们可以从 `Subject` 声明中检索用户\
  \ ID。还记得我们在授权服务中将用户 ID 设置为令牌主体（subject）吗？这就是原因。\n\n我还更改了 `RentalPropertyService`\
  \ 接口，以便在 `delete()` 方法中支持 `userId` 参数作为授权用户。此外，我还修改了 `entityManagerRentalPropertyService`\
  \ 的实现。查看以下几行，其中我们确保只有在租赁房的所有者请求删除时才处理删除：\n\n```java\n@Override\npublic Optional<RentalPropertyDTO>\n\
  \    delete(UUID id, String userId) {\n    EntityManager entityManager =\n     \
  \   entityManagerFactory.createEntityManager();\n    EntityTransaction transaction\
  \ =\n        entityManager.getTransaction();\n    RentalPropertyDTO dto;\n    try\
  \ {\n        transaction.begin();\n        RentalProperty property = entityManager\n\
  \            .find(RentalProperty.class, id);\n        if(!property.getLandlordID()\n\
  \            .toString().equals(userId)) {\n            transaction.rollback();\n\
  \            return Optional.empty();\n        }\n        dto = RentalPropertyConverter.toDTO(property);\n\
  \        transaction.commit();\n    } catch (Exception e) {\n        if (transaction.isActive())\
  \ {\n            transaction.rollback();\n        }\n        throw e;\n    } finally\
  \ {\n        entityManager.close();\n    }\n    return Optional.ofNullable(dto);\n\
  }\n```\n\n本质上，如果属性不属于已验证的用户，将无法将其删除。此外，系统将认为该属性“未找到”。\n\n好了，最后一个话题带我们进一步探讨了如何使用\
  \ Spring Security 保护应用程序。\n\n### 实现和使用刷新令牌\n\nOAuth 2.0 的另一个重要方面是我们所说的刷新令牌（refresh\
  \ tokens）。刷新令牌是用于重新生成用户令牌的第二个令牌，以防第一个令牌过期。使用刷新令牌需要一些考虑。\n\n首先，如果你不希望用户在令牌过期后再次输入用户名和密码，那么刷新令牌尤为重要。但这引出了了一个争议性的问题：为什么用户令牌应该是短命的？\n\
  \n假设我们正在开发一个银行手机应用。你不希望 JWT 令牌在无活动状态下存超过两分钟，对吧？在这种情况下，创建一个非常短的令牌（例如，有效期为一分钟）和一个刷新令牌（它可以有八小时的有效期）是有意义的。如果你的用户在过去的\
  \ 60 秒内使用过应用，你可以使用刷新令牌来更新主令牌。如果用户超过一分钟没有使用它，你的应用程序可以撤销两个令牌，并且应用将用户登出。这可能是更新访问权限并保持严密安全限制的好方法。\n\
  \n非常长期的刷新令牌的问题在于，它们可能会被攻击者利用，在不需要用户凭据的情况下获取有效的用户令牌。\n\n在大多数情况下，你只需要一个普通的用户令牌。假设在\
  \ HomeIt 中，我们将过期日期设置为整整一周。用户可以一直保持登录状态，并且偶尔需要重新登录。在这种情况下，你也可以使用刷新令牌来避免糟糕的用户体验。令牌可能在用户正在执行重要操作时正好过期，例如，他们需要重新登录。你需要评估这种这种情况发生在用户身上的事件频率，以决定是否需要刷新令牌。再次，这仅仅意味着权衡利弊。\n\
  \n\n\n考虑刷新令牌（refresh tokens）的另一个重要方面。你也可以将刷新令牌制作为 JWT Token，但具有不同的作用范围（scope）。由于刷新令牌仅用于更新用户令牌，作用范围不需要包含系统中的其他操作，只需要访问允许从刷新令牌生成用户令牌的特定端点。而且，验证刷新令牌的唯一地方是授权服务器本身。\n\
  \n在编写刷新令牌逻辑时，你希望接收到与首次创建原始令牌时发送相同的请求负载（payload），但这次的授权类型类型（grant type）是 `refresh_token`。请看这个示例：\n\
  \n```json\n{\n    \"grant_type\":\"refresh_token\",\n    \"refresh_token\":\"YOUR_REFRESH_TOKEN\"\
  ,\n    \"client_id\":\"YOUR_CLIENT_ID\",\n    \"client_secret\":\"YOUR_CLIENT_SECRET\"\
  \n}\n```\n\n每当你生成一个新的用户令牌时，你也可以重新生成刷新令牌。这是一个你可以用于所有令牌创建响应负载的示例载负载：\n\n```json\n\
  {\n    \"access_token\":\"NEW_ACCESS_TOKEN\",\n    \"token_type\":\"Bearer\",\n\
  \    \"expires_in\":3600,\n    \"refresh_token\":\"NEW_REFRESH_TOKEN\"\n}\n```\n\
  \n就这些了！让我们结束这一章吧。\n\n# 总结\n\n在本章中，我们讨论了 Spring 应用的许多重要安全方面，具体来说，就是你可以编写启用 OAuth\
  \ 2.0 实现的多种方式。我们学习了 JWT 令牌是如何运作的，以及如何在非常安全的情况下对令牌进行签名和验证，而无需多个应用程序反复连接到授权服务。正如你所想象的，实现\
  \ OAuth 2.0 流程有许多方法，这完全归根于你的公司是如何做的。在加入一个新的 Spring 项目时，请务必询问令牌是如何生成和验证的。你现在已经有了许多概念和实践方面的理解，可以考虑你的架构采取了哪些安全权衡。你也将能够提出诸如以下有力的问题：\n\
  \n* 如果攻击者成功找到了我们的签名密钥和密钥，我们该如何以最小的精力进行轮换？\n* 为什么我们使用带有当前过期日期的令牌？\n* 我们需要刷新令牌吗？为什么？\n\
  \n就这些了！在下一章中，我们将研究如何实现服务之间的通信。由于我们现在希望不同的服务能够良好地工作，我们还将探索如何测试我们的应用。下章节见！\n\n# 9\n\
  \n# Spring 服务之间的高性能安全通信\n\n欢迎来到第 9 章！这是一个非常充实的章节，我们将深入研究创建 Spring 微服务架构的三个关键主题。\n\
  \n在本章中，我们将扩展如何实现 Spring API，但这次将使用 Spring WebFlux 实现极高的性能。我们还将讨论如何让你的服务之间相互通信，并以更安全的方式实现它。以下是我们的主题概览：\n\
  \n* 简化服务通信\n* 为 HomeIt 身份验证添加更多安全性\n* 使用 Spring WebFlux 编写高性能服务\n* 通过 API 请求连接服务\n\
  * 使用 RestAssured 编写 API 集成测试\n\n由于我们现在以复杂的方式连接服务，因此仅仅进行单元测试和隔离的 API 测试是远远不够的。在本章中，你将学习使用一种名为\
  \ `RestAssured` 的强大工具，它将通过你的整个服务集运行请求，以确保它们能够协同工作。你感到兴奋吗？我知道我很兴奋。让我们开始吧！\n\n# 技术要求\n\
  \n对于本章，你需要参考我们 Git 仓库中的代码。第 9 章的所有代码都在这里：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-09`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-09)。\n\
  \n## 简化服务通信\n\n如果我们正在开发微服务，那么每个服务都需要与其他服务通信，这是一个既定事实。如果我们正在开发 RESTful 服务，这意味着一个服务应该能够向其他服务发送\
  \ `api http` 请求。\n\n在 Spring 中，通过 REST API 通信有三种主要方式：\n\n* `RestTemplate`：这是许多应用程序使用的基础\
  \ HTTP 客户端。它可以非常容易地发送任何 HTTP 请求，并将 JSON 响应转换回数据传输对象（`Data Transfer Objects`, DTOs）。\n\
  * `Feign client`：这是一种允许我们直接在 Java 接口中使用注解声明 HTTP 请求的客户端。这允许与 Spring Cloud 无缝集成，使得服务发现变得更加简单。\n\
  * `WebClient`：这是一个非阻塞 HTTP 客户端，它是 `WebFlux` 依赖的一部分。如果你需要非常高的吞吐量，应该使用这种。\n\n接下来，让我们服务如何相互通信的示例。我们将使用\
  \ `HomeIt` 项目作为构建这种服务间通信的实验场。在本章中，我们将向你展示如何使用 `RestTemplate` 发送 API 请求。`Feign client`\
  \ 和 `WebClient` 的使用将在第 12 章介绍。\n\n## 为 HomeIt 身份验证添加更多安全性\n\n假设你想保护应用程序不受令牌泄露。这种情况是指恶意用户使用有效令牌与你的程序交互，以利用系统中的某些漏洞。在这种情况下，拥有一种撤销令牌的方法总是好的。在我们的\
  \ HomeIt 系统中，我们将开发 `Revoke Token Service`（令牌撤销服务）。该服务将拥有两个端点：一个用于撤销令牌的 `POST` 请求，另一个端点将实现\
  \ `GET` 方法，以便我们知道令牌是否被撤销。\n\n`Revoke Token Service` 将由应用中的 `Rental Property Service`\
  \ 在 `Spring Security` 令牌验证期间调用。这样，你的微服务就可以始终检查令牌状态是否良好，或者它是被你手动撤销，还是被其他微服务自动撤销。\n\
  \n下面的图解释了我们在这里实现的内容：\n\n![图 9.1: HomeIt 身份认证流程](img/B18632_09_1.jpg)\n\n图 9.1：HomeIt\
  \ 身份认证流程\n\n## 什么是 RestAssured？\n\n`RestAssured` 实际上并不是 Spring 生态系统的一部分，但它非常有用。它使得编写\
  \ REST API 调用变得简单，我们可以进行检查以确保它们运行正常。\n\n由于所有服务都应该协同工作并无缝相互通信，我们将这种测试套件称为集成测试。这与使用\
  \ mock 对象以隔离方式测试单个类的单元测试形成对比。它与使用 `@SpringBootTest` 注解对单个微服务进行隔离测试不同。由于我们正在尝试模拟整个系统的使用，我们也可以将其称为端到端测试。\n\
  \n客户端应用程序将供房东和租户生成用户凭据和访问令牌，以便他们可以在我们的系统中创建和检索租赁物业。在这个路径上，我们将确保响应是良好的，并允许我们完整实现服务之间的对话。\n\
  \n\n\n\n特别需要提到的是，我们将为 `Rental Property Service` 添加一些功能，使得每当调用其某个端点时，它不仅仅是验证 JWT\
  \ 签名，还会向 `Revoke Token Service` 发起 API 请求，以验证该令牌未被撤销。这一点很重要，因为 `Rental Property\
  \ Service` 无法判断/区分用户令牌是否已被撤销或应该被撤销。\n\n对于像 `Revoke Token` 这样的微服务，另一个需要考虑的重要点是：当你的应用程序具有用于实时撤销访问令牌的安全性过滤器时，每个微服务都应该调用\
  \ `Revoke Token Service` 来确保令牌仍然有效。由于由于，如果你有太多的服务，`Revoke Token Service` 可能会承受巨大的负载，并接收成千上万的并发请求。为了确保\
  \ `Revoke Token` 服务能够更合理地处理请求，我们将使用 `Spring WebFlux` 来编写此服务——这样你就能理解如何创建比 `Spring\
  \ Web` 扩展性得多的非阻塞服务。\n\n好了，让我们进入正题。\n\n# 使用 WebFlux 编写高性能服务\n\n编写 `Spring Web Flux`\
  \ 微服务的首先要做的，当然是使用 `Spring Initializr` 网站 ([`start.spring.io/`](https://start.spring.io/))\
  \ 生成应用。在这个示例中，我生成了一个具有以下选项的空应用：\n\n![图 9.2: 使用 Spring Initializr 创建撤销令牌](img/B18632_09_2.jpg)\n\
  \n图 9.2: 使用 Spring Initializr 创建撤销令牌\n\n你不需要在此屏幕上选择依赖项。一旦点击 `Generate` 并下载应用，只需在\
  \ `build.gradle` 文件的 `dependencies` 部分添加以下依赖项：\n\n```\ndependencies {\n    implementation\
  \ 'org.springframework.boot:spring-boot-starter-webflux'\n    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc`\n\
  \    implementation 'io.r2dbc:r2dbc-h2'\n    implementation 'org.springframework.boot:spring-boot-starter-security'\n\
  \    implementation 'org.springframework.security:spring-security-config'\n    implementation\
  \ 'org.springframework.security:spring-security-web'\n}\n```\n\n`starter-webflux`\
  \ 依赖项将保证该服务与使用 `Spring Web` 提供服务相比，速度极快。\n\n`starter-data-r2dbc` 依赖项将保证你的数据库连接也支持非阻塞操作。\n\
  \n总结一下，非阻塞操作（也称为响应式操作）允许你的 Java 线程在 I/O 任务（如数据库查询、网络请求或文件访问）进行期间保持空闲状态。当此类任务启动时，线程不会空闲等待；而是变为可处理其他任务的状态。一旦\
  \ I/O 操作完成，原始任务将恢复、分配给线程并像往一样继续处理。\n\n在 `WebFlux` 和 `R2DBC` 依赖项之上，我们添加了 `Spring\
  \ Security` 依赖项，以便我们的 `Revoke Token Service` 可以像往一样处理身份验证。你不希望此服务在没有适当凭据的情况下被访问。\n\
  \n## 查看 Revoke Token 目录结构\n\n`Revoke Token Service` 非常简单，因为它支持两个端点：一个用于撤销令牌，另一个用于检查给定令牌是否已被撤销。\n\
  \n整个微服务可以在我们的项目仓库中查看，地址：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-09/revoke-token-service`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-09/revoke-token-service)\n\
  \n现在，请花几秒钟查看项目结构：\n\n![图 9.3: Revoke Token Service 属性文件位置](img/B18632_09_3.jpg)\n\
  \n图 9.3: Revoke Token Service 属性文件位置\n\n我们要做的第一件事是在下一个节中设置属性文件。\n\n## 编写 Revoke\
  \ Token Service 属性文件\n\n将在 `resources` 文件夹中创建一个名为 `application.properties` 的文件，正如你在`图\
  \ 9.3` 中看到的那。\n\n以下行应添加到属性文件中：\n\n```\nspring.application.name=revoke-token-service\n\
  spring.r2dbc.url=r2dbc:h2:mem:///revokedtokendb\nspring.r2dbc.username = sa\nspring.r2dbc.password\
  \ = password\nspring.h2.console.enabled = true\nspring.sql.init.mode = always\n\
  logging.level.org.springframework.data.r2dbc.core=DEBUG\nlogging.level.io.r2dbc.h2=DEBUG\n\
  server.port=8082\n```\n\n这些行将确保以下结果：\n\n* 创建内存数据库连接\n* 你可以在运行时看到服务中发生的的每一个 SQL 查询\n\
  * 服务器实例化在端口 `8082` 上，因为其他服务已经暴露在端口 `8080` 和 `8081` 上\n\n## 编写数据库表 schema 文件\n\n\
  `R2DBC` 依赖项的工作方式与 `Spring Data` 不同，这意味着你需要手动创建数据库 schema。在这种情况下，我们在 `resources`\
  \ 文件夹中添加了一个 schema。它如下：\n\n```sql\nCREATE TABLE revoked_tokens (\n    REVOKED VARCHAR(1024)\
  \ PRIMARY KEY\n);\n```\n\n## 编写 Revoke Token Service 持久层\n\n请看编写实体类有多简单：\n\n```java\n\
  @Table(\"revoked_tokens\")\npublic class RevokeToken {\n    private String revoked;\n\
  \n    public RevokeToken(String revoked) {\n        this.revoked = revoked;\n  \
  \  }\n\n    public String getRevoked() {\n        return revoked;\n    }\n\n   \
  \ public void setRevoked(String token) {\n        this.revoked = token;\n    }\n\
  }\n```\n\n可以看出，`RevokeToken` 类是一个非常简单的实体，只有一个名为 `revoked` 的属性，代表我们的撤销令牌。`@Table`\
  \ 注解定义了表名，该表是在 schema 中定义的。\n\n接下来，快速查看我们的仓库接口：\n\n```java\npublic interface RevokeTokenRepository\
  \ extends ReactiveCrudRepository<RevokeToken, String> {\n    Mono<RevokeToken> getByRevoked(String\
  \ token);\n}\n```\n\n可以看出，我们只需要一个自定义方法从数据库查询撤销令牌。由于 schema 将 `revoked` 列定义为主主键，该查询将是非常快速。\n\
  \n请记住，此仓库扩展了 `ReactiveCrudRepository` 接口。这样做可以让你的查询访问不同的返回类型。这是理解响应式与阻塞服务的关键。\n\n\
  ## 响应式与阻塞服务\n\n当你编写阻塞服务时，你总是调用返回你期望处理的实际对象的函数。目前为止，每当你使用 `Spring Data` 执行数据库调用时，从方法调用返回的是实际的数据库\
  \ `Entity` 对象。这意味着代码需要等待整个数据库 I/O 操作完成后返回该对象。在 Java 术语中，这通常意味着你的线程处于阻塞状态，等待返回类型。这就是性能大打折扣的原因，即使你使用了虚拟线程。\n\
  \n在处理响应式编程时，你会发现有两种需要在执行栈中传递的返回对象类型：\n\n\n\n\n\n- `Mono<T>`: 这意味着你的返回类型将在未来交付，即当\
  \ I/O 操作完成时。在与 `Mono` 对象一起工作时，你的返回类型（即你的数据库对象）被封装在 `Mono` 接口内部。\n- `Flux<T>`: 这意味着你的返回类型是一系列类型为\
  \ `T`的对象，这些对象将在未来 I/O 操作完成时交付。你可以将其视为一个对象的流（stream）。\n\n在这两种情况下，当与 `Mono<T>` 或 `Flux<T>`\
  \ 接口工作时，你将能够通过函数式编程风格来处理返回的对象。这意味着什么呢？基本上意味着你将使用类似于 Java Stream API 的语法类型。我们将看到一些示例，并详细解释它对你的\
  \ API 运行时执行意味着什么。\n\n## 编写撤销令牌（Revoke Token）服务类\n\n现在可以编写 `Service` 类了，它将同时访问存储库以保存和查询已撤销的令牌：\n\
  \n```java\n@Service\npublic class RevokeTokenService {\n    private final RevokedTokenRepository\
  \ repository;\n    public RevokeTokenService(\n        RevokedTokenRepository repository)\
  \ {\n        this.repository = repository;\n    }\n    public Mono<RevokedToken>\
  \ revokeToken(String token) {\n        return repository.save(new RevokedToken(token));\n\
  \    }\n    public Mono<RevokedToken>\n        getRevokedToken(String token){\n\
  \        return repository.getByRevoked(token);\n    }\n}\n```\n\n如你所示，两个方法都只处理\
  \ `Mono<RevokedToken>` 对象，这意味着你能够返回一个 `Mono` —— 这是一个函数，当数据库能够为你检索该对象时，它将返回 `RevokedToken`\
  \ 对象。\n\n注意，你需要避免在整个应用程序的任何地方解析（resolve）`Mono<T>` 或 `Flux<T>`。你的工作基本上是以函数式的方式链用方法，并在你的控制器中返回这些执行流水线（pipelines），这样\
  \ Spring WebFlux 依赖本身就可以解析并调度这些流水线，并在 I/O 操作开始和返回数据时挂起它们。通过将这些流水线返回给你的控制器，你确保了代码是非阻塞且响应式的。\n\
  \n虽然你有方法可以立即从 `Mono` 和 `Flux` 接口中提取对象，但这意味着你面临着代码变得变得复杂甚至在某些点发生阻塞的风险。\n\nSpring\
  \ WebFlux 是一种值得专门写一本书的依赖，因为它非常重要的项目，允许你编写高性能的服务。在本章中，我们将为你向你展示一个非常快速的介绍，让你理解这个概念。\n\
  \n现在让我们编写控制器。在 WebFlux 语言中，我们称之为编写 `Handler` 类。\n\n## 编写响应式端点 Handler 类\n\n这是你编写一个\
  \ `Handler` 类来处理请求并调用你的服务类的方式：\n\n```java\n@Component\npublic class RevokeTokenHandler\
  \ {\n    private final RevokeTokenService revokeTokenService;\n    public RevokeTokenHandler(\n\
  \        RevokeTokenService revokeTokenService) {\n        this.revokeTokenService\
  \ = revokeTokenService;\n    }\n    public Mono<ServerResponse> revokeToken(\n \
  \       ServerRequest request) {\n        String token = request\n            .queryParam(\"\
  token\").orElse(\"\");\n      return revokeTokenService\n            .revokeToken(token)\n\
  \            .flatMap(revokedToken ->\n                ServerResponse.status(201)\n\
  \                    .contentType(\n                        MediaType.APPLICATION_JSON)\n\
  \                    .bodyValue(revokedToken))\n            .switchIfEmpty(\n  \
  \              ServerResponse.badRequest().build())\n            .onErrorResume(error\
  \ ->\n                ServerResponse.badRequest().build());\n    }\n    public Mono<ServerResponse>\
  \ isTokenRevoked(\n        ServerRequest request) {\n    String token = request\n\
  \        .queryParam(\"token\").orElse(\"\");\n    return revokeTokenService.getRevokedToken(token)\n\
  \        .flatMap(revokedToken ->\n            ServerResponse.ok()\n           \
  \ .contentType(\n                MediaType.APPLICATION_JSON)\n            .bodyValue(\n\
  \                revokedToken))\n        .switchIfEmpty(\n            ServerResponse.noContent().build());\n\
  }\n```\n\n这是一个你可以在看到整个 WebFlux 编写风格的示例。在 `revokeToken()` 方法中，你将从 HTTP 客户端发送的请求对象提取令牌参数。然后你将调用\
  \ `revokeToken` 服务，它将返回一个 `Mono<RevokedToken>` 对象。从该对象中，你将编写一个响应式流水线，这与我们在 Java\
  \ Streams API 中编写的函数式编程风格匹配。`flatMap()` 方法将从你的 `Mono` 接口中提取 `RevokedToken` 对象，然后将其转换为\
  \ `ServerResponse` 对象。我们是在说想将 `RevokedToken` 对象作为 JSON 返回。\n\n你可能已经注意到，到目前为止，我还没有包含从\
  \ `RevokedToken` 实体对象到任何 DTO 的转换。这是因为撤销令牌服务非常简单，所以我们可以通过打破规则来使其变得更简单。如果此服务变得更加复杂并带有复杂的业务规则，你绝对应该重构它以包含\
  \ DTO 和转换过程，以便你将数据库对象与网络 JSON 实现隔离开。\n\n仍然在 `revokeToken()` 方法中，如果发生任何错误 —— 例如，如果我们尝试两次撤销同一个令牌，我们只需返回错误的请求\
  \ HTTP 码，而不包含任何细节。你可能想扩展此服务以匹配其他其他用例。我只是给你提供一个基础的实现，以便你理解 WebFlux 实现本身。\n\n`isTokenRevoked()`\
  \ 方法与 `revokeToken()` 非常相似。但你不是在尝试撤销令牌，基本上是在请求服务在令牌已撤销时返回它。如果令牌不在数据库中，你将得到一个空的 `Mono`，这将返回\
  \ `204 – no content` HTTP 码。这意味着你的令牌尚未撤销。\n\n接下来，我们将向你展示如何分配 URI 端点。\n\n## 编写 RouterConfig\
  \ 和资源地址\n\n这是你最终使用处理器在 Spring WebFlux 中创建端点的方式 —— 查看下面的代码：\n\n```java\n@Configuration\n\
  public class RouterConfig {\n    @Bean\n    public RouterFunction<ServerResponse>\n\
  \        route(RevokeTokenHandler handler) {\n      return RouterFunctions\n   \
  \         .route(RequestPredicates.POST(\n                \"/api/revoke-tokens\"\
  ),\n                handler::revokeToken)\n            .andRoute(RequestPredicates.GET(\n\
  \                \"/api/revoke-tokens\"),\n                handler::isTokenRevoked);\n\
  \    }\n}\n```\n\n你会发现 `RouterConfig` 类等同于 Spring Web 项目中的 `controller` 类。但你不是为每个\
  \ URL 和端点编写多个方法，而是编写一个 `route()` 方法，将你的 `handler` 类实例作为 Spring Bean 注入。你为这个 `route()`\
  \ 方法加上 `@Bean` 注解，这意味着 Spring Boot 将应用程序生命周期开始时调用此方法，以实例化 `RouterFunctions` Spring\
  \ Bean。\n\n你在 `route()` 方法中看到的 `RouterFunctions` 实现实际上定义了你的端点。你可以将 `handler` 类中的方法引用传递给\
  \ `route()` 和 `andRoute()` 方法，以便定义哪些 URL 应该由哪些处理器方法处理。\n\n\n\n\n这是一个示例，展示了我们如何编写\
  \ Spring Security 过滤器，以便在一个地方对每个端点包含 App ID 和 secret 验证。这与我们在 `RentalProperty` 服务中所采取的做法相反，在那个服务中，控制器方法直接验证了\
  \ ID 和 secret：\n\n```java\n@Configuration\n@EnableWebFluxSecurity\npublic class\
  \ SecurityConfig {\n    private static final String APP_ID = \"myAppId\";\n    private\
  \ static final String APP_SECRET = \"mySecret\";\n    @Bean\n    public SecurityWebFilterChain\n\
  \        securityWebFilterChain(ServerHttpSecurity http) {\n      return http\n\
  \          .authorizeExchange(spec ->\n              spec.anyExchange().authenticated())\n\
  \          .httpBasic(authConfigurer ->\n              authConfigurer.authenticationManager(\n\
  \                  authentication -> {\n                          String principal\
  \ =\n                                  authentication.getName();\n             \
  \             String credentials = authentication\n                            \
  \          .getCredentials().toString();\n                          if (APP_ID.equals(principal)\
  \ &&\n                                  APP_SECRET.equals(\n                   \
  \                               credentials)){\n                            Authentication\
  \ auth = new\n                              UsernamePasswordAuthenticationToken(\n\
  \                                    principal, credentials,\n                 \
  \                   Collections.emptyList());\n                            return\
  \ Mono.just(auth);\n                          } else {\n                       \
  \     return Mono.empty();\n                            // Returning an empty Mono\n\
  \                            // if authentication fails\n                      \
  \    }\n                  }))\n          .csrf(ServerHttpSecurity.CsrfSpec::disable)\n\
  \          .build();\n}\n```\n\n要调用 Revoke Token Service 中的方法，您应该发送一个带有 `basic`\
  \ 头的请求。这意味着将 app ID 和 secret 拼接作为用户名和密码，并进行 base 64 编码。\n\n现在，您的 Revoke Token 微服务已经完全就绪，基于\
  \ `WebFlux` 构建。如果您对编写高性能的服务感兴趣，可以在 Pack Publishing 出版的书籍 *Hands-On Programming in\
  \ Spring 5* 中了解更多关于 `WebFlux` 的信息：[`www.packt.com/en-us/hands-on-reactive-programming-in-spring-978177284951`](https://www.packt.com/en-us/hands-on-reactive-programming-in-spring-978177284951)。\n\
  \n我们现在可以对租赁属性服务进行一些更改，这样每当你向它发送请求时，租赁属性服务还将查询 Revoke Token Service 以检查令牌是否仍然有效——这是验证\
  \ JWT 令牌本身之外的验证。\n\n接下来让我们来看实际操作。\n\n# 通过 API 请求连接服务\n\n我们现在将转向租赁属性服务中实现一个简单的安全过滤器，该过滤器将向我们新的\
  \ Revoke Token Service 发送 HTTP 请求。为了实现这一点，我们将使用 `RestTemplate` bean，它是作为依赖项包含在租赁属性服务中的：\n\
  \n```java\n@Service\npublic class RestTemplateRevokedTokenService {\n    private\
  \ final RestTemplate restTemplate;\n    public RestTemplateRevokeTokenService(\n\
  \        RestTemplate restTemplate) {\n      this.restTemplate = restTemplate;\n\
  \    }\n    public boolean isTokenRevoked(String token) {\n      String url =\n\
  \        \"http://localhost:8082/api/revoke-tokens?token=\"\n        + token;\n\
  \      // Create headers and add them to the request\n      HttpHeaders headers\
  \ = new HttpHeaders();\n      headers.set(\"Authorization\",\n          \"Basic\
  \ bXlBcHBJZDpteVNlY3JldA==\");\n      // this is a base64 encoded version\n    \
  \  // of the string \"myAppId:mySecret\",\n      // which is the id and secret expected\n\
  \      // by the Revoke Token Service\n      HttpEntity<String> entity =\n     \
  \   new HttpEntity<>(headers);\n      // Use exchange to send the request with headers\n\
  \      ResponseEntity<String> response =\n        restTemplate.exchange(url,\n \
  \           HttpMethod.GET, entity, String.class);\n      if(response.getStatusCode().value()\
  \ == 204) {\n        // This is a simple test. If our response is 204,\n       \
  \ // that means the token is not revoked.\n        return false;\n      }\n    \
  \  // If the response is 200, we test to see\n      // whether the token we sent\
  \ is included in the response.\n      return Objects.requireNonNull(response.getBody()).contains(token);\n\
  \    }\n}\n```\n\n\n\n\n```java\npublic class TokenRevocationFilter\n    extends\
  \ OncePerRequestFilter {\n    private final RestTemplateRevokedTokenService\n  \
  \      revokeTokenService;\n    public TokenRevocationFilter(\n        RestTemplateRevokedTokenService\n\
  \            revokeTokenService) {\n        this.revokeTokenService = revokeTokenService;\n\
  \    }\n    @Override\n    protected void doFilterInternal(\n        HttpServletRequest\
  \ request,\n        HttpServletResponse response,\n        FilterChain filterChain)\n\
  \            throws ServletException, IOException {\n        // Extract token from\
  \ the Authorization header\n        String authorizationHeader = request\n     \
  \       .getHeader(\"Authorization\");\n        if (authorizationHeader != null\
  \ &&\n            authorizationHeader.startsWith(\"Bearer \")) {\n            String\
  \ token =\n              authorizationHeader.substring(7);\n            // Validate\
  \ the token against\n            // the revocation service\n            if (revokeTokenService.isTokenRevoked(token))\
  \ {\n                // If the token is revoked, return 403\n                //\
  \ Forbidden\n                response.sendError(\n                    HttpServletResponse.SC_FORBIDDEN,\n\
  \                    \"Token is revoked\");\n                return;\n         \
  \   }\n        }\n        // Continue the filter chain\n        filterChain.doFilter(request,\
  \ response);\n    }\n}\n```\n\n如你所示，此服务注入了 `RestTemplateRevokedTokenService` Spring\
  \ Bean，这样它就可以向远程服务器发送请求。另一个重要点是 `TokenRevocationFilter` 类继承了 `OncePerRequestFilter`\
  \ —— 正如名称所示，每个 HTTP 客户端请求只会精确激活一次。每当有请求进入时，你的自定义过滤器都会被调用。`doFilterInternal()` 方法是我们需要实现的，以便过滤器允许或拒绝请求。如果你忘记了这一点，你的请求将不会被过滤器链的其余部分处理。\n\
  \n自定义过滤器让你承担了某些关键任务的责任，例如在应用测试后需要手动继续过滤器链的执行。在过滤器内部，你可以自由操作请求和响应对象。我们基本上提取了授权头并找到了实际的\
  \ JWT 令牌发送给令牌撤销服务。最后，如果过滤器检测到请求不应允许（在本例中，通过检测到令牌已被撤销），你可以像我们在示例代码中做的那样在响应对象中设置错误。\n\
  \n现在，让我们看看如何修改 `SecurityConfig` 类来添加这个自定义过滤器：\n\n```java\n@Configuration\n@EnableWebSecurity\n\
  @EnableMethodSecurity\npublic class SecurityConfig {\n    private final RestTemplateRevokedTokenService\n\
  \        restTemplateRevokedTokenService;\n    public SecurityConfig(\n        RestTemplateRevokedTokenService\n\
  \        revokeTokenService){\n        this.restTemplateRevokedTokenService =\n\
  \        revokeTokenService;\n    }\n    @Bean\n    protected DefaultSecurityFilterChain\n\
  \    configure(HttpSecurity http) throws Exception {\n        return http.csrf(AbstractHttpConfigurer::disable)\n\
  \        .sessionManagement(session ->\n            session.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n\
  \        .authorizeHttpRequests(auth ->\n            auth.anyRequest().authenticated())\n\
  \        .oauth2Server(oauth2 -> oauth2\n            .jwt(jwt -> jwt.jwtConverter(\n\
  \            new JwtConverter())))\n        .addFilterBefore(\n            new TokenRevocationFilter(\n\
  \                restTemplateRevokedTokenService),\n            BearerAuthenticationFilter.class)\n\
  \        .build();\n    }\n}\n```\n\n你可以看到这就是我们的过滤器链，基本上我们在添加 `jwtAuthenticationConverter`\
  \ 过滤器之后添加了自定义过滤器。这现在确保了每当用户请求到达时，我们都会调用令牌撤销服务。拥有像这样更强的验证非常有用，但它会向令牌撤销服务产生大量的额外请求。由于令牌撤销服务是用\
  \ WebFlux 制作的响应式服务，它可以处理比简单的 Spring Web 服务多多的请求。我们还可以通过缓存令牌撤销服务的响应来提高性能，这样短时间内的后续调用无需向令牌撤销服务发送请求。我们将在第\
  \ 12 章看到这一点，届时我们将如何优化你的架构。\n\n好了，一切准备就绪，`RentalPropertiesService` 可以与 `RevokeTokenService`\
  \ 通信。接下来，让我们创建一个测试套件，验证服务之间的整个用户流是否正常工作。\n\n# 使用 RestAssured 编写 API 集成测试\n\nRest\
  \ Assured 项目实际上并不是 Spring 生态系统的一部分，但它非常容易编写 API 测试，以验证不同服务可以协同工作。在本章中，我们将在仓库中创建一个新项目，运行一个用例，其中房东创建一个租赁房产，租客查看该租赁房产。\n\
  \n## 创建项目结构\n\n要创建项目结构，你可以使用 Spring Initializr 网站下载一个没有额外依赖的默认项目。然后，你可以删除 Java `src`\
  \ 文件夹中的所有类。你的最终目录结构将是这样的：\n\n![Figure 9.4: The integration test project structure](img/B18632_09_4.jpg)\n\
  \n图 9.4: 集成测试项目结构\n\n这就是你创建集成测试所需的全部内容。接下来，让我们声明一些依赖。\n\n## 声明依赖\n\n现在来看 `build.gradle`\
  \ 文件，在其中我们声明了重要的依赖：\n\n```gradle\nplugins {\n    id 'java'\n}\ngroup = 'com.homeit'\n\
  version = '0.0.1-SNAPSHOT'\njava {\n    toolchain {\n        languageVersion = JavaLanguageVersion.of(21)\n\
  \    }\n}\nrepositories {\n    mavenCentral()\n}\ndependencies {\n    testImplementation\
  \ 'com.fasterxml.jackson.core:jackson-databind:2.17.2'\n    testImplementation 'io.rest-assured:rest-assured:5.3.0'\n\
  \    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'\n}\ntasks.named('test')\
  \ {\n    useJUnitPlatform()\n}\n```\n\n正如你所注意到的，我们在这里使用的依赖只有 `jackson-databind`、`rest-assured`\
  \ 和 `junit-jupiter`。这三个依赖将帮助我们向服务发送请求、解析答案并验证它们以确保结果是预期的。\n\n## 编写实际测试\n\n我们这里只有一个测试方法，即名为\
  \ `endToEndFlow()` 方法。这是因为该方法将包含发生以下过程的过程：\n\n*   创建了两个用户：一个房东和一个租客\n*   为两个用户都创建了访问令牌\n\
  *   房东创建了一个示例房产\n*   租客能够获取该示例房产\n*   租客尝试创建房产但失败了\n*   我们验证令牌撤销服务中的房东令牌未被撤销\n*\
  \   然后我们撤销房东的令牌\n*   房东尝试创建房产但失败，因为他们的令牌现在已被撤销\n\n这里是完整的实现。第一个方法基本上是按正确顺序调用测试方法。这些方法将发送请求并使用\
  \ `RestAssured` 类验证响应：\n\n\n\n\n\n```java\n@Test\nvoid endToEndFlow() {\n    CreatedUser\
  \ createdLandlord =\n        createUserAndToken(\"landlord\");\n    CreatedUser\
  \ createdTenant =\n        createUserAndToken(\"tenant\");\n    CreatedProperty\
  \ createdProperty =\n        landlordCreatesProperty(createdLandlord);\n    tenantRetrievesProperty(\n\
  \        createdProperty.createdPropertyResponse(),\n        createdTenant.userTokenResponse());\n\
  \    tenantFailsAtCreatingProperty(createdTenant);\n    verifyLandlordTokenIsNotRevoked(\n\
  \        createdLandlord.userAccessToken());\n    revokeLandlordToken(createdLandlord.userAccessToken());\n\
  \    landlordFailsAtCreatingProperty(\n        createdLandlord.userId(),\n     \
  \   createdLandlord.userAccessToken());\n}\n```\n\n好的，这就是我喜欢的组织端到端测试的方式。由于它们非常密集，在一个测试流中有很多测试结果相互依赖的测试用例，因此将测试用例分离到不同的方法是一个良好的实践。这使得类更容易阅读和理解。\n\
  \n现在，让我们看看如何创建一个房东用户——这是我们端到端测试中的第一个方法：\n\n```java\nprivate CreatedUser createUserAndToken(String\
  \ userType) {\n    // First request to localhost:8081\n    RestAssured.baseURI =\
  \ \"http://localhost/users\";\n    RestAssured.port = 8081;\n    System.out.println(\"\
  ===== CREATES USER OF TYPE: \"\n        + userType);\n    ExtractableResponse<Response>\
  \ createdUserResponse =\n        createUser(userType);\n    ExtractableResponse<Response>\
  \ userTokenResponse =\n        createToken(createdUserResponse.path(\"email\"));\n\
  \    return new CreatedUser(createdUserResponse,\n        userTokenResponse);\n\
  }\n```\n\n在这里我们开始看到 `RestAssured` 的实际作用。我们使用 `baseURI` 和端口来指定第一个请求的目标地址。`ExtractableResponse`\
  \ 类帮助通过使用 JSON 路径查询来处理服务器响应——我们可以通过使用 `path()` 方法识别请求中的字段。我们创建 `CreatedUser` 记录类是为了存储稍后将使用的值。\n\
  \n`createUser()` 和 `createToken()` 方法按顺序使用，用于创建房东用户和有效的 JWT 访问令牌，以便房东以后就可以查询租赁属性服务了。\n\
  \n`CreatedUser` 记录非常简单：\n\n```java\nprivate record CreatedUser(\n    ExtractableResponse<Response>\
  \ userIdResponse,\n    ExtractableResponse<Response> userTokenResponse) {\n    String\
  \ userAccessToken() {\n        return userTokenResponse.path(\"access_token\");\n\
  \    }\n    String userId() {\n        return userIdResponse.path(\"id\");\n   \
  \ }\n}\n```\n\n`userAccessToken()` 和 `userId()` 工具方法是为了便于从从授权服务收到的 JSON 响应中提取值。\n\
  \n## 使用 RestAssured 发起实际请求\n\n现在，让我们看看如何使用 `RestAssured` 发起实际请求。这里是 `createUser()`\
  \ 方法的实现：\n\n```java\nprivate ExtractableResponse<Response> createUser(\n    String\
  \ userType) {\n    return given()\n            .contentType(\"application/json\"\
  )\n            .body(userPayload(userType)).\n        when()\n            .log().all()\n\
  \            .post(\"/register\").\n        .then()\n            .log().all()\n\
  \            .body(\"id\", notNull())\n            .body(\"email\", endsWith(\"\
  user@example.com\"))\n            .body(\"user_type\", equalTo(userType))\n    .extract();\n\
  }\n```\n\n这是一个如何使用 `RestAssured` 创建请求并验证其返回值的简要示例。它遵循了我们在第 6 章中学的测试用例的相同结构：`given`、`when`、`then`。在这个实现中，我们表示想要发送一个带有值为\
  \ `\"application/json\"` 的 `contentType` 头的请求，并将正文设置为从 `userPayload()` 方法返回的内容——我们稍后会看那个。\n\
  \n然后我们进入 `when()` 指令，在其中我们设置 `RestAssured` 记录所有信息并对 `/register` 端点执行 `POST` 方法。请记住，我们已经在调用\
  \ `createUser()` 的方法中设置了目标 URI 和端口。\n\n在发送请求后，我们继续验证响应包含我们预期的内容。在这种情况下，我们还记录了响应，并确保正文包含\
  \ ID（非空值）、电子邮件以特定后缀结尾，并且用户类型与我们提供给方法的类型相同。最后，我们返回从响应中提取的值。\n\n现在让我们来看 `userPayload()`\
  \ 方法：\n\n```java\nprivate static Map<String, String> userPayload(\n    String userType)\
  \ {\n    return Map.of(\"email\",\n        new Date().getTime() + \"_user@example.com\"\
  ,\n        \"password\", \"userpass\",\n        \"user_type\", userType);\n}\n```\n\
  \n`userPayload()` 方法基本上创建了一个键/值对 map。该 map 被 `RestAssured` 透明地用于创建有效负载。因为我们将创建不同的用户，所以在在这个工具方法中动态生成电子邮件是好的。\n\
  \n`createUser()` 方法还包含另一个名为 `createToken()` 的工具方法。让我们看看如何实现的：\n\n```java\nprivate\
  \ ExtractableResponse<Response> createToken(\n    String email) {\n    return given()\n\
  \            .contentType(\"application/json\")\n            .body(tokenPayload(email,\
  \ \"userpass\")).\n        when()\n            .log().all()\n            .post(\"\
  /token\").\n        .then()\n            .log().all()\n            .body(\"access_token\"\
  , notNull())\n            .body(\"token_type\", equalTo(\"Bearer\"))\n         \
  \   .body(\"expires_in\", equalTo(\"3600\"))\n    .extract();\n}\n```\n\n正如你所见，这就是另一个具有\
  \ `given-when-then` 结构的 `RestAssured` 请求。这一次，我们将 `POST` URI 设置为 `\"/token\"`，因为这是我们授权服务中的令牌地址。在\
  \ `then()` 部分，我们验证响应中是否返回了 `\"access_token\"` 字段，同时还有 `\"token_type\"` 和令牌的过期时间。\n\
  \n同样，我们端到端测试的其余部分由多个对其他服务的 `RestAssured` 调用以及对结果的验证组成。这里是 `revokeToken()` 方法的代码，用于撤销房东令牌并确保他们无法注册新属性：\n\
  \n```java\nprivate ExtractableResponse<Response> revokeToken(\n    String token)\
  \ {\n    return given()\n            .header(\"Authorization\",\n              \
  \  \"Basic bXlBcHBJZJZBZVNlY3JldA==\")\n        .when()\n            .log().all()\n\
  \            .post(\"/api/revoke-tokens?token=\"+token).\n        .then()\n    \
  \        .log().all()\n            .body(\"revoked\", equalTo(token))\n    .extract();\n\
  }\n```\n\n在这个方法中，我们发送了一个 `Authorization` 头，它基本上由 `\"myAppId:mySecret\"` 字符串组成，并经过\
  \ `Base64` 编码。此实现使用 `\"/api/revoke-tokens\"` URI 调用令牌撤销服务，并将令牌作为查询参数。此外，我们验证了响应中包含\
  \ `\"revoked\"` 属性，并且它包含了我们撤销的原始令牌。\n\n# 总结\n\n在本章中，我们学习了关于以下内容的有趣知识：\n\n*   如何创建一个能够处理大量并行请求的高性能\
  \ Spring WebFlux 服务\n\n\n\n\n*   如何在 Spring Security 配置中创建额外的安全过滤器，以及如何链式使用它们来增强应用程序的安全性\n\
  *   如何通过使用 `RestTemplate` Spring Bean 让你的服务之间进行通信\n*   如何实现全端到端的微服务集成测试，以验证一组相互依赖特定服务能够正常协同工作\n\
  \n在下一章中，我们将继续研究服务间的通信。但这一次，我们将学习如何以事件驱动的方式来实现它。下章节见！\n\n# 10 使用 NoSQL 数据库构建异步事件驱动系统\n\
  \n欢迎来到*第 10 章！我对这一章感到非常兴奋，因为我们将使用 Spring Framework 切换到一个完全不同的主题。\n\n在本章中，我们首先将揭示\
  \ RESTful API 的一些关键问题，以及整合不同系统如何导致大量难以维护的代码。然后，我们将介绍事件驱动架构作为替代方案，来实现服务的解耦。\n\n以下是本章涵盖的主题：\n\
  \n*   RESTful API 的可维护性问题\n*   介绍事件驱动架构\n*   在事件驱动服务中使用 Kafka\n*   使用 MongoDB 进行\
  \ NoSQL 持久化\n*   我们的事件驱动 HomeIt\n*   构建我们的租房建议服务发布者\n*   构建我们的租赁物业服务订阅者\n*   扩展我们的端到端测试\n\
  \n除了事件驱动架构这一主旨外，我们还将探索使用 WebFlux 编写异步系统的更多细微之处，以及如何引入最常用的 NoSQL 数据库 MongoDB。我希望这一章能让你真正领略事件驱动系统的力量。让我们开始吧！\n\
  \n# 技术要求\n\n本章的所有代码库可以在 [`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-10`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-10)\
  \ 找到。\n\n# RESTful API 的可维护性问题\n\n`REST` 标准通常是开发软件的极佳工具。它提供了一种简洁的方式将你的实体映射到端点，并标准化基本操作，如列出、创建、更新和删除对象。它作为构建\
  \ Web 服务的默认方法而风靡全球也不足为。\n\n尽管功能强大，但这个伟大的标准中仍然存在一个非常关键的痛点。那就是服务之间强耦合/重耦合的问题。\n\n\
  ## 什么是重耦合？\n\n为了理解我所说的`强耦合服务`，请考虑以下场景：假设在我们的 HomeIt 启动项目中，我们有一个租房建议服务（rental proposal\
  \ service），其作用是确保租客和房东之间的租赁交易顺畅进行。\n\n假设租房建议服务仅持有当前租赁谈判状态的信息，并且在谈判过程中该服务需要与其他服务进行通信。\n\
  \n假设我们还有其他依赖于租房建议服务的服务，例如：\n\n*   **租赁物业服务（Rental properties service）**：该服务的代码示例已在\
  \ [`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-10/rental-property-microservice`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-10/rental-property-microservice)\
  \ 提供，它需要知道谈判的当前，以便跟踪物业是否可租。\n*   **消息服务（Messaging service）**：如果租房建议的状态发生变化，该服务将向相关用户发送消息。当有人出价或反报价、或者接受或拒绝提议时，消息服务将负责向房东或租客发送实际消息。\n\
  *   **支付服务（Payment service）**：该服务将跟踪何时该向客户收费。也就是说，一旦提议被房东或租客接受，该服务就会启动向租客请求实际付款的过程。\n\
  \n现在，让我们尝试仅通过 RESTful API 端点（全部来自租房建议服务的 API）来协调这三个服务。也就是说，一旦租赁谈判改变了其状态，租房建议服务就必须向其他三个服务发出\
  \ API 请求。这在`图 10.1` 中所示：\n\n![图 10.1 – RESTful API 通信示例](img/B18632_10_1.jpg)\n\n\
  图 10.1 – RESTful API 通信示例\n\n现在，根据`图 10.1` 我们可以得出，每当谈判状态改变时，我们都需要检查 API 调用是否已正确发送到其他\
  \ API。这意味着，每当我们添加新的谈判状态或新的 API 服务时，我们都需要评估是否要重写或更改租房建议服务中的每一个 API 调用。\n\n这很有趣，因为它使得租房建议服务成为负责编排所有其他服务的服务。对于编排三个或四个服务可能还好，但一旦你的微服务云中的服务数量增加，这可能会使管理和维护变得复杂得多。\n\
  \n随着时间的推移，越来越多的服务相互集成，如果我们专门使用 REST API 来表示服务之间的连接，代码量可能会呈指数级增长。此外，当我们仅使用 RESTful\
  \ API 连接服务时，意味着每个服务都需要了解其他服务的领域。这就是我们所指的“重耦合”。如果你在`图 10.1`的右侧再添加四个服务，意味着你的租房建议服务被迫包含某些引用其他新服务的代码。\n\
  \n现在，让我们探索此处提出的拓扑结构的影响，以及不同的编程决策如何导致不可维护的软件。\n\n## 服务耦合如何使代码更难维护\n\n重耦合的情况如下：随着连接的服务数量增加，让这些服务独立且分离运行变得越来越困难。在我们的示例中，通过始终使用\
  \ RESTful API，由于租房建议服务包含了向租赁物业服务、消息服务、支付服务等发送请求的显式代码，在进行更改时会有非常多的代码需要阅读和编辑。\n\n\n\
  \n\n避免将一个服务的特定知识编写在另一个服务中。这会让你的代码更加`cleaner`，从某种意味着不同服务将具有良好的隔离领域。\n\n例如，理想情况下，消息服务不应该知道任何关于租赁物业或租赁提议对象的知识。它只需要知道`messages`。\n\
  \n## 编写稳定的接口\n\n尽可能在设计服务时，使其在未来不需要更改其接口（端点）。在全年范围内不断发布“当月最宠”（`flavor of the month`）端点将导致你在未来仅仅因为更改了原始服务，就必须在其他服务中添加新代码。相反，你应该创建几个代表你服务所处理领域本质的端点，并在它们发布后停止更改它们。\n\
  \n例如，在消息服务中，与其为短信、电子邮件、WhatsApp 通道等编写端点，不如编写一个抽象的端点，用于实现与你公司使用的任何平台进行通信。你实现该端点的方式将允许产品团队决定消息应该发送到哪里。这可以避免许多头疼的问题，并在未来节省开发成本和公司资金。\n\
  \n## 开发响应的独立性\n\n让你的服务独立于需要与之通信的其他服务工作。这样做表明你懂得如何隔离事务，并有助于保持整个微服务云的一致性。这使得也更容易从故障中恢复。\n\
  \n这里是另一个例子：你可能想将租赁提议服务写成等待支付服务的 API 调用结果的形式，以便你可以定义提议的状态。然而，这样做会产生数据一致性风险，因为如果你的租赁提议\
  \ API 无法调用支付服务，或者支付服务在调用过程中处理中断，你将面临大问题！你将无法确定租赁提议的状态，这将导致你最终遭受财务损失——特别是当你实现高业务量时。\n\
  \n## 了解你的最高阶层业务服务\n\n这是一个尤为重要的考虑因素，可以为你工作的公司节省数百万的开发工作，而我们并没有在很多地方看到过这种建议。在编写微服务时，评估你是否真的在每个服务中都需要业务相关的规则。\n\
  \n在我们的案例中，消息服务不应该知道任何关于提议的状态。支付服务也不应该知道租赁物业。租赁物业也不应该知道提议。跨领域知识对于某个服务来说不应该是重要的。\n\
  \n此外，这是领域边界原则的一个特例：你需要确定哪个服务应该包含你业务规则的核心。你应该设计或识别出哪个服务代表了最高阶的业务规则。换句话说，尽管每个服务都参与你的系统并帮助推动收入，但哪些服务将负责包含真正驱动向客户提供的核心价值的业务规则？\n\
  \n让我通过我们的示例来解释：在 HomeIt 系统中，我们完全专注于租赁物业，因此，驱动租赁关系的关键服务是租赁提议服务。这意味着你的最高级业务规则必须包含在租赁提议服务中，而该服务是你架构中价值最高的服务。由于租赁提议服务代表了对你公司价值最高（租赁本身），你永远永远不要将本应属于最高价值服务的逻辑分散到其他服务中。\n\
  \n在 HomeIt 示例中，未能识别最高阶业务服务通常涉及在许多不同的服务中为租赁物业状态编写大量的 `if-else` 语句。如果你发现消息服务、支付服务和租赁物业服务都在尝试根据提议的当前状态来实现逻辑，这意味着我们未能成功将高价值逻辑隔离在某一个或几个服务中。\n\
  \n为什么这很重要？这是因为如果你将租赁提议逻辑分散在不同的服务中，每当业务想要添加新的逻辑、用例、产品和流程时，你都必须更改许多服务并在每处添加新的 `if-else`\
  \ 语句。你的代码将无法扩展，你将为公司带来数百万的成本来改变和适应市场。你的代码将变得不可扩展、缓慢且维护成本极高。开发者不会对此感到高兴；你会增加人员流失率。通常，公司需要很长时间才能发现这是一个架构问题——如果他们真的能发现的话。\n\
  \n因此，确保你只有一个或少数几个持有关键业务规则的服务。\n\n## 识别服务编排器\n\n如果你编写服务的方式使得端点足够通用且灵活，那么就意味着你将有机会按照你想要的方式编排它们。你可以定义何时通过\
  \ WhatsApp、电子邮件或其他任何方式发送消息。你可以更轻松地定义应该通过信用卡还是银行转账进行收费。如果你编写服务端点时，参数描述的是你想要的行为，而不是为每种行为编写一个端点，那么就可以创建配置对象来定义你系统流的工作方式。你将拥有更多力量来扩展和加速你的开发。\n\
  \n想想：取决于租赁提议的状态，其他服务将以不同的方式运行。现在，假设你有不止一种类型的租赁提议流程。假设对于不同的国家，你有一些应该体现在租赁提议对象中的特殊状态。你可能会思考方法，让你的提议服务（或辅助服务）充当其他服务如何行为的编排器。\n\
  \n这在现实生活中是如何运作的？如果你知道你应该为租赁提议设置仅适用于信用卡或通过 WhatsApp 通信的不同流程，呢？这可能要求你在创建新的租赁提议对象时，添加一些特殊参数来驱动该行为。\n\
  \n如你所见，这个原则违反了我之前说的领域边界。它在其中一个服务中增加了跨领域信息，以告知其他系统如何行为。事实证明，如果你想让你的服务更加灵活，这种对领域边界规则的例外非常完美。\n\
  \n### 解耦调用\n\n通过观察我们的第一张图片，你无疑会推出，如果我们只使用 REST API 调用，那么提议服务将对与其通信的每个服务多增加一次调用。这意味着\
  \ 10 个服务需要 10 次 API 调用，依此类推。\n\n\n\n\n解耦调用意味着我们应该努力减少对其他服务的调用，而这正是事件驱动架构大放异彩的地方。通过使用我们所谓的\
  \ `topics`（主题）或 `queues`（队列），并结合响应无关原则，我们可以让租约提议服务基本上连接到一个中间服务，该中间服务负责将消息转发给其他对了解租约提议服务更新感兴趣的服务。\n\
  \n我们将在下一节中探讨它的工作原理。\n\n## 介绍事件驱动架构\n\n现在你已经知道：如果我们仅有 REST API，意味着我们需要连接的每个服务都代表了我们需要编写的一个新调用，专门针对该服务的调用。相比之下，当使用事件驱动方法时，我们不再需要为微服务与其通信的每个服务编写特定的\
  \ API 调用。\n\n这是如何运作的呢？我们不再允许服务之间通过 API 调用直接通信，而是会添加一个代表消息队列的中间服务。该服务接收来自调用源头服务的更新通知，并将通知转发给所有对这些通知感兴趣的其他服务。\n\
  \n让我们来看下面的图：\n\n![图 10.2 – 事件驱动通信的示例](img/B18632_10_2.jpg)\n\n图 10.2 – 事件驱动通信的示例\n\
  \n在这种模型中，我们包含了一个中间服务，它跟踪租约提议服务发生的每一个更新事件。一旦租约提议状态发生变化，租约提议服务就会向我们称为 `topic` 或 `queue`\
  \ 发送单个通知。然后，其他系统可以订阅这些通知。每当有新消息发出时，每个订阅了通知的服务都会收到该通知的副本。\n\n这意味着，一旦提议状态改变，租约提议服务完全不知道哪些服务被触发了。它只需要知道告诉微服务云一件事：`嘿，我更新了自己。请告诉所有感兴趣的人`。\n\
  \n因此，每个应对这些变化做出反应的服务都应该是该主题本身的订阅者。这具有几个优势：\n\n*   你可以在架构中包含新服务，而无需对提议服务进行更改。\n*\
  \   提议服务中的代码量大大减少，因为你永远不需要为每个服务编写特定的调用。\n*   鉴于你的系统可以将消息发送到消息主题/队列，它不需要等待其他服务的响应。这意味着系统将异步方式运行，这可能为你的系统带来巨大的速度。\n\
  *   通过主题，通过添加任意数量的订阅者，你拥有一种帮助解耦服务的机制，使得领域之间可能变得更加相互隔离（这从下一节开始将讨论）。\n*   你可以选择你想要实现的消息发布和消费策略。你是想在订阅者拉取消息时立即将其标记为\
  \ `read`（已读），还是想让订阅者在完成处理后将消息标记为 `read only`（只读）？\n\n现在有了这个系统设计，让我们讨论如何设计消息本身。不过，首先让我们再多讨论队列（queue）和主题（topic）之间的区别。\n\
  \n## 队列和主题有什么区别？\n\n`queue`（队列）是一种消息模型，其中消息发送到特定的目的地并由单个消费者消费。在队列中，消息通常按照它们到达的顺序处理（先进先出），每条消息在消费后都会从队列中移除。这种设置确保了每条消息只由一个接收者处理，非常适合需要点对点通信的任务。\n\
  \n另一方面，`topic`（主题）大部分情况下类似于队列，但它可以被不同的组订阅。在 `queue` 中，你通常只有一个消费者。但在 `topic` 中，你可能有多个系统消费它。所以，我们可以安全地说，`queue`\
  \ 是单目的地通道，而 `topic` 可能是多目的地通道。\n\n现在，让我们讨论为什么使用其中一个而不是另一个。在队列和主题之间做出选择取决于应用程序的通信需求：\n\
  \n*   使用 `queue`：当你希望每条消息只被一个消费者处理时。这适用于负载均衡任务、工作分配、请求节流（以处理峰值请求量），或任务不应在多个消费者之间重复的情况。\n\
  *   使用 `topic`：当你需要发布-订阅功能时，即消息被广播到多个订阅者，且每个订阅者处理消息的方式各不相同。这对于事件通知、更新或任何多个系统需要对同一条消息做出不同反应的场景，且每个订阅者跟踪其他订阅者的消息消费的情况来说是非常理想的。\n\
  \n既然我们知道了队列和主题之间的关键区别，让我们讨论你决定结构化消息的不同方法。这里有很多内容要讨论，你会惊讶于消息设计本身在不同系统和公司之间可以是如此灵活和多变。\n\
  \n## 你的通知消息应该长什么样？\n\n在决定通知消息中应该包含哪些信息时，有几种结构类型需要考虑。让我们来看。\n\n### 消息格式\n\n你可以使用任何喜欢的格式来格式化你的消息。首先，我建议你直接选择\
  \ `JSON` 格式，因为它已经普及。你也可以选择 `Protocol Buffers` 或 `Avro` 格式，这两者都面向更高的性能，但可读性较低。本书将不会涵盖其中任何一种。\n\
  \n### 瘦消息与胖消息\n\n在思考你应该在消息中提供多少数据时，考虑消息有多大是很——换句话说，你的消息应该是 `fat`（胖）还是 `thin`（瘦）。这没有对错之分；但你应该思考其影响，以便理解对于你的用例来说最好的方法是什么。\n\
  \n#### 瘦消息\n\n你构建通知系统的方法之一是提供包含很少信息的消息。例如，我们可以创建一个包含对象 ID 和你移动对象到的状态的消息。你甚至可以只编写对象的\
  \ ID 和第二个属性，用来说消息是创建、更新还是删除的。虽然瘦事件实现非常简单，并且通常会在队列和主题中移动，但订阅者系统将从你的 API 查询原始对象以检查其内容并决定如何操作。这样做的优点允许订阅者\
  \ API 检查对象的当前状态。\n\nHomeIt 的示例是向订阅者系统发送消息，仅说明提议的 ID 及其当前状态，如下所示：\n\n```json\n{\n\
  \  \"proposal_id\": \"74cfd995-358e-4854\",\n  \"status\": \"ACCEPTED\"\n}\n```\n\
  \n#### 胖消息\n\n你可能希望在通知消息中提供更多数据。也就是说，只发送带有修改后的对象 ID 和可能更改的状态两个属性，你可能想提供更多信息，甚至在队列或主题中提供整个对象。这意味着订阅者系统将不再频繁查询原始对象。\n\
  \n我们将在几页后看到针对我们的租约提议服务的胖消息方法。这里有一个向你的通知中添加更多数据的快速示例：\n\n\n\n\n\n```json\n{\n   \
  \ \"proposal_id\": \"74cfd995-358e-4854\",\n    \"status\": \"REJECTED\",\n    \"\
  message\": \"Sorry, I cannot accept this deal\",\n    \"landlord_id\": \"2d913fd0-431a-4ee5-9d27\"\
  ,\n    \"tenant_id\": \"b33b250e-9208-4ad9-8c78\",\n    \"author_id\": \"2d913fd0-431a-4ee5-9d27\"\
  \n}\n```\n\n如你所见，在在上一个示例中，我们添加了租户 ID、房东 ID、消息、提案 ID 以及提案所转到的状态。这意味着订阅系统从 `API` 中拉取原始对象的必要性降低了，这有助于减少提案服务的负载。\n\
  \n根据情况，你应该定义你更倾向于在消息主题（message topics）上承担更重的负载，还是在你的原始 `API` 上承担负载。请记住，如果你需要订阅者从原始\
  \ `API` 获取数据，这意味着要在你的订阅者服务中编写 HTTP `GET` 调用，这会增加耦合性并使未来更新发布者服务变得更加困难。\n\n### 警惕高阶领域溢出（Domain\
  \ Spilling）\n\n从某种意义上说，无论是胖消息（fat messages）还是薄消息（thin messages），意味着你的订阅系统都需要了解你的发布者领域。由于它依赖于发布者系统更新后的对象来决定做什么，这意味着订阅者需要实现附加到修改后的对象领域的逻辑。我将其称为\
  \ `domain spilling`（**领域溢出**）。就像把咖啡洒在衣服上是不受欢迎欢迎的一样，你不希望在一个不处理该领域的服务中出现来自该领域的污点。\n\
  \n例如，在 `HomeIt` 中，在收到租赁提案状态更改的通知后，你的支付服务将围绕租赁提案状态进行推理，以定义它的下一步是什么。这意味着支付服务中的开发者需要了解租赁提案领域，即使只是浅层次。这样做意味着你正在将业务规则从高阶领域（租赁提案领域，正如我们之前解释过的，它是\
  \ `HomeIt` 的核心价值）移动到低阶领域（支付系统对于收钱至关重要，但它不是一个允许在与租户和房东协商租赁提案时协调操作的核心服务）。支付系统实现了资金交换，这是一项关键功能。然而，它不是\
  \ `HomeIt` 业务的核心系统，这意味着它应该尽可能少地承担关于高阶租赁提案领域的逻辑。\n\n### 将跨领域知识移动到发布者系统\n\n正如我所说，当你的低阶领域服务拥有与高阶领域相关的业务规则时，`domain\
  \ spilling` 通常是不受欢迎的。因此，如果你不希望订阅系统依赖于高阶领域服务的业务规则，你可以将部分逻辑从低阶领域移动到高阶领域。\n\n这样想：正如我们所确定的，你拥最重要的业务功能是排序和协调租户与房东之间的交互。这意味着，取决于该交互的结果，你希望该服务通知其他服务它们应该如何表现。\n\
  \n从 `proposal service` 出发，你想指定哪些消息应该给你的参与者以及它们应该如何交付。你还想告知支付服务要收集多少资金以及如何收集。如果特定的房源编号不可，你还想告知房产服务，以便你的提案服务能够承受更多关于其他服务的知识。也就是说，协调你业务的服务可以为其他服务提供一些已知参数。\n\
  \n这将如何实现？嗯，有两种方案。一种是在你的核心提案服务中添加一些配置属性，以便根据你希望其他服务如何表现，提案对象可以为其他服务持有一些不同的参数，以便当这些服务被激活时，它们可能直接接收到已知参数，而不是尝试根据提案状态推导出自己的行为。这种方法的缺点是使用你的租赁提案对象来存储来自其他领域的数据，这可能仍然不理想。\n\
  \n另一种配置其他服务应如何表现的方法是创建一个单独的配置服务。也就是说，每当创建一个租赁提案时，就会创建一个配置对象并存储在那个配置服务中。租赁提案流程将更新配置对象，根据你的用户输入来协调其他系统。这意味着当其他系统收到关于原始租赁提案的通知时，它们可以查询配置服务并提取它们的已知参数，以发现它们应该如何表现。或者，我们可以以其他方式配置你的队列和主题，正如我们接下来将看到的。\n\
  \n### 业务驱动与实体驱动的事件\n\n在创建用于发送通知的队列或主题时，你应该决定是否希望该主题上的事件是围绕你的实体（entities）、通用用户旅程还是业务事件来定义的。在讨论薄消息与胖消息时，我们提供的示例是集中在根据租赁提案对象的状态来创建我们的事件。这意味着事件的设计是为了反映实体的当前状态。\n\
  \n相比之下，你可以根据用户旅程来定义事件。我们可以根据刚刚发生的某些动作来命名事件。例如，我们可以创建以下事件名称：`RENTAL_PROPOSAL_OPENED`、`OFFER_SENT`、`OFFER_REJECTED`、`OFFER_CANCELLED`\
  \ 和 `OFFER_APPROVED`。当你围绕业务故事创建事件时，对于消费者来说可能更有意义。你清楚地知道用户在旅程中的什么位置。\n\n### 目标主题与源主题\n\
  \n你应该做的另一个关键决定是，你创建的主题是指向发布事件的服务中的对象，还是接收该事件的特定服务中的对象。这在主题连接到订阅者服务且该服务对自己的事件感兴趣的情况下，可能变得特别有用。你可能只是因为可以负担起异步操作而想要创建这个主题，这可能会更有成效。发布者服务不依赖于订阅者服务的结果，因此你可能只需要准备一个完全引用目标服务（订阅者服务）的主题。\n\
  \n当然，在我们的 `HomeIt` 示例中，我们设计的类型是一个源主题（source topic），因为该主题的创建仅仅是为了发布租赁提案对象本身的更改。发布者正在通知订阅者关于发布者领域的变化。\n\
  \n\n\n\n\n目标主题（destination topic）的一个很好的例子是：假设你有一个报告服务，它期望接收某些非常特定的事件，而这些事件只有报告服务本身才能理解。这些事件帮助报告服务跟踪一般的租赁提议，并最终创建业务报告。租赁提议服务的发布者可以专门为报告服务生成事件，并根据报告服务所需的输入进行定制。这样，当租赁提议被创建、接受或已支付时，租赁提议服务就能通知报告服务。通过讲述提议本身的故事（创建、接受、支付），将更多关注点放在业务端，因此我们说这些事件是\
  \ `business-driven`（业务驱动的）的。也就是说，在发送事件时，我们将关注于业务本身发生了什么，而不是共享关于租赁提议实体对象的所有信息，后者更多是我们\
  \ API 的技术层面。对于报告服务来说，理解用户旅程以及业务本身是重要的，而了解租赁提议数据对象随时间变化的状态则没有那么重要。这两个选项之间存在细微但重要的区别，理解你需要关注的是数据对象还是业务用例，可能在很大程度上促进开发。\n\
  \n## 共享主题与非共享主题\n\n在考虑架构中的新主题和队列时，你应该定义是想使用一个主题供许多不同系统使用、少数系统使用，还是仅供一个系统使用。在我们的\
  \ HomeIt 示例中，我们创建了一个仅支持租赁提议服务事件的主题。然而，我们可能想使用同一个主题来支持其他服务的事件。假设我们希望让支付服务在该主题中发布财务交易的结果。那么，同一个主题就会流过来自两个不同系统的事件。如果你想保持各部分更加独立，可以创建一个不同的主题，专门用于传输有关支付的通知。\n\
  \n当然，每种选择都有优缺点。如果你决定拥有多个主题，且每个主题都仅为单个服务工作，那么当你的架构大幅扩容时，请准备好管理许多不同的主题。另一方面，当你拥有一个可以接收来自多个服务事件的单一主题时，将要求所有订阅者在不感兴趣时直接忽略来自其他系统的消息。\n\
  \n## 单租户与多租户主题\n\n在此语境下，租户（tenant）指的不是租赁物业的人，而是可能使用你整个服务来托管其业务的公司。以 HubSpot 和 Salesforce\
  \ 为例，它们的系统被不同的公司用于托管自己的运营。每家公司都会为他们的每个用户创建账户。我们说 HubSpot 和 Salesforce 是多租户的。它们能够托管来自多家公司的运营。\n\
  \n因此，在设计主题时，你需要就是单租户还是多租户做出重要决策。首先，你的公司运作是否像 HomeIt 一样，即我们是一家允许房东和房屋租户相互进行业务的公司？还是你的系统更像\
  \ HubSpot，允许不同的公司在你的网站上执行它们的运营？\n\n如果你的架构是单租户的，你拥有的每个主题都将是单租户的，但一个主题将流来自不同用户的数据。如果你的架构是多租户的，你可能会为每个租户创建主题——这样一家公司就看不到任何其他公司的事件。你也可以通过流来自多家公司事件的主题来实现多租户。\n\
  \n当你允许主题流过来自多个用户或公司的数据时，你需要确保他们看不到来自其他服务的事件和通知。即使是实体 ID 的 `UUIDs` 也不能被未拥有该对象的操作看到。将对象\
  \ ID 泄露给不拥有主题的人会开启攻击窗口，而你不希望发生这种情况。\n\n## 输入主题与输出主题\n\n当你的主题被用于传递操作结果时，我们称其为输出主题（output\
  \ topic）。当主题被用于将输入传递给另一个服务时，我们称其为输入主题（input topic）。\n\n你可能希望创建拥有自己的输入和输出主题的服务。例如，如果你有一个服务需要长时间来完成某些处理——假设是三小时——那么你无法通过\
  \ `RESTful API` 支持该操作。你需要让该操作变为异步。因此，创建你的服务时带有两个主题：一个输入主题和一个输出主题。每你想触发该服务时，只需在输入主题中发布一条输入消息。然后，一旦该服务完成处理，它会将结果作为事件发布在输出主题中。感兴趣的服务可以获取该结果通知以继续它们的操作。\n\
  \n在 HomeIt 中，我们可以创建一个媒体处理服务，来处理电影文件和图片。我们可以为该服务设置两个主题：一个告知要处理的文件、它们存储在何处以及应该如何处理；另一个返回结果的媒体及其存储位置。\n\
  \n## 单向主题与双向主题\n\n设计主题的另一个选项是确定它们是用于仅向一个方向或两个方向流向消息。\n\n我们将我们的 HomeIt 租赁提议主题设为单向方式。这意味着每个事件都从租赁提议服务流向订阅者服务。它只向一个方向流动。相比之下，如果我们允许支付服务向同一个主题发布消息，而租赁提议服务现在有一个订阅者专门用来听这条消息，那么我们就把这个主题变成了一个双向主题，因为消息将流向租赁提议服务并从租赁提议服务流出。\n\
  \n双向主题通常是一个糟糕的模式，因为不同的系统必须知道哪些消息应该丢弃，哪些消息应该处理。这可能导致大量无用的处理，甚至可能由于不支持的消息而破坏系统。然而，当你进行快速的概念验证（PoC）时，这可能是很有用的。例如，如果你只想看到事情的发生，那么速度就是重要的。\n\
  \n### 死信主题（Dead letter topics）\n\n当你的服务无法处理消息时，该怎么办？这就是我们使用死信主题的原因。这些是专门的主题，用于处理在多次尝试后仍无法成功投递或处理的消息。\n\
  \n当消息由于处理错误、无效数据格式或超过生存时间（`TTL`）而持续失败时，它将从原始主题重定向到死信主题。这种机制将问题消息从主流程中隔离出来，防止它们导致重复的持续失败或阻塞系统。\n\
  \n通过将这些无法投递的消息分离，你可以分析并解决底层问题，而不会干扰整体基础设施。\n\n死信主题通过允许对故障消息进行单独处理增强了系统的可靠性和可维护性，便于调试和合规审计，并确保消息系统在单个消息失败的情况下仍能顺利运行。\n\
  \n\n\n\n`Kafka` 是一个开源的分布式事件流平台，用于构建实时数据流水线和应用程序。它通过以容错的方式发布和订阅记录流，高效地处理海量数据。Kafka\
  \ 最初由 LinkedIn 的工程师开发，以满足该公司处理海量实时数据馈的需求。它于 2011 年开源，后来成为 Apache 软件基金会的项目。\n\n在本书中，我们无法探讨如何在生产环境中维护\
  \ Kafka 集群——那是一整本书讨论的话题。相反，我们将为你提供一个快速设置的方案，以便你能够连接你的 Spring 服务。\n\n现在，让我们从学习与 `Kafka`\
  \ 相关的核心概念开始。这些概念在你工作的每一家公司都是关键的。\n\n## Kafka 主要概念\n\n要使用 `Kafka`，我们需要理解以下概念：`topics`（主题）、`subscribers/consumers`（订阅者/消费者）、`consumer\
  \ groups`（消费者组）和 `partitions`（分区）。当你理解了这些核心概念，就能轻松知道如何使用这个强大的系统进行基础系统设计：\n\n* `Kafka`\
  \ 中的 `Topics` 形成了一个数据库，其唯一目的是允许从生产者向消费者流式消息。\n* `Subscribers`（或 `consumers`）是从 `Kafka`\
  \ 主题读取并处理消息的应用程序。它们根据数据需求订阅特定的主题。消费者可以独立工作，也可以作为 `consumer group` 的一部分工作。\n* `Consumer\
  \ groups` 是消费者的集合，它们协调共同从主题中读取消息。它们至关重要，因为它们在消息消费中实现了可扩展性和容错性。通过在组内的多个消费者之间分配负载，`Kafka`\
  \ 确保每条消息只被组内的某一个消费者处理，从而防止重复处理并允许高效的负载均衡。\n* `Partitions` 是 `Kafka` 主题的基础组件。每个主题被划分为多个分区，每个分区是消息的有序序列。分区允许\
  \ `Kafka` 通过在集群中的不同 broker（服务器）之间分布数据来实现水平扩展。这种分布实现了消息的并行处理，并提高了系统的吞吐量。重要的是，在每个分区内部，消息按照产生的精确顺序进行存储和消费，从而保留了每个分区的消息顺序。然而，`Kafka`\
  \ 不保证同一主题内不同分区之间的顺序。\n\n查看`图 10.3*` 来理解这些元素是如何协同工作的：\n\n![Figure 10.3 – Kafka topology:\
  \ publishers, partitions, consumer groups, and consumers](img/B18632_10_3.jpg)\n\
  \n图 10.3 – Kafka 拓扑：发布者、分区、消费者组和消费者\n\n从图中，你可以看到主题内部分区、消费者（也称为订阅者）以及发布者和生产者之间的区别。\n\
  \n现在，让我们学习以最简单的方式运行 `Kafka` 主题，以便你可以开始实现本章的 POC（概念验证）。通常公司已经有了可供你使用的主题。\n\n## 在\
  \ Linux 机器上安装 Kafka\n\n我们在本章中实现的服务使用 `Kafka` 作为事件基础设施。要它，你需要按照以下步骤设置开发实例：\n\n1.\
  \ 在 [`kafka.apache.org/downloads`](https://kafka.apache.org/downloads) 下载 `Kafka`。\n\
  \   你可以使用最新版本。下载二进制包并将其解压到独立的家目录，例如 `/kafka`。\n\n2. 运行开发实例。\n   要运行你的 `kafka` 开发实例，你需要运行以下两个命令：\n\
  \   * 这里是 `ZooKeeper` 命令：\n     ```\n     ./zookeeper-server-start.sh config/zookeeper.properties\n\
  \     ```\n   * 这里是 Kafka 命令：\n     ```bash\n     ./kafka-server-start.sh config/server.properties\n\
  \     ```\n\n3. 创建一个 Kafka 主题。\n   要创建主题，使用以下命令：\n   ```bash\n   ./kafka-topics.sh\
  \ --create --topic my-topic --bootstrap-server localhost:9092 --partitions 3 --replication-factor\
  \ 1\n   ```\n\n4. 运行 Kafka 消费者。\n   要启动消费者，使用以下命令：\n   ```bash\n   ./kafka-console-consumer.sh\
  \ --topic my-topic --bootstrap-server localhost:9092 --from-beginning\n   ```\n\n\
  5. 运行 Kafka 生产者。\n   要产生消息，使用以下命令：\n   ```bash\n   ./kafka-console-producer.sh --topic\
  \ my-topic --bootstrap-server localhost:9092\n   ```\n\n## 使用 MongoDB 进行持久化\n\n\
  要构建 `mongod`（即 Mongo 服务守护进程），我们将使用以下步骤。\n\n重要提示：这些指令在 Ubuntu 上适用。然而，Windows 的方法相同，例外是你你可能需要使用\
  \ WSL。\n\n让我们开始吧：\n\n1. 从 MongoDB 下载页面下载 `MongoDB` 二进制文件：\n   [`www.mongodb.com/try/download`](https://www.mongodb.com/try/download)\n\
  \   如果你想保持简单，下载 `tarball` 并将其解压到本地目录。\n   如果你打算为开发创建一个测试数据库，可以随时使用你自己的家目录。例如，你可以直接将\
  \ `tarball` 下载到 `~/mongodb`。\n\n2. 将最新版本的 `mongodb` 解压到你的 `test` 目录，然后为你的实际数据库文件创建另一个目录。例如，我创建了以下目录来存放我需要的任何数据库：\n\
  \   ```\n   ~/mongodb/mongodbs\n   ```\n\n3. 在 `mongodbs` 数据库内部，创建一个目录用于托管提案服务数据库，我将其命名为\
  \ `proposaldb`：\n   ```\n   ~/mongodb/mongodbs/proposaldb\n   ```\n\n4. 在此数据库中创建以下目录：\n\
  \   ```bash\n   cd ~/mongodb/mongodbs/proposaldb\n   mkdir -p data/db\n   mkdir\
  \ log\n   ```\n   有了这两个目录，可以使用以下命令启动你的 `mongodb` 实例：\n   ```bash\n   cd ~/mongodb\n\
  \   ./mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod --dbpath mongodbs/proposaldb/data/db\
  \ --logpath mongodbs/proposaldb/log/mongodb.log --fork\n   ```\n\n5. 要确保它正在运行，现在只需使用以下命令：\n\
  \   ```bash\n   ps aux | grep mongod\n   ```\n\n\n\n\n```\nrodrigo@rodrigo-desktop:~/mongodb$\
  \ ps aux | grep mongod\nrodrigo    15992  0.6  0.7 559832 126904 ?      Sl     \
  \ 20:30   0:11 mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod --dbpath mongodbs/proposaldb/data/db\
  \ --logpath mongodbs/proposaldb/log/mongodb.log --fork\n```\n\n6. 现在，你需要一个客户端应用来连接\
  \ `mongodb`。请确保从 MongoDB 官方网站下载 `Mongodb Shell`：\n\n7. [`www.mongodb.com/try/download/shell`](https://www.mongodb.com/try/download/shell)\n\
  \n一旦你下载并解压到家目录 `dir` 下的独立目录，你就可以使用以下命令运行它：\n\n```bash\ncd ~/mongodb\n./mongosh-2.3.1-linux-x64/bin/mongosh\n\
  ```\n\n该命令将自动将 `mongo shell` 连接到本地 Mongo 守护进程。\n\n8. 这里有一些重要且基础的命令，帮助你了解如何导航数据库：\n\
  \n```bash\nshow dbs # 显示所有数据库\nuse <dbname> # 使用或创建一个新数据库\nshow collections # 显示数据库内部的集合（基本上就是你的表）\n\
  db.myCollection.find() # 显示名为 myCollection 的集合中的所有文档\n```\n\n9. 若要关闭你的 `mongodb`\
  \ 服务，请尝试以下命令：\n\n```bash\nuse admin #这将使用你的 admin 数据库\ndb.shutdownServer() # 这将杀死\
  \ mongodb 进程\n```\n\n如果你手动关闭 `mongodb` 服务并使用之前提到的相同命令行重启它，它将再次使用同一个数据库，从而保持你保存的数据完好无损。\n\
  \n这就是你设置 `MongoDB` 实例的方法。现在，让我们来看看租房提议服务的细节。\n\n# 我们在 HomeIt 中的事件驱动示例\n\n为了说明如何使用\
  \ Spring Framework 连接发布者（publishers）和订阅者（subscribers），请想象：我们将创建一个租房提议服务，该服务在协商租赁协议期间注册房东与租客之间的交互。\n\
  \n每一份租房提议都是一个对象，包含了房东 ID、房产 ID 和租客 ID，以及一系列 `rounds`（轮次），这些轮次记录了双方试图协商的价格。\n\n我们在此处使用事件驱动实现的方式如下：我们希望房产服务在某处房产最近收到许多提议时通知租客。我们创建了一个名为\
  \ `score` 的评分系统。房产收到的提议越多，分数越高。因此，每当房东或租客通过房产轮次进行通信时——无论是报价、还价、拒绝还是批准提议——我们都会将该房产的评分加\
  \ 1。\n\n本质上，每当有新的谈判轮发生时，租房提议服务都会将租房提议数据存储在我们的 MongoDB 数据库中。然后，它将向 Kafka Topic 发布一个事件。此外，在房产服务中，我们将实现一个简单的\
  \ Kafka 订阅者，它可以接收租房提议轮的通知。当轮次发生且通知到达时，将有一个服务负责更新接收提议轮的房产评分。\n\n以下是租房提议服务中 `RentalProposal`\
  \ 实体建模的方式：\n\n```java\n@Document\npublic record RentalProposal(\n    @Id\n    String\
  \ id,\n    String tenantId,\n    String landlordId,\n    String propertyId,\n  \
  \  List<Round> rounds,\n    String status // OPEN, NEGOTIATING, ACCEPTED,\n    \
  \              // REJECTED, CANCELLED\n    ){\n    public RentalProposalDTO toDTO()\
  \ {\n        return new RentalProposalDTO(\n            this.id, this.tenantId,\
  \ this.landlordId,\n            this.propertyId, this.rounds(), this.status );\n\
  \    }\n}\n```\n\n如你所示，创建一个要保存到 MongoDB 的实体基本上要求你使用来自 MongoDB 依赖的 `@Document` 注解（我们将在几分钟后查看需要声明哪些依赖）。\n\
  \n此外，这是我们定义 `Round` 实体的方式：\n\n```java\npublic record Round (\n    String roundId,\n\
  \    String status, // OPEN, OFFER, COUNTER_OFFER, APPROVED,\n                 \
  \ // REJECTED, CANCELLED\n    String authorId,\n    Double value,\n    String message)\
  \ {\n    // Getters and Setters\n}\n```\n\n这意味着 `RentalProperty` 可以包含许多轮次。此外，这里是帮助我们的\
  \ `RentalProposalStates` 和 `RoundStates` 枚举：\n\n```java\npublic enum RentalProposalStates\
  \ {\n    OPEN,\n    NEGOTIATING,\n    ACCEPTED,\n    REJECTED,\n    CANCELLED\n\
  }\n\npublic enum RoundStates {\n    OPEN,\n    OFFER,\n    COUNTER_OFFER,\n    APPROVED,\n\
  \    REJECTION,\n    CANCELATION\n}\n```\n\n因此，一旦 `Round` 从一个状态移动到下一个状态，`RentalProposal`\
  \ 也会解析为更通的状态。\n\n# 构建我们的提案服务\n\n正如我之前提到的，租房提议服务非常重要：它将用于探索 https://github.com/PacktPublishing/System-Design-in-Practice/tree/main/chapter10/rental-proposal\
  \ 中的其他部分。\n\n##get WebFlux、MongoDB 和 Spring\n\n由于我们希望此服务是异步且健壮的，我们将使用 `WebFlux`\
  \ 创建它。以下是我们声明依赖的方式——结合了 Spring、Kafka 和 MongoDB。这存在于 `build.gradle` 文件中：\n\n```gradle\n\
  implementation 'org.springframework.boot:spring-boot-starter-webflux'\nimplementation\
  \ 'org.springframework.boot:spring-boot-starter-data-mongodb'\nimplementation 'org.springframework.kafka:spring-kafka'\n\
  implementation 'com.fasterxml.jackson.core:jackson-databind'\n```\n\n由于我们将使用 JSON\
  \ 对象从 Kafka 发送和接收通知，我们还包含了 `jackson-databind`。\n\n现在，让我们看看控制器中编写实际端点的快速示例。这里是我们创建一个新的\
  \ `RentalProposal` 并向其添加 `Round`。它们都声明在 `RentalProposalController` 类中：\n\n```java\n\
  @PostMapping()\npublic Mono<RentalProposalDTO> createProposal(\n    @RequestBody\
  \ RentalProposalDTO rentalProposalDTO) {\n    return service.createProposal(rentalProposalDTO);\n\
  }\n\n@PostMapping(\"/{proposalId}/rounds\")\npublic Mono<ResponseEntity<RentalProposalDTO>>\
  \ addRound(\n    @PathVariable String proposalId,\n    @RequestBody Round round)\
  \ {\n    return service.addRound(proposalId, round)\n        .map(ResponseEntity::ok)\n\
  \        .switchIfEmpty(Mono.just(ResponseEntity.notFound().build()));\n}\n```\n\
  \n我们可以看到，这次我们将 Spring Web 端点声明与 WebFlux 混合在一起。它们可以无缝协作。对于 `addRound()` 方法，如果我们提供的提议\
  \ ID 不存在，我们只返回 `404 (NOT_FOUND)` HTTP 状态码。\n\n让我们快速查看如何在 `Service` 层将租房提议实体数据保存到数据库。这是我们定义的\
  \ `Service` 接口：\n\n```java\n@Service\npublic interface RentalProposalService {\n\
  \    Mono<RentalProposalDTO> createProposal(RentalProposalDTO newRentalProposal);\n\
  \    Mono<RentalProposalDTO> addRound(String proposalId, Round round);\n    Flux<RentalProposalDTO>\
  \ getProposals();\n    Mono<RentalProposalDTO> deleteProposal(String proposalId);\n\
  \    Mono<RentalProposalDTO> getProposal(String proposalId);\n}\n```\n\n\n\n\n以下是我们要声明服务实现的方式（`RentalProposalServiceImpl`\
  \ 类）：\n\n```java\n@Service\npublic class RentalProposalServiceImpl implements RentalProposalService\
  \ {\n    private final RentalProposalRepository repository;\n    private final KafkaTemplate<String,\n\
  \        RentalProposalEvent> kafkaTemplate;\n    public RentalProposalServiceImpl(\n\
  \        RentalProposalRepository repository,\n        KafkaTemplate<String, RentalProposalEvent>\n\
  \            kafkaTemplate) {\n        this.repository = repository;\n        this.kafkaTemplate\
  \ = kafkaTemplate;\n    }\n}\n```\n\n如你所见，我们在这里注入了两个重要的 Spring Bean：`RentalProposalRepository`\
  \ 和 `KafkaTemplate` 接口。\n\n`RentalProposalRepository` 是基础的 Mongo Repository 扩展，我们可以在这里看到它：\n\
  \n```java\npublic interface RentalProposalRepository extends\n    ReactiveMongoRepository<RentalProposal,\
  \ String> {}\n```\n\n需要注意的是，由于我们在这里使用了 Spring WebFlux，我们需要使用 `ReactiveMongoRepository`。这意味着我们在\
  \ MongoDB 中的操作将以异步方式处理。这使得整个 `WebFlux` 异步流水线能够正常工作。\n\n由于我们不需要任何自定义方法（正如我们在第 7 章\
  \ {\n}\n```\n\n如你所见，当保存新的 `Proposal` 或 `Round` 时，我们将发布 `RentalProposalEvent`，这样\
  \ `RentalProperties` 服务就可以订阅这些通知，并更新位于 `RentalProperties` 数据库中的 `RentalProperty`\
  \ 评分。这样，其他客户就能看到某个房产的评分是否高——意味着有很多人正在尝试对该房产进行谈判。`RentalProposalEvent` 包含提议 ID、在租赁提议内部发布的轮次\
  \ ID、提议中引用的房产 ID 以及 `roundType` 属性，该属性表示它是报价、还价、批准、拒绝还是其他。\n\n以下是我们在 `Service` 层创建提议并发射\
  \ `Round` 的方式：\n\n```java\npublic Mono<RentalProposalDTO> createProposal(\n    RentalProposalDTO\
  \ newRentalProposal) {\n    Round firstRound = new Round(UUID.randomUUID().toString(),\n\
  \        RoundStates.OPEN.toString(),\n        newRentalProposal.tenantId(),\n \
  \       null,\n        null);\n    List<Round> rounds = List.of(firstRound);\n \
  \   return repository.save(new RentalProposal(\n        UUID.randomUUID().toString(),\n\
  \        newRentalProposal.tenantId(),\n        newRentalProposal.landlordId(),\n\
  \        newRentalProposal.propertyId(),\n        rounds,\n        RentalProposalStates.OPEN.toString()))\n\
  \        .flatMap( proposal ->\n            Mono.fromFuture(\n                kafkaTemplate.send(\"\
  proposal-topic\",\n                    new RentalProposalEvent(\n              \
  \          proposal.id(),\n                        firstRound.roundId(),\n     \
  \                   proposal.propertyId(),\n                        firstRound.status())))\n\
  \            .thenApply(result -> proposal))\n        .map(RentalProposal::toDTO);\n\
  }\n```\n\n如你所见，在创建 `RentalProposal` 时，我们创建了一个处于 `OPEN` 状态的新 `Round` 并将其添加到新的 `RentalProposal`\
  \ 中，然后将其保存到 `mongodb` 存储库中。当我们收到 `repository.save()` 操作的结果时，就是最后发布事件的时候了。这就是我们告诉其他系统新创建的\
  \ `RentalProposal` 对象的方式。如你所见，我们需要命名主题并创建我们正在发送的事件。最后，我们将结果映射到我们将在方法中返回的 DTO。同样，这也是我们将一个新的\
  \ `Round` 保存到 `RentalProposal` 对象的方法：\n\n```java\npublic Mono<RentalProposalDTO>\
  \ addRound(\n    String proposalId, Round round) {\n    return repository.findById(proposalId)\n\
  \        .flatMap(proposal -> {\n            RentalProposal p = new RentalProposal(\n\
  \                proposal.id(),\n                proposal.tenantId(),\n        \
  \        proposal.landlordId(),\n                proposal.propertyId(),\n      \
  \          allRounds(round, proposal),\n                newProposalStatusFromRound(round)\n\
  \            );\n            return repository.save(p);\n        })\n        .flatMap(proposal\
  \ ->\n            Mono.fromFuture(\n                kafkaTemplate.send(\"proposal-topic\"\
  ,\n                    new RentalProposalEvent(\n                        proposalId,\n\
  \                        round.roundId(),\n                        proposal.propertyId(),\n\
  \                        round.status())))\n            .thenApply(result -> proposal))\n\
  \        .map(RentalProposal::toDTO);\n}\n```\n\n这也非常容易理解。我们提供提议 ID（引用我们想要添加新谈判轮次的提议）以及我们之前见过的实际\
  \ `Round` 对象。在保存新的 `Round` 对象后，我们还可以将更新发布到我们的 Kafka 提议主题，然后将原始的 `RentalProposal`\
  \ 对象解析为我们在方法中返回的 DTO。\n\n这基本上 `publisher` 类的大部分内容了。在两个时刻我们会通知其他系统发生了变化。\n\n现在，为了让此系统连接到我们的\
  \ Kafka 主题，我们需要查看实际的 `application.properties` 文件是如何构建的：\n\n```properties\nspring.application.name=rental-proposal-service\n\
  server.port=8084\nspring.kafka.bootstrap-servers=localhost:9092\nspring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer\n\
  spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer\n\
  ```\n\n如你所见，我们为此服务定义了端口 `8084`，然后定义 `localhost:9092` 为默认 Kafka 服务器端口，最后指定使用哪些类来序列化我们的消息和键。\n\
  \n## 使用 WebFlux 流集合\n\n另一个重要的注意的是，在使用 WebFlux 时，我们可以依赖从服务器到客户端的对象流。与其使用分页，可以使用 `Flux`\
  \ 对象流式传输对象，而无需整个集合内存可用。\n\n这非常有趣，因为它赋予了我们的 HTTP 逐个消费这些对象的能力。以下是使用 `Flux` 接口流式传输数据的示例：\n\
  \n```java\n@GetMapping\npublic Mono<ResponseEntity<Flux<RentalProposalDTO>>>\n \
  \   getProposals() {\n    return Mono.just(ResponseEntity.ok(\n        service.getProposals()))\n\
  \        .switchIfEmpty(\n            Mono.just(ResponseEntity.notFound().build()));\n\
  }\n```\n\n这可能很困惑，但让我为你拆解一下。`service.getProposals()` 方法基本上将查询数据库并返回一个对象流，当我们的 HTTP\
  \ 客户端请求它们时，这些对象将逐个可用。\n\n在此实现中，我们将 `RentalProposalDTO` 的 `Flux` 流封装在 `ResponseEntity`\
  \ 对象中。然而，由于我们无法立即解析 `ResponseObject`，我们将其包装在一个 `Mono` 对象中。\n\n\n\n因此，在控制器的返回中，我们提供了一个\
  \ `Mono` 对象，它将返回一个 `ResponseEntity` 对象。`ResponseEntity` 是一个包含 HTTP 返回状态码的单一对象，它将包含一个\
  \ `Flux`，允许我们的客户端请求直接从数据库一点一点地流式传输对象。\n\n很有趣，不是吗？你可以通过访问我们应用程序的代码来查看整个流程。\n\n然而，请记住，你的\
  \ HTTP 客户端至少应该支持 1.1 版本才能流式传输对象，如果你需要多通道的优化流式传输，则需要 HTTP 2.0。除此之外，你可以在客户端应用中控制你如何获取数据。使用它的最佳方式有两方面：\n\
  \n*   如果你的客户端应用程序是后端系统，你应该使用 `WebFlux` 和其他异步处理工具，这样它就可以通过异步流水线流式传输对象，就像我们在租房建议服务中正在做的那样。\n\
  \n*   如果你的客户端应用程序是前端应用，你可以在客户请求更多对象时获取新对象。例如，你可以构建类似于 Facebook 消息流的效果，该消息流会在用户向下滚动时获取几个新对象。\n\
  \n就这些了。关于流式架构还有很多可以说的内容，我在这里尝试为你提供了一些非常简单且强大的示例。现在，让我们看看微服务架构中等式的另一面：我们将在 `RentalProperties`\
  \ 服务中进行的更改，以订阅租房建议的更新。\n\n# 构建我们的租房属性服务消费者\n\n正如我们之前提到的，租房属性服务对我们的租房建议服务中发生的任何谈判都感兴趣。这样，每当租房属性产生一个新报价时，租房属性服务都能增加该属性的分数。\n\
  \n更改非常简单。以下是我们定义一个监听消息更新的消费者服务：\n\n```\n@Service\npublic class ProposalConsumerService\
  \ {\n    private final ScoreService scoreService;\n    private final ObjectMapper\
  \ objectMapper\n        = new ObjectMapper();\n    public ProposalConsumerService(\n\
  \        @Qualifier(\"jdbcRentalPropertyService\")\n        ScoreService scoreService)\
  \ {\n        this.scoreService = scoreService;\n    }\n    @KafkaListener(topics\
  \ = \"proposal-topic\",\n          groupId = \"rental-properties-proposal-group\"\
  )\n    public void consume(String message)\n        throws JsonProcessingException\
  \ {\n        RentalProposalEvent event = objectMapper.readValue(\n            message,\
  \ RentalProposalEvent.class);\n        scoreService.addScore(\n            UUID.fromString(event.propertyId()));\n\
  \        System.out.println(\"Consumed message: \" + event);\n    }\n}\n```\n\n\
  如你所示，为了获取消息，我们需要使用 `ObjectMapper` 类将 `RentalProposalEvent` JSON 从字符串转换回对象。这非常简单，我们只需要声明\
  \ `@KafkaListener` 注解即可。它的参数是主题名称和监听器所属的消费者组。当你想要将事件流到不同的服务时，消费者组变得尤为重要。每个服务都应该有自己的消费者组。此外，当你扩展服务时——例如，在运行时添加更多租房属性服务的副本——Kafka\
  \ 主题将检测到同一个消费者组内有多个消费者，消息将在它们之间均匀分布。\n\n好了，一旦你以字符串形式接收到消息并将其反序列化为 `RentalProposalEvent`，我们就会调用评分服务的\
  \ `addScore()` 方法。其实现方式如下文所示：\n\n```\n@Override\npublic void addScore(UUID propertyId)\
  \ {\n    StringBuilder sql = new StringBuilder(\"UPDATE rental_properties SET score\
  \ = score + 1 WHERE id=:propertyId\");\n    MapSqlParameterSource params = new MapSqlParameterSource();\n\
  \    params.addValue(\"propertyId\", propertyId);\n    int rowsAffected = jdbcTemplate.update(\n\
  \        sql.toString(), params);\n    if (rowsAffected > 0) {\n        System.out.println(\n\
  \        \"Score updated successfully for property: \" +\n            propertyId);\n\
  \    } else {\n        System.out.println(\n        \"No property found with ID:\
  \ \" + propertyId);\n    }\n}\n```\n\n就这些了。关于流式架构还有很多可以说的内容，我在这里尝试为你提供了一些非常简单且强大的示例。现在，让我们看看微服务架构中等式的另一面：我们将在\
  \ `RentalProperties` 服务中进行的更改，以订阅租房建议的更新。\n\n# 构建我们的租房属性服务消费者\n\n正如我们之前提到的，租房属性服务对我们的租房建议服务中发生的任何谈判都感兴趣。这样，每当租房属性产生一个新报价时，租房属性服务都能增加该属性的分数。\n\
  \n更改非常简单。以下是我们定义一个监听消息更新的消费者服务：\n\n```\n@Service\npublic class ProposalConsumerService\
  \ {\n    private final ScoreService scoreService;\n    private final ObjectMapper\
  \ objectMapper\n        = new ObjectMapper();\n    public ProposalConsumerService(\n\
  \        @Qualifier(\"jdbcRentalPropertyService\")\n        ScoreService scoreService)\
  \ {\n        this.scoreService = scoreService;\n    }\n    @KafkaListener(topics\
  \ = \"proposal-topic\",\n          groupId = \"rental-properties-proposal-group\"\
  )\n    public void consume(String message)\n        throws JsonProcessingException\
  \ {\n        RentalProposalEvent event = objectMapper.readValue(\n            message,\
  \ RentalProposalEvent.class);\n        scoreService.addScore(\n            UUID.fromString(event.propertyId()));\n\
  \        System.out.println(\"Consumed message: \" + event);\n    }\n}\n```\n\n\
  如你所示，为了获取消息，我们需要使用 `ObjectMapper` 类将 `RentalProposalEvent` JSON 从字符串转换回对象。这非常简单，我们只需要声明\
  \ `@KafkaListener` 注解即可。它的参数是主题名称和监听器所属的消费者组。当你想要将事件流到不同的服务时，消费者组变得尤为重要。每个服务都应该有自己的消费者组。此外，当你扩展服务时——例如，在运行时添加更多租房属性服务的副本——Kafka\
  \ 主题将检测到同一个消费者组内有多个消费者，消息将在它们之间均匀分布。\n\n好了，一旦你以字符串形式接收到消息并将其反序列化为 `RentalProposalEvent`，我们就会调用评分服务的\
  \ `addScore()` 方法。其实现方式如下文所示：\n\n```\n@Override\npublic void addScore(UUID propertyId)\
  \ {\n    StringBuilder sql = new StringBuilder(\"UPDATE rental_properties SET score\
  \ = score + 1 WHERE id=:propertyId\");\n    MapSqlParameterSource params = new MapSqlParameterSource();\n\
  \    params.addValue(\"propertyId\", propertyId);\n    int rowsAffected = jdbcTemplate.update(\n\
  \        sql.toString(), params);\n    if (rowsAffected > 0) {\n        System.out.println(\n\
  \        \"Score updated successfully for property: \" +\n            propertyId);\n\
  \    } else {\n        System.out.println(\n        \"No property found with ID:\
  \ \" + propertyId);\n    }\n}\n```\n\n就这些了。关于流式架构还有很多可以说的内容，我在这里尝试为你提供了一些非常简单且强大的示例。现在，让我们看看微服务架构中等式的另一面：我们将在\
  \ `RentalProperties` 服务中进行的更改，以订阅租房建议的更新。\n\n\n\n现在，我们将利用构建好的所有内容并为真实世界的部署做好准备。这部分涵盖了在云环境中启动微服务、对其韧性进行优化，以及结构化配置以优雅地处理故障。我们还将深入探讨使微服务具备容错和自愈能力的高级技术。\n\
  \n此部分包含以下章节：\n\n*   第 11 章，启动你的自组织微服务云\n*   第 12 章，优化你的服务\n\n# 11 启动你的自组织微服务云\n\n\
  欢迎来到第 11 章！到目前为止，我们通过原型方法创建了服务。我们并没有关心它们是如何实例化的，或者它们是如何找到对方的。我们也没有关心它们是如何生成日志的。这是因为我们希望先提供有趣且最重要的部分。\n\
  \n现在，你已经拥有了使用 Spring 开发系统的关键工具和技术。你了解 Spring Bean 的工作原理，以及如何使用 Spring Web 和 WebFlux\
  \ 编写 API。我们已经通过 SQL 和 NoSQL 示例看到了如何管理数据。我们还学习了如何通过多种方式测试系统，以及如何编写事件驱动系统。\n\n这些内容很多了！现在，让我们准备好架构发布到生产环境。为了部署你的系统，我们需要处理其他重要事项，例如在本章中将涵盖的主题：\n\
  \n*   如何更好地结构化你的服务日志\n*   如何为不同的环境组织属性文件\n*   使用 Spring Cloud 基础设施设置你的服务\n\n这三个关键点将帮助你使用原生\
  \ Spring 工具成功地编排云基础设施。这将使得管理云配置、让微服务相互发现以及向客户端暴露统一的 API 变得相当容易。此外，你还可以隐藏那些不想公开的端点。准备好了吗？我们开始吧！\n\
  \n# 技术要求\n\n你可以使用我们 GitHub 仓库中包含的第 11 章](#B18632_11.xhtml__idTextAnchor298)的参考代码：`https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11`。\n\
  \n# 如何生成你的服务日志\n\n为了在开始时快速编写服务原型，使用简单的 `System.out.println()` 方法编写日志是可以接受的。但为了确保你的服务在生产和其他测试环境中以更清晰、更有结构化的方式报告操作，你需要以一种独特的方式编写日志，以便允许你选择在每个环境中暴露多少详细信息。\n\
  \n正确地编写日志是非常重要的。即使是经验丰富的开发者也经常忘记这一关键步骤，而这会给排查故障带来困难。优秀的日志将让你能够很容易找到系统性问题的根源。如果你想让你的开发者工作变得轻松，请务必实现我们在接下来的章节中看到的日志标准。\n\
  \n## 现有的日志级别有哪些？\n\n通常，当使用 Log4J 或 Logback 等工具（两者都受 支持）编写日志时，你可以声明日志级别——这意味着你的消息将具有特定的含义。\n\
  \n这些级别对每条日志条目的目的和严重程度进行分类，使得在分析期间更容易解释和确定它们的优先级。\n\n无论我们使用什么工具来创建日志，这些都是我们经常使用的日志级别：\n\
  \n*   **TRACE**：这是最细粒度的信息，通常用于通过在非常详细的跟踪程序执行来诊断特定问题。由于输出量巨大，在生产环境中很少启用它。我喜欢在本地测试应用时在开发期间它，因为它有时可以帮助我避免在\
  \ IDE 中使用调试功能。\n*   **DEBUG**：这是关于系统流的详细信息。它也用于开发和测试验证期间的调试。有时，我们会在生产环境的故障排除期间启用它，以理解应用程序的行为。注意，debug\
  \ 和 trace 日志可能会非常冗长，当日志量巨大时，会导致生产环境中日志分类出现问题。它还会产生许多不必要的存储成本。\n*   **INFO**：它从高层突出应用程序的进度。它通常在生产环境中启用，以记录启动、关闭或配置更改等重大事件。避免对高并发操作使用\
  \ info 日志，因为大多数成功的操作将产生相同的日志，并变得毫无意义。\n*   **WARN**：这些是潜在的有害或意外情况，不一定是错误，但可能需要关注。它指示了不会阻止应用程序运行但可能需要调查的问题。我喜欢在处理高频发生的操作时使用\
  \ warn 日志。通过在高频操作中省略 info 日志并仅发布 warn 日志，我们就可以在情况变得异常或意外时看到日志。这样对于排查故障就具有意义了。\n\
  *   **ERROR**：它告知可能仍允许应用程序继续运行但表明特定操作失败的事件。它用于记录已处理但表示问题的异常或错误。突出 error 日志和 warn\
  \ 日志之间的区别是好的。warn log 意味着你没有错误，只有意外情况，例如客户端以错误的方式发送请求，而你的应用程序以 400（错误请求）响应回答。坏请求响应本身并不是错误，但由于在配置良好的环境中你的应用程序不应该接收格式错误的请求，因此查看\
  \ warn 消息以检查系统是否按预期运行是很好的。\n*   **FATAL**：这些是会导致应用程序终止的严重错误事件。它指示了需要立即关注的关键故障，例如系统崩溃或数据损坏。\n\
  \n通过这些日志级别，你将能够判断控制台输出的严重程度。现在，让我们学习如何使用 Spring 原生支持的工具实际写入日志。\n\n## 如何在 Spring\
  \ 中日志\n\nSpring 服务中最常用的两个 Java 日志工具/框架是 Log4J 和 Logback。它们包含相似的功能，并允许以有趣的方式格式化日志，因此我们在这里选择\
  \ Log4J 的常用方法（Logback 是另一种框架，但我们在书中没有足够的空间向你展示如何使用它）。我们可以通过在类上添加 `@Slf4j` 为任何类创建一个日志服务实例。这将使用\
  \ Log4J 框架创建一个 `log` 对象，可以在该类实例的任何地方引用它。示例所示：\n\n\n\n\n\n```java\n@RestControllerAdvice\n\
  @Slf4j\npublic class SampleExceptionHandler {\n    @ExceptionHandler(RuntimeException.class)\n\
  \    public ResponseEntity<ProblemDetail>\n        handleGenericException(RuntimeException\
  \ ex) {\n          log.error(\"exception: \", ex);\n          ProblemDetail problemDetail\
  \ =\n              ProblemDetail.forStatus(\n                  HttpStatus.INTERNAL_SERVER_ERROR);\n\
  \          problemDetail.setTitle(\n              \"Customized Internal Server Error\"\
  );\n          problemDetail.setDetail(\n              \"An unexpected error occurred:\
  \ \"\n                  + ex.getMessage());\n          problemDetail.setInstance(\n\
  \              URI.create(\n                  \"/api/v1/rental-properties/error\"\
  ));\n          problemDetail.setProperty(\"timestamp\",\n              LocalDateTime.now().toString());\n\
  \          log.debug(\"The resulting error object: {}\",\n              problemDetail);\n\
  \          return new ResponseEntity<>(problemDetail,\n              HttpStatus.INTERNAL_SERVER_ERROR);\n\
  \    }\n    // ... the rest of the code goes here\n}\n```\n\n在这个类中，我们表示第一条输出日志处于\
  \ `ERROR` 级别，而第二条处于 `DEBUG` 级别。这些是在运行应用程序时需要注意的两种不同的详细级别。Debug 日志通常在你需要通过日志获取关键变量值和流程细节时使用，以便确认你的程序运行正常。Error\
  \ 日志用于你不需要程序正常执行的详细信息，只需要异常详情的情况——本质上，它指的是没有按预期执行的指令，这意味着你的软件在某个层面上损坏了。\n\n现在，你需要在运行应用程序时指定想要激活的日志级别。你可以在属性文件中进行指定。以下是来自我们的租赁房产微服务属性文件的三个示例：\n\
  \n```properties\n# 为整个应用程序启用 INFO 日志\nlogging.level.root=INFO\n# 为其中一个类启用 DEBUG\
  \ 日志\nlogging.level.com.homeit.rental.property.controller.SampleExceptionHandler=DEBUG\n\
  # 为 Spring Web 包启用 DEBUG 日志\nlogging.level.org.springframework.web=DEBUG logging.level.org.springframework.web.servlet=DEBUG\n\
  ```\n\n在第一个示例中，我们表示只从 `INFO` 级别（`root` 日志）开始记录日志。这意味着当你运行服务时，应用程序将不会产生低于 `INFO`\
  \ 级别（`DEBUG` 和 `TRACE`）的日志，但仍然会产生高于 `INFO` 级别（`WARN`、`ERROR` 和 `FATAL`）的日志。\n\n\
  如你所见，选择应用程序产生日志的级别非常重要，因此请务必记住日志级别的层次结构。\n\n在第二个示例中，我们可以看到我们为特定类（`SampleExceptionHandler`）设置了日志。这意味着，仅对于\
  \ `SampleExceptionHandler` 类，你的应用程序才会产生 `DEBUG` 级别及以下的日志（包括 `INFO`、`WARN`、`ERROR`\
  \ 和 `FATAL`）。\n\n为特定类指定要产生的日志级别，可以让你专注于你更密切地调查或监控的应用程序部分的细节。如果你将整个应用程序的日志级别设置为 `DEBUG`，可能无法监控所有消息。\n\
  \n还可以为 Spring 特有的包开启更详细的日志。这正是我们在第三个示例中所做的。由于根日志器配置只针对你的应用程序类，当你想要了解 Spring 框架内部发生了什么时，必须显式地为\
  \ Spring 特有的类和包开启 `DEBUG` 或 `TRACE` 日志。有时开启 Spring 类的日志是非常用的，你将看到 Spring 原生类随时间推移的行为。例如，你可能会发现这很有有用。\n\
  \n## 理解日志输出\n\n一旦设置了级别，你就会看到不同的输出。以下是我们得到的一个示例：\n\n```text\n2024-10-07T09:26:25.123Z\
  \ ERROR 12345 --- [main] c.h.SampleExceptionHandler : The resulting error object\
  \ : ProblemDetail[type='about:blank', title='Customized Internal Server Error',\
  \ status=500, detail='An unexpected error occurred: sample unhandled exception',\
  \ instance='/api/v1/rental-properties/error', properties={timestamp=2024-10-07T09:26:25.123Z}]\n\
  ```\n\n如你所示，两条日志之间的主要区别是级别，如上面提到的。当我们从 `log.error()` 更改为 `log.info()` 时，可以看到运行应用程序时的级别。再次，在这种情况下，当你将日志级别设置为\
  \ `INFO` 且没有为类定义 `DEBUG` 日志时，意味着每次 `log.debug()` 调用都不会在控制台中产生输出。\n\n关于如何更好地组织日志的介绍就到此。现在，让我们谈谈如何组织你的应用程序属性。\n\
  \n# 如何组织属性文件\n\n除了组织日志之外，我们还需要正确地告知服务我们在运行时想要使用的重要值。例如，在我们的 HomeIt 示例中，在 `RentalProperties`\
  \ 服务启动时，我们可能想告诉它我们想要从哪个主题读取事件，或者想告诉它 `RentalProperties` 服务正在连接的重要服务的地址和端口，例如数据库地址和凭据。\n\
  \n这些被称为 `服务属性`（service properties），属性分为两种类型：\n\n*   Spring 依赖项定义其行为所必需的属性\n*   你在应用程序中需要用来定义代码行为的属性\n\
  \n你想要使用服务属性设置某些变量有两个重要原因：\n\n*   因为你希望在不同的环境中启动同一服务时，更方便地更改这些值。\n*   因为你想隐藏那些应该是秘密的值，例如凭据。\n\
  \n\n\n\n既然我们已经解释了*是什么*，现在我们将展示一些关于*如何*将属性值注入到你的应用程序中的示例。但首先，让我们学习在 Spring 中声明属性的不同方法。\n\
  \n## 编写你的属性文件\n\n通常情况下，你的文件应该始终创建在项目文件夹内部的 `src/main/resources` 文件夹中。根据你选择的写入属性的格式，文件名将所不同。让我们先查看普通的\
  \ `application.properties` 格式，然后查看 YAML 格式。\n\n### 编写 application.properties 文件\n\
  \n`application.properties` 文件采用简单格式，你可以在每行设置一个应用程序属性，属性名称通过点 `.` 分隔。属性值通过等号 `=`\
  \ 与属性名称隔。这里示例展示了我们在 `RentalProperties` 服务中使用的部分属性：\n\n```\nspring.application.name=rental-property-microservice\n\
  server.port=8085\nspring.kafka.bootstrap-servers=localhost:9092\nspring.kafka.consumer.group-id=proposal-group\n\
  spring.kafka.consumer.auto-offset-reset=earliest\n```\n\n如你所见，属性是按层级组织的。每个 Spring\
  \ Kafka 依赖属性将以 `spring.kafka` 为前缀，这让你更容易看到哪些依赖在使用你声明的每个属性。\n\n你可以在此处查看整个文件：https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-11/rental-property-microservice/src/main/resources/application.properties。\n\
  \n### YAML 属性文件\n\nYAML 属性文件具有不同的格式：\n\n*   首先，按照习惯，文件始终以 `.yml` 扩展名命名——因此它应该命名为\
  \ `application.yml`\n*   其次，属性前缀都有各自的行，而子值通过两个空格缩进进行嵌套\n\n这是一个来自 `AuthorizationProvider`\
  \ 服务的示例。与 `RentalProperties` 服务中的 `application.properties` 文件一样，`application.yml`\
  \ 属性也位于你项目的 `src/main/resources` 文件夹中：\n\n```\nspring:\n  application:\n    name:\
  \ authprovider\n  datasource:\n    url: jdbc:h2:mem:testdb\n    driverClassName:\
  \ org.h2.Driver\n    username: sa\n    password: password\n```\n\n再次，这个示例只是 `Authorization`\
  \ 服务中使用的完整属性集的一个片段。你可以在此处查看整个属性文件：https://github.com/PacktPublishing/Spring-System-Design-in-Practice/blob/main/chapter-11/authprovider/src/main/resources/application.yml。\n\
  \n## 在启动打包后的应用程序时覆盖属性文件\n\n在将应用程序打包成 JAR 文件后，有多种方法可以覆盖你的属性文件，这样你就不需要编辑 JAR 文件本身。当你打包应用时包含了一些开发属性文件，但你想用来自实际工作环境（例如生产环境）的属性覆盖这些环境属性时，这些方法非常有用。\n\
  \n让我们在下面的小节中查看五种方法。\n\n### 在应用程序相同目录下添加新的属性文件\n\n将 `application.properties` 或 `application.yml`\
  \ 文件放置在与你的 JAR 文件相同的目录下：\n\n```\nrental-properties-microservice.jar\napplication.properties\n\
  ```\n\n当应用程序启动时，Spring Boot 会首先查找 JAR 文件外部的配置文件。通过在相同目录下添加属性文件，你可以覆盖封装在 JAR 文件内部的属性。\n\
  \n### 将属性文件添加到 /config 目录\n\n在与 JAR 文件相同的位置创建一个 `config` 目录，并将你的 `application.properties`\
  \ 或 `application.yml` 文件放在此目录中：\n\n```\nyourapp.jar\nconfig/\n    application.properties\n\
  ```\n\nSpring Boot 会自动检查 `/config` 子目录以查找配置文件。在这里定义的属性将覆盖 JAR 文件内部的属性。\n\n### 使用命令行覆盖属性值\n\
  \n在运行应用程序时，直接将属性作为命令行参数传递：\n\n```\njava -jar yourapp.jar --server.port=8081\n```\n\
  \n命令行参数在 Spring Boot 的属性层级中具有最高优先级。这意味着它们将覆盖外部文件中设置的属性以及 JAR 中封装的属性。\n\n如果你使用 `-D`\
  \ 声明属性，这意味着你把属性注入到 JVM 环境中：\n\n```\njava -Dserver.port=8082 -jar yourapp.jar\n```\n\
  \n在这个示例中，你只是覆盖了一个属性，即服务器端口。\n\n### 在命令行处定义新的属性文件\n\n创建一个包含你想要配置的新 `application.properties`\
  \ 或 `application.yml` 文件，并将其放置在任选的目录中。然后你可以在运行 JAR 时使用 `--spring.config.location`\
  \ 选项来指定自定义属性文件的路径：\n\n```\njava -jar yourapp.jar --spring.config.location=file:/path/to/your/custom.properties\n\
  ```\n\n### 硬编码你的属性\n\n设置属性另一种方法是将它们写在代码中。在我们的 `RentalProperties` 服务中，是这样做的：\n\n\
  ```java\nprivate static void virtualThreads(SpringApplication app){\n    app.setDefaultProperties(Map.of(\"\
  spring.threads.virtual.enabled\", \"true\"));\n}\n```\n\n现在你已经知道了声明服务的几种基本方法，让我们转向其他可以用于设置属性的策略。\n\
  \n## 使用环境变量设置属性值\n\n在 Spring Boot 应用程序中，你也可以使用操作系统的环境变量来设置属性值。让我们看看使用环境变量定义属性值的方法。\n\
  \n## 使用环境变量覆盖属性\n\n环境变量可以覆盖配置文件中定义的属性。当应用程序启动时，Spring Boot 会检查与属性名称匹配的环境变量，并使用它们的值覆盖你在属性文件中定义或服务中硬编码的属性。要使用操作系统环境变量声明属性，你需要将分隔属性单词的点\
  \ `.` 替换为下划线 `_`。\n\n这是一个在 Linux 环境中定义服务器端口的示例。你应该记住，最初在属性文件中声明服务器端口需要编写 `server.port`。现在，我们只需将点替换为下划线。此命令可以在你的\
  \ Linux 控制台上使用系统变量声明服务器属性：\n\n```\nexport SERVER_PORT=8081\n```\n\n这是一个在 Windows\
  \ 环境中定义服务器端口的示例：\n\n```\nset SERVER_PORT=8081\n```\n\n这样，每当你启动任何 Spring 时，因为 Spring\
  \ Web 默认会尝试从配置中读取 `server.port` 属性，它将从环境变量中读取服务器端口并覆盖属性文件。\n\n### 属性值的优先级\n\n当你结合不同的声明属性值的方法时，某些将覆盖另一些。以下是优先级——即哪些属性值源将覆盖其他源：\n\
  \n*   命令行参数覆盖所有其他属性源\n*   Java 系统属性次之\n*   环境变量覆盖文件中的属性\n*   外部配置文件覆盖封装的配置\n*  \
  \ 如果未提供外部属性，则使用封装的配置文件\n\n\n\n\n*   默认属性是最后的手段（包括直接在代码中声明的属性）\n\n这就是你组织属性值声明的方式。但等一下，还有更多内容。在下一节中，让我们看看如何为不同的环境预包不同的属性文件。这就是我们所说的\
  \ Spring profiles（配置环境）。\n\n## 为每个部署环境创建属性文件\n\n假设你的应用需要部署到开发环境，然后部署到测试环境（staging）进行最终测试和质量保证，最后移动到生产环境。这是行业中非常常见的场景。在这种情况下，如果能为每个环境预先定义一组不同的属性值，不是很好吗？通过使用\
  \ Spring Profiles，你可以为每个环境准备一个 `.properties` 或 `.yml` 文件。\n\n假设你希望应用程序根据环境运行在不同的服务器端口上：\n\
  \n*   开发环境 (dev)：运行在端口 8081 \n*   测试环境 (stg)：运行在端口 8082 \n*   生产环境 (prod)：运行在端口\
  \ 8080 \n\n以下是如何使用 Spring Profiles 进行这种设置。首先，创建特定配置的属性文件。在你的 `src/main/resources`\
  \ 目录下，为每个环境创建独立的属性文件：\n\n*   `application-dev.properties`\n*   `application-stg.properties`\n\
  *   `application-prod.properties`\n\n在每个属性文件中，用不同的值声明 `server.port`。当你运行应用程序时，可以指定要激活哪个\
  \ profile，Spring Boot 会自动加载相应的属性文件。例如，加载 dev 属性文件的方法如下：\n\n```\njava -jar yourapp.jar\
  \ --spring.profiles.active=dev\n```\n\n这意味着你的服务将加载 `application-dev.properties`\
  \ 以及默认的 `application.properties` 文件。dev 环境文件将根据你在其中声明的任何属性覆盖默认属性文件。通过声明激活 profile，Spring\
  \ 将尝试在默认属性文件之上加载名为 `application-{profile}.properties` 的文件。\n\n### 从环境变量读取属性\n\n\
  你的属性值也可以引用环境变量。例如，在为 Spring 应用声明 `server.port` 属性时，允许使用以下语法，以便将环境变量的值提取到你的属性文件中：\n\
  \n```\nserver.port=${RENTAL_PROPERTIES_SERVER_PORT}\n```\n\n这意味着你的 `server.port`\
  \ 值将与环境变量 `RENTAL_PROPERTIES_SERVER_PORT` 的值相同。\n\n当你想要隐藏密钥（如重要服务的密码）时，注入环境变量是非常重要的。将这些值存储在环境变量中意味着你不需要将它们直接写在属性文件中。而且由于它们不在属性文件中，你可以安全地使用\
  \ Git 保护这些文件。\n\n好了，这解释了在服务中声明属性你需要的所有知识。现在，你实际上如何如何将这些属性之一注入到你的 Spring 应用中呢？这将在下一节中学习。\n\
  \n## 在你的服务中注入属性\n\n如果你需要将环境变量注入到 Spring 应用中，只需在你的服务中使用以下语法即可。在这个示例中，我们正在修改 `RentalProposalServiceImpl`\
  \ 类中的 `Proposal` 服务，以便我们可以在属性文件中声明 `kafka` 主题的名称：\n\n```\n@Value(\"${rental.proposal.topic.name:sample-name}\"\
  )\nprivate String topicName;\n```\n\n这是我们如何在 `application.properties` 文件中声明属性的方法：\n\
  \n```\nrental.proposal.topic.name=proposal-topic\n```\n\n这结束了关于如何构建应用程序属性值的介绍。总结一下，你可以执行以下操作：\n\
  \n*   以不同格式（`properties` 或 `.yml` 文件）编写独立的属性文件\n*   为不同的执行 profile 编写特定的属性文件（有助于为不同环境提供值）\n\
  *   设置启动应用程序时使用的属性文件\n*   在启动 Spring 应用的命令行中设置属性值\n*   直接在代码中设置属性文件\n*   使用你的操作系统存储属性文件值，Spring\
  \ 将在启动时检测到这些值\n*   在你的 Spring 服务中注入你自己的属性文件\n\n至此，我们可以进入下一个主题，在其中我们将看到如何使用 Spring\
  \ Cloud 以一种自组织的方式启动服务。\n\n# 使用 Spring Cloud 设置你的服务\n\nSpring Cloud 是 Spring 中的一组工具，帮助你通过一系列功能启动服务，这些功能允许你简化连接。通过使用\
  \ Spring Cloud，你可以执行诸如下操作：\n\n*   创建一个配置服务，它将托管你所有微服务的配置文件\n*   创建一个发现服务，帮助你的服务自动相互连接，而无论每个服务使用的\
  \ IP 和端口如何\n*   将你的微服务扩展到多个副本副本，并让它们自动在负载均衡器后工作\n*   将你所有的服务映射到单个 API 网关中，使客户端只需访问一个\
  \ IP 和一个端口即可到达你的任何微服务\n\n让我们通过查看 Spring Cloud 拓扑结构来看看它是如何工作的。我们将使用 HomeIt 示例来说明\
  \ Spring Cloud 拓扑结构是如何构建的。\n\n## 理解 Spring Cloud 拓扑结构\n\n下面的图展示了 Spring Cloud 组件如何放入我们到为止为\
  \ HomeIt 构建的架构中：\n\n![Figure 11.1: HomeIt Spring Cloud topology](img/B18632_11_1.jpg)\n\
  \n图 11.1：HomeIt Spring Cloud 拓扑结构\n\n适用于以下观察：\n\n*   首先，API 网关我们将编写的一个特殊 Spring\
  \ Cloud 服务，它允许我们的客户端通过一个 IP 和端口来访问云中的任何服务。这意味着你不需要强迫客户端拥有每个服务的地址。此外，如果你为每个服务创建了多个副本，API\
  \ 网关将自动对服务调用进行负载均衡。这有助于水平扩展你的应用（当你需要为同一个服务创建多个副本时）。\n*   其次，Config 服务是一个特殊的 Spring\
  \ Cloud 服务，它允许你暴露配置仓库，以便你的任何服务都能从 Config 服务加载配置。Config 服务允许从不同的介质检索属性文件。在示例中，我们将使用\
  \ GitHub 作为中央仓库来暴露配置文件，这在我们想要对属性文件进行版本控制时是理想的。启动时，Config 服务基本上会克隆你的 Git 配置仓库，并为其他服务提供这些文件。\n\
  *   第三，发现服务（也称为 Eureka 服务）允许云中的每个服务找到每个其他服务。它服务于以下目的：\n\n    *   它允许架构中的所有服务都发布它们自己的实例，并说明它们运行在哪个\
  \ IP 上以及监听哪个 HTTP 端口。\n    *   由于发现服务将知道云中的每个其他服务，以及其 IP 和端口，它可以告知所有其他服务去哪里寻找任何可用服务。这意味着当你使用我们将在接下来的几节中将看到的特殊\
  \ Spring Cloud 配置时，你所有的服务都能够自动找到彼此。\n    *   因为每个服务都将从你的 Spring Cloud Config 服务读取自己的配置，因此为你可能需要的不同环境中的服务设置特定配置将变得容易得多。\n\
  \n\n\n\n如你所见，你的 Spring Cloud 环境将确保在你要启动服务的任何环境中，都能够将所有服务相互连接。\n\n在接下来的章节中，我们将学习如何编写这些特殊服务，以及如何更改当前的服务以享受自配置云环境带来的益处。\n\
  \n## 启动发现服务 (Discovery service)\n\n发现服务（也称为 Eureka 服务）是一个非常简单的微服务，它可以帮助你映射云中的其他所有服务。它最初由\
  \ Netflix 创建并供其内部使用，但后来公司决定将其开源。由于其显而易见的优势，它被纳入了 Spring Cloud 服务集之中。\n\n创建发现服务并不需要配置额外的依赖项。你只需要使用\
  \ Spring Initializr 创建一个示例服务。然后，将项目内容提取到硬盘，并将你的 `build.gradle` 文件设置为如下内容：\n\n```\n\
  plugins {\n   id 'java'\n   id 'org.springframework.boot' version '3.3.4'\n   id\
  \ 'io.spring.dependency-management' version '1.1.6'\n}\ngroup = 'com.homeit'\nversion\
  \ = '0.0.1-SNAPSHOT'\njava {\n   toolchain {\n       languageVersion = JavaLanguageVersion.of(21)\n\
  \   }\n}\ndependencyManagement {\n   imports {\n       mavenBom \"org.springframework.cloud:spring-cloud-dependencies:2023.0.3\"\
  \n   }\n}\nrepositories {\n   mavenCentral()\n}\ndependencies {\n   implementation\
  \ 'org.springframework.boot:spring-boot-starter'\n   implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'\n\
  \   implementation 'org.springframework.boot:spring-boot-starter-actuator'\n   testImplementation\
  \ 'org.springframework.boot:spring-boot-starter-test'\n   testRuntimeOnly 'org.junit.platform:junit-platform-launcher'\n\
  }\ntasks.named('test') {\n   useJUnitPlatform()\n}\n```\n\n在代码块中，`dependencyManagement`\
  \ 部分会下载你可能需要的任何 Spring Cloud 依赖的正确版本，这样你就就不需要在每个依赖项中设置版本。\n\n这里的关键依赖项是 `netflix-eureka`。它会自动为你的服务添加一些\
  \ REST 端点，允许发现服务能够接收来自其他服务的注册请求，并允许其他服务发现已注册的服务。注册的服务默认存储在内存数据库中。\n\n以下是 HomeIt\
  \ 架构中 Eureka 服务的关键属性：\n\n```\nspring.application.name=eureka-server\nserver.port=8761\n\
  eureka.client.register-with-eureka=false\neureka.client.fetch-registry=false\n```\n\
  \n如你所见，我们正在设置服务的名称和默认端口，最后，我们有两个关键选项：`register-with-eureka`（它告诉服务不要尝试在另一个 Eureka\
  \ 服务中注册自己）以及 `fetch-registry`（它目前设置为 Eureka 服务不从其他 Eureka 服务获取注册表数据）。这些选项在进行独立 Eureka\
  \ 服务配置时非常有用。\n\n此外，为了让你的应用程序运行 Eureka 服务，你需要在主应用程序类中添加一个特殊的注解。这是一个示例：\n\n```\n@SpringBootApplication\n\
  @EnableEurekaServer\npublic class EurekaServerApplication {\n public static void\
  \ main(String[] args) {\n  SpringApplication.run(EurekaServerApplication.class,\
  \ args);\n }\n}\n```\n\n通过这种操作，你将能够运行 Eureka 服务。它以独立模式运行，这意味着你的云将只有一个 Eureka 服务实例可用。缺点是如果你的\
  \ Eureka 服务停止，所有其他服务将无法保持与其彼此服务地址的同步。如果你的任何服务发生变化，Eureka 将不会在那里向你的云服务更新这些变化。\n\n\
  独立模式可能有一点风险，因此我们需要添加多个 Eureka 服务实例。如果你希望通过多个 Eureka 服务实例实现高可用性，你需要定义在所有服务实例中有哪些\
  \ Eureka 服务实例可用。你将通过使用服务属性上的 `defaultZone` 配置列出所有可用的 Eureka 服务（包括所有 Eureka 实例）。此外，你还需要在\
  \ Eureka 服务中将 `fetch-registry` 和 `register-with-eureka` 选项设置为 `true`。\n\n以下是一个 Eureka\
  \ 服务查询其他服务的示例：\n\n```\neureka.client.register-with-eureka=false\neureka.client.fetch-registry=false\n\
  eureka.client.service-url.defaultZone=http: //localhost:8761/eureka/,http://localhost:8762/eureka/\n\
  ```\n\n我们的发现服务就此结束。你可以在这里查看 Eureka 服务的完整实现：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/eureka-server`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/eureka-server)。接下来，让我们看看如何运行\
  \ Config 服务，它允许你的微服务从中心位置下载属性文件。\n\n## 启动 Config 服务\n\nConfig 服务允许你拥有一个中心位置，微服务可以从该位置下载它们的属性文件。我们已经看到，管理属性文件是让微服务在许多环境中运行的重要部分。因此，与其分布属性文件并根据情况决定每个服务如何发现它们，不如拥有一个位置，让所有服务在启动时直接查询它们的属性呢？\n\
  \n在所有微服务中统一这种设计是 Config 服务的目的。以下是构建方法。\n\n### 构建 Spring Cloud Config 服务\n\n要创建一个\
  \ Spring Cloud Config 服务，访问 Spring Initializr 网站创建一个基础应用程序。你可以添加任何应用程序名称和包名。然后，你的\
  \ `build.gradle` 文件看起来应该是这样的：\n\n```\nplugins {\n   id 'java'\n   id 'org.springframework.boot'\
  \ version '3.3.4'\n   id 'io.spring.dependency-management' version '1.1.6'\n}\n\
  group = 'com.homeit'\nversion = '0.0.1-SNAPSHOT'\njava {\n   toolchain {\n     \
  \  languageVersion = JavaLanguageVersion.of(21)\n   }\n}\ndependencyManagement {\n\
  \   imports {\n       mavenBom \"org.springframework.cloud:spring-cloud-dependencies:2023.0.3\"\
  \n   }\n}\nrepositories {\n   mavenCentral()\n}\ndependencies {\n   implementation\
  \ 'org.springframework.boot:spring-boot-starter'\n   implementation 'org.springframework.cloud:spring-cloud-config-server'\n\
  \   implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'\n\
  \   testImplementation 'org.springframework.boot:spring-boot-starter-test'\n   testRuntimeOnly\
  \ 'org.junit.platform:junit-platform-launcher'\n}\ntasks.named('test') {\n   useJUnitPlatform()\n\
  }\n```\n\n\n\n\n\n# 设置 Spring Config Server 属性\n\n由于有很多重要的属性需要配置在 Spring Config\
  \ Server 上，让我们对属性文件进行拆分并添加几个不同的部分，以便于理解。\n\n## 设置基础应用属性和 GitHub 访问\n\n就像 Eureka\
  \ 服务一样，编写一个完整的 Config Server 实际上非常简单，因为你不需要向代码中添加额外的类和服务。一旦你已经在 `build.gradle` 文件中设置了依赖，这就是我们准备为\
  \ HomeIt Config Server 使用的默认属性文件：\n\n```\nspring.application.name=config-server\n\
  server.port=8888\nspring.cloud.config.server.git.uri=https: //github.com/rsantiago/professional-spring-system-design-patterns.git\n\
  spring.cloud.config.server.git.username=${GIT_USER}\nspring.cloud.config.server.git.password=${GIT_KEY}\n\
  spring.cloud.config.server.git.searchPaths=config-repo/\n```\n\n如你所见，我将端口设置为 `8888`，然后设置了我想从哪里获取配置文件的\
  \ Git 仓库。我还将用户名和密码设置为两个环境变量（我使用 GitHub 开发者令牌作为密码）。此外，我告诉 Spring，一旦它克隆仓库，配置文件位于 `config-repo/`\
  \ 目录。\n\n这些就是我们设置 Git 配置和基础服务属性（如应用名称和服务器端口）所需的所有属性值。现在让我们来看看 Eureka 客户端使用的属性，以便你的\
  \ Config Server 知道如何将自己发布到 Eureka 服务，同时也让它知道如何从 Eureka 注册中心获取其他服务的地址。\n\n## 设置 Eureka\
  \ 属性\n\n以下属性与 Eureka 服务有关。它们将帮助你的 Config 服务连接到 Spring Cloud 环境：\n\n```\neureka.client.service-url.defaultZone=http:\
  \ //localhost:8761/eureka/\neureka.client.register-with-eureka=true\neureka.client.fetch-registry=true\n\
  eureka.instance.prefer-ip-address=true\n```\n\n在这里，我告诉我的 Config Server，Eureka 服务可以通过端口\
  \ `8761` 找到，并且这个 config server 应该在 Eureka 中注册自己。该服务器将从 Eureka 获取已注册的服务器，并倾向于使用 IP\
  \ 地址来访问其他服务器。\n\n## 为了透明化设置正确的日志级别\n\n了解你的 Config 服务正在发生什么对于排查 Spring Cloud 环境的问题至关重要。因此，让我们看看\
  \ HomeIt Config Server 属性文件中其他重要的选项，这些选项会产生记录 Config Server 运行情况的日志：\n\n```\nlogging.level.org.springframework.cloud.config.server.environment=DEBUG\n\
  logging.level.org.eclipse.jgit=DEBUG\nlogging.level.org.springframework.web=DEBUG\n\
  logging.level.org.springframework.cloud.config.server=DEBUG\n```\n\n在设置好 Eureka\
  \ 属性后，在这一部分，我设置了 Config 服务所需要的日志级别，这样我就知道服务器在运行时发生了什么。\n\n如你所见，我首先在以下部分中将日志设为 `DEBUG`\
  \ 级别：\n\n* JGit 依赖，它处理连接到配置的 GitHub 仓库（当你使用 Spring Cloud Config Server 依赖时，JGit\
  \ 依赖会自动且隐式地导入）。\n* 还有 Spring Web 依赖和 Cloud Config server 依赖。这允许我理解 config server\
  \ 启动以及其他微服务尝试下载其属性文件时，底层发生了什么。\n\n对于你的 Config 服务来说，基本上就是这些。让我们来看看最后一步，即创建运行配置服务的主应用类。\n\
  \n## 应用类\n\n为了让 Config 服务正常工作，你需要一个类似这样的简单应用类：\n\n```\n@SpringBootApplication\n\
  @EnableConfigServer\n@EnableDiscoveryClient\npublic class ConfigServerApplication\
  \ {\n public static void main(String[] args) {\n  SpringApplication.run(ConfigServerApplication.class,\
  \ args);\n }\n}\n```\n\n你只需要两个额外的注解：\n\n* `@EnableConfigServer` 将确保 Spring 注入了 Config\
  \ Server 正常运行所需的所有内容，允许其他服务查询它们自己的配置文件。\n* `@EnableDiscoveryClient` 将确保此 Config\
  \ Server 在 Eureka 服务中注册自己。记住，Eureka 需要知道服务在哪里，以便它们能够轻松地相互连接。我们将在*将你的服务与 Spring Cloud\
  \ 集成*章节查看它是如何实现的。\n\n如果你想查看此配置服务的完整代码，点击此链接：[`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/config-server`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/config-server)。\n\
  \n接下来，让我们看看如何在 Git 仓库中构建你的属性文件的示例。\n\n### 在 Git 仓库上设置属性文件\n\n为了确保应用程序可以从不同环境下载属性文件，让我们使用\
  \ Spring Profiles 功能。我为每个服务创建了四个不同的属性文件：一个默认属性文件和三个针对假设环境的不同文件：dev、stg 和 prod。\n\
  \n这里是我创建的文件列表。如你所见，有四个文件以 `rental-property-microservice` 字符串为前缀。这意味着这些是在 HomeIt\
  \ 项目中编写的租赁属性微服务的四个文件——每个环境一个（默认、dev、stg 和 prod）：\n\n```\nauthprovider-dev.properties\n\
  authprovider-prod.properties\nauthprovider.properties\nauthprovider-stg.properties\n\
  rental-property-microservice-dev.properties\nrental-property-microservice-prod.properties\n\
  rental-property-microservice.properties\nrental-property-microservice-stg.properties\n\
  rental-proposal-service-dev.properties\nrental-proposal-service-prod.properties\n\
  rental-proposal-service.properties\nrental-proposal-service-stg.properties\nrevoke-token-service-dev.properties\n\
  revoke-token-service-prod.properties\nrevoke-token-service.properties\nrevoke-token-service-stg.properties\n\
  ```\n\n所有这些文件可以在 [`github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/config-repo`](https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/config-repo)\
  \ 中看到。\n\n此外，我创建文件的方式非常简单，只是为了说明如何从一个环境更改属性。这里是 prod 环境下租赁属性微服务的示例：\n\n```\nserver.port=9801\n\
  ```\n\n如你所见，我只更改了每个文件中的端口号。在现实世界中，租赁服务的属性文件在每个环境中会有许多不同的属性，取决于你想要使用的外部服务。通常，dev、stg\
  \ 和 prod 会提供相同的外部服务，但 URL 不同（例如数据库连接）。\n\n你在 Config Server 中的属性文件名必须以你在项目默认属性文件中设置的服务名称开头。在租赁属性服务的情况下，我们在\
  \ `application.properties` 文件中设置了这个值：\n\n```\nspring.application.name=rental-property-microservice\n\
  ```\n\n这意味着无论我用哪个配置运行租赁属性服务，一旦我配置该服务与我的 Spring Cloud 环境集成，它将尝试获取以 `rental-properties-microservice`\
  \ 为前缀的属性。这对于确保你获得正确的配置至关重要。\n\n接下来，让我们看看应该如何编写自己的服务，以便它们自动与 Spring Cloud 集成。\n\n\
  \n\n\n\n# 将你的服务与 Spring Cloud 集成\n\n要将你的服务与 Spring Cloud 完全集成，需要满足以下三个要求：\n\n* 准备你的服务器以注册到\
  \ Eureka 服务中\n* 准备你的服务器以从 Spring Cloud Config Server 获取属性文件\n* 让你的服务器能够自动发现其他服务\n\
  \n为了实现这三个要求，我们将总共完成五个步骤。在接下来的章节中，这些我们将遵循的步骤。让我们让“租赁物业（Rental Properties）”服务适应这个环境。你可以调整这些步骤，以将其他服务集成到\
  \ Spring Cloud 环境中。\n\n### 添加必要的 Spring Cloud 依赖\n\n首先，在你的 `build.gradle` 文件中添加这些依赖：\n\
  \n```\nimplementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'\n\
  implementation 'org.springframework.cloud:spring-cloud-starter-config'\n```\n\n\
  第一个依赖将确保你的服务连接到 Eureka 服务，而第二个依赖将确保你的服务从 Config Server 下载配置文件。\n\n### 设置你的服务属性\n\
  \n为了强制你的微服务从 Config 服务下载配置并连接到 Eureka，需要在你的默认属性文件中添加以下属性：\n\n```\neureka.client.service-url.defaultZone=http://localhost:8761/eureka/\n\
  spring.config.import=configserver:\n```\n\n记住，我们的 Eureka 服务设置在端口 8761 上运行，并且 `spring.config.import`\
  \ 选项告诉你的微服务在 Eureka 中查找配置服务器。由于我们已经添加了启动的配置依赖，Spring 将完成从 Config Server 下载配置的所有工作——这些在\
  \ Spring Cloud 架构中都是箱即用的。\n\n### 配置你的应用程序类\n\n为了确保你的微服务与 Eureka 服务集成，你需要在你的应用程序类中添加以下注解：\n\
  \n```\n@SpringBootApplication\n@EnableDiscoveryClient\npublic class RentalPropertyApplication\
  \ {\n    // 其他代码在此处...\n}\n```\n\n通过在本节以及最后两个章节中设置的属性和注解，你的微应用会将自己注册到 Eureka 服务中。然后，它将尝试从\
  \ Config 服务器获取配置文件。记住，你的配置服务器也配置为注册到 Eureka 服务。\n\n`@EnableDiscoveryClient` 将设置你的应用程序连接到\
  \ Eureka 服务，但它之所以能知道如何连接，是因为你以正确的方式设置了依赖和属性。\n\n### 选择微服务将使用哪个属性文件\n\n好的，但我们如何设置“租赁物业”应用程序类来下载\
  \ prod 属性文件呢？这很简单：只需确保在启动时设置了正确的 Spring Profile。然后，获取你的微服务 JAR 文件并运行以下命令：\n\n```\n\
  java -jar rental-property-microservice.jar --spring.profiles.active=prod\n```\n\n\
  此命令将让我们的租赁物业微服务在 Config Server 中查找 `rental-property-microservice-prod.properties`\
  \ 文件。\n\n### 使用自发现调用其他服务\n\n连接到其他服务呢？当你将应用程序集成到 Spring Cloud 架构时，可以通过完成两件事使用 `RestTemplate`\
  \ 连接到另一个服务。\n\n首先，使用特殊注解声明你的 `RestTemplate` Bean 工：\n\n```\n@Configuration\npublic\
  \ class RestTemplateConfiguration {\n    @Bean\n    @LoadBalanced\n    public RestTemplate\
  \ restTemplate() {\n        return new RestTemplate();\n    }\n}\n```\n\n通过使用 `@LoadBalanced`\
  \ 注解，Spring Cloud 将确保两点：\n\n* 第一，你的应用程序将使用 Eureka 提供的注册表。这意味着你的应用程序只需使用在各自属性文件中声明的其他服务的名称，就能知道其他微服务的\
  \ IP 和端口。\n* 第二，Spring Cloud 将确保如果你在 Spring Cloud 环境中运行了同一服务的多个副本，调用服务在调用另一个微服务时会在不同的目标服务实例之间切换。这就是我们所说的“负载均衡（load\
  \ balancing）”。换句话说，启动 HTTP 用的服务会将调用（或负载）分配到相同目标服务的多个副本之间。\n\n这是 Spring Cloud 发现服务的一个重要方面。如果你运行了同一服务的多个副本并且它们配置为使用\
  \ Eureka 服务，Eureka 将保留所有位于不同 IP 和端口的现有实例列表。换句话说，如果你从不同的 IP 和端口多次运行 Proposal 服务，你的\
  \ Eureka 服务将知道每一个实例。每当一个服务尝试调用租赁物业服务时，负载均衡的 `RestTemplate` 将接收到这些不同实例的列表并均匀分配调用。在考虑扩展服务以处理更多流量时，请记住这一点。\n\
  \n这是允许你的 Spring 服务在云环境中自动发现其他服务的第二件事。让我们看看“租赁物业”服务是如何调用另一个服务器的。我们需要仅使用目标服务的名称来声明\
  \ `url` 参数。此外，由于我们编写了“租赁物业”服务查询令牌撤销服务（Revoke Token service）以发现令牌是否仍然有效，我们设置调用自动发现令牌撤销服务的地址。代码将如下：\n\
  \n```\npublic boolean isTokenRevoked(String token) {\n    String url = \"http://revoke-token-service/api/revoke-tokens?token=\"\
  \ + token;\n    // 其他代码\n}\n```\n\n记住，这是 `RestTemplateRevTokenService` 类中的代码。在 Spring\
  \ 配置之前，我们需要手动设置目标服务的位置和端口。但由于我们现在使用 Eureka 作为发现服务，只需通过属性文件中设置的名称引用你的目标服务，Spring\
  \ Cloud 就会确保 Eureka 通知你的调用服务器目标服务所在。这太不可思议且实用了！它让你的云在启动的每个环境中都能自动配置。\n\n这些是你每个服务中需要做的最重要的事情。如果你想查看到为止构建的所有服务是如何设置的，服务器的最终代码在这里：\n\
  \n* Eureka: https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/eureka-server\n\
  * Config Server: https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/config-server\n\
  * Rental Properties service: https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/rental-property-microservice\n\
  * Rental Proposal service: https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/rental-proposal-service\n\
  * Authorization provider: https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-11/authprovider\n\
  \n\n\n\n我们已经走了很远了！到此，你的微服务云已经能够远程提供配置文件并自动发现其他服务。现在，让我们讨论一下如何从单一位置处理你所有的服务请求：一个\
  \ Spring API 网关。\n\n## 启动 API 网关服务\n\n如果你已经完成了我们目前为止讨论的所有内容，那么以下情况就是成立的：你的服务正在启动并自动发现彼此，而且你的配置文件都集中在一个地方。这很酷，但仍然有一个问题需要解决：如果有一个外部\
  \ HTTP 客户端要使用这些服务，它们必须要么通过查询 Eureka 服务来查找微服务的 IP 和端口，要么我们需要另一种方法让外部客户端知道去哪里找到你的服务器。\n\
  \n这就是 Spring Cloud Gateway 的用场了。Spring Cloud Gateway 并不强制你的外部客户端知道如何查询 Eureka 服务器，而是允许你通过设置一个门面服务器（façade\
  \ server）将所有端点集中到单一服务中。在我们的 HomeIt 云中，这意味着我们的前端能够通过单个 IP 和端口（带有不同的端点）创建用户和令牌、创建和查询属性，以及创建和查询提案。\n\
  \n配置 Spring Cloud Gateway 的方法是遵循以下步骤：\n\n1. 在 Spring Initializr 中创建一个简单的 Spring\
  \ 应用程序。\n2. 添加网关所需的依赖项。\n3. 使用属性文件配置端点。\n\n让我们看看在我们的 HomeIt 示例中是如何实现的。\n\n### 在\
  \ Spring Initializr 中带有正确的依赖创建简单的 Spring 应用程序\n\n到这里，你已经知道如何使用 Spring Initializr\
  \ 创建简单的应用了。所以，去那里创建一个不需要任何特殊依赖的应用即可。\n\n接下来，将你的 `build.gradle` 文件设置为以下内容：\n\n```\n\
  plugins {\n   id 'java'\n   id 'org.springframework.boot' version '3.3.4'\n   id\
  \ 'io.spring.dependency-management' version '1.1.6'\n}\ngroup = 'com.homeit'\nversion\
  \ = '0.0.1-SNAPSHOT'\njava {\n   toolchain {\n       languageVersion = JavaLanguageVersion.of(21)\n\
  \   }\n}\ndependencyManagement {\n   imports {\n       mavenBom \"org.springframework.cloud:spring-cloud-dependencies:2023.0.3\"\
  \n   }\n}\nrepositories {\n   mavenCentral()\n}\ndependencies {\n   implementation\
  \ 'org.springframework.boot:spring-boot-starter'\n   implementation 'org.springframework.cloud:spring-cloud-starter-gateway'\n\
  \   implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'\n\
  \   testImplementation 'org.springframework.boot:spring-boot-starter-test'\n   testRuntimeOnly\
  \ 'org.junit.platform:junit-platform-launcher'\n}\ntasks.named('test') {\n   useJUnitPlatform()\n\
  }\n```\n\n通过设置 Eureka 客户端依赖，你的 API 网关将连接到 Eureka 服务，你运行的每个服务将对你的 API 网关可用。\n\n接下来，让我们通过添加\
  \ `@EnableDiscoveryClient` 注解设置应用程序类以启用发现客户端服务：\n\n```\n@SpringBootApplication\n\
  @EnableDiscoveryClient\npublic class ApiGatewayApplication {\n public static void\
  \ main(String[] args) {\n  SpringApplication.run(ApiGatewayApplication.class, args);\n\
  \ }\n}\n```\n\n足够简单对吧？设置应用程序非常简单。现在，我们需要配置 API 网关。\n\n### 使用 API 网关服务属性文件配置端点\n\n\
  为了创建我们的 API 网关端点，我们需要在 `.yml` 属性文件中声明它们。这不需要编写大量代码。这是 `application.yml` 文件的开头：\n\
  \n```\nspring:\n  application:\n    name: api-gateway\n  cloud:\n    gateway:\n\
  \      discovery:\n        locator:\n          enabled: true\n          lower-case-service-id:\
  \ true\n```\n\n这通知 Spring Cloud 该应用程序名为 `api-gateway`，网关服务将被激活以发现云中的其他服务，并且每个服务查询都应该通过将服务名称解析为小写来处理。\n\
  \n现在，这是我们需要在这个 API 网关中声明我们想要的端点的方式。这一切都在配置文件内完成。注意这些空格，它们是刻意留下的，因为所有这些路由都是属性层级中\
  \ `spring.cloud.gateway` 属性的子节点：\n\n```\n      routes:\n        - id: authprovider\n\
  \          uri: lb://authprovider\n          predicates:\n            - Path=/auth/**\n\
  \          filters:\n            - StripPrefix=1\n        - id: revoketoken\n  \
  \        uri: lb://revoke-token-service\n          predicates:\n            - Path=/revoke/**\n\
  \          filters:\n            - StripPrefix=1\n        - id: rentalproposal\n\
  \          uri: lb://rental-proposal-service\n          predicates:\n          \
  \  - Path=/proposals/**\n          filters:\n            - StripPrefix=1\n     \
  \   - id: rentalproperties\n          uri: lb://rental-property-microservice\n \
  \         predicates:\n            - Path=/properties/**\n          filters:\n \
  \           - StripPrefix=1\n```\n\n这些配置为我们目前所有的重要服务创建了 API 网关端点。让我们取其中一个定义的路径来理解它的组成部分：\n\
  \n```\n    - id: rentalproperties\n      uri: lb://rental-property-microservice\n\
  \      predicates:\n        - Path=/properties/**\n      filters:\n        - StripPrefix=1\n\
  ```\n\n现在，让我们看看每个属性意味着什么。\n\n### Spring API 网关配置属性\n\n`id` 属性有助于为 API 网关端点创建一个名称。它通常意味着我们在为其中服务设置一个端点。在\
  \ HomeIt 的背景下，我们讨论的是为外部客户端访问租赁房服务创建一个 API 网关端点。\n\n`uri` 属性意味着 Eureka 注册中的服务位置。在这里，我们声明要负载访问名为\
  \ `rental-property-microservice` 的服务（记住，这是我们在租赁房服务的默认 `application.properties` 中设置的名称）。\n\
  \n注意，**负载均衡**意味着指向我们 API 网关的每个调用将分布到每个注册到租赁房服务的实例上。这信息很大，再读一遍以确保你理解。Spring Cloud\
  \ 是一种能够自动处理很多问题的架构！\n\n`predicates` 部分告诉我们，每当请求到达 API 网关且 URI 具有 `/properties/**`\
  \ 前缀时，API 网关会将该请求转发到 Eureka 注册中的租赁房服务。\n\n`filters` 部分告诉我们，当我们把请求转发到租赁房服务时，将使用 `StripPrefix=1`\
  \ 指令去掉 `/properties/**` 前缀。换句话说，在转发到目标服务之前，我们会去掉根 URL 的一级。\n\n这意味着在实践中，其他应用程序必须调用\
  \ `http://{api-gateway:port}/properties/api/v1/rental-properties`，这样网关就可以去掉 URI\
  \ 中的 `properties` 部分并将请求转发到 `http://{rental-properties-microservice:port}/api/v1/rental-properties`。\n\
  \n这是 `rentalproperties`，但正如你从这些端点集合中看到的，我们还为 HomeIt 架构中的所有重要服务声明了端点，包括 `authprovider`、`revoketoken`\
  \ 和 `rentalproposal`。这有趣吗？\n\n现在，让我们看看 `application.yml` 文件的其他部分：\n\n```\nlogging:\n\
  \  level:\n    com.homeit.logs.GlobalFilterLogs: DEBUG\n    org.springframework.cloud.gateway:\
  \ DEBUG\n    org.springframework.http.server.reactive: DEBUG\n    reactor.netty.http.server:\
  \ DEBUG\n```\n\n\n\n我们设置这些日志级别是为了确保当 API 网关接收调用并将其转发到其他服务器时，我们能够看到发生的一切情况。它将为我们的\
  \ `GlobalFilter` 日志（稍后我们会看到这些）生成调试日志，还会为 API 网关依赖项、Reactive 服务器依赖项以及 HTTP 服务器依赖项生成调试日志。\n\
  \n让我们最后最后的属性：\n\n```yaml\nserver:\n  port: 8080\neureka:\n  client:\n    service-url:\n\
  \      defaultZone: http: //localhost:8761/eureka/\n```\n\n如你所见，我们正在设置 API 网关在端口\
  \ `8080` 上提供服务，并将 `eureka` 的服务 URL 指向 `localhost` 的端口 `8761`。这意味着无论 `http://localhost:8080/{whatever-uri}`\
  \ 的请求命中了我们的 API 网关配置，只要前缀与我们创建的任何过滤器匹配，API 网关就会知道如何将该请求转发到我们的服务之一。\n\n到此，你已经设置好了\
  \ API 网关。现在，我们需要提高日志的透明度，因此我们将添加一个全局过滤器类，它将让你了解 API 网关接收的每个请求的所有重要信息。\n\n### 在你的\
  \ Spring API 网关中设置透明日志\n\n由于我们需要更高的透明度来检查 API 网关是否正常工作，我创建了一个名为 `GlobalFilterLogs`\
  \ 的类。这意味着 API 网关接收的所有调用都会产生包含该 HTTP 请求中每一个位信息的日志。让我们来看实现代码：\n\n```java\n@Component\n\
  public class GlobalFilterLogs\n    implements GlobalFilter, Ordered {\n    private\
  \ static final Logger logger = LoggerFactory\n        .getLogger(GlobalFilterLogs.class);\n\
  \    @Override\n    public Mono<Void> filter(ServerWebExchange exchange,\norg.springframework.cloud.gateway.filter.GatewayFilterChain\
  \  chain) {\n    // Log the request path and headers\n    logger.info(\"Incoming\
  \ request: {} {}\",\n        exchange.getRequest().getMethod(),\n        exchange.getRequest().getURI());\n\
  \    exchange.getRequest().getHeaders()\n        .forEach((name, values) -> {\n\
  \              values.forEach(value -> logger.debug(\n                  \"Request\
  \ Header: {}={}\", name, value));\n          });\n    return chain.filter(exchange)\n\
  \        .then(Mono.fromRunnable(() -> {\n        // Log the response status code\
  \ and headers\n      logger.info(\"Outgoing response: {}\",\n          exchange.getResponse().getStatusCode());\n\
  \      exchange.getResponse().getHeaders()\n          .forEach((name, values) ->\
  \ {\n              values.forEach(value -> logger.debug(\n                  \"Response\
  \ Header: {}={}\", name, value));\n          }));\n      }));\n    }\n    @Override\n\
  \    public int getOrder() {\n      return -1; // Ensure this filter is applied\
  \ first\n    }\n}\n```\n\n这段整洁的代码将在我们的 API 网关周期中注入一个类，它将在调试级别将所有处理过的请求和响应对象记录到控制台中。这让我们透明地看到我们正以正确的方式向目标服务发送请求。\n\
  \n这就是我们正确设置 API 网关所需的内容。让我们测试整个 Spring Cloud 环境。\n\n## 通过集成测试访问 API 网关\n\n现在我们已经配置好了\
  \ Spring Cloud 环境，如何对其进行完全测试呢？\n\n首先，我们需要知道如何让它对外部客户端都可用。为了确保所有服务器都以正确的方式相互连接，你需要按照以下顺序运行服务：\n\
  \n1. 需要启动 `Eureka` 服务。\n2. 需要启动 `Config` 服务。\n3. 需要启动 `API gateway` 服务。\n4. 最后，我们运行集成测试。\n\
  \n\n\n欢迎来到我们的最后一章！本书带我们经历了多种不同的 Spring Framework 模式的奇妙之旅。在本章中，我们将关注服务可能出现的问题——因为世界并不总是风顺的，对吧？处理系统意味着我们将遇到许多严重问题——包括在生产环境中。本章的目的是减轻这种冲击。句话说，它的目的是帮助你准备系统，使其更具韧性、容错性并经过优化。\n\
  \n我们本章将涵盖以下主题：\n\n*   为你的项目设定正确的性能预期\n*   使用缓存加速对关键数据的访问\n*   使用死信队列从故障中恢复\n*  \
  \ 使用 `Spring Actuator` 进行实时服务监控\n*   使用 `Resilience4j` 处理故障服务\n*   使用 SQL 技巧防止竞态条件\n\
  *   使用审计作业（audit job）从故障中恢复\n*   通过使用节流（throttling）来处理请求激增\n\n在本章中，你将了解到一系列处理系统陷阱的策略。好了，让我们开始吧！\n\
  \n# 技术栈要求\n\n为了运行这些示例，你需要访问我们示例代码库中的 `chapter-12` 文件夹：[https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-12]。\n\
  \n具体来说，你可以在 `Rental Properties` 服务的实现中找到新的代码示例：[https://github.com/PacktPublishing/Spring-System-Design-in-Practice/tree/main/chapter-12/rental-property-microservice]。\n\
  \n# 为你的项目设定正确的性能预期\n\n当你编写软件时，你会投入心血的一部分到代码中。你花费大量时间去构思绝妙的想法。事实证明，我们许多最好的想法其实是有缺陷且带有\
  \ Bug 的，这可能很难接受的。正如此，软件也是某种情感上的过山车。以下原则可能帮助你应对这些情绪和预期。\n\n## 故障是不可避免的\n\nBug、错误、故障、停机、网络错误、硬件故障——这些在软件架构中都是预料之中的，在任何人的微服务中都是完全不可避免的。开发者来说，处理这么多变量是不可能的。我经常对我的团队说，互联网是一个完全的奇迹。你能想象有多少数据结构和系统需要在软件和硬件上完美地对齐，以便这个不可思议的环境能够在全球自由发布信息吗？处理系统有时是一场噩梦，所以我们需要接受软件是有风险的这一事实。当你构建某个东西时，无论你投入了多少关注和质量保证——总会有东西坏掉；某些东西会意外离线。\n\
  \n当你的系统增长时，出现问题的概率也会越来越大。因此，关于性能改进和故障排除，你应该记住的第一点是：你将在某个时间点需要这样做。\n\n## 尽早发布，稍后优化\n\
  \n我在思考软件优化时喜欢考虑的第二点是：由于改进工程的方法数胜无数，不要尝试从零开始发布一个完美的系统——否则，你永远无法发布它，并且花费大量资金在从未进入生产环境的优化上。\n\
  \n优化需要时间并消耗你公司的资金，所以你应该针对你可能在生产环境中遇到的明确问题进行优化。如果你知道你的系统每秒需要处理 20,000 次请求，那么从第一个版本开始就构建能够处理该需求的系统。但如果你知道系统的第一个版本在第一个月内将发布给不到\
  \ 1,000 名用户，那么直接发布且无需支持每秒数千次请求即可。这种心态将让你能够有效地利用公司的资源。能够交付产品，而不是为了乌托邦式的完美而延迟交付，将使你在开发者中脱颖而出。\n\
  \n## 可能减慢速度的关键瓶颈\n\n软件性能瓶颈可能发生在各种关键领域。以 `Figure 12.1` 为例。这是我们当前架构的非常简化版本。每个组件都代表可能出错的地方。让我们来看：\n\
  \n![Figure 12.1 – A sample internet architecture](img/B18632_12_1.jpg)\n\n图 12.1\
  \ – 示例架构\n\n在浏览器中，渲染复杂的页面或低效的脚本可能会降低交互或破坏网络调用。如果 配置不当，可能会引入延迟。API 网关在过载时可能成为瓶颈。对象存储访问可能由于网络甚至本地硬件限制而变慢。未充分优化的微服务可能会消耗过\
  \ CPU 或内存。网络问题会影响服务之间的数据流，特别是在容器中。慢速硬盘和网络文件系统会延迟数据检索。低效的数据库会导致查询缓慢，影响整体性能。最后，如果你以错误的方式设计软件——我们通常在系统在现实世界中使用时才发现这一点——你将发现你的系统正在以次优的方式使用资源。\n\
  \n找出系统中问题的最佳方法是将你的架构拆解为组件和整体网络拓扑，然后单独测试每个组件。例如，如果你的用户在请求时遇到很长的延迟，你需要检查网络中的每一个跳节点是否工作正常，直到找到耗时最长的那一步。可能是数据库查询，可能是你的微服务算法。你将不得不通过调查每个小步骤来找到答案。\n\
  \n## 消除单点故障\n\n优化系统时需要考虑的另一点是：尽可能地消除我们所谓的“单点故障”——这意味着任何单个组件、服务或依赖项一旦故障，就会导致整个系统或其关键部分停止工作。\n\
  \n这通常意味着你应该有并行运行的服务副本。如果其中一个副本失败，其他副本可以接管并继续工作。\n\n这是软件工程中至关的一步。确保你的系统没有以独立模式运行。\n\
  \n## 分布式事务出错\n\n与微服务相比，单体架构在事务方面具有明显优势。由于整个系统只连接到一个数据库，你创建的任何包含不同表中多次更改的新事务都可以封装在单个数据库事务中。数据库基础设施保证了，如果事务中的某个操作失败，所有其他操作都将回滚，你的系统数据将保持不变且一致。\n\
  \n对于微服务，你需要用不同的思考方式。由于单个用户操作可能跨越不同的服务器，如果受影响的服务中的一个出现问题，其他服务可能会处于错误状态。这需要一种特殊的思维方式。通常情况下，你的每个服务都需要非常清晰的状态和消息系统。因此，如果某个服务出现问题，你可以从其他服务中找回消息，并回滚在其他系统中发生的事务。\n\
  \n解决分布式事务错误的方法数胜无数；由于我们正接近书的末尾，我们没有足够的空间在这里讨论和演示它们。但请记住，如果分布式事务执行链中的某个服务发生故障，它必须提供事件，以便其他服务器可以回滚它们对应的事务部分。\n\
  \n\n\n\n## 为并发请求准备好你的服务\n\n服务优化的另一个关键方面是老牌的并发问题。例如，在我们的 HomeIt 系统中，还没有创建任何保护措施来防止同一个房东接受来自不同人的两个或多个提案。这将导致非常基础的并发问题。我特意留下了这个漏洞，以便我们进一步讨论。即使我们创建了一个服务来标记哪些房产已经出租，一个心怀不胎的房东也可能尝试同时接受两份合同。\n\
  \n建立相应的功能以防止人们以不应被允许的方式并发使用资源，这是关键。\n\n这些主题介绍并总结了我们在思考优化、性能和故障时会遇到的各种类型的问题。在本章的剩余部分中，我们将查看几种防止故障和优化我们策略的策略。\n\
  \n# 使用缓存加速关键数据的访问\n\n缓存是一个有趣的话题，容易解释，但在实践中有时很难做完美。假设在 HomeIt 上，你开始看到很多用户在寻找房产，然后你你不希望每次使用通过\
  \ ID 获取房产的端点时都接入数据库。毕竟，向数据库发送请求是一个开销较大的 I/O 操作，而且在所有者注册基本数据后，房产随时间的变化并不大。\n\n在这种情况下，你可能会决定，当接收到通过\
  \ ID 获取房产的时，你的 `Rental Properties` 服务在访问数据库之前应该查询缓存系统——通常这意味着在数据库操作之前放置一个内存数据库，例如\
  \ `Redis` 或 `Memcached`。\n\n我们在这里不会介绍如何安装或配置不同的 `Redis` 实例，因为这本身就是一整本书的话题。你可以使用这个官方指南页面学习如何在你的机器上安装\
  \ `Redis`：\n\n[`redis.io/docs/latest/operate/oss_and_stack/install/install-redis/`](https://redis.io/docs/latest/operate/oss_and_stack/install/install-redis/)\n\
  \n让我们直接看看如何在 `Spring Boot` 内部配置 `Redis`。你需要一个已经在运行的 `Redis` 实例：\n\n1. 首先，我们要在 `build.gradle`\
  \ 文件中添加这两个依赖项：\n\n```\nimplementation 'org.springframework.boot:spring-boot-starter-cache'\n\
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'\n```\n\n\
  2. 接着，我们创建一个 `Configuration` 类，它将告诉 Spring 框架启动缓存服务：\n\n```\n@Configuration\n@EnableCaching\n\
  public class CacheConfig {\n}\n```\n\n如果你在使用外部 `Redis` 服务器，只需将这些属性添加到你的项目中即可。在我们的示例代码中，我只是添加了但注释掉了，所以如果你想在项目中使用，可以直接使用：\n\
  \n```\nspring.cache.type=redis\nspring.data.redis.host=localhost\nspring.data.redis.port=6379\n\
  ```\n\n现在我们已经有了依赖项、配置 Bean 类以及包含在项目中的属性，我们可以直接向需要的服务类中添加缓存声明。在这种情况下，我将为 `RentalPropertiesServiceImpl`\
  \ 类添加缓存，因为我希望通过 ID 的 getter 从缓存中返回房产。以下是代码：\n\n```\n@Override\n@Cacheable(value\
  \ = \"properties\", key = \"#id\")\npublic Optional<RentalPropertyDTO> get(UUID\
  \ id) {\n    return Optional.ofNullable(rentalProperties.get(id));\n}\n```\n\n这个\
  \ `@Cacheable` 注解是做什么的？它创建了一个属性的内存集合。例如，当我们第一次使用 `id` A 访问房产 `GET` 端点时，缓存系统不会在其集合中找到该属性。因此，它将查询数据库，除了返回属性外，它还会将其缓存，这样下次调用就不需要查询数据库，而只需对缓存的属性进行内存扫描了。\n\
  \n这里有一个有趣的语言点：当我们的缓存能够返回我们请求的对象时，我们称之为为“缓存命中（cache hit）”。当我们的对象尚未缓存且我们需要去数据库时，我们称之为为“缓存未命中（cache\
  \ miss）”。这些是你会听到人们使用的通用术语。\n\n现在，这里有一点重要的事情。当你有一个缓存对象时，你需要确保当该对象在数据库中更新时，它能得到更新。也就是说，每当该对象在系统中被更新时，你需要从缓存中“剔除（evict）”该对象。我们这样做：\n\
  \n```\n@Override\n@CacheEvict(value = \"properties\", key = \"#id\")\npublic Optional<RentalPropertyDTO>\
  \ update(\n        UUID id,\n        RentalPropertyDTO updatedProperty) {\n    //\
  \ implementation goes here\n}\n```\n\n通过在你的代码中添加 `@CacheEvict` 注解，可以指示缓存系统始终移除你当前在数据库中更新的\
  \ ID 属性。这样，下一次有人尝试使用相同的 ID 获取属性时，你将遇到缓存未命中，新版本将再次被缓存。\n\n足够简单，对吧？现在，让我们进入下一个主题：死信队列。\n\
  \n# 使用死信队列从故障中恢复\n\n在我们的 HomeIt 系统中，我们创建了一个非常系统，使得我们的 `Rental Properties` 服务可以更新谈判。这是一个简单的服务，没有容错空间，对吧？！\n\
  \n嗯，如果由于某些原因，有人更改了提案代码并不小心了不同的消息结构会怎样？或者如果你有一个复杂的通知，它以某种方式被更改了呢？这意味着通知的消费者在解析数据时可能会遇到问题。\n\
  \n为了处理系统中的格式错误消息，你可以创建一个或多个死信队列。这意味着你可以创建一个或多个作为警报队列的主——一旦尝试解析通知，任何错误都可以被转发到死信主题。\n\
  \n你可以完全有一个系统来消费死信消息，或者当你的死信主题增长到某个程度时，设置一些警报系统。死信队列有助于你对架构中格式错误消息的可可见性。\n\n由于你已经知道如何创建主题，我将把这个想法留在这里，不提供代码示例，以便我们在本章中涵盖更多的优化想法。\n\
  \n# 使用 Spring Actuator 进行实时服务监控\n\n正如你可能注意到的，我们在此书项目中的某些服务中添加了 Spring Actuator 依赖，但我们还没有机会真正解释它是做什么的。\n\
  \n好了，关键在于：Spring Actuator 是一个提供了一些基础功能的依赖，以便你更容易监控你的服务。这些端点可以被其他系统利用来创建仪表板并监控服务的就绪和生存状态。\n\
  \n例如，如果你使用 Kubernetes 部署应用程序，可以使用健康端点检查你的服务实例是否仍然在线。一旦健康端点停止响应，Kubernetes 将移除该实例并启动一个新的实例来替换故障的服务。\n\
  \n以下是 Spring Actuator 的一些有用端点列表：\n\n*   **健康监控**：检查应用是否运行（`/actuator/health`）\n\
  *   **性能指标**：查看 CPU、内存和请求统计（`/actuator/metrics`）\n*   **环境检查**：查看配置属性和系统变量（`/actuator/env`）\n\
  *   **日志管理**：运行时更改日志级别（`/actuator/loggers`）\n\n\n\n\n\n- **端点映射**：出所有 API 路由 (`/actuator/mappings`)\n\
  - **线程和内存分析**：获取线程储和堆转储 (`/actuator/threaddump` 和 `/actuator/heapdump`)\n- **安全审计**：跟踪登录事件\
  \ (`/actuator/auditevents` )\n- **定时任务监控**：查看激活的定时任务 (`/actuator/scheduledtasks`\
  \ )\n\n如果我们启动了 API 网关服务器，你可以在这里找到这些端点：\n\n`http://localhost:8080/actuator/health`\n\
  \n你可以通过向你的服务添加依赖项来启用 actuator 端点，就像我们对 API 网关执行的那样。只需进入你的 `build.gradle` 文件，并在依赖部分添加以下行即可：\n\
  \n```\nimplementation 'org.springframework.boot:spring-boot-starter-actuator'\n\
  ```\n\n通过此方法，你运行的任何服务都将拥有一组相同的端点。这里有一点：由于我正在使用 IntelliJ IDE 编写这些服务，我可以使用它与 Actuator\
  \ 端点的原生集成。下面是你通过访问此功能后将看到的截图：\n\n![图 12.2 – IntelliJ Actuator 接口](img/B18632_12_2.jpg)\n\
  \n图 12.2 – IntelliJ Actuator 接口\n\n其他 IDE 将为你提供类似的有用功能和集成。在张截图中，你可以看到运行服务中的每一个 bean。你还可以在运行时直接浏览许多其他关键信息。\n\
  \n好了，Actuator 让理解你的服务正在发生什么变得简单得多。现在，让我们看看如何使用断路器（Circuit Breaker）模式来整合来自不同服务的日志。\n\
  \n# 使用 Resilience4j 处理故障服务\n\n如果你的一个服务停止了对另一个服务的响应，你可以实现策略来决定调用者将如何操作。你可以在 Spring\
  \ 中使用 Resilience4j 来定义这些策略。\n\nResilience4j 帮助你在面对或避免服务故障时为应用程序定义不同的行为——你可以在调用失败时选择备用行为，或者为接收来自其他服务的调用设置最大阈值。你可以指令你的服务自动重试失败的调用。你可以做很多有趣的事情让系统恢复正常。\n\
  \n我们首先看的是如何使用 Resilience4j 在另一个服务发生故障时切换服务行为。我们称这种模式为断路器。\n\n## 使用断路器模式\n\n让我们思考\
  \ HomeIt 公司。你知道 `Rental Properties` 服务现在依赖于 `Revoke Token` 服务，以发现令牌是否被管理员置无效。但如果\
  \ `Revoke Token` 服务宕机了呢？在这种情况下，我们的应用程序应该如何表现？到目前，如果 `Rental Properties` 服务无法调用 `Revoke\
  \ Token` 服务，它基本上将无法验证令牌。\n\n因此，为了让我们的架构更具韧性，假设我们想要采用以下策略：如果 `Revoke Token` 服务宕机，我们就认为所有令牌都是有效的。这个策略很重要，这样我们才不会完全剥夺用户使用网站的能力。\n\
  \n好了，这里是实现方法。首先，我们需要在 `Rental Properties` 服务的依赖部分添加以下依赖项：\n\n```\nimplementation\
  \ 'io.github.resilience4j:resilience4j-spring-boot3'\nimplementation 'org.springframework.boot:spring-boot-starter-aop'\n\
  ```\n\n一旦添加了依赖项，你就可以以下指令配置断路器。\n\n首先，对于 HomeIt 的 `Rental Properties` 服务，我们将在 `RestTemplateRevokeTokenService.isTokenRevoked()`\
  \ 方法上添加以下注解：\n\n```\n@CircuitBreaker(name = \"revokeTokenCircuitBreaker\", fallbackMethod\
  \ = \"revokeTokenServiceOutage\")\n//@Cacheable(value = \"token\", key = \"#token\"\
  )\npublic boolean isTokenRevoked(String token) {\n    // 其余代码保持不变\n}\n```\n\n正如你所注意到的，我们需要为断路器设置一个名称，以及备用方法的名称，以防\
  \ `Revoke Token` 服务不可用。以下是备用方法的实现。我直接将其实现在 `RestTemplateRevokeTokenService` 类中：\n\
  \n```\nprivate boolean revokeTokenServiceOutage(Exception ex) {\n    log.error(\"\
  Revoke Token service is out! \" +\n                \"All tokens are considered not\
  \ revoked until \" +\n                \"revoke service is back\", ex);\n    return\
  \ false;\n    // 在令牌服务宕机期间\n    // 没有令牌被视为失效\n}\n```\n\n此外，你还需要在你的配置中添加以下配置：\n\n\
  ```\n# 断路器配置\nresilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.failureRateThreshold=50\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.slow-call-rate=50\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.slow-call-threshold=2s\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.wait-duration-in-state=5s\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.permitted-calls-in-open=3\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.sliding-window-size=10\n\
  resilience4j.circuitbreaker.instances.revokeTokenCircuitBreaker.minimum-number-calls=5\n\
  ```\n\n以下是对配置的快速解释：\n\n- `failureRateThreshold`：系统识别持续故障的故障百分比。在这种情况下，如果我们的调用有 50%\
  \ 失败，电路将打开并使用备用方法。\n- `slow-call-rate`：如果超过 50% 的调用被认为是慢的，电路将打开。\n- `slow-call-threshold`：什么是“慢调用”——在这种情况下，持续两秒的调用被视为慢调用。\n\
  - `wait-duration-in-state`：当电路打开时，在触发下一次请求测试故障服务之前执行备用方案的时间。\n- `permitted-calls-in-open`：当断路器处于半开启并再次尝试连接故障服务时允许的调用次数。\n\
  - `sliding-window-size`：断路器用于衡量电路开启还是关闭的最后 X 次调用次数。\n- `minimum-number-calls`：在断路器开始真正衡量效率之前所需的最小调用次数。\n\
  \n通过这种方式，任何当 `Revoke Token` 服务离线时，断路器都会打开并触发 `isTokenRevoked()` 方法的默认实现。所有令牌将被视为有效。\n\
  \n以上总结了断路器模式的主要要点。让我们看看下一个模式，限流（Rate Limiting）。\n\n## 使用限流模式\n\n对服务限流意味着限制其他服务在给定时间内调用你服务的次数超过\
  \ X 次。这对于保护你的服务免受过度调用（导致其完全崩溃离线）非常重要。\n\n在 Resilience4j 中使用限流，请参考以下注解示例：\n\n```\n\
  @RateLimiter(name = \"revokeTokenServiceRateLimiter\", fallbackMethod = \"rateLimitFallback\"\
  )\npublic boolean isTokenRevoked(String token) {\n   // 你的服务实现写在此处\n}\n```\n\n\n\
  \n\n在这种情况下，你还需要设置回退方法（fallback method），它的实现完全取决于你的意愿——你可以直接返回一个默认答案（在我们的 HomeIt\
  \ 示例中，使 token 有效），或者向调用者返回一个默认错误（如果你认为过多的真实用户会被阻止成功访问你的网站，这对于我们的示例来说可能是个棘手的主意）。\n\
  \n就像你使用断路器（Circuit Breaker）一样，你还需要参数化速率限制器（rate limiter）在应用程序中的运行方式。在此处查看 HomeIt\
  \ 示例：\n\n```\n# rate limiting\nresilience4j.ratelimiter.instances.revokeTokenServiceRateLimiter.limit-for-period=100\n\
  resilience4j.ratelimiter.instances.revokeTokenServiceRateLimiter.limit-refresh-period=1s\n\
  ```\n\n在这种情况下，我们只取了两个参数：我们希望应用程序支持的调用次数以及我们希望刷新计数器的时间。在这个示例中，我们规定服务每秒运行不能超过 100\
  \ 次。\n\n请注意，我们在声明注解时总是会给一个名称。该名称随后会被写在配置文件中。每当我们使用 Resilience4j 的注解时，我们就称其为 Resilience4j\
  \ 的“实例”（instance）。因此，我们可以为想要用 Resilience4j 保护的每个服务声明不同的策略。这允许我们变得非常灵活且具体，并为每种不同的情况定制我们的弹性策略。\n\
  \n另一个重要的 Resilience4j 策略是重试（Retry）。让我们详细查看。\n\n## 在 Resilience4J 中使用 Retry\n\n有时，服务会因为瞬时情况而失败。可能是发生了瞬时网络问题，导致你对另一个服务的调用丢失了。或者可能是某些过载导致你的服务停止响应几秒。在繁忙、高并发的架构中，这种情况可能会发生。现在，由于这没有导致你的服务完全离线，基本上意味着下次你调用它时，它将能够响应。这时我们应该做的是能够重试请求。这在\
  \ Resilience4J 中很容易，只需使用 `@Retry` 注解即可。当然，你需要为该特定实例设置一个名称。见下文：\n\n```\n@Retry(name\
  \ = \"revokeTokenServiceRetry\")\npublic boolean isTokenRevoked(String token) {\n\
  \    // 你的服务实现写在这里\n}\n```\n\n`@Retry` 注解与 Resilience4j 其他注解的主要区别在于，你不需要声明回退方法。毕竟，你只是要求系统在出现问题时重试同一个方法。\n\
  \n为了给这个 `@Retry` 实例设置实际策略，我们可以在 `application.properties` 上使用以下声明：\n\n```\n## retry\
  \ config\nresilience4j.retry.instances.revokeTokenServiceRetry.max-attempts=3\n\
  resilience4j.retry.instances.revokeTokenServiceRetry.wait-duration=2s\n```\n\n在这种情况下，我们规定\
  \ Resilience4j 应该运行同一个方法最多三次，并且在每次重试之间等待两秒。这对于你自己的应用程序来说可能不是一个实用的设置；它只是一个示例。你应该始终考虑你的用例。例如，如果你认为你的应用可以在半秒甚至更短的时间内再次响应，只需设置毫秒（ms）时间——例如\
  \ 500 ms。\n\n好了，现在来看隔板（Bulkhead）模式。\n\n## 使用 Bulkhead 模式\n\n这种模式似乎与速率限制（Rate Limiting）模式相似。但它不是设置每个时间段内可以接受多少请求，而是选择你的应用程序中同时可以处理多少并行请求。如果你发现某些情况下，服务器因为开启多个线程并行处理请求而负载过重，这对于防止实际内存崩溃特别有用。如果你的服务实例无法获得更多内存，实现\
  \ Bulkhead 将防止你的服务发生完全崩溃。\n\n以下是使用 `@Bulkhead` 注解的方法：\n\n```\n@Bulkhead(name = \"\
  revokeTokenBulkhead\", fallbackMethod = \"bulkheadFallback\")\npublic boolean isTokenRevoked(String\
  \ token) {\n    // 你的服务实现写在这里\n}\n```\n\n如所示，你将为这个 Bulkhead 实例设置一个名称，并且还应该定义一个在没有更多可用线程时执行的方法。\n\
  \n以下是在你的 `application.properties` 文件中参数化 Bulkhead 的示例：\n\n```\n## bulk head\nresilience4j.bulkhead.instances.revokeTokenBulkhead.max-concurrent-calls=50\n\
  resilience4j.bulkhead.instances.revokeTokenBulkhead.max-wait-duration=50s\n```\n\
  \n`max-concurrent-calls` 参数定义了希望应用程序使用的最大线程数。`max-wait-duration` 意味着调用等待机会的最大时间。在这个示例中，我们规定一次处理最多\
  \ 50 个调用，最大等待时长为 3 秒。因此，如果同时发生超过 50 个调用，过多的调用将等待最多三秒进行处理。如果超过了三秒，Bulkhead 将为队列中等待的每个请求抛出异常。\n\
  \n好了，这总结了 Resilience4j 的几个很有用注解。请注意，如果你在同一个方法中同时使用多个注解，你将对其进行彻底测试以查看它们是否正常工作。\n\n\
  现在，让我们聊聊并发问题。\n\n## 使用 SQL 技巧防止竞态条件\n\n在我们的 HomeIt 系统中，想象这样一个场景：两个租户在同一时刻尝试接受同一处房的租赁建议。我们如何防止两份协议同时最终完成？我们又如何决定哪个租户真正获得了租赁？\n\
  \n## 为什么微服务级别的解决方案不起作用\n\n你可能考虑在微服务级别使用 `synchronized` 块、信号量（semaphores）或分布式锁来处理此。但是，如果你的系统运行了服务的多个实例，它们并不总是能感知对方。这意味着两个用户可能在同一时刻接受租赁建议——导致经典的竞态条件。\n\
  \n如果接受协议涉及多个服务（例如：支付、合同签署或通知），问题会变得更糟糕。现在，你处理的是分布式事务，并发请求可能会导致服务之间的状态不一致。\n\n有些人认为，你应该创建一个专门的锁微服务来控制访问。第一个在该服务中获取锁的用户将继续租赁流程。但当你的系统扩展时会发生什么？如果你水平扩展你的锁服务，你可能会引入新的同步问题。\n\
  \n## 简单且有效的解决方案——数据库锁\n\n与其依赖微服务，不如让你的数据库处理并发。通过简单的原子 SQL 更新，你可以确保只有一个用户成功锁定租赁。这种方法是安全且可扩展的，并且不依赖分布式服务。\n\
  \n### SQL 查询——获取租赁物业的锁\n\n该查询仅在房屋尚未租出时才更新租赁状态：\n\n```\nUPDATE rental_properties\n\
  SET rented = TRUE, tenant_id = <tenant_id>\nWHERE property_id = <property_id> AND\
  \ rented = FALSE\nRETURNING *;\n```\n\n你可以通过 `RETURNING` 指令看到整行数据。如果你获得了行，意味着用户成功获取了房屋租赁。这样，你可以安全地继续后续步骤，而不必担心其他用户并发完成同一笔交易。\n\
  \n\n\n\n一些开发者可能会建议使用存储过程来强制执行此逻辑。然而，存储过程依赖于数据库，这使得未来在不同数据库之间切换变得困难。它们还通过在数据库层引入逻辑，增加了系统的复杂性，使得调试和维护业务规则变得更加困难。通过使用简单的原子\
  \ SQL 语句，你可以将逻辑保持在应用层，使你的系统更具活性且更容易扩展。\n\n好的，这以一种简单而有效的方式避免了我们许多并发问题。现在，让我们聊聊如何从某些故障中恢复。\n\
  \n## 使用审计任务从故障中恢复\n\n在我们的 `HomeIt` 系统中，处理租赁合同涉及向多个系统发送请求——这构成了一个`分布式事务`。但如果执行过程中发生错误怎么办？我们如何确保系统能够自动恢复，而不需要人工干预或故障排除？\n\
  \n我见过的最有效的解决方案之一是实现我所谓的`审计任务`（audit job）。这个想法简单而强大。\n\n每当用户接受`租赁提案`时，我们都会记录接受的精确时间。该时间戳作为提案数据的一部分存储。此外，我们在所有下游服务中将`租赁提案\
  \ ID` 注册为`外键`。换句话说，只有当所有所需的服务都记录了引用原始协议的数据时，租赁提案才被视为`完全处理完毕`。为了方便追踪，此`提案 ID 应该在每个相关表中建立索引`。\n\
  \n通过这种设置，我们现在可以实现一个按定期运行的`审计任务`——例如，每天运行一次。该任务会扫描过去`24 小时`内接受的租赁协议，并验证每个下游服务是否拥有必要的记录。如果它检测到`缺失或不完整的数据`，它会自动对该特定服务进行`重试`过程，确保操作最终按预期完成。\n\
  \n在`24 小时`内，每份协议都会经过`24 次自动验证`，这显著降低了未被察觉的故障概率。如果你需要`更严格的一致性`，可以根据系统需求和性能限制，将审计周期扩展到一周甚至一个月。\n\
  \n通过利用审计任务，我们创建了一个`自愈机制`，它可以持续监控、检测并纠正不一致之处——而无需手动调试或干预。\n\n以下是在 `Spring Boot` 中使用\
  \ `@Scheduled` 注解实现审计任务的快速方法：\n\n```java\n@Component\npublic class RentalAgreementAuditJob\
  \ {\n    @Scheduled(fixedRate = 3600000) // 每小时运行一次\n    public void auditRentalAgreements()\
  \ {\n        // 验证下游服务是否拥有\n        // 预期逻辑\n        // 如果检测到数据缺失\n        // 重试处理租赁协议\n\
  \    }\n}\n```\n\n你可以使用审计任务生成可供观测性系统扫描的日志，这样你就能立即掌握处于不一致状态的系统。\n\n## 使用限流处理请求激增\n\
  \n在某些情况下，你的应用程序可能会遇到请求激增。想象一下，在 `HomeIt` 中，我们启动了一项特别活动，为在特定日期注册租赁物业的房东提供折扣。该活动非常成功，导致成千上万房东试图在同一时间注册他们的物业。\n\
  \n我们如何防止系统过载并离线？\n\n一种强大的解决方案是使用`限流`（Throttling）模式，它本质上将用户发送请求的时间与系统处理并完成请求的时间解耦。与其立即处理所有入站请求，不如异步处理它们，允许你的系统以受控的方式吸收流量。\n\
  \n实现这一点的简单方法是在用户与处理注册的服务之间放置一个`Kafka 主题`（或其他消息队列系统）。该流程如下：\n\n1. 当房东提交注册请求时，系统会立即确认并将请求放置在`Kafka\
  \ 主题`中。用户会收到快速的“请求已收到”响应，防止由于系统过载导致的变慢或失败。\n2. 一个独立的后台工作线程以受控速率从主题中消费请求，确保注册服务在处理请求时不会压垮系统。\n\
  3. 随着每个请求的处理，用户会接收更新，例如电子邮件或网站上的通知，告知他们物业已成功注册。\n\n通过使用这种模式，峰值负载被分散到了时间上，防止突发激增冲垮你的服务器，同时为用户保持流畅的体验。\n\
  \n此外，你可以通过提供状态更新来增强用户体验。与其让用户猜测他们的注册是否成功，你的系统可以执行以下操作：\n\n* 在网站上显示进度条\n* 处理完成后发送电子邮件或推送通知\n\
  * 允许用户通过仪表板检查其请求状态\n\n这确保了尽管他们的请求不是即时处理的，他们也知道正在发生什么，从而提高了对你系统的信任。这带我们来到了本章的最后。我希望这为你思考应用程序中的常见问题提供了一个有趣的角度。\n\
  \n# 总结\n\n在本章中，我们提供了一些关键技巧，让你的服务达到性能、韧性和容错性目标，并对并发处理提供了一些不错的“调料”。\n\n我们从一些原则开始，帮助你管理服务中的预期和性能。然后，我们讨论了如何使用`缓存`来加速数据访问，以及如何以非常不同的方式从故障中恢复：通过处理死信队列、使用\
  \ `Spring Actuator` 监控你的服务、使用强大的 `Resilience4j` 实现重试（retries）、断路器（Circuit Breaker）以及其他处理错误的绝佳工具。\n\
  \n我们讨论了如何使用非常巧妙的 SQL 技巧来处理并发，而不是到处都是分布式服务。我们还讨论了如何实现审计任务，以验证当你使用分布式事务时系统是否在以一致的方式运行，以及如何使用有趣的`限流`策略防止你的服务耗尽内存。\n\
  \n我希望这些对你有所帮助。改进架构的方法有无数种，但这些技巧非常重要，也是我希望自己在刚开始时就な学会的。\n\n本书到此结束。希望在我们的下一次旅程中见到你。干杯！\n\
