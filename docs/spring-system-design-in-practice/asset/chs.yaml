  \ 3 点到 5 点之间反复上床。感谢你的爱、耐心和支持。我们做到了！\n\n致我的母亲 Valéria，她对人和事物的坚定不移的照顾是我一生的榜样。致我的父亲\
  \ João，他教我要坚持不懈，无论如何都要继续下去。\n\n并给我的孩子们——Valentina, Lavínia, Theo 和 Aurora——愿这本书能提醒你们永远梦想远大，充满激情地创造，并为伟大的人为世界带来伟大的事物。\n\
  \n– Rodrigo Santiago\n\n# 前言\n\n在我 20 年的职场经验中，我读过无数技术书籍——有些发人启发，许多则过被遗忘。但很少有书籍（如果有的话）能像这本书一样，捕捉到大型复杂组织内部软件工程的真实状况。《实战中的\
  \ Spring 系统设计》不仅仅是在谈论系统设计——令人惊讶的是，它深陷其中。\n\n当我翻开每一页时，我回想起了自己的早年岁月——在处理系统复杂性的同时应对不确定性。它让我想起了那些为了拼凑分散的概念而熬过的深夜，思考如何弥合开发团队与业务之间差距的漫长夜晚。如果\
  \ 10 到 15 年前我有这样一本书就好了……唉，我们无法回到过去——至少现在还不行。\n\nRodrigo Santiago 创造了真正特别的东西。他的写作风格就像导师在白板前解释问题一样流畅——接地气、清晰且令人目一新的务实。这本书不是一本枯燥的参考手册。它是一条穿过混乱的明亮道路，用耐心和精准引导你穿过真实系统的架构地形。\n\
  \n最触动我的是这些场景是多么地能引起共鸣。无论是微服务通信的权衡、过早优化的隐藏成本，还是将开发与实际业务需求对齐的艺术，每个主题都是通过那些像实战获得的教训来构建的，而不仅仅是研究出来的。\n\
  \n对于那些对现代系统设计术语感到不知所措的开发者来说，这本书提供了一种清晰感。对于寻求锐化其架构视野的资深工程师来说，它是一次现实检查。而对于渴望的架构师来说，它是一份地图和参考书的结合，充满了来之不易的见解和经过检验的模式。\n\
  \n它还提醒了我们在一个快节奏环境中经常忘记的一点：良好的系统设计不在于巧妙的解决方案，而在于清晰的思考。它是关于在实施之前理解——在“如何做”之前“为什么”。\n\
  \n《实战中的 Spring 系统设计》不仅向你展示了 Spring 能做到什么，它向你展示了如何整体地思考、自信地构建并用洞察力领导。\n\n阅读它。反思它。然后，去构建更好的系统——不仅是技术上的，更是深思熟虑的。\n\
  \n*Shalini Goyal*\n*全球技术主管，前亚马逊*\n\n# 贡献者\n\n# 关于作者\n\n**Rodrigo Santiago** 是一位软件开发者，拥有多年精简系统以及改进产品和流程的经验。他领导过多个将混乱挑战转化为高性能解决方案的项目，专注于那些微小变化就能产生巨大影响的领域。Rodrigo\
  \ 以在压力下保持冷静积极的态度而闻名，并成功引导跨职能团队交付成果。\n\nRodrigo 活跃于多个行业，从法律科技到金融科技，处理系统架构和团队动态。他在系统设计、微服务和事件驱动架构方面的专业知识使其能够满足技术和业务需求的可扩展解决方案。\n\
  \n# 关于评审员\n\n**Ibidapo Abdulazeez** 是一位软件工程师，拥有多年构建可扩展解决方案的经验，特别是在金融科技和房地产领域。Abdulazeez\
  \ 拥有计算机硕士学位，致力于利用技术解决发达行业的关键挑战。\n\n凭借在云计算、机器学习和使用 Spring 进行后端开发方面的专业知识，Abdulazeez\
  \ 参与过信用卡欺诈系统和学生贷款可访问性 API 等项目。Abdulazeez 志在攻读计算机科学博士学位，致力于推动技术进步和创新。\n\n# 前言\n\n\
  欢迎来到这段深入 Spring 的之旅！如果你曾盯着空白的 IDE，疑惑该从哪里开始构建一个健壮、可扩展的服务，你并不孤单。软件开发的世界充满了宏大的想法和雄勃的目标，但将这些想法转化为结构良好、可维护的应用程序？这既是艺术也是科学。这本书是为了帮助你跨越这一差距。\n\
  \n我们将从基础开始，因为优秀的软件建立在清晰之之上。我们将逐步剖析需求，区分功能性和非功能性需求，并将它们转换为领域对象和可靠的 API 合约。这就像在建造摩天大楼之前绘制蓝图——你不会希望你的应用程序在现实复杂性的第一阵风中倒塌。\n\
  \n然后，我们将卷起袖子进入魔法世界：使用 Spring 构建服务。接口应该如何与实现交互？哪种优雅的方式可以设计随时间增长增长的服务？我们将回答这些问题，并为创建新\
  \ API 以及与其他系统无缝通信提供一个实用的蓝图。由于在当今世界安全性是不可或缺的，我们将深入研究用户身份验证、使用非对称密钥创建令牌和验证令牌。\n\n\
  当然，任何旅程如果没有一些障碍是不完整的。我们将通过测试直面这些障碍——单元测试、集成测试和端到端测试——确保我们构建的东西不仅功能完备而且可靠。我们还将探索事件驱动架构，讨论处理\
  \ SQL 和 NoSQL 数据库数据集成的最佳实践，甚至将构建一个完整的 Spring Cloud 。\n\n\n\n\n但当事情出现问题时会怎样？因为，让我们面对现实，问题总会发生。服务会崩溃，网络会中断，竞态条件会在暗处潜伏。这就是为什么我们还将讨论韧性设计：有效地结构化配置、优雅地处理故障，并像资架构师一样解决并发问题。\n\
  \n在整本书中，我们将保持实用性。这并不是对 `Spring 6` 特性的抽象导览；而是一份构建真实世界应用程序的实战指南——这些应用程序应该是能够扩展、从故障中恢复，并与周围系统进行整洁集成的。我们将从一个名为\
  \ HomeIt 的示例应用开始，该应用连接了房东和对租房物业感兴趣的租客。\n\n所以，拿起你最喜欢的饮料（咖啡、茶或任何能为你的编程提供能量的东西），启动你的\
  \ IDE，让我们一起构建伟大的东西。欢迎来到 `Spring` 的世界！\n\n### 关于 Spring 框架更新的说明\n\n在写作期间，`Spring\
  \ Framework 7` 的里程碑版本已开始推出，正式版本预计将于 2025 年 11 月发布。虽然 `Spring 7` 引入了一些增强，特别是在 HTTP\
  \ 客户端接口方面，但本书主要关注软件架构和系统设计概念，这些概念在很大程度上与框架无关。\n\n书中所讨论的示例和实践并不依赖于 `Spring` HTTP\
  \ 客户端工具的特定功能（如 `OpenFeign`），因此尽管 `Spring 7` 进行了更新，它们仍然有效且适用。\n\n我们致力于保持内容的准确性和相关性，并将继续监控重大更新，以确保读者获得充分的信息。\n\
  \n# 本书适合的读者\n\n无论你正迈出进入 `Spring` 世界的第一步，还是作为一名寻求精炼可扩展 Web 服务处理方法的资深系统架构师，本书都有适合你的内容。\n\
  \n如果你是 `Spring` 的初学者，可能会被其庞大的生态系统感到无从从。你应该从哪里开始？如何构化你的应用程序？所有这些组件是如何整合在一起的？我们也曾经历过那个阶段。这就是为什么本书将带你熟悉基础知识——从剖析需求到设计\
  \ API、编写服务、集成数据库以及处理安全性。当你完成学习时，你将能够自信构建出一个功能完备、生产就绪的 `Spring` 应用程序。\n\n对于系统架构师和资深开发者，本书提供了一种设计可扩展、高韧性服务的结构化方法。我们将涵盖\
  \ API 设计、非对称密钥认证、事件驱动架构和容错性的最佳实践。如果你想确保你的 `Spring` 应用程序在处理真实世界复杂性的同时保持可维护性和性能，本书将帮助你实现这一目标。\n\
  \n本书假设你具备某些面向对象编程语言经验，并对如何编写 `Java` 代码有基础了解。你不需要成为软件开发流程的专家——我们的目标是提供一个清晰的框架，帮助你将高层需求分解为一组有效扩展且具有韧性的服务家族。\n\
  \n所以，无论你是刚刚起步还是在精炼你的技能，让我们深入其中，一起构建伟大的作品吧！\n\n# 本书涵盖的内容\n\n- **第 1 章：什么是产品需求？**，探索如何以结构化、精确的方式捕捉产品需求，为定义良好的问题和解决方案奠定基础。每一个伟大的系统都始于定义良好的目标。你将学习如何识别关键业务需求，并将其转化为技术目标，从一开始就指导开发。\n\
  - **第 2 章：将复杂需求分类为功能、用例和故事**，通过将需求拆分为清晰的功能、用例和用户故事，解开软件项目复杂的复杂的乱麻（项目通常始于错综复杂的预期）。这种结构化的方法确保了我们在捕捉真正重要内容的同时，保持开发过程的可控和专注。\n\
  - **第 3 章：为你的应用程序定义领域**，解释了在编写第一行代码之前，我们需要理解业务领域。在本章中，我们将使用关键的 `领域驱动设计` (`DDD`)\
  \ 技术来创建系统核心概念的可视化表示，确保我们的模型与真实的业务逻辑一致。\n- **第 4 章为你的领域定义服务**，解释了功能性需求告诉我们系统必须做什么，而技术需求定义了它应该如何运行。我们将涵盖技术方面的关键约束和预期，确保我们的服务使用正确的工具为真实世界的需求而构建。\n\
  - **第 5 章：编写你的服务——使用 Spring 框架引入 REST API**，介绍了 RESTful API 的核心原理，并引导你创建第一个由 `Spring`\
  \ 驱动的服务，包括控制器、请求处理和响应。现在我们已经有了前几章的坚实基础，是时候构建了！\n- **第 6 章：将业务需求转化为设计良好的 Spring API**，教你如何通过定义清晰的接口、解耦实现以及无缝集成不同服务来构建具有适应性的\
  \ `Spring` 服务。我们还将涵盖 `Spring` 如何提供接口和实现以高效连接外部系统的关键概念。\n- **第 7 章：处理数据并演进你的微服务**，解释了数据是任何系统的命脉，我们如何处理数据决定了服务的灵活性。在本章中，我们将探索如何在\
  \ `Spring` 中与关系型数据库协作，如何快速原型化服务，以及自定义查询与开箱数据连接之间的不同方法（这些方法更容易检索或保存数据）。\n- **第 8\
  \ 章：使用 Spring Security 和 2.0 安全服务**，提供了一份使用 `Spring Security` 和 `OAuth 2.0` 实现身份验证和授权的实践指南，确保我们的服务在保护敏感数据的同时提供无缝的用户访问。在现代应用程序中，安全性是不可妥协的。\n\
  - **第 9 章：Spring 服务之间高性能且安全的通信**，解释了为什么当多个服务需要通信时，性能和安全性变得至关重要。我们将深入研究让服务间通信高效、安全且扩展的策略，涵盖如何使用\
  \ `WebFlux` 创建异步服务。\n- **第 10 章：使用 NoSQL 数据库构建异步、事件驱动系统**，介绍了事件驱动架构，展示了如何使用消息系统和\
  \ NoSQL 数据库解耦服务，以构建可扩展的响应式应用程序，因为并非所有交互都需要实时完成。\n- **第 11 章：启动你的自组织微服务云**，探索了如何启动云原生\
  \ `Spring` 应用程序，利用服务发现、API 网关、远程配置以及其他让你的服务顺畅连接的关键功能。\n- **第 12 章：优化你的服务**，专注于关键的性能调优、缓存、优雅地处理故障以及提高韧性。从断路器到并发解决方案和分布式事务一致性检查，我们将确保我们的服务在真实条件下运行良好。\n\
