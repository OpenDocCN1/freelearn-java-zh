  \n1. 如果你正在处理单体架构且代码较多（象限 a），开发者开始意识到，为了避免这些巨大的限制（以及许多其他限制），可以将服务拆分为不同的、更小且更简单的程序。今天，已经有公司拥有几十个甚至上百个这样不同的程序。这些被称为`微服务架构`。\n\
